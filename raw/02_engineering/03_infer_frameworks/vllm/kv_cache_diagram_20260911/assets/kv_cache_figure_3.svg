    <rect class="cell" x="742" y="348" width="22" height="44" opacity=".45"/>
    <rect class="cell" x="768" y="348" width="22" height="44" opacity=".45"/>
    <rect class="cell" x="794" y="348" width="22" height="44" opacity=".45"/>
    <rect class="cell" x="820" y="348" width="22" height="44" opacity=".45"/>
    <rect class="cell" x="846" y="348" width="22" height="44" opacity=".45"/>
