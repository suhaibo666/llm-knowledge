# 上游追踪清单 —— tools/radar.py 的唯一输入
#
# 为什么要显式维护，而不是从 wiki 页头自动推导：
#   1. 页头基线是写给人看的，格式不统一（代码基准 / 代码基线 / 源码基线，
#      `verl main @ 8a694930` / `vllm-project/vllm@d66300a1…`，还有一页钉两个仓的）；
#   2. Megatron-LM、torchtitan、MindSpeed 在库里是「旁置 checkout + path:line」引用，
#      页面里根本不出现 github URL，靠 URL 反推必然漏掉。
#
# kb_baseline 是「KB 当前分析所依据的那个 commit」。radar 用它判断
# 「上游已经跑到哪、我们的页面落后多少」。合并新分析后请同步更新这里。
# 填 null 表示暂不做落后判定，只报告新活动。

repos:
  # ---- 推理 / 后训练框架 ----
  - name: vLLM
    repo: vllm-project/vllm
    branch: main
    kb_baseline: d66300a1baa7779c68c7dfa4e51eee2502b48017
    kb_entry: wiki/02_engineering/03_infer_frameworks/vllm/index.md
    category: 推理框架

