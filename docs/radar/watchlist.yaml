# 前沿论文调研。三条实测结论固化在这里：
#   1. 用 ti:（标题匹配）而不是 abs:，abs 会捞进只是顺带提了 LLM 的论文；
#   2. 必须带 LLM 约束，否则 MoE / attention 这类词会把视频理解、外科识别、
#      加密货币预测全捞进来；
#   3. 加 cat: 类别约束进一步收敛。
# 即便如此仍会有残留噪声（"Mixture of Experts" 跨领域太通用），所以每主题
# 只列 8 条供扫读，不合适就在这里调 query——这是给人调的旋钮，不是自动的。
arxiv:
  - name: MoE 与稀疏化
    query: 'ti:"mixture of experts" AND (abs:"large language model" OR abs:"LLM") AND (cat:cs.LG OR cat:cs.CL OR cat:cs.DC)'
    category: 前沿论文
  - name: 注意力与长上下文
    query: '(ti:"KV cache" OR ti:"long context" OR ti:"attention") AND (abs:"large language model" OR abs:"LLM") AND (cat:cs.CL OR cat:cs.LG)'
    category: 前沿论文
  - name: RL 后训练与对齐
    query: '(ti:"reinforcement learning" OR ti:"post-training" OR ti:"RLHF") AND (abs:"large language model" OR abs:"LLM") AND cat:cs.CL'
    category: 前沿论文
  - name: 推理服务与系统
    query: 'ti:"LLM inference" OR ti:"LLM serving" OR ti:"inference engine" OR ti:"speculative decoding"'
    category: 前沿论文
  - name: 并行与训练系统
    query: '(ti:"distributed training" OR ti:"parallelism" OR ti:"pipeline parallel") AND (abs:"large language model" OR abs:"LLM")'
    category: 前沿论文
