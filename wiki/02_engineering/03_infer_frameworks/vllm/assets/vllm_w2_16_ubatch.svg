<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="610" viewBox="0 0 1040 610"><title>MRV2：跨微批次请求只截掉未来Query</title><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#2A313B;font-size:20px}.neutral{fill:#fff;stroke:#C7CCD3}.ghost{fill:#F7F6F3;stroke:#DDD9D2}.acc1{fill:#EAF1FD;stroke:#2563EB}.acc2{fill:#FCF1E6;stroke:#C3651F}.heading{font-size:24px;font-weight:600}.cap{font-size:19px;fill:#6B7280}.arrow{stroke:#2563EB;stroke-width:2.5;fill:none}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563EB"/></marker></defs><rect width="1040" height="610" fill="white"/>
<text x="30" y="35" class="heading">同一 A 横跨两个微批次：第二段保留第一段已算出的历史</text>
<text x="30" y="77" class="cap">教学切分：3 个真实 token 补到 4；边界在扁平位置 2（不代表默认触发阈值）</text>
<text x="100" y="115" class="cap">flat 0</text>
<rect x="80" y="128" width="205" height="58" class="neutral"/>
<text x="140" y="165" class="">B5</text>
<text x="330" y="115" class="cap">flat 1</text>
<rect x="310" y="128" width="205" height="58" class="acc1"/>
<text x="370" y="165" class="">A18</text>
<text x="560" y="115" class="cap">flat 2</text>
<rect x="540" y="128" width="205" height="58" class="neutral"/>
<text x="600" y="165" class="">A19</text>
<text x="790" y="115" class="cap">flat 3</text>
<rect x="770" y="128" width="205" height="58" class="ghost"/>
<text x="830" y="165" class="">padding</text>
<path d="M525 112V202" stroke="#C3651F" stroke-width="2" stroke-dasharray="5 4"/>
<text x="110" y="223" class="">U0：token [0,2)</text>
<text x="590" y="223" class="">U1：token [2,4)</text>
<path d="M285 237L285 262" class="arrow" marker-end="url(#a)"/>
<path d="M760 237L760 262" class="arrow" marker-end="url(#a)"/>
<rect x="30" y="276" width="475" height="245" class="neutral"/>
<rect x="535" y="276" width="475" height="245" class="neutral"/>
<text x="50" y="312" class="heading">U0：B5、A18</text>
<text x="555" y="312" class="heading">U1：A19、padding</text>
<text x="50" y="355" class="">query_start_loc = [0,1,2]</text>
<text x="555" y="355" class="">query_start_loc = [0,1]</text>
<text x="50" y="394" class="">seq_lens = [6,19]</text>
<text x="555" y="394" class="">seq_lens = [20]</text>
<text x="50" y="436" class="">A 的未来 A19 尚未算：20 − 1 = 19</text>
<text x="555" y="436" class="">A18 已在 U0 算过：仍计入 20</text>
<text x="50" y="477" class="cap">B 可见 0–5；A18 可见 A0–A18</text>
<text x="555" y="477" class="cap">A19 可见 A0–A19；padding 不产出</text>
<text x="30" y="562" class="">拼回 B5 / A18 / A19 的 hidden states 后，只对完整 batch 采样一次。</text>
<text x="30" y="597" class="cap">不能按“该微批次只有一个 A Query”把 U1 的历史又减掉 A18。</text>
</svg>
