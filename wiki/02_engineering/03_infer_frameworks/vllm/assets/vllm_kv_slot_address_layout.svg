<svg id="kv-address-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 555" role="img" aria-labelledby="kv-title kv-desc"><title id="kv-title">同一 block id 的跨层视图与 K/V 元素地址</title><desc id="kv-desc">两种共享 backing 排列的局部切片。普通 FlashAttention 每层 view 为块、head、state、内容。K/V 在内容轴相邻，层间连续性由布局决定。</desc><style>#kv-address-svg text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}#kv-address-svg .title{font-size:20px;font-weight:600}#kv-address-svg .body{font-size:16px}#kv-address-svg .small{font-size:14px;fill:#475569}#kv-address-svg .neutral{fill:#fff;stroke:#64748b}#kv-address-svg .ghost{fill:#f8fafc;stroke:#94a3b8}#kv-address-svg .acc1{fill:#dbeafe;stroke:#2563eb}#kv-address-svg .acc2{fill:#ffedd5;stroke:#ea580c}</style><rect width="900" height="555" fill="white"/>
<text x="24" y="32" class="title">同一个编号 ≠ 同一种物理排列</text>
<text x="24" y="58" class="small">共享 backing 的局部切片：每格是一层的一页；省略其他块与层。</text>
<text x="24" y="91" class="body">LBNHC：按层排，再排块；地址向右增加 →</text>
<rect x="145" y="106" width="108" height="64" class="neutral"/>
<text x="157" y="131" class="body">layer 0</text>
<text x="157" y="155" class="body">block 6</text>
<text x="254" y="143" class="small">›</text>
<rect x="263" y="106" width="108" height="64" class="acc1"/>
<text x="275" y="131" class="body">layer 0</text>
<text x="275" y="155" class="body">block 7</text>
<text x="372" y="143" class="small">›</text>
<rect x="381" y="106" width="108" height="64" class="neutral"/>
<text x="393" y="131" class="body">layer 0</text>
<text x="393" y="155" class="body">block 8</text>
<text x="490" y="143" class="small">›</text>
<rect x="499" y="106" width="108" height="64" class="neutral"/>
<text x="511" y="131" class="body">layer 1</text>
<text x="511" y="155" class="body">block 6</text>
<text x="608" y="143" class="small">›</text>
<rect x="617" y="106" width="108" height="64" class="acc1"/>
<text x="629" y="131" class="body">layer 1</text>
<text x="629" y="155" class="body">block 7</text>
<text x="726" y="143" class="small">›</text>
<rect x="735" y="106" width="108" height="64" class="neutral"/>
<text x="747" y="131" class="body">layer 1</text>
<text x="747" y="155" class="body">block 8</text>
<text x="24" y="196" class="small">仅展示 layer 0/1 与 block 6/7/8；省略范围不表示地址相邻。</text>
<text x="24" y="226" class="body">BLNHC：按块排，再排层；地址向右增加 →</text>
<rect x="145" y="240" width="108" height="64" class="neutral"/>
<text x="157" y="265" class="body">layer 0</text>
<text x="157" y="289" class="body">block 6</text>
<text x="254" y="277" class="small">›</text>
<rect x="263" y="240" width="108" height="64" class="neutral"/>
<text x="275" y="265" class="body">layer 1</text>
<text x="275" y="289" class="body">block 6</text>
<text x="372" y="277" class="small">›</text>
<rect x="381" y="240" width="108" height="64" class="acc1"/>
<text x="393" y="265" class="body">layer 0</text>
<text x="393" y="289" class="body">block 7</text>
<text x="490" y="277" class="small">›</text>
<rect x="499" y="240" width="108" height="64" class="acc1"/>
<text x="511" y="265" class="body">layer 1</text>
<text x="511" y="289" class="body">block 7</text>
<text x="608" y="277" class="small">›</text>
<rect x="617" y="240" width="108" height="64" class="neutral"/>
<text x="629" y="265" class="body">layer 0</text>
<text x="629" y="289" class="body">block 8</text>
<text x="726" y="277" class="small">›</text>
<rect x="735" y="240" width="108" height="64" class="neutral"/>
<text x="747" y="265" class="body">layer 1</text>
<text x="747" y="289" class="body">block 8</text>
<text x="24" y="340" class="body">放大：layer 1 / block 7 / offset 8 / head 0；slot = 120</text>
<text x="24" y="365" class="small">逻辑 view：[block, head, state, content]；以下是一个 head 的 content 轴。</text>
<rect x="145" y="386" width="350" height="66" class="acc1"/>
<rect x="495" y="386" width="350" height="66" class="neutral"/>
<text x="166" y="412" class="body">K：content 0–127</text>
<text x="166" y="438" class="small">128 元素 × 2 B = 256 B</text>
<text x="516" y="412" class="body">V：content 128–255</text>
<text x="516" y="438" class="small">128 元素 × 2 B = 256 B</text>
<rect x="160" y="461" width="330" height="29" class="acc2"/>
<text x="170" y="482" class="small">K 的 d=5 → cache[7,0,8,5]</text>
<rect x="510" y="461" width="335" height="29" class="acc2"/>
<text x="520" y="482" class="small">V 的 d=5 → cache[7,0,8,133]</text>
<text x="24" y="519" class="small">无 padding、LBNHC、H=1、B=16：K 地址偏移 61450 B；V 偏移 61706 B。</text>
<text x="24" y="541" class="small">两者只差 D×e；跨层 / 跨 head 的连续性仍要读真实 stride。</text>
</svg>