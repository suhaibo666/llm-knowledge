<svg id="kv-address-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 590" role="img" aria-labelledby="kv-title kv-desc"><title id="kv-title">同一 kernel block 的跨层视图与 A19 的 K/V 元素地址</title><desc id="kv-desc">两种共享 backing 排列的局部切片。普通 FlashAttention 每层 view 为块、head、state、内容；LBNHC 块内按 token、head、内容排列。K/V 在同一 head 的内容轴相邻，层间连续性由布局决定。</desc><style>#kv-address-svg text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#0f172a}#kv-address-svg .title{font-size:20px;font-weight:600}#kv-address-svg .body{font-size:16px}#kv-address-svg .small{font-size:14px;fill:#475569}#kv-address-svg .neutral{fill:#fff;stroke:#64748b}#kv-address-svg .ghost{fill:#f8fafc;stroke:#94a3b8}#kv-address-svg .acc1{fill:#dbeafe;stroke:#2563eb}#kv-address-svg .acc2{fill:#ffedd5;stroke:#ea580c}</style><rect width="960" height="590" fill="white"/>
<text x="24" y="32" class="title">同一个编号 ≠ 同一种物理排列</text>
<text x="24" y="58" class="small">共享 backing 的局部切片：每格是一层的一页；省略其他块与层。</text>
<text x="24" y="92" class="body">LBNHC：按层排，再排块；地址向右增加 →</text>
<rect x="60" y="106" width="138" height="64" class="neutral"/>
<text x="74" y="131" class="body">layer 0</text>
<text x="74" y="155" class="body">block 12</text>
<text x="200" y="143" class="small">›</text>
<rect x="210" y="106" width="138" height="64" class="acc1"/>
<text x="224" y="131" class="body">layer 0</text>
<text x="224" y="155" class="body">block 13</text>
<text x="350" y="143" class="small">›</text>
<rect x="360" y="106" width="138" height="64" class="neutral"/>
<text x="374" y="131" class="body">layer 0</text>
<text x="374" y="155" class="body">block 14</text>
<text x="500" y="143" class="small">›</text>
<rect x="510" y="106" width="138" height="64" class="neutral"/>
<text x="524" y="131" class="body">layer 1</text>
<text x="524" y="155" class="body">block 12</text>
<text x="650" y="143" class="small">›</text>
<rect x="660" y="106" width="138" height="64" class="acc1"/>
<text x="674" y="131" class="body">layer 1</text>
<text x="674" y="155" class="body">block 13</text>
<text x="800" y="143" class="small">›</text>
<rect x="810" y="106" width="138" height="64" class="neutral"/>
<text x="824" y="131" class="body">layer 1</text>
<text x="824" y="155" class="body">block 14</text>
<text x="24" y="196" class="small">仅展示 layer 0/1 与 kernel block 12/13/14；省略范围不表示地址相邻。</text>
<text x="24" y="226" class="body">BLNHC：按块排，再排层；地址向右增加 →</text>
<rect x="60" y="240" width="138" height="64" class="neutral"/>
<text x="74" y="265" class="body">layer 0</text>
<text x="74" y="289" class="body">block 12</text>
<text x="200" y="277" class="small">›</text>
<rect x="210" y="240" width="138" height="64" class="neutral"/>
<text x="224" y="265" class="body">layer 1</text>
<text x="224" y="289" class="body">block 12</text>
<text x="350" y="277" class="small">›</text>
<rect x="360" y="240" width="138" height="64" class="acc1"/>
<text x="374" y="265" class="body">layer 0</text>
<text x="374" y="289" class="body">block 13</text>
<text x="500" y="277" class="small">›</text>
<rect x="510" y="240" width="138" height="64" class="acc1"/>
<text x="524" y="265" class="body">layer 1</text>
<text x="524" y="289" class="body">block 13</text>
<text x="650" y="277" class="small">›</text>
<rect x="660" y="240" width="138" height="64" class="neutral"/>
<text x="674" y="265" class="body">layer 0</text>
<text x="674" y="289" class="body">block 14</text>
<text x="800" y="277" class="small">›</text>
<rect x="810" y="240" width="138" height="64" class="neutral"/>
<text x="824" y="265" class="body">layer 1</text>
<text x="824" y="289" class="body">block 14</text>
<text x="24" y="340" class="body">放大：layer 1 / kernel block 13 / offset 3（A19）；slot = 13×16+3 = 211</text>
<text x="24" y="365" class="small">LBNHC 块内按 token → head → content：一个 token 行依次放 head 0、head 1，各为 K(64) 接 V(64)。</text>
<rect x="60" y="386" width="220" height="66" class="acc1"/>
<text x="88" y="412" class="body">head 0 · K：c 0–63</text>
<text x="88" y="438" class="small">64 元素 × 2 B = 128 B</text>
<rect x="280" y="386" width="220" height="66" class="neutral"/>
<text x="308" y="412" class="body">head 0 · V：c 64–127</text>
<text x="308" y="438" class="small">64 元素 × 2 B = 128 B</text>
<rect x="500" y="386" width="220" height="66" class="ghost"/>
<text x="528" y="412" class="body">head 1 · K：c 0–63</text>
<text x="528" y="438" class="small">64 元素 × 2 B = 128 B</text>
<rect x="720" y="386" width="220" height="66" class="ghost"/>
<text x="748" y="412" class="body">head 1 · V：c 64–127</text>
<text x="748" y="438" class="small">64 元素 × 2 B = 128 B</text>
<rect x="77.19" y="386" width="3.44" height="66" class="acc2"/>
<rect x="297.19" y="386" width="3.44" height="66" class="acc2"/>
<rect x="60" y="462" width="210" height="29" class="acc2"/>
<text x="70" y="482" class="small">K 的 d=5 → cache[13,0,3,5]</text>
<rect x="280" y="462" width="210" height="29" class="acc2"/>
<text x="290" y="482" class="small">V 的 d=5 → cache[13,0,3,69]</text>
<text x="510" y="482" class="small">head 1 → cache[13,1,3,0:128]</text>
<text x="24" y="526" class="small">无 padding、LBNHC、H=2、D=64、B_k=16、BF16：K 偏移 (211·256+5)·2 = 108042 B；V 偏移 108170 B。</text>
<text x="24" y="550" class="small">两者只差 D×e = 128 B；b·B_k+o = 211 正是 slot_mapping 的值。偏移从该层 view 起点算起。</text>
<text x="24" y="574" class="small">跨层 / 跨 head 的连续性仍要读真实 stride；换布局或 padding 后致密简式失效。</text>
</svg>
