<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="790" viewBox="0 0 1020 790"><title>MRV1：空洞压紧与全部请求字段同行</title><desc>删除 X 后 B 从 row 2 移到 row 1，再与 A 交换，最终 B row 0、A row 1。图中块号是表内容，不表示复制 KV 缓存。</desc><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#2A313B;font-size:20px}.neutral{fill:#fff;stroke:#C7CCD3}.ghost{fill:#F7F6F3;stroke:#DDD9D2}.acc1{fill:#EAF1FD;stroke:#2563EB}.acc2{fill:#FCF1E6;stroke:#C3651F}.arrow.main{stroke:#2563EB;stroke-width:2.5;fill:none}.cap{font-size:19px;fill:#6B7280}.heading{font-size:24px;font-weight:600}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#2563EB"/></marker></defs><rect width="1020" height="790" fill="white"/>
<text x="30" y="36" class="heading">紧凑 row 是整组状态的位置；只改请求 id 会错配</text>
