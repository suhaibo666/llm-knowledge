<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" font-family="Microsoft YaHei, SimHei, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="mDn" markerWidth="9" markerHeight="9" refX="4.5" refY="8" orient="0"><path d="M0,0 L9,0 L4.5,9 z" fill="#e03131"/></marker>
    <marker id="mIn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#5f3dc4"/></marker>
  </defs>
  <rect width="1280" height="690" fill="#ffffff"/>
  <text x="30" y="36" font-size="23" font-weight="bold" fill="#212529">HSDP 反向 reduce 路径:缓冲申请/释放与显存峰值</text>
  <text x="30" y="59" font-size="13.5" fill="#868e96">p = 单组完整参数/梯度(bf16)。torchtitan reduce=fp32(硬编码)=> reduce_scatter_input / reduce_output 走 fp32,字节 = bf16 全梯度的 2x。</text>
  <!-- color legend -->
  <rect x="30" y="70" width="18" height="13" rx="2" fill="#5b8def"/><text x="54" y="81" font-size="12.5" fill="#495057">完整参数(bf16, p)</text>
  <rect x="210" y="70" width="18" height="13" rx="2" fill="#4caf82"/><text x="234" y="81" font-size="12.5" fill="#495057">完整梯度(bf16, p)</text>
  <rect x="392" y="70" width="18" height="13" rx="2" fill="#f76707"/><text x="416" y="81" font-size="12.5" fill="#495057">reduce_scatter_input(fp32, 2p)</text>
  <rect x="650" y="70" width="18" height="13" rx="2" fill="#9b6dd6"/><text x="674" y="81" font-size="12.5" fill="#495057">reduce_output / 分片梯度(fp32, 2p/S)</text>

  <!-- ======================= Part A: lifecycle columns ======================= -->
  <text x="30" y="108" font-size="16" font-weight="bold" fill="#343a40">① 单组 reduce 路径缓冲生命周期(时间 ->;同时 group N-1 在 re-AG / 计算)</text>

  <!-- baseline + base foundation -->
  <line x1="80" y1="300" x2="1170" y2="300" stroke="#ced4da" stroke-width="1.2"/>
  <rect x="80" y="332" width="1090" height="30" rx="4" fill="#e9ecef"/>
  <text x="625" y="351" font-size="12.5" text-anchor="middle" fill="#868e96">常驻 base:分片 param P/S + 分片 grad ≤P/S + optim 2P/S(均 fp32)+ 激活 —— 不随单组 reduce 起伏</text>

  <g text-anchor="middle">
    <!-- Col1 Bm(N) cx=160 -->
    <text x="160" y="128" font-size="13" fill="#343a40">Bm(N) 算梯度</text>
    <rect x="95" y="274" width="130" height="26" rx="3" fill="#5b8def"/><text x="160" y="291" font-size="11.5" fill="#fff">完整参 N</text>
    <rect x="95" y="248" width="130" height="26" rx="3" fill="#5b8def"/><text x="160" y="265" font-size="11" fill="#fff">完整参 N-1(re-AG)</text>
    <rect x="95" y="222" width="130" height="26" rx="3" fill="#4caf82"/><text x="160" y="239" font-size="11" fill="#fff">完整梯 N(产出)</text>
    <text x="160" y="320" font-size="12" font-weight="bold" fill="#1971c2">2p 参 + 1p 梯(bf16)</text>

    <!-- Col2 reshard(N) cx=345 -->
    <text x="345" y="128" font-size="13" fill="#343a40">reshard(N) :511</text>
    <rect x="280" y="222" width="130" height="26" rx="3" fill="none" stroke="#ced4da" stroke-width="1.2" stroke-dasharray="3 3"/><text x="345" y="239" font-size="10.5" fill="#adb5bd">完整参 N 已释放</text>
    <rect x="280" y="274" width="130" height="26" rx="3" fill="#5b8def"/><text x="345" y="291" font-size="11" fill="#fff">完整参 N-1</text>
    <rect x="280" y="248" width="130" height="26" rx="3" fill="#4caf82"/><text x="345" y="265" font-size="11.5" fill="#fff">完整梯 N</text>
    <text x="345" y="320" font-size="12" font-weight="bold" fill="#1971c2">1p 参 + 1p 梯</text>

    <!-- Col3 copy-in(N) cx=530  (SPIKE) -->
    <text x="530" y="128" font-size="13" fill="#343a40">copy-in(N) :514</text>
    <rect x="465" y="274" width="130" height="26" rx="3" fill="#5b8def"/><text x="530" y="291" font-size="11" fill="#fff">完整参 N-1</text>
    <rect x="465" y="248" width="130" height="26" rx="3" fill="#4caf82"/><text x="530" y="265" font-size="10.5" fill="#fff">完整梯 N(chunk_cat 源)</text>
    <rect x="465" y="190" width="130" height="56" rx="3" fill="#f76707"/><text x="530" y="214" font-size="11" fill="#fff">reduce_scatter_input N</text><text x="530" y="230" font-size="10.5" fill="#fff">(fp32, 2p)</text>
    <text x="530" y="320" font-size="12" font-weight="bold" fill="#c2255c">1p参 + 1p梯 + 2p暂存 = 瞬时尖峰</text>

    <!-- Col4 RS(N) cx=715 -->
    <text x="715" y="128" font-size="13" fill="#343a40">reduce_scatter(N) :528</text>
    <rect x="650" y="274" width="130" height="26" rx="3" fill="#5b8def"/><text x="715" y="291" font-size="11" fill="#fff">完整参 N-1</text>
    <rect x="650" y="220" width="130" height="54" rx="3" fill="#f76707"/><text x="715" y="251" font-size="11" fill="#fff">RS_input N (fp32,2p)</text>
    <rect x="650" y="206" width="130" height="14" rx="2" fill="#9b6dd6"/><text x="715" y="217" font-size="10" fill="#fff">reduce_output (2p/S)</text>
    <text x="715" y="320" font-size="12" font-weight="bold" fill="#1971c2">1p参 + 2p暂存 + 2p/S</text>

    <!-- Col5 AR(N) cx=900  (highlight +0) -->
    <text x="900" y="128" font-size="13" fill="#2b8a3e" font-weight="bold">all_reduce(N) :556</text>
    <rect x="835" y="274" width="130" height="26" rx="3" fill="#5b8def"/><text x="900" y="291" font-size="11" fill="#fff">完整参 N-1</text>
    <rect x="835" y="220" width="130" height="54" rx="3" fill="#f76707"/><text x="900" y="251" font-size="11" fill="#fff">RS_input N</text>
    <rect x="835" y="206" width="130" height="14" rx="2" fill="#9b6dd6"/><text x="900" y="217" font-size="10" fill="#fff">reduce_output(原地)</text>
    <text x="900" y="320" font-size="12" font-weight="bold" fill="#2b8a3e">= RS 列(AR 不增加峰值)</text>

    <!-- Col6 view-out cx=1085 -->
    <text x="1085" y="128" font-size="13" fill="#343a40">view-out :585-614</text>
    <rect x="1020" y="274" width="130" height="26" rx="3" fill="#5b8def"/><text x="1085" y="291" font-size="11" fill="#fff">完整参 N-1</text>
    <rect x="1020" y="220" width="130" height="54" rx="3" fill="#fdd9b5" stroke="#d9480f" stroke-width="1.4" stroke-dasharray="5 3"/><text x="1085" y="245" font-size="10.5" fill="#d9480f">RS_input N(延迟释放)</text>
    <rect x="1020" y="206" width="130" height="14" rx="2" fill="#9b6dd6"/><text x="1085" y="217" font-size="9.5" fill="#fff">-> 常驻 sharded grad</text>
    <text x="1085" y="320" font-size="11.5" font-weight="bold" fill="#d9480f">RS_input 延迟释放;输出沉淀进 base</text>
  </g>

  <!-- alloc/free annotations -->
  <text x="530" y="184" font-size="11" fill="#2b8a3e" text-anchor="middle">+ allocate :508</text>
  <path d="M650,250 L632,250" fill="none" stroke="#e03131" stroke-width="1.3" marker-end="url(#mDn)"/>
  <text x="610" y="244" font-size="10.5" fill="#e03131" text-anchor="end">- 释放梯N :517</text>
  <text x="715" y="200" font-size="10.5" fill="#2b8a3e" text-anchor="middle">+ :522</text>

  <!-- AR highlight box -->
  <rect x="828" y="120" width="144" height="210" rx="7" fill="none" stroke="#2f9e44" stroke-width="2" stroke-dasharray="4 3"/>
  <path d="M905,213 L950,213" fill="none" stroke="#2f9e44" stroke-width="0"/>
  <text x="900" y="106" font-size="12" text-anchor="middle" font-weight="bold" fill="#2f9e44">AR 原地复用 reduce_output, +0</text>

  <!-- view-out: reduce_output flows into base -->
  <path d="M1085,222 L1085,332" fill="none" stroke="#5f3dc4" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#mIn)"/>

  <!-- ======================= Part B: peak composition ======================= -->
  <line x1="30" y1="384" x2="1250" y2="384" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="410" font-size="16" font-weight="bold" fill="#343a40">② 反向显存峰值构成(transient,叠在 base 之上)</text>

  <!-- peak stacked bar  x=110 w=120 baseline y=628 -->
  <g>
    <!-- base+act compressed -->
    <rect x="110" y="566" width="120" height="62" fill="#e9ecef"/>
    <path d="M110,566 L122,560 L134,566 L146,560 L158,566 L170,560 L182,566 L194,560 L206,566 L218,560 L230,566" fill="#ffffff" stroke="#ced4da" stroke-width="1"/>
    <text x="170" y="600" font-size="11" text-anchor="middle" fill="#868e96">base + 激活</text>
    <!-- 2p params bf16 -->
    <rect x="110" y="540" width="120" height="26" fill="#5b8def"/>
    <rect x="110" y="514" width="120" height="26" fill="#5b8def"/>
    <!-- RS_input fp32 2p -->
    <rect x="110" y="462" width="120" height="52" fill="#f76707"/>
    <!-- grad bf16 p (transient) -->
    <rect x="110" y="436" width="120" height="26" fill="#4caf82" stroke="#2b8a3e" stroke-dasharray="4 2"/>
    <!-- reduce_output 2p/S -->
    <rect x="110" y="424" width="120" height="12" fill="#9b6dd6"/>
    <!-- AR sliver +0 -->
    <rect x="110" y="419" width="120" height="5" fill="#e03131"/>
    <!-- peak line -->
    <line x1="110" y1="419" x2="980" y2="419" stroke="#e03131" stroke-width="1.3" stroke-dasharray="5 3"/>
    <text x="236" y="423" font-size="12" font-weight="bold" fill="#e03131">峰值</text>
    <!-- segment labels -->
    <text x="240" y="529" font-size="12" fill="#1971c2">2p 完整参数(bf16, re-AG 当前层+预取)</text>
    <text x="240" y="491" font-size="12" fill="#d9480f">2p reduce_scatter_input(fp32 暂存)</text>
    <text x="240" y="452" font-size="12" fill="#2b8a3e">p 完整梯度(bf16, copy-in 瞬时叠加)</text>
    <text x="240" y="432" font-size="11.5" fill="#7048e8">2p/S reduce_output  +  AR +0(原地)</text>
  </g>

  <!-- conclusions box -->
  <rect x="560" y="430" width="690" height="232" rx="8" fill="#f8f9fa" stroke="#dee2e6"/>
  <text x="578" y="456" font-size="14.5" font-weight="bold" fill="#212529">峰值公式与关键结论</text>
  <text x="578" y="482" font-size="12.5" fill="#495057">反向稳态峰值 ≈ <tspan font-weight="bold">base</tspan>(P/S param + ≤P/S grad + 2P/S optim,fp32) + 激活</text>
  <text x="578" y="502" font-size="12.5" fill="#495057">　　　　　　　 + <tspan fill="#1971c2" font-weight="bold">2p 完整参数</tspan>(bf16,re-AG) + <tspan fill="#d9480f" font-weight="bold">2p reduce_scatter_input</tspan>(fp32)<tspan fill="#2b8a3e">[+ copy-in 瞬时 p 完整梯]</tspan></text>
  <text x="578" y="530" font-size="12.5" fill="#2b8a3e" font-weight="bold">① all-reduce 原地复用 p/S 的 reduce_output(:556),对峰值贡献 ≈ 0</text>
  <text x="594" y="549" font-size="12" fill="#2b8a3e">=> HSDP 反向峰值 ≈ 纯 FSDP 反向峰值;HSDP 的 dp_replicate 复制不省显存(分片只按 S)。</text>
  <text x="578" y="575" font-size="12.5" fill="#495057">② <tspan fill="#d9480f" font-weight="bold">reduce 走 fp32</tspan>:RS_input / reduce_output 是 bf16 全梯度字节的 2x,反向暂存比"1 组完整梯度"更重。</text>
  <text x="578" y="599" font-size="12.5" fill="#495057">③ RS_input <tspan font-weight="bold">延迟释放</tspan>(ReduceScatterState :561,见 §8),稳态仅 1 份,与下一组 copy-in 重叠。</text>
  <text x="578" y="623" font-size="12.5" fill="#495057">④ 对比前向(2 组完整参数 bf16):反向再叠 ~2-3p 的 fp32 梯度暂存,通常是整轮显存峰值所在。</text>
  <text x="578" y="648" font-size="11" fill="#868e96">注:若 reduce_dtype=bf16 而参数 fp32(非 torchtitan 默认),view-out 的 _to_dtype_if_needed(:577) 另开 fp32 输出、_all_reduce_state 暂留 bf16 输入(+p/S)。</text>
</svg>
