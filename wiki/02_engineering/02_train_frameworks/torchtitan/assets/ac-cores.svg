<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" font-family="Microsoft YaHei, SimHei, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#495057"/></marker>
    <marker id="ad" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#adb5bd"/></marker>
  </defs>
  <rect width="1120" height="560" fill="#ffffff"/>
  <text x="30" y="38" font-size="23" font-weight="bold" fill="#212529">机制定位:AC 横跨 autograd 与 dispatch 两核心</text>
  <text x="30" y="62" font-size="13" fill="#868e96">不改任何算子。同一个算子前向时被两个通用扩展点各拦一次,正交叠加。</text>

  <!-- op at top -->
  <rect x="410" y="86" width="300" height="44" rx="6" fill="#f1f3f5" stroke="#868e96"/>
  <text x="560" y="113" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#343a40">一个 aten 算子(前向执行)</text>

  <!-- split arrows -->
  <path d="M470,130 C400,150 320,160 300,184" fill="none" stroke="#495057" stroke-width="1.4" marker-end="url(#a)"/>
  <path d="M650,130 C720,150 800,160 820,184" fill="none" stroke="#495057" stroke-width="1.4" marker-end="url(#a)"/>

  <!-- dispatch core (left, blue) -->
  <rect x="60" y="180" width="480" height="180" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.6"/>
  <text x="80" y="206" font-size="15" font-weight="bold" fill="#1864ab">dispatch 核心</text>
  <text x="80" y="226" font-size="12" fill="#1c7ed6">扩展点:TorchDispatchMode.__torch_dispatch__</text>
  <rect x="80" y="238" width="440" height="44" rx="5" fill="#ffffff" stroke="#74c0fc"/>
  <text x="300" y="265" font-size="12.5" text-anchor="middle" fill="#1864ab">_CachingMode:policy_fn → MUST_SAVE? → storage.append(输出)</text>
  <rect x="80" y="294" width="440" height="48" rx="5" fill="#ffffff" stroke="#74c0fc"/>
  <text x="300" y="314" font-size="12" text-anchor="middle" fill="#495057">管"重算时哪些 op 真跑"</text>
  <text x="300" y="332" font-size="12" text-anchor="middle" fill="#1864ab" font-weight="bold">→ 决定:WHICH ops</text>

  <!-- autograd core (right, green) -->
  <rect x="580" y="180" width="480" height="180" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.6"/>
  <text x="600" y="206" font-size="15" font-weight="bold" fill="#1e7a4d">autograd 核心</text>
  <text x="600" y="226" font-size="12" fill="#2f9e44">扩展点:saved_tensors_hooks</text>
  <rect x="600" y="238" width="440" height="44" rx="5" fill="#ffffff" stroke="#8ce99a"/>
  <text x="820" y="260" font-size="12.5" text-anchor="middle" fill="#1e7a4d">_checkpoint_hook.pack_hook:激活 → 返回 Holder(票)</text>
  <text x="820" y="276" font-size="11.5" text-anchor="middle" fill="#868e96">前向不存激活,只存占位符</text>
  <rect x="600" y="294" width="440" height="48" rx="5" fill="#ffffff" stroke="#8ce99a"/>
  <text x="820" y="314" font-size="12" text-anchor="middle" fill="#495057">管"整段 vs 算"+ 何时(lazy,首次 unpack)</text>
  <text x="820" y="332" font-size="12" text-anchor="middle" fill="#1e7a4d" font-weight="bold">→ 决定:WHEN recompute</text>

  <!-- backward row -->
  <text x="30" y="404" font-size="15" font-weight="bold" fill="#c92a2a">反向</text>
  <path d="M300,360 L300,392" fill="none" stroke="#adb5bd" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ad)"/>
  <path d="M820,360 L820,392" fill="none" stroke="#adb5bd" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ad)"/>

  <rect x="580" y="392" width="480" height="52" rx="6" fill="#fff5f5" stroke="#fa5252"/>
  <text x="820" y="414" font-size="12.5" text-anchor="middle" fill="#c92a2a">autograd:首次 unpack → 整段重算 recompute_fn</text>
  <text x="820" y="432" font-size="12" text-anchor="middle" fill="#495057">enable_grad 重建子图;_recomputation_hook 绑票</text>

  <rect x="60" y="392" width="480" height="52" rx="6" fill="#e7f5ff" stroke="#1c7ed6"/>
  <text x="300" y="414" font-size="12.5" text-anchor="middle" fill="#1864ab">dispatch:重算那一遍里,_CachedMode</text>
  <text x="300" y="432" font-size="12" text-anchor="middle" fill="#495057">MUST_SAVE → storage.pop 回放 / 其余 → 真算</text>

  <path d="M580,418 L546,418" fill="none" stroke="#495057" stroke-width="1.3" marker-end="url(#a)"/>
  <text x="556" y="412" font-size="11" fill="#868e96">驱动</text>

  <!-- bottom: design philosophy -->
  <line x1="30" y1="470" x2="1090" y2="470" stroke="#dee2e6"/>
  <text x="30" y="494" font-size="13" fill="#495057">设计哲学:零算子侵入,与 DTensor 寄生 __torch_dispatch__ 同源 —— 站在 PyTorch 通用拦截点上,对任意算子生效。</text>
  <text x="30" y="516" font-size="12.5" fill="#868e96">DTensor / SAC缓存回放 → __torch_dispatch__(dispatch);AC 票据机制 → saved_tensors_hooks(autograd)。</text>
  <text x="30" y="538" font-size="12.5" fill="#868e96">同算子前向各拦一次:dispatch 缓存输出、autograd 把激活换票;full AC 只用 autograd 那个,SAC 多叠 dispatch 那层。</text>
</svg>
