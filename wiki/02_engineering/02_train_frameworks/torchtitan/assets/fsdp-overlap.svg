<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="780" font-family="Microsoft YaHei, SimHei, Segoe UI, Arial, sans-serif">
  <defs>
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#e9ecef"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#adb5bd" stroke-width="3"/>
    </pattern>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#e03131"/>
    </marker>
  </defs>

  <rect width="1180" height="780" fill="#ffffff"/>
  <text x="30" y="40" font-size="26" font-weight="bold" fill="#212529">FSDP 前向:计算 — 通信掩盖对照</text>
  <text x="30" y="66" font-size="15" fill="#868e96">CI=copy-in(拼分片+转dtype)  AG=all-gather(NCCL通信)  CO=copy-out(拆回完整参数)  Cm=Compute(用完整参数算)</text>

  <!-- ============ Panel 1: serial ============ -->
  <text x="30" y="108" font-size="19" font-weight="bold" fill="#343a40">① 没有多流(全部挤在一条流上,串行)</text>
  <text x="20" y="152" font-size="15" fill="#495057">单流</text>
  <!-- group0 -->
  <rect x="150" y="130" width="38" height="40" rx="3" fill="#f4a259"/><text x="169" y="155" font-size="13" text-anchor="middle" fill="#fff">CI0</text>
  <rect x="188" y="130" width="78" height="40" rx="3" fill="#5b8def"/><text x="227" y="155" font-size="13" text-anchor="middle" fill="#fff">AG0</text>
  <rect x="266" y="130" width="26" height="40" rx="3" fill="#9b6dd6"/><text x="279" y="155" font-size="11" text-anchor="middle" fill="#fff">CO0</text>
  <rect x="292" y="130" width="120" height="40" rx="3" fill="#4caf82"/><text x="352" y="155" font-size="13" text-anchor="middle" fill="#fff">Cm0</text>
  <!-- group1 -->
  <rect x="412" y="130" width="38" height="40" rx="3" fill="#f4a259"/><text x="431" y="155" font-size="13" text-anchor="middle" fill="#fff">CI1</text>
  <rect x="450" y="130" width="78" height="40" rx="3" fill="#5b8def"/><text x="489" y="155" font-size="13" text-anchor="middle" fill="#fff">AG1</text>
  <rect x="528" y="130" width="26" height="40" rx="3" fill="#9b6dd6"/><text x="541" y="155" font-size="11" text-anchor="middle" fill="#fff">CO1</text>
  <rect x="554" y="130" width="120" height="40" rx="3" fill="#4caf82"/><text x="614" y="155" font-size="13" text-anchor="middle" fill="#fff">Cm1</text>
  <!-- group2 -->
  <rect x="674" y="130" width="38" height="40" rx="3" fill="#f4a259"/><text x="693" y="155" font-size="13" text-anchor="middle" fill="#fff">CI2</text>
  <rect x="712" y="130" width="78" height="40" rx="3" fill="#5b8def"/><text x="751" y="155" font-size="13" text-anchor="middle" fill="#fff">AG2</text>
  <rect x="790" y="130" width="26" height="40" rx="3" fill="#9b6dd6"/><text x="803" y="155" font-size="11" text-anchor="middle" fill="#fff">CO2</text>
  <rect x="816" y="130" width="120" height="40" rx="3" fill="#4caf82"/><text x="876" y="155" font-size="13" text-anchor="middle" fill="#fff">Cm2</text>
  <text x="946" y="155" font-size="15" fill="#868e96">…</text>
  <!-- exposed brackets under AG -->
  <path d="M188,178 L188,186 L266,186 L266,178" fill="none" stroke="#e03131" stroke-width="1.5"/>
  <path d="M450,178 L450,186 L528,186 L528,178" fill="none" stroke="#e03131" stroke-width="1.5"/>
  <text x="300" y="202" font-size="13" fill="#e03131">AG 完全暴露:GPU 计算单元在通信时空转</text>
  <text x="150" y="226" font-size="13" fill="#868e96">总时长 = Σ(CI+AG+CO+Cm),首尾相接,零重叠</text>

  <!-- ============ Panel 2: multi-stream ============ -->
  <text x="30" y="288" font-size="19" font-weight="bold" fill="#343a40">② 有多流 + 预取(掩盖)</text>
  <text x="20" y="332" font-size="14" fill="#495057">copy_in 流</text>
  <text x="20" y="377" font-size="14" fill="#495057">all_gather 流</text>
  <text x="20" y="424" font-size="14" fill="#495057">计算流</text>

  <!-- copy_in lane y=312 h=30 -->
  <rect x="150" y="312" width="38" height="30" rx="3" fill="#f4a259"/><text x="169" y="332" font-size="12" text-anchor="middle" fill="#fff">CI0</text>
  <rect x="232" y="312" width="38" height="30" rx="3" fill="#f4a259"/><text x="251" y="332" font-size="12" text-anchor="middle" fill="#fff">CI1</text>
  <rect x="408" y="312" width="38" height="30" rx="3" fill="#f4a259"/><text x="427" y="332" font-size="12" text-anchor="middle" fill="#fff">CI2</text>
  <rect x="584" y="312" width="38" height="30" rx="3" fill="#f4a259"/><text x="603" y="332" font-size="12" text-anchor="middle" fill="#fff">CI3</text>

  <!-- all_gather lane y=357 h=30 -->
  <rect x="192" y="357" width="78" height="30" rx="3" fill="#5b8def"/><text x="231" y="377" font-size="12" text-anchor="middle" fill="#fff">AG0</text>
  <rect x="310" y="357" width="78" height="30" rx="3" fill="#5b8def"/><text x="349" y="377" font-size="12" text-anchor="middle" fill="#fff">AG1</text>
  <rect x="486" y="357" width="78" height="30" rx="3" fill="#5b8def"/><text x="525" y="377" font-size="12" text-anchor="middle" fill="#fff">AG2</text>
  <rect x="662" y="357" width="78" height="30" rx="3" fill="#5b8def"/><text x="701" y="377" font-size="12" text-anchor="middle" fill="#fff">AG3</text>

  <!-- compute lane y=400 h=44 -->
  <rect x="150" y="400" width="120" height="44" rx="3" fill="url(#hatch)" stroke="#adb5bd"/><text x="210" y="427" font-size="12" text-anchor="middle" fill="#e03131">等 AG0(暴露)</text>
  <rect x="270" y="400" width="26" height="44" rx="3" fill="#9b6dd6"/><text x="283" y="427" font-size="10" text-anchor="middle" fill="#fff">CO0</text>
  <rect x="296" y="400" width="150" height="44" rx="3" fill="#4caf82"/><text x="371" y="427" font-size="14" text-anchor="middle" fill="#fff">Cm0</text>
  <rect x="446" y="400" width="26" height="44" rx="3" fill="#9b6dd6"/><text x="459" y="427" font-size="10" text-anchor="middle" fill="#fff">CO1</text>
  <rect x="472" y="400" width="150" height="44" rx="3" fill="#4caf82"/><text x="547" y="427" font-size="14" text-anchor="middle" fill="#fff">Cm1</text>
  <rect x="622" y="400" width="26" height="44" rx="3" fill="#9b6dd6"/><text x="635" y="427" font-size="10" text-anchor="middle" fill="#fff">CO2</text>
  <rect x="648" y="400" width="150" height="44" rx="3" fill="#4caf82"/><text x="723" y="427" font-size="14" text-anchor="middle" fill="#fff">Cm2</text>
  <text x="806" y="427" font-size="15" fill="#868e96">…</text>

  <!-- wait_event markers (stars) at each CO start -->
  <text x="270" y="396" font-size="18" fill="#e03131" text-anchor="middle">★</text>
  <text x="446" y="396" font-size="18" fill="#2f9e44" text-anchor="middle">★</text>
  <text x="622" y="396" font-size="18" fill="#2f9e44" text-anchor="middle">★</text>

  <!-- arrows AG done -> star -->
  <path d="M388,372 C420,372 430,388 446,396" fill="none" stroke="#e03131" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <path d="M564,372 C600,372 606,388 622,396" fill="none" stroke="#e03131" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arr)"/>

  <!-- overlap brackets -->
  <path d="M296,452 L296,460 L446,460 L446,452" fill="none" stroke="#2f9e44" stroke-width="1.4"/>
  <text x="300" y="476" font-size="12" fill="#2f9e44">AG1 在 Cm0 期间跑完 → 下个 ★ 立即返回(掩盖)</text>
  <path d="M232,300 L232,294 L270,294" fill="none" stroke="#f08c00" stroke-width="1.2"/>
  <text x="278" y="298" font-size="11" fill="#f08c00">CI1 与 AG0 重叠(独立流)</text>

  <text x="150" y="500" font-size="13" fill="#495057">★ = <tspan font-family="Consolas, monospace" fill="#1864ab">current_stream().wait_event(all_gather_event)</tspan>  —— 每层计算流唯一一次"等通信流"(_fsdp_collectives.py:361)</text>
  <text x="150" y="520" font-size="13" fill="#e03131">红★:首层 prologue,真的等;</text>
  <text x="360" y="520" font-size="13" fill="#2f9e44">绿★:AG 已被上一层计算掩盖,几乎零停顿</text>
  <text x="150" y="540" font-size="13" fill="#868e96">总时长 ≈ AG0 + Σ Cm(通信/拷贝被塞进计算影子,关键路径上只剩计算)</text>

  <!-- ============ Legend ============ -->
  <text x="30" y="592" font-size="16" font-weight="bold" fill="#343a40">图例</text>
  <rect x="30" y="606" width="22" height="16" rx="2" fill="#f4a259"/><text x="58" y="619" font-size="13" fill="#495057">CI copy-in</text>
  <rect x="150" y="606" width="22" height="16" rx="2" fill="#5b8def"/><text x="178" y="619" font-size="13" fill="#495057">AG all-gather(通信)</text>
  <rect x="340" y="606" width="22" height="16" rx="2" fill="#9b6dd6"/><text x="368" y="619" font-size="13" fill="#495057">CO copy-out</text>
  <rect x="470" y="606" width="22" height="16" rx="2" fill="#4caf82"/><text x="498" y="619" font-size="13" fill="#495057">Cm 计算</text>
  <rect x="580" y="606" width="22" height="16" rx="2" fill="url(#hatch)" stroke="#adb5bd"/><text x="608" y="619" font-size="13" fill="#495057">暴露/空转</text>

  <line x1="30" y1="644" x2="1150" y2="644" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="672" font-size="13.5" fill="#495057">要点:① CO 与 Cm 在同一条计算流 → FIFO 串行(且 Cm 读 CO 造出的完整参数,有硬数据依赖)。</text>
  <text x="30" y="694" font-size="13.5" fill="#495057">② 被掩盖的是 AG/CI:它们在独立流上与"CO+Cm 这段计算"并行。靠 CPU 异步派发跑在 GPU 前 + 高优先级流编排。</text>
  <text x="30" y="716" font-size="13.5" fill="#495057">③ 全掩盖成立条件:层数足够 + 单层 Cm ≥ AG + 无 D2H 打断(否则用显式预取);首层 AG0 永远暴露。</text>
</svg>
