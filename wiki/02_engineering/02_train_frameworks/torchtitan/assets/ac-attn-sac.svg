<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" font-family="Microsoft YaHei, SimHei, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="s" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#d9480f"/></marker>
  </defs>
  <rect width="1160" height="720" fill="#ffffff"/>
  <text x="30" y="36" font-size="23" font-weight="bold" fill="#212529">attention block 的 SAC 端到端走查</text>
  <text x="30" y="58" font-size="13" fill="#868e96">policy:mm 奇数次存/偶数次算,SDPA 恒存,norm/rope/residual 重算。橙=MUST_SAVE(存→回放),绿=PREFER_RECOMPUTE(真算)。</text>

  <!-- x anchor -->
  <rect x="40" y="78" width="1080" height="34" rx="6" fill="#f3eefc" stroke="#9b6dd6"/>
  <text x="580" y="100" font-size="13" text-anchor="middle" fill="#6741d9">x(块输入)—— 由 _NoopSaveInputs 锚定为"重算起点";storage = { q, v, o(+lse) }</text>

  <!-- column headers -->
  <text x="200" y="138" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#343a40">正向(全算,只留 MUST_SAVE 输出)</text>
  <text x="470" y="138" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#b3801e">storage</text>
  <text x="850" y="138" font-size="14.5" text-anchor="middle" font-weight="bold" fill="#343a40">反向(从 x 重跑整段:回放 / 真算)</text>

  <!-- helper rows -->
  <!-- row template: A box 40-360, B chip 400-540, C box 580-1120 ; y = 156 + i*62, h=48 -->

  <!-- i=0 norm -->
  <rect x="40" y="156" width="320" height="48" rx="6" fill="#e9f7ef" stroke="#4caf82"/><text x="56" y="178" font-size="13.5" fill="#1e7a4d">attention_norm</text><text x="56" y="196" font-size="11" fill="#2f9e44">PREFER_RECOMPUTE</text>
  <rect x="580" y="156" width="540" height="48" rx="6" fill="#e9f7ef" stroke="#4caf82"/><text x="596" y="185" font-size="13" fill="#1e7a4d">真重算 RMSNorm(x) → h</text>

  <!-- i=1 wq MUST_SAVE -->
  <rect x="40" y="218" width="320" height="48" rx="6" fill="#fff3e6" stroke="#f4a259"/><text x="56" y="240" font-size="13.5" fill="#b3541e">wq  (mm #1)</text><text x="56" y="258" font-size="11" fill="#d9480f">MUST_SAVE</text>
  <rect x="408" y="222" width="124" height="40" rx="6" fill="#ffe8cc" stroke="#f4a259"/><text x="470" y="247" font-size="13" text-anchor="middle" fill="#b3541e">q</text>
  <path d="M360,242 L406,242" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#s)"/>
  <path d="M532,242 L578,242" fill="none" stroke="#d9480f" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#s)"/>
  <rect x="580" y="218" width="540" height="48" rx="6" fill="#fff3e6" stroke="#f4a259"/><text x="596" y="247" font-size="13" fill="#b3541e">storage.pop → 回放 q(不重 matmul)</text>

  <!-- i=2 wk RECOMPUTE -->
  <rect x="40" y="280" width="320" height="48" rx="6" fill="#e9f7ef" stroke="#4caf82"/><text x="56" y="302" font-size="13.5" fill="#1e7a4d">wk  (mm #2)</text><text x="56" y="320" font-size="11" fill="#2f9e44">PREFER_RECOMPUTE</text>
  <rect x="580" y="280" width="540" height="48" rx="6" fill="#e9f7ef" stroke="#4caf82"/><text x="596" y="309" font-size="13" fill="#1e7a4d">真重算 wk(h) → k</text>

  <!-- i=3 wv MUST_SAVE -->
  <rect x="40" y="342" width="320" height="48" rx="6" fill="#fff3e6" stroke="#f4a259"/><text x="56" y="364" font-size="13.5" fill="#b3541e">wv  (mm #3)</text><text x="56" y="382" font-size="11" fill="#d9480f">MUST_SAVE</text>
  <rect x="408" y="346" width="124" height="40" rx="6" fill="#ffe8cc" stroke="#f4a259"/><text x="470" y="371" font-size="13" text-anchor="middle" fill="#b3541e">v</text>
  <path d="M360,366 L406,366" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#s)"/>
  <path d="M532,366 L578,366" fill="none" stroke="#d9480f" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#s)"/>
  <rect x="580" y="342" width="540" height="48" rx="6" fill="#fff3e6" stroke="#f4a259"/><text x="596" y="371" font-size="13" fill="#b3541e">storage.pop → 回放 v</text>

  <!-- i=4 rope RECOMPUTE -->
  <rect x="40" y="404" width="320" height="48" rx="6" fill="#e9f7ef" stroke="#4caf82"/><text x="56" y="426" font-size="13.5" fill="#1e7a4d">rope</text><text x="56" y="444" font-size="11" fill="#2f9e44">PREFER_RECOMPUTE</text>
  <rect x="580" y="404" width="540" height="48" rx="6" fill="#e9f7ef" stroke="#4caf82"/><text x="596" y="433" font-size="13" fill="#1e7a4d">真重算 rope(q, k)</text>

  <!-- i=5 SDPA MUST_SAVE -->
  <rect x="40" y="466" width="320" height="48" rx="6" fill="#fff3e6" stroke="#f4a259" stroke-width="2"/><text x="56" y="488" font-size="13.5" font-weight="bold" fill="#b3541e">SDPA</text><text x="56" y="506" font-size="11" fill="#d9480f">MUST_SAVE</text>
  <rect x="402" y="470" width="136" height="40" rx="6" fill="#ffe8cc" stroke="#f4a259"/><text x="470" y="495" font-size="12.5" text-anchor="middle" fill="#b3541e">o (+lse)</text>
  <path d="M360,490 L400,490" fill="none" stroke="#d9480f" stroke-width="1.4" marker-end="url(#s)"/>
  <path d="M538,490 L578,490" fill="none" stroke="#d9480f" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#s)"/>
  <rect x="580" y="466" width="540" height="48" rx="6" fill="#fff3e6" stroke="#f4a259" stroke-width="2"/><text x="596" y="495" font-size="13" font-weight="bold" fill="#b3541e">storage.pop → 回放 o  ★ 不重算 O(S²) 注意力</text>

  <!-- i=6 wo RECOMPUTE -->
  <rect x="40" y="528" width="320" height="48" rx="6" fill="#e9f7ef" stroke="#4caf82"/><text x="56" y="550" font-size="13.5" fill="#1e7a4d">wo  (mm #4)</text><text x="56" y="568" font-size="11" fill="#2f9e44">PREFER_RECOMPUTE</text>
  <rect x="580" y="528" width="540" height="48" rx="6" fill="#e9f7ef" stroke="#4caf82"/><text x="596" y="557" font-size="13" fill="#1e7a4d">真重算 wo(o) → out</text>

  <!-- i=7 residual RECOMPUTE -->
  <rect x="40" y="590" width="320" height="48" rx="6" fill="#e9f7ef" stroke="#4caf82"/><text x="56" y="612" font-size="13.5" fill="#1e7a4d">residual add</text><text x="56" y="630" font-size="11" fill="#2f9e44">PREFER_RECOMPUTE</text>
  <rect x="580" y="590" width="540" height="48" rx="6" fill="#e9f7ef" stroke="#4caf82"/><text x="596" y="619" font-size="13" fill="#1e7a4d">真重算 x + out → y</text>

  <!-- bottom notes -->
  <line x1="30" y1="658" x2="1130" y2="658" stroke="#dee2e6"/>
  <text x="30" y="680" font-size="12.5" fill="#495057">正向留:x(锚) + storage{q,v,o} + 轻量票(weak_holders);释放:h、k、rope 输出、SDPA 内 S×S 注意力矩阵、out(激活大头)。</text>
  <text x="30" y="700" font-size="12.5" fill="#868e96">轴①weak_holders = 全部激活的票(autograd 决定,含 q/v/o);轴②storage = policy 选的 3 个输出。SDPA 回放 = 省掉注意力重算,这是 SAC 在 attention 上的价值。</text>
</svg>
