<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="740" font-family="Microsoft YaHei, SimHei, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#495057"/></marker>
  </defs>
  <rect width="1180" height="740" fill="#ffffff"/>
  <text x="30" y="38" font-size="24" font-weight="bold" fill="#212529">激活重计算:票据机制(前向发票 → 反向重算绑票 → unpack 兑票)</text>
  <text x="30" y="62" font-size="13.5" fill="#868e96">蓝=票 _Holder,橙=MUST_SAVE/storage,绿=PREFER_RECOMPUTE,紫=input_saver。示例块:h=x@W1(mm)→ a=relu(h)→ y=a@W2(mm)</text>

  <!-- op header chips -->
  <g font-size="13" text-anchor="middle">
    <rect x="200" y="86" width="260" height="40" rx="6" fill="#fff3e6" stroke="#f4a259"/><text x="330" y="104" fill="#b3541e" font-weight="bold">h = x @ W1  (mm)</text><text x="330" y="120" fill="#b3541e" font-size="11">MUST_SAVE</text>
    <rect x="480" y="86" width="220" height="40" rx="6" fill="#e9f7ef" stroke="#4caf82"/><text x="590" y="104" fill="#1e7a4d" font-weight="bold">a = relu(h)</text><text x="590" y="120" fill="#1e7a4d" font-size="11">PREFER_RECOMPUTE</text>
    <rect x="720" y="86" width="260" height="40" rx="6" fill="#fff3e6" stroke="#f4a259"/><text x="850" y="104" fill="#b3541e" font-weight="bold">y = a @ W2  (mm)</text><text x="850" y="120" fill="#b3541e" font-size="11">MUST_SAVE</text>
  </g>

  <!-- ============ Stage 1 forward ============ -->
  <text x="30" y="160" font-size="16" font-weight="bold" fill="#343a40">① 前向 _checkpoint_hook.pack_hook(:1129):发票,不存激活</text>
  <rect x="30" y="170" width="1120" height="30" rx="5" fill="#f3eefc" stroke="#9b6dd6"/><text x="44" y="190" font-size="12.5" fill="#6741d9">input_saver = _NoopSaveInputs.apply(块输入 x)(:1564) —— 存"原料",反向重算的起点</text>
  <g font-size="12">
    <rect x="200" y="210" width="260" height="62" rx="6" fill="#eef3ff" stroke="#5b8def"/><text x="330" y="232" text-anchor="middle" fill="#1c4fb3">发票0 → weak_holders[0]</text><text x="330" y="252" text-anchor="middle" fill="#b3541e">[SAC] 输出 h → storage[mm]</text><text x="330" y="266" text-anchor="middle" fill="#868e96" font-size="11">h 由 storage 持有</text>
    <rect x="480" y="210" width="220" height="62" rx="6" fill="#eef3ff" stroke="#5b8def"/><text x="590" y="232" text-anchor="middle" fill="#1c4fb3">发票1 → weak_holders[1]</text><text x="590" y="254" text-anchor="middle" fill="#2f9e44">激活 a 释放(省显存)</text>
    <rect x="720" y="210" width="260" height="62" rx="6" fill="#eef3ff" stroke="#5b8def"/><text x="850" y="232" text-anchor="middle" fill="#1c4fb3">发票2 → weak_holders[2]</text><text x="850" y="252" text-anchor="middle" fill="#b3541e">[SAC] 输出 y → storage[mm]</text>
  </g>
  <text x="1000" y="245" font-size="12" fill="#868e96">autograd 图里</text><text x="1000" y="260" font-size="12" fill="#868e96">挂的全是"票"</text>

  <line x1="590" y1="278" x2="590" y2="306" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="600" y="296" font-size="12.5" fill="#495057">反向第一次 unpack(任意票)→ 触发整块重算</text>

  <!-- ============ Stage 2 recompute ============ -->
  <text x="30" y="332" font-size="16" font-weight="bold" fill="#343a40">② 反向重算 recompute_fn 重跑整块,_recomputation_hook.pack_hook(:1070)按序绑票</text>
  <g font-size="12">
    <rect x="200" y="344" width="260" height="64" rx="6" fill="#fff3e6" stroke="#f4a259"/><text x="330" y="366" text-anchor="middle" fill="#b3541e">_Cached 模式:storage.pop(0)</text><text x="330" y="384" text-anchor="middle" fill="#b3541e">取回 h(不重算 mm,:1359)</text><text x="330" y="400" text-anchor="middle" fill="#1c4fb3">→ recomputed[票0] = h</text>
    <rect x="480" y="344" width="220" height="64" rx="6" fill="#e9f7ef" stroke="#4caf82"/><text x="590" y="366" text-anchor="middle" fill="#1e7a4d">非 MUST_SAVE</text><text x="590" y="384" text-anchor="middle" fill="#1e7a4d">真算 relu(h)(:1361)</text><text x="590" y="400" text-anchor="middle" fill="#1c4fb3">→ recomputed[票1] = a</text>
    <rect x="720" y="344" width="260" height="64" rx="6" fill="#fff3e6" stroke="#f4a259"/><text x="850" y="366" text-anchor="middle" fill="#b3541e">storage.pop(0) 取回 y</text><text x="850" y="384" text-anchor="middle" fill="#b3541e">(不重算 mm)</text><text x="850" y="400" text-anchor="middle" fill="#1c4fb3">→ recomputed[票2] = y</text>
  </g>
  <rect x="1000" y="350" width="150" height="52" rx="6" fill="#fff0f0" stroke="#e03131"/><text x="1075" y="370" text-anchor="middle" font-size="11.5" fill="#c92a2a">票补满 → 提前停</text><text x="1075" y="388" text-anchor="middle" font-size="10.5" fill="#c92a2a">_StopRecomputation(:1102)</text>

  <line x1="590" y1="414" x2="590" y2="442" stroke="#495057" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ============ Stage 3 unpack ============ -->
  <text x="30" y="468" font-size="16" font-weight="bold" fill="#343a40">③ unpack 兑票(:1169)</text>
  <rect x="200" y="478" width="780" height="48" rx="6" fill="#f1f3f5" stroke="#adb5bd"/><text x="590" y="500" text-anchor="middle" font-size="12.5" fill="#343a40">unpack(票i) → recomputed[gid][票i] → 交 autograd 算梯度;holder 置 None 防重兑。</text><text x="590" y="518" text-anchor="middle" font-size="12" fill="#868e96">整块只在"第一次 unpack"重算一次;后续票直接取(is_recomputed[gid]=True)。</text>

  <!-- ============ pairing + structures ============ -->
  <line x1="30" y1="548" x2="1150" y2="548" stroke="#dee2e6"/>
  <text x="30" y="574" font-size="14.5" font-weight="bold" fill="#5f3dc4">配对的本质:同序重放 + 下标对齐</text>
  <text x="40" y="596" font-size="13" fill="#495057">前向第 i 张票 ↔ 重算第 i 个激活(forward 与 recompute 跑同一串算子、同序)。storage 也按执行序 append / pop。</text>
  <text x="40" y="616" font-size="13" fill="#495057">两者都<tspan font-weight="bold" fill="#c92a2a">要求确定性</tspan>:不一致则 check_recomputed_tensors_match(:848)报 CheckpointError;preserve_rng_state 保证随机算子重算一致。</text>

  <text x="30" y="648" font-size="14" font-weight="bold" fill="#343a40">_CheckpointFrame 三件套</text>
  <g font-size="12">
    <rect x="30" y="660" width="280" height="46" rx="6" fill="#eef3ff" stroke="#5b8def"/><text x="44" y="680" fill="#1c4fb3" font-weight="bold">weak_holders = [票0,票1,票2]</text><text x="44" y="698" fill="#868e96">前向按序记票(弱引用)</text>
    <rect x="330" y="660" width="300" height="46" rx="6" fill="#eafaf1" stroke="#4caf82"/><text x="344" y="680" fill="#1e7a4d" font-weight="bold">recomputed[gid] = {票→激活}</text><text x="344" y="698" fill="#868e96">重算时绑入;backward 消费完即清(弱键)</text>
    <rect x="650" y="660" width="300" height="46" rx="6" fill="#fff3e6" stroke="#f4a259"/><text x="664" y="680" fill="#b3541e" font-weight="bold">storage[func] = [输出...] (仅 SAC)</text><text x="664" y="698" fill="#868e96">前向 append,重算 pop(0) 回放</text>
  </g>
  <rect x="970" y="660" width="180" height="46" rx="6" fill="#f3eefc" stroke="#9b6dd6"/><text x="984" y="680" font-size="12" fill="#6741d9" font-weight="bold">input_saver</text><text x="984" y="698" font-size="12" fill="#868e96">块输入(重算原料)</text>

  <text x="30" y="728" font-size="12.5" fill="#868e96">full AC = 所有票都靠"真重算"填;SAC = MUST_SAVE 的票靠 storage 回放(不重算/不重通信),其余真重算。</text>
</svg>
