<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" font-family="Microsoft YaHei, SimHei, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#495057"/></marker>
  </defs>
  <rect width="1120" height="240" fill="#ffffff"/>
  <text x="30" y="36" font-size="20" font-weight="bold" fill="#212529">config 驱动的模块级 AC(方案 A:改配置不改脚本)</text>

  <rect x="30" y="70" width="240" height="96" rx="8" fill="#fff3bf" stroke="#f59f00"/>
  <text x="150" y="96" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#b3801e">① config(只改这里)</text>
  <text x="150" y="122" font-size="12" text-anchor="middle" fill="#495057">recompute_fqns =</text>
  <text x="150" y="142" font-size="12" text-anchor="middle" fill="#495057">layers.*.ffn,</text>
  <text x="150" y="160" font-size="12" text-anchor="middle" fill="#495057">layers.0.attn</text>

  <path d="M270,118 L312,118" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="312" y="70" width="280" height="96" rx="8" fill="#e9f7ef" stroke="#2f9e44"/>
  <text x="452" y="96" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1e7a4d">② tag_recompute(通用,写一次)</text>
  <text x="452" y="122" font-size="12" text-anchor="middle" fill="#495057">遍历 named_modules</text>
  <text x="452" y="142" font-size="12" text-anchor="middle" fill="#495057">FQN 匹配通配 →</text>
  <text x="452" y="160" font-size="12" text-anchor="middle" fill="#495057">m._recompute = True</text>

  <path d="M592,118 L634,118" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="634" y="70" width="280" height="96" rx="8" fill="#eef3ff" stroke="#5b8def"/>
  <text x="774" y="96" font-size="13.5" text-anchor="middle" font-weight="bold" fill="#1c4fb3">③ apply(固定,不改)</text>
  <text x="774" y="122" font-size="12" text-anchor="middle" fill="#495057">apply_activation_checkpointing(</text>
  <text x="774" y="142" font-size="12" text-anchor="middle" fill="#495057">check_fn = lambda m:</text>
  <text x="774" y="160" font-size="12" text-anchor="middle" fill="#495057">m._recompute )</text>

  <path d="M914,118 L956,118" fill="none" stroke="#495057" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="956" y="78" width="150" height="80" rx="8" fill="#f3eefc" stroke="#9b6dd6"/>
  <text x="1031" y="106" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#6741d9">命中子模块</text>
  <text x="1031" y="128" font-size="12" text-anchor="middle" fill="#495057">被 checkpoint_</text>
  <text x="1031" y="146" font-size="12" text-anchor="middle" fill="#495057">wrapper 包</text>

  <text x="30" y="202" font-size="12.5" fill="#868e96">check_fn 只收 module 不收 FQN → 需 ② 把 FQN 翻成 flag。粒度=模块边界:任意子模块按名点名;细于模块的算子需本就写成子模块。</text>
  <text x="30" y="222" font-size="12.5" fill="#868e96">不同模块要不同模式(full/SAC/offload):跑多遍 apply,各配不同 checkpoint_wrapper_fn + check_fn。</text>
</svg>
