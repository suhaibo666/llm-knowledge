<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="600" font-family="Microsoft YaHei, SimHei, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ar2" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 z" fill="#5f3dc4"/></marker>
  </defs>
  <rect width="1300" height="600" fill="#ffffff"/>
  <text x="30" y="34" font-size="23" font-weight="bold" fill="#212529">SimpleFSDP 通信粒度:trace 逐参数 → 编译期分层统一 + 掩盖</text>
  <text x="30" y="58" font-size="14" fill="#868e96">bucketing pass 按 TransformerBlock 把逐参数集合通信合成每块 1 AG + 1 RS(像 FSDP2 ParamGroup),再换流 + 重排实现重叠。</text>

  <!-- ===== Panel 1: per-param ===== -->
  <rect x="28" y="76" width="1244" height="172" rx="6" fill="#fcfcfd" stroke="#dee2e6"/>
  <text x="44" y="100" font-size="15" font-weight="bold" fill="#343a40">① trace 出的 joint 图:逐参数,一参一次(无 eager 分组)</text>

  <text x="44" y="132" font-size="12.5" fill="#1864ab" font-weight="bold">TransformerBlock N 的参数:</text>
  <g text-anchor="middle" font-size="11">
    <rect x="270" y="118" width="62" height="22" rx="4" fill="#e7f5ff" stroke="#74c0fc"/><text x="301" y="133" fill="#1864ab">wq</text>
    <rect x="338" y="118" width="62" height="22" rx="4" fill="#e7f5ff" stroke="#74c0fc"/><text x="369" y="133" fill="#1864ab">wk</text>
    <rect x="406" y="118" width="62" height="22" rx="4" fill="#e7f5ff" stroke="#74c0fc"/><text x="437" y="133" fill="#1864ab">wv</text>
    <rect x="474" y="118" width="62" height="22" rx="4" fill="#e7f5ff" stroke="#74c0fc"/><text x="505" y="133" fill="#1864ab">wo</text>
    <rect x="542" y="118" width="62" height="22" rx="4" fill="#e7f5ff" stroke="#74c0fc"/><text x="573" y="133" fill="#1864ab">w1</text>
    <rect x="610" y="118" width="62" height="22" rx="4" fill="#e7f5ff" stroke="#74c0fc"/><text x="641" y="133" fill="#1864ab">w2</text>
    <rect x="678" y="118" width="62" height="22" rx="4" fill="#e7f5ff" stroke="#74c0fc"/><text x="709" y="133" fill="#1864ab">w3</text>
  </g>

  <text x="44" y="172" font-size="12" fill="#495057">前向 all_gather:</text>
  <g text-anchor="middle" font-size="10" fill="#fff">
    <rect x="270" y="160" width="62" height="20" rx="3" fill="#5b8def"/><text x="301" y="174">AG</text>
    <rect x="338" y="160" width="62" height="20" rx="3" fill="#5b8def"/><text x="369" y="174">AG</text>
    <rect x="406" y="160" width="62" height="20" rx="3" fill="#5b8def"/><text x="437" y="174">AG</text>
    <rect x="474" y="160" width="62" height="20" rx="3" fill="#5b8def"/><text x="505" y="174">AG</text>
    <rect x="542" y="160" width="62" height="20" rx="3" fill="#5b8def"/><text x="573" y="174">AG</text>
    <rect x="610" y="160" width="62" height="20" rx="3" fill="#5b8def"/><text x="641" y="174">AG</text>
    <rect x="678" y="160" width="62" height="20" rx="3" fill="#5b8def"/><text x="709" y="174">AG</text>
  </g>
  <text x="44" y="208" font-size="12" fill="#495057">反向 reduce_scatter:</text>
  <g text-anchor="middle" font-size="10" fill="#fff">
    <rect x="270" y="196" width="62" height="20" rx="3" fill="#15aabf"/><text x="301" y="210">RS</text>
    <rect x="338" y="196" width="62" height="20" rx="3" fill="#15aabf"/><text x="369" y="210">RS</text>
    <rect x="406" y="196" width="62" height="20" rx="3" fill="#15aabf"/><text x="437" y="210">RS</text>
    <rect x="474" y="196" width="62" height="20" rx="3" fill="#15aabf"/><text x="505" y="210">RS</text>
    <rect x="542" y="196" width="62" height="20" rx="3" fill="#15aabf"/><text x="573" y="210">RS</text>
    <rect x="610" y="196" width="62" height="20" rx="3" fill="#15aabf"/><text x="641" y="210">RS</text>
    <rect x="678" y="196" width="62" height="20" rx="3" fill="#15aabf"/><text x="709" y="210">RS</text>
  </g>

  <rect x="772" y="116" width="488" height="118" rx="6" fill="#fff5f5" stroke="#ffc9c9"/>
  <text x="788" y="138" font-size="12.5" font-weight="bold" fill="#c92a2a">N 个参数 → N 个小集合通信</text>
  <text x="788" y="160" font-size="12" fill="#495057">参数化是逐参数 getter(simple_fsdp.py:145-150),</text>
  <text x="788" y="178" font-size="12" fill="#495057">每参数各自 redistribute → 各自一个 all_gather 节点。</text>
  <text x="788" y="200" font-size="12" fill="#495057">这是「没有分组」的形态:NCCL 调用多、每个小。</text>
  <text x="788" y="222" font-size="11.5" fill="#868e96">FSDP2 在 eager 建 FSDPParamGroup 时就分好组;SimpleFSDP 此刻还没。</text>

  <!-- arrow down -->
  <path d="M650,250 L650,282" fill="none" stroke="#5f3dc4" stroke-width="2.2" marker-end="url(#ar2)"/>
  <text x="666" y="271" font-size="13" font-weight="bold" fill="#5f3dc4">pass② joint_transformer_block_bucketing_reordering(按 block · 方向 · FSDP2 参数序)</text>

  <!-- ===== Panel 2: bucketed + overlap ===== -->
  <rect x="28" y="290" width="1244" height="236" rx="6" fill="#fcfcfd" stroke="#dee2e6"/>
  <text x="44" y="314" font-size="15" font-weight="bold" fill="#343a40">② 分桶 + 重排后:每 block 统一(1 AG + 1 RS)+ 跨流掩盖</text>

  <!-- lane labels -->
  <text x="44" y="344" font-size="12.5" fill="#343a40" font-weight="bold">默认流(计算)</text>
  <text x="44" y="392" font-size="12.5" fill="#495057">额外 PG 流(AG)</text>
  <text x="44" y="434" font-size="12.5" fill="#495057">原 PG 流(RS)</text>

  <!-- lane backgrounds -->
  <rect x="190" y="330" width="1066" height="34" rx="4" fill="#f8f9fa"/>
  <rect x="190" y="378" width="1066" height="28" rx="4" fill="#f8f9fa"/>
  <rect x="190" y="420" width="1066" height="28" rx="4" fill="#f8f9fa"/>

  <!-- compute lane -->
  <g text-anchor="middle">
    <rect x="200" y="332" width="206" height="30" rx="3" fill="#4caf82"/><text x="303" y="352" font-size="12.5" fill="#fff">Cm(blk N)</text>
    <rect x="416" y="332" width="206" height="30" rx="3" fill="#4caf82"/><text x="519" y="352" font-size="12.5" fill="#fff">Cm(blk N-1)</text>
    <rect x="632" y="332" width="206" height="30" rx="3" fill="#4caf82"/><text x="735" y="352" font-size="12.5" fill="#fff">Cm(blk N-2)</text>
    <rect x="848" y="332" width="160" height="30" rx="3" fill="#4caf82"/><text x="928" y="352" font-size="12" fill="#fff">Cm(blk N-3)</text>
    <text x="1030" y="352" font-size="15" fill="#868e96">…</text>
  </g>
  <!-- AG lane (extra PG stream): prefetched, overlaps compute -->
  <g text-anchor="middle">
    <rect x="300" y="380" width="120" height="24" rx="3" fill="#5b8def"/><text x="360" y="397" font-size="11" fill="#fff">AG(blk N+1)</text>
    <rect x="516" y="380" width="120" height="24" rx="3" fill="#5b8def"/><text x="576" y="397" font-size="11" fill="#fff">AG(blk N+2)</text>
    <rect x="732" y="380" width="120" height="24" rx="3" fill="#5b8def"/><text x="792" y="397" font-size="11" fill="#fff">AG(blk N+3)</text>
  </g>
  <!-- RS lane (original PG stream) -->
  <g text-anchor="middle">
    <rect x="430" y="422" width="120" height="24" rx="3" fill="#15aabf"/><text x="490" y="439" font-size="11" fill="#fff">RS(blk N)</text>
    <rect x="646" y="422" width="120" height="24" rx="3" fill="#15aabf"/><text x="706" y="439" font-size="11" fill="#fff">RS(blk N-1)</text>
    <rect x="862" y="422" width="120" height="24" rx="3" fill="#15aabf"/><text x="922" y="439" font-size="11" fill="#fff">RS(blk N-2)</text>
  </g>

  <!-- concurrency bracket -->
  <rect x="300" y="328" width="336" height="122" rx="6" fill="none" stroke="#2f9e44" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="468" y="468" font-size="12.5" text-anchor="middle" fill="#2f9e44" font-weight="bold">AG(额外PG流) ∥ RS(原PG流) ∥ compute(默认流) —— 三流并发</text>

  <text x="44" y="498" font-size="12.5" fill="#495057">每 block:7 参数 → <tspan font-weight="bold" fill="#1971c2">1 个 AG</tspan>、7 梯度 → <tspan font-weight="bold" fill="#0c8599">1 个 RS</tspan>。AG 在额外 PG 独立流上<tspan font-weight="bold">提前发起(预取)</tspan>盖住前一层计算;RS-wait <tspan font-weight="bold">推后</tspan>盖住后一层反向计算。</text>

  <!-- bottom note -->
  <text x="30" y="556" font-size="13" fill="#c92a2a"><tspan font-weight="bold">不开 compile / 关 bucketing pass → 退化成逐参数(N 倍小通信,低效)。</tspan>「分层统一通信」是编译期优化的产物,不是天生的——也是 SimpleFSDP 必须走编译路径的原因。</text>
  <text x="30" y="580" font-size="12" fill="#868e96">对照:FSDP2 在 eager 建 fully_shard 时就把每 block 包成一个 FSDPParamGroup(天生每块 1 AG+1 RS);SimpleFSDP 把「分组」挪到编译期 bucketing。</text>
</svg>
