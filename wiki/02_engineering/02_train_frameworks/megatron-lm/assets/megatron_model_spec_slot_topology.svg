<text class="pt" x="40" y="1043" text-anchor="start">③ 治理不变量：两条泳道模块树不同形，却写出同一份 checkpoint 键</text>
<text class="su" x="40" y="1062" text-anchor="start">TransformerLayerSubmodules 的第 13 个字段 sharded_state_dict_keys_map 在 TransformerLayer.sharded_state_dict 里经 apply_prefix_mapping 就地改键</text>
<rect class="neutral" x="40" y="1077" width="360" height="56" rx="6"/>
<text class="sm" x="54" y="1097" text-anchor="start">local 原始键（模块树路径）</text>
<text class="dim" x="54" y="1117" text-anchor="start">input_layernorm.weight</text>
<path class="aux" d="M 400 1105 L 468 1105"/>
<text class="sm" x="434" y="1098" text-anchor="middle">重命名</text>
<rect class="acc1" x="470" y="1077" width="540" height="56" rx="6"/>
<text class="sm" x="484" y="1095" text-anchor="start">规范键（写盘即规范名）</text>
<text class="dim" x="484" y="1111" text-anchor="start">self_attention.linear_qkv.layer_norm_weight</text>
<text class="sm" x="484" y="1127" text-anchor="start">map: "input_layernorm." → "self_attention.linear_qkv.layer_norm_"</text>
<path class="aux" d="M 1078 1105 L 1012 1105"/>
<text class="sm" x="1045" y="1098" text-anchor="middle">无需映射</text>
<rect class="neutral" x="1080" y="1077" width="360" height="56" rx="6"/>
<text class="sm" x="1094" y="1097" text-anchor="start">transformer_engine 原生键</text>
<text class="dim" x="1094" y="1117" text-anchor="start">self_attention.linear_qkv.layer_norm_weight</text>
<rect class="neutral" x="40" y="1143" width="360" height="56" rx="6"/>
<text class="sm" x="54" y="1163" text-anchor="start">local 原始键（模块树路径）</text>
<text class="dim" x="54" y="1183" text-anchor="start">pre_mlp_layernorm.weight</text>
<path class="aux" d="M 400 1171 L 468 1171"/>
<text class="sm" x="434" y="1164" text-anchor="middle">重命名</text>
<rect class="acc1" x="470" y="1143" width="540" height="56" rx="6"/>
<text class="sm" x="484" y="1161" text-anchor="start">规范键（写盘即规范名）</text>
<text class="dim" x="484" y="1177" text-anchor="start">mlp.linear_fc1.layer_norm_weight</text>
<text class="sm" x="484" y="1193" text-anchor="start">map: "pre_mlp_layernorm." → "mlp.linear_fc1.layer_norm_"</text>
<path class="aux" d="M 1078 1171 L 1012 1171"/>
<text class="sm" x="1045" y="1164" text-anchor="middle">无需映射</text>
<rect class="neutral" x="1080" y="1143" width="360" height="56" rx="6"/>
<text class="sm" x="1094" y="1163" text-anchor="start">transformer_engine 原生键</text>
<text class="dim" x="1094" y="1183" text-anchor="start">mlp.linear_fc1.layer_norm_weight</text>
<rect class="acc2" x="20" y="1229" width="1440" height="56" rx="10"/>
<text class="costtx" x="40" y="1252" text-anchor="start">代价：3 个恒空槽被无条件调用</text>
<text class="sm" x="40" y="1271" text-anchor="start">decoder-only 下 pre_cross_attn_layernorm / cross_attention / cross_attn_bda 在两条泳道上都是哨兵（右侧橙条），_forward_attention 仍每层每次前向调用它们</text>
<text class="cap" x="28" y="1311" text-anchor="start">蓝色：本图机制（被填的槽、被融进 linear 的 norm、规范键）；橙色：代价；灰底：哨兵与不参与本图立论的部分。</text>
<text class="cap" x="28" y="1329" text-anchor="start">两条泳道的 12 行按 dataclass 声明顺序逐行对齐——同一行的差异就是「一个布尔量改变了槽的拓扑」。</text>
</svg>
