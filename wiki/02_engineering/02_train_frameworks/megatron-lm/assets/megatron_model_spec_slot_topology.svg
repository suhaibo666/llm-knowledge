<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1337" width="100%" role="img" aria-label="local 与 transformer engine 两份 spec 装出的插槽表拓扑对照及其共同的 checkpoint 键">
<style>
