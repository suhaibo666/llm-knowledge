<rect class="card" x="0.5" y="0.5" width="1479" height="1336" rx="14"/>
<text class="ti" x="28" y="36" text-anchor="start">同一个 TransformerLayer 类，两份后端 spec：改变的是槽的拓扑，不只是算子</text>
<text class="su" x="28" y="57" text-anchor="start">dense · 非 MLA · 无 hyper-connection：非哨兵槽 local=6、transformer_engine=4，差的正是被融进后继 linear 的两个 norm 槽</text>
<rect class="panel" x="20" y="84" width="708" height="911" rx="12"/>
<text class="pt" x="40" y="114" text-anchor="start">① transformer_impl = "local"</text>
<rect class="neutral" x="40" y="130" width="668" height="58" rx="8"/>
<text class="tx" x="374" y="147" text-anchor="middle">config</text>
<text class="sm" x="374" y="163" text-anchor="middle">transformer_impl = "local"</text>
<text class="sm" x="374" y="179" text-anchor="middle">num_experts=None · qk_layernorm=False</text>
<path class="main" d="M 374 188 L 374 202"/>
<rect class="neutral" x="40" y="202" width="668" height="34" rx="8"/>
<text class="tx" x="374" y="223" text-anchor="middle">get_backend(transformer_impl)</text>
<path class="main" d="M 374 236 L 374 250"/>
<rect class="neutral" x="40" y="250" width="668" height="66" rx="8"/>
<text class="tx" x="374" y="271" text-anchor="middle">LocalSpecProvider</text>
<text class="sm" x="374" y="287" text-anchor="middle">fuse_layernorm_and_linear() → False</text>
<text class="sm" x="374" y="303" text-anchor="middle">linear_fc1 = backend.column_parallel_linear()</text>
<path class="main" d="M 374 316 L 374 330"/>
<text class="tx" x="40" y="348" text-anchor="start">TransformerLayerSubmodules —— 12 个模块槽 + 1 张 sharded_state_dict_keys_map</text>
<rect class="neutral" x="576" y="334" width="132" height="22" rx="6"/>
<text class="sm" x="642" y="349" text-anchor="middle">非哨兵槽 6 / 12</text>
<text class="tx" x="38" y="387" text-anchor="start">input_layernorm</text>
