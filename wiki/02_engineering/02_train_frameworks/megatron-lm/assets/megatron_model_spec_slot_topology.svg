<text class="sm" x="952" y="666" text-anchor="start">IdentityOp（哨兵：此槽未填）</text>
<text class="sm" x="770" y="705" text-anchor="start">cross_attention</text>
<rect class="ghost" x="938" y="684" width="476" height="34" rx="8"/>
<text class="sm" x="952" y="705" text-anchor="start">IdentityOp（哨兵：此槽未填）</text>
<rect class="acc2" x="1428" y="688" width="10" height="26" rx="3"/>
<text class="sm" x="770" y="744" text-anchor="start">cross_attn_bda</text>
<rect class="ghost" x="938" y="723" width="476" height="34" rx="8"/>
