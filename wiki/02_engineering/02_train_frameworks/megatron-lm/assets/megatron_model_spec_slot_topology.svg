<rect class="acc1" x="772" y="250" width="668" height="66" rx="8"/>
<text class="tx" x="1106" y="271" text-anchor="middle">TESpecProvider</text>
<text class="sm" x="1106" y="287" text-anchor="middle">fuse_layernorm_and_linear() → True</text>
<text class="sm" x="1106" y="303" text-anchor="middle">linear_fc1 = backend.column_parallel_layer_norm_linear()</text>
<path class="main" d="M 1106 316 L 1106 330"/>
<text class="tx" x="772" y="348" text-anchor="start">TransformerLayerSubmodules —— 12 个模块槽 + 1 张 sharded_state_dict_keys_map</text>
