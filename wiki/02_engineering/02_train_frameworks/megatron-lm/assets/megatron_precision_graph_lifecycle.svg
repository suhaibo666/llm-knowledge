<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="735" viewBox="0 0 1260 735" role="img"><title>同一输入如何走到可消费的梯度</title><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;font-size:15px;fill:#2A313B}.title{font-size:23px;font-weight:700}.small{font-size:13px;fill:#626B77}.bold{font-weight:700}.neutral{fill:#fff;stroke:#C7CCD3}.ghost{fill:#F7F6F3;stroke:#DDD9D2}.acc1{fill:#EAF1FD;stroke:#2563EB}.acc2{fill:#FCF1E6;stroke:#C3651F}.arrow{fill:none;stroke:#98A1AD;stroke-width:1.3}.main{stroke:#2563EB;stroke-width:2}.dash{fill:none;stroke:#C3651F;stroke-dasharray:5 4}</style><defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#98A1AD"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="26" y="37" class="title">同一输入如何走到可消费的梯度</text><text x="26" y="67" class="small">三条通路使用同一 X[128,128]；每条通路内的精度、融合与激活近似固定。箭头表示依赖，不表示耗时。</text><text x="26" y="110" class="bold">local：固定地址由 runner 持有；调用者的地址可以变化</text><rect x="26" y="128" width="225" height="58" rx="6" class="neutral"/><text x="37" y="152" class="bold">运行时 X</text><text x="37" y="174" class="small">新的张量数据</text><path d="M252,157 L267,157" class="arrow main" marker-end="url(#head)"/><rect x="270" y="128" width="225" height="58" rx="6" class="acc1"/><text x="281" y="152" class="bold">固定输入表面</text><text x="281" y="174" class="small">异址 copy_；合法别名可省</text><path d="M496,157 L511,157" class="arrow main" marker-end="url(#head)"/><rect x="514" y="128" width="225" height="58" rx="6" class="acc1"/><text x="525" y="152" class="bold">fwd_graph.replay</text><text x="525" y="174" class="small">写固定输出 surface</text><path d="M740,157 L755,157" class="arrow main" marker-end="url(#head)"/><rect x="758" y="128" width="225" height="58" rx="6" class="acc2"/><text x="769" y="152" class="bold">外部可用 A</text><text x="769" y="174" class="small">末层 clone，防覆盖</text><path d="M984,157 L999,157" class="arrow main" marker-end="url(#head)"/><rect x="1002" y="128" width="225" height="58" rx="6" class="neutral"/><text x="1013" y="152" class="bold">后续层 → loss</text><text x="1013" y="174" class="small">自动微分产生 G_A</text><path d="M1114.5,188 L1114.5,221" class="arrow main" marker-end="url(#head)"/><rect x="26" y="225" width="225" height="58" rx="6" class="neutral"/><text x="37" y="249" class="bold">梯度消费者</text><text x="37" y="271" class="small">等待事件 / 完成梯度同步</text><path d="M267,254 L253,254" class="arrow main" marker-end="url(#head)"/><rect x="270" y="225" width="225" height="58" rx="6" class="acc1"/><text x="281" y="249" class="bold">main_grad + event</text><text x="281" y="271" class="small">wgrad 累加，记录 ready</text><path d="M511,254 L497,254" class="arrow main" marker-end="url(#head)"/><rect x="514" y="225" width="225" height="58" rx="6" class="acc1"/><text x="525" y="249" class="bold">bwd_graph.replay</text><text x="525" y="271" class="small">计算 dgrad / wgrad</text><path d="M755,254 L741,254" class="arrow main" marker-end="url(#head)"/><rect x="758" y="225" width="225" height="58" rx="6" class="acc2"/><text x="769" y="249" class="bold">固定输出梯度表面</text><text x="769" y="271" class="small">新 G_A 异址则 copy_</text><path d="M999,254 L985,254" class="arrow main" marker-end="url(#head)"/><rect x="1002" y="225" width="225" height="58" rx="6" class="neutral"/><text x="1013" y="249" class="bold">运行时 G_A</text><text x="1013" y="271" class="small">来自 loss backward</text><text x="26" y="310" class="small">先记录首次 F/B 顺序，再共享池捕获；前向表面可复用，反向消费前不得覆盖。</text><text x="26" y="356" class="bold">transformer_engine：helper 安装图；依赖 callable 承载前后向</text><rect x="26" y="374" width="225" height="58" rx="6" class="neutral"/><text x="37" y="398" class="bold">sample X / args</text><text x="37" y="420" class="small">helper 构造静态输入</text><path d="M252,403 L267,403" class="arrow main" marker-end="url(#head)"/><rect x="270" y="374" width="225" height="58" rx="6" class="acc1"/><text x="281" y="398" class="bold">有界 sample slots</text><text x="281" y="420" class="small">按 F/B 顺序证明可复用</text><path d="M496,403 L511,403" class="arrow main" marker-end="url(#head)"/><rect x="514" y="374" width="225" height="58" rx="6" class="acc2"/><text x="525" y="398" class="bold">make_graphed_callables</text><text x="525" y="420" class="small">TE 捕获与缓冲优化</text><path d="M740,403 L755,403" class="arrow main" marker-end="url(#head)"/><rect x="758" y="374" width="225" height="58" rx="6" class="neutral"/><text x="769" y="398" class="bold">layer.cuda_graphs</text><text x="769" y="420" class="small">按层 / 微批槽位安装</text><path d="M984,403 L999,403" class="arrow main" marker-end="url(#head)"/><rect x="1002" y="374" width="225" height="58" rx="6" class="neutral"/><text x="1013" y="398" class="bold">运行时 X → A → loss</text><text x="1013" y="420" class="small">选定槽位 callable 执行</text><path d="M1114.5,434 L1114.5,467" class="arrow main" marker-end="url(#head)"/><rect x="26" y="471" width="225" height="58" rx="6" class="neutral"/><text x="37" y="495" class="bold">梯度消费者</text><text x="37" y="517" class="small">同步 / optimizer 后续消费</text><path d="M267,500 L253,500" class="arrow main" marker-end="url(#head)"/><rect x="270" y="471" width="225" height="58" rx="6" class="neutral"/><text x="281" y="495" class="bold">dgrad / wgrad</text><text x="281" y="517" class="small">返回或累加参数梯度</text><path d="M511,500 L497,500" class="arrow main" marker-end="url(#head)"/><rect x="514" y="471" width="225" height="58" rx="6" class="acc2"/><text x="525" y="495" class="bold">TE backward</text><text x="525" y="517" class="small">内部保存由依赖管理</text><path d="M755,500 L741,500" class="arrow main" marker-end="url(#head)"/><rect x="758" y="471" width="225" height="58" rx="6" class="acc1"/><text x="769" y="495" class="bold">同槽 callable 的反向</text><text x="769" y="517" class="small">按原 F/B 对应关系执行</text><path d="M999,500 L985,500" class="arrow main" marker-end="url(#head)"/><rect x="1002" y="471" width="225" height="58" rx="6" class="neutral"/><text x="1013" y="495" class="bold">loss 的自动微分</text><text x="1013" y="517" class="small">到达图 callable 边界</text><text x="26" y="556" class="small">橙框为 TE 证据边界：Megatron 可核实输入、顺序与安装；不把 local 的缓冲/event 实现照搬给 TE。</text><text x="26" y="601" class="bold">full_iteration：数据复制在图外，整步 F/loss/B 在图内</text><rect x="26" y="619" width="225" height="58" rx="6" class="neutral"/><text x="37" y="643" class="bold">各微批的 X</text><text x="37" y="665" class="small">data_read 读完整步输入</text><path d="M252,648 L267,648" class="arrow main" marker-end="url(#head)"/><rect x="270" y="619" width="225" height="58" rx="6" class="acc1"/><text x="281" y="643" class="bold">StaticBufferLoader</text><text x="281" y="665" class="small">复制流写入，当前流等待</text><path d="M496,648 L511,648" class="arrow main" marker-end="url(#head)"/><rect x="514" y="619" width="225" height="58" rx="6" class="acc1"/><text x="525" y="643" class="bold">整步 CUDA Graph</text><text x="525" y="665" class="small">forward → loss → backward</text><path d="M740,648 L755,648" class="arrow main" marker-end="url(#head)"/><rect x="758" y="619" width="225" height="58" rx="6" class="neutral"/><text x="769" y="643" class="bold">保存的 result 容器</text><text x="769" y="665" class="small">重放结果交训练循环</text><path d="M984,648 L999,648" class="arrow main" marker-end="url(#head)"/><rect x="1002" y="619" width="225" height="58" rx="6" class="acc2"/><text x="1013" y="643" class="bold">optimizer.step（图外）</text><text x="1013" y="665" class="small">随后参数同步 / 下一次 GEMM</text><text x="26" y="706" class="small">训练与验证各持有图、静态输入和结果；共享 mempool 不等于 optimizer 已成为这张 F/B 图的一部分。</text></svg>
