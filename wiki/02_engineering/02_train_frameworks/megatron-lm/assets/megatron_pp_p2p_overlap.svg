<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1316 448" width="100%" role="img"
     aria-label="overlap_p2p_comm 前后对照：同步融合 P2P 时计算流每步干等一段通信，异步 isend/irecv 加延迟 wait 后计算流连续、通信被掩盖，壁钟从 22 降到 16">
  <style>
    text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
    .card{fill:#fff;stroke:#E4E7EC}
    .ti{font-size:15px;font-weight:700;fill:#1F2430}
    .su{font-size:11.5px;fill:#8A8F98}
    .pt{font-size:12.5px;font-weight:700;fill:#2A313B}
    .ps{font-size:11px;fill:#8A8F98}
    .lab{font-size:11px;fill:#5B6470;text-anchor:end}
    .bl{font-size:12px;font-weight:700;fill:#fff;text-anchor:middle}
    .bls{font-size:10px;font-weight:600;fill:#5B6470;text-anchor:middle}
    .f{fill:#3E7BD0}                                  /* 前向计算 */
    .b{fill:#3E9970}                                  /* 反向计算 */
    .stall{fill:url(#hatch);stroke:#C3651F;stroke-width:1.2}   /* 关键路径上的干等 */
    .comm{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.2}        /* 被掩盖的异步通信 */
    .base{stroke:#ECEFF3}
    .rule{stroke:#C7CCD3;stroke-dasharray:3 3}
    .tick{stroke:#9AA1AC;stroke-width:1.5}
    .mk{font-size:10px;fill:#9AA1AC;text-anchor:middle}
    .cb{stroke:#B6BCC4;stroke-width:1}
    .cbt{font-size:9.5px;fill:#8A8F98}
    .box-cost{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.4}
    .txt-cost{font-size:10.5px;font-weight:600;fill:#8A4A11}
    .box-gain{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.4}
    .txt-gain{font-size:10.5px;font-weight:600;fill:#173F87}
    .cap{font-size:11px;fill:#7A808A}
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="#FBF1E6"/>
      <rect width="3" height="6" fill="#EFD9BE"/>
    </pattern>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="1315" height="447" rx="14"/>
  <text class="ti" x="20" y="34">overlap_p2p_comm：把 vp× 的 P2P 通信移出关键路径</text>
  <text class="su" x="20" y="52">VPP 稳态的 2 个 1F1B 步 · 上下共用同一条时间轴 · 蓝 = 前向计算，绿 = 反向计算，橙斜纹 = 计算流干等，浅蓝框 = 异步 P2P</text>
  <text class="su" x="20" y="68">序列取自 schedules.py:1849 的四个回调（可逐条核对）；时间比例为示意参数 t_f=t_b=4t、t_p2p=1.5t，非实测</text>
  <text class="pt" x="20" y="80">① VPP 默认：同步融合 P2P（send_forward_backward_recv_forward_backward）</text>
  <text class="ps" x="20" y="97">算完 → 同步收发 → 再算，串成一条线；斜纹段 = 计算流干等通信</text>
  <text class="lab" x="84" y="129">comp 流</text>
  <line class="base" x1="94" y1="143" x2="1106" y2="143"/>
  <rect class="f" x="94" y="110" width="182" height="30" rx="4"/>
  <text class="bl" x="185" y="128.5">F0</text>
  <rect class="stall" x="278" y="110" width="67" height="30" rx="4"/>
  <text class="bls" x="311.5" y="128.5">P2P</text>
  <rect class="b" x="347" y="110" width="182" height="30" rx="4"/>
  <text class="bl" x="438" y="128.5">B0</text>
  <rect class="stall" x="531" y="110" width="67" height="30" rx="4"/>
  <text class="bls" x="564.5" y="128.5">P2P</text>
  <rect class="f" x="600" y="110" width="182" height="30" rx="4"/>
  <text class="bl" x="691" y="128.5">F1</text>
  <rect class="stall" x="784" y="110" width="67" height="30" rx="4"/>
  <text class="bls" x="817.5" y="128.5">P2P</text>
  <rect class="b" x="853" y="110" width="182" height="30" rx="4"/>
  <text class="bl" x="944" y="128.5">B1</text>
  <rect class="stall" x="1037" y="110" width="67" height="30" rx="4"/>
  <text class="bls" x="1070.5" y="128.5">P2P</text>
  <line class="rule" x1="94" y1="158" x2="1106" y2="158"/>
  <line class="tick" x1="1106" y1="153" x2="1106" y2="163"/>
  <text class="mk" x="600" y="172">壁钟 = 22.0 t（以 t_f = 4 t 为刻度）</text>
  <rect class="box-cost" x="1120" y="114" width="176" height="52" rx="8"/>
  <text class="txt-cost" x="1131" y="132">P2P 在关键路径上</text>
  <text class="txt-cost" x="1131" y="147">每步多付 t_p2p</text>
  <text class="pt" x="20" y="202">② overlap_p2p_comm：异步 isend/irecv + 延迟 wait</text>
  <text class="ps" x="20" y="219">isend/irecv 只拿 handle，到下一次计算之后才 wait；comm 与 comp 在 GPU 上并行</text>
  <text class="lab" x="84" y="251">comp 流</text>
  <line class="base" x1="94" y1="265" x2="1106" y2="265"/>
  <rect class="f" x="94" y="232" width="182" height="30" rx="4"/>
  <text class="bl" x="185" y="250.5">F0</text>
  <rect class="b" x="278" y="232" width="182" height="30" rx="4"/>
  <text class="bl" x="369" y="250.5">B0</text>
  <rect class="f" x="462" y="232" width="182" height="30" rx="4"/>
  <text class="bl" x="553" y="250.5">F1</text>
  <rect class="b" x="646" y="232" width="182" height="30" rx="4"/>
  <text class="bl" x="737" y="250.5">B1</text>
  <text class="lab" x="84" y="295">comm 流</text>
  <line class="base" x1="94" y1="309" x2="1106" y2="309"/>
  <rect class="comm" x="278" y="276" width="67" height="30" rx="4"/>
  <text class="bls" x="311.5" y="294.5">isend/irecv 激活</text>
  <rect class="comm" x="462" y="276" width="67" height="30" rx="4"/>
  <text class="bls" x="495.5" y="294.5">isend/irecv 梯度</text>
  <rect class="comm" x="646" y="276" width="67" height="30" rx="4"/>
  <text class="bls" x="679.5" y="294.5">isend/irecv 激活</text>
  <rect class="comm" x="830" y="276" width="67" height="30" rx="4"/>
  <text class="bls" x="863.5" y="294.5">isend/irecv 梯度</text>
  <line class="rule" x1="94" y1="324" x2="830" y2="324"/>
  <line class="tick" x1="830" y1="319" x2="830" y2="329"/>
  <text class="mk" x="462" y="338">壁钟 = 16.0 t（以 t_f = 4 t 为刻度）</text>
  <rect class="box-gain" x="1120" y="236" width="176" height="52" rx="8"/>
  <text class="txt-gain" x="1131" y="254">P2P 移出关键路径</text>
  <text class="txt-gain" x="1131" y="269">省 6.0 t（≈27%）</text>
  <line class="cb" x1="94" y1="346" x2="94" y2="356"/>
  <text class="cbt" x="98" y="366">pp_pre_forward</text>
  <text class="cbt" x="98" y="378">wait(上轮预取 recv)</text>
  <line class="cb" x1="278" y1="346" x2="278" y2="356"/>
  <text class="cbt" x="282" y="366">pp_post_forward</text>
  <text class="cbt" x="282" y="378">isend 激活 + irecv 预取</text>
  <line class="cb" x1="462" y1="346" x2="462" y2="356"/>
  <text class="cbt" x="466" y="366">pp_post_backward</text>
  <text class="cbt" x="466" y="378">isend 梯度 + irecv 预取</text>
  <text class="cap" x="20" y="410">壁钟从 22.0 t 降到 16.0 t（省 27%）——省的是<tspan font-weight="700">暴露的通信</tspan>，不是气泡：气泡率仍是 (pp−1)/(m·vp)，与 VPP 相同。</text>
  <text class="cap" x="20" y="426">代价：额外的 fwd/bwd_recv_buffer（首/末 rank 各 N−pp+1 份 chunk 激活，schedules.py:1668）；且必须 batch_p2p_comm = False（schedules.py:1180-1181 断言）。</text>
</svg>
