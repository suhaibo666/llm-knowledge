<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" width="100%" role="img"
 data-contract="steps=2;tf=2;tb=2;tp2p=0.75;sync_span=11;async_compute=8;async_completion=8.75;saved=2.25;hyper_hidden=hidden_size*num_residual_streams;hyper_scope=intermediate_pp_boundary;hyper_recv_gate=physical_pp_rank_gt_0;hyper_send_gate=physical_pp_rank_lt_last;hyper_endpoints=hidden_size;hyper_flexible_vpp=TODO"
 aria-label="两个 VPP steady step 的同步与异步 P2P 时间线，以及 Hyper Connections 在固定 shape 中间流水边界扩展 hidden 维、端点保持 hidden_size 和 flexible VPP TODO。异步只缩短暴露通信，最后请求仍在 8.75t 才完成。">
<style>text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}.card{fill:#fff;stroke:#dfe3e8}.panel{fill:#fafbfc;stroke:#dfe3e8}.title{font-size:19px;font-weight:700;fill:#202630}.sub{font-size:11px;fill:#737b87}.pt{font-size:14px;font-weight:700;fill:#303844}.lane{font-size:11px;fill:#596270;text-anchor:end}.f{fill:#2563eb}.b{fill:#c3651f}.comm{fill:#e9f0fd;stroke:#2563eb;stroke-width:1.4}.stall{fill:url(#hatch);stroke:#c3651f}.bar{font-size:10px;font-weight:700;fill:#fff;text-anchor:middle}.comm+.bar,.stall+.bar{fill:#46505d}.rule{fill:none;stroke:#9ba3ad}.small{font-size:10.5px;fill:#616b78}.call{font-size:10.5px;fill:#173f87}.cost{font-size:10.5px;fill:#8a4a11}.note{fill:#fff;stroke:#b7bec8}.note-t{font-size:11px;fill:#47515e}.shape-box{fill:#fff;stroke:#9ba3ad}.shape-mid{fill:#e9f0fd;stroke:#2563eb;stroke-width:1.4}.shape-title{font-size:11px;font-weight:700;fill:#303844;text-anchor:middle}.shape-value{font-size:11px;fill:#173f87;text-anchor:middle}.shape-gate{font-size:10.5px;fill:#47515e;text-anchor:middle}.arrow{font-size:22px;font-weight:700;fill:#c3651f;text-anchor:middle}.todo{font-size:10.5px;fill:#8a4a11}</style>
<defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fbf0e7"/><rect width="2" height="7" fill="#e7bf9e"/></pattern></defs>
<rect class="card" x=".5" y=".5" width="1439" height="819" rx="14"/>
<text class="title" x="28" y="38">overlap_p2p_comm：post request 之后仍要在数据/存储边界 wait</text>
<text class="sub" x="28" y="60">同一 2 个 steady step；参数 t_f=t_b=2t、t_p2p=0.75t 仅作图，不是实测。蓝/橙为 F/B，浅蓝为 in-flight P2P，斜纹为暴露等待。</text>
<rect class="panel" x="20" y="82" width="1400" height="190" rx="11"/>
<text class="pt" x="40" y="112">① batch_isend_irecv（wait_on_reqs 强制为 true）：compute 与 P2P 串行</text>
<text class="lane" x="146" y="166">compute / wait</text>
<rect class="f" x="160" y="142" width="181" height="34" rx="5"/>
<text class="bar" x="252" y="164">F0</text>
<rect class="stall" x="344" y="142" width="66" height="34" rx="5"/>
<text class="bar" x="378.5" y="164">wait A</text>
<rect class="b" x="413" y="142" width="181" height="34" rx="5"/>
<text class="bar" x="505" y="164">B0</text>
<rect class="stall" x="597" y="142" width="66" height="34" rx="5"/>
<text class="bar" x="631.5" y="164">wait G</text>
<rect class="f" x="666" y="142" width="181" height="34" rx="5"/>
<text class="bar" x="758" y="164">F1</text>
<rect class="stall" x="850" y="142" width="66" height="34" rx="5"/>
<text class="bar" x="884.5" y="164">wait A</text>
<rect class="b" x="919" y="142" width="181" height="34" rx="5"/>
<text class="bar" x="1011" y="164">B1</text>
<rect class="stall" x="1103" y="142" width="66" height="34" rx="5"/>
<text class="bar" x="1137.5" y="164">wait G</text>
<path class="rule" d="M 160 218 H 1172 M 160 213 V 223 M 1172 213 V 223"/>
<text class="small" x="666" y="236" text-anchor="middle">同步完成 = 11.00t</text>
<text class="cost" x="1210" y="166">4 次 × 0.75t 暴露</text>
<rect class="panel" x="20" y="290" width="1400" height="250" rx="11"/>
<text class="pt" x="40" y="320">② independent isend/irecv（wait_on_reqs=false）：请求与下一个可独立 chunk 计算重叠</text>
<text class="lane" x="146" y="376">compute</text>
<rect class="f" x="160" y="352" width="181" height="34" rx="5"/>
<text class="bar" x="252" y="374">F0</text>
<rect class="b" x="344" y="352" width="181" height="34" rx="5"/>
<text class="bar" x="436" y="374">B0</text>
<rect class="f" x="528" y="352" width="181" height="34" rx="5"/>
<text class="bar" x="620" y="374">F1</text>
<rect class="b" x="712" y="352" width="181" height="34" rx="5"/>
<text class="bar" x="804" y="374">B1</text>
<text class="lane" x="146" y="428">comm</text>
<rect class="comm" x="344" y="404" width="66" height="34" rx="5"/>
<text class="bar" x="378.5" y="426">A req</text>
<rect class="comm" x="528" y="404" width="66" height="34" rx="5"/>
<text class="bar" x="562.5" y="426">G req</text>
<rect class="comm" x="712" y="404" width="66" height="34" rx="5"/>
<text class="bar" x="746.5" y="426">A req</text>
<rect class="comm" x="896" y="404" width="66" height="34" rx="5"/>
<text class="bar" x="930.5" y="426">G req</text>
<path class="rule" d="M 344 393 V 447 M 528 393 V 447"/>
<text class="call" x="349" y="460">post F：isend activation / prefetch recv</text>
<text class="call" x="533" y="480">post B：isend gradient / prefetch recv</text>
<path class="rule" d="M 160 506 H 965 M 160 501 V 511 M 965 501 V 511"/>
<text class="small" x="562.5" y="524" text-anchor="middle">compute 区间 = 8.00t；最后 drain 后完成 = 8.75t</text>
<text class="call" x="1010" y="376">recv：pre-forward / pre-backward 消费前 wait</text>
<text class="call" x="1010" y="398">send：源 storage 复用/伪释放前 wait</text>
<text class="cost" x="1010" y="420">cleanup：handle 队列必须为空</text>
<rect class="note" x="20" y="560" width="1400" height="62" rx="10"/>
<text class="note-t" x="40" y="585">本示例省 2.25t（20.5%），不是从 11t 直接到 8t：最后一个 0.75t request 仍要完成。没有独立 chunk、链路争用或 recv 提前被消费时，wait 会重新暴露。</text>
<text class="note-t" x="40" y="606">overlap_p2p_comm_warmup_flush 只把同一生命周期延伸到 warmup/flush；要求 overlap_p2p_comm=true 且 batch_p2p_comm=false。</text>
<rect class="panel" x="20" y="640" width="1400" height="158" rx="11"/>
<text class="pt" x="40" y="669">③ get_tensor_shapes：Hyper Connections 的 fixed-shape PP boundary replay</text>
<rect class="shape-box" x="45" y="686" width="270" height="62" rx="8"/>
<text class="shape-title" x="180" y="708">first-stage input</text>
<text class="shape-value" x="180" y="731">[S, B, hidden_size]</text>
<text class="arrow" x="340" y="726">→</text>
<rect class="shape-mid" x="365" y="686" width="710" height="62" rx="8"/>
<text class="shape-title" x="720" y="705">intermediate PP send / recv</text>
<text class="shape-value" x="720" y="725">[S, B, hidden_size * num_residual_streams]</text>
<text class="shape-gate" x="720" y="743">recv：physical PP rank &gt; 0 · send：physical PP rank &lt; PP last</text>
<text class="arrow" x="1100" y="726">→</text>
<rect class="shape-box" x="1125" y="686" width="270" height="62" rx="8"/>
<text class="shape-title" x="1260" y="708">last-stage output</text>
<text class="shape-value" x="1260" y="731">[S, B, hidden_size]</text>
<text class="todo" x="45" y="779">flexible VPP TODO：两类现有 layout 有 send/recv 一致性测试；helper 尚未承诺任意 flexible-VPP 排布。</text>
</svg>
