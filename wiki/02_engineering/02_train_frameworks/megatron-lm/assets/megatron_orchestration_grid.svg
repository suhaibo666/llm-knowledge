<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="736" viewBox="0 0 1180 736"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#263445;font-size:16px}.title{font-size:23px;font-weight:700}.dim{font-size:14px;fill:#526174}.cap{font-size:16px}.mono{font-family:Consolas,monospace;font-size:16px}.neutral{fill:#fff;stroke:#aeb9c6}.ghost{fill:#f5f7fa;stroke:#dae0e7}.acc1{fill:#e8f1fb;stroke:#2f6fba;stroke-width:2}.acc2{fill:#fff1e5;stroke:#c77b31;stroke-width:2}.main{stroke:#2f6fba;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.aux{stroke:#9aa8b7;stroke-width:1.4;fill:none}.boundary{stroke:#9aa8b7;stroke-width:1.4;stroke-dasharray:6 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f6fba"/></marker></defs><rect width="1180" height="736" fill="white"/><text x="25" y="36" class="title">HyperCommGrid：反序数组 + moveaxis，把所选轴变成一行</text><text x="25" y="68" class="dim">同一 R0…R15 / R5；沿用 default 布局；蓝色行是本 rank 接收的组</text><rect x="18" y="92" width="1143" height="211" rx="7" class="ghost"/><text x="31" y="120" class="">base view：请求 cp + dp</text><text x="31" y="150" class="mono">shape [2,2,2,2]</text><text x="31" y="179" class="mono">pp · dp · cp · tp</text><text x="31" y="203" class="dim">arange → reshape，左轴慢 / 右轴快</text><text x="31" y="238" class="mono">source [1,2] → target [2,3]</text><text x="31" y="267" class="mono">moveaxis → pp · tp · dp · cp</text><path d="M499,192 L539,192" class="main"/><rect x="555" y="135" width="245" height="30" rx="7" class="ghost"/><text x="567" y="156" class="mono">[0,2,4,6]</text><rect x="555" y="170" width="245" height="30" rx="7" class="acc1"/><text x="567" y="191" class="mono">[1,3,5,7]</text><rect x="555" y="205" width="245" height="30" rx="7" class="ghost"/><text x="567" y="226" class="mono">[8,10,12,14]</text><rect x="555" y="240" width="245" height="30" rx="7" class="ghost"/><text x="567" y="261" class="mono">[9,11,13,15]</text><text x="555" y="120" class="dim">reshape → 每行一个组</text><path d="M813,192 L843,192" class="main"/><rect x="858" y="152" width="285" height="95" rx="7" class="acc1"/><text x="873" y="179" class="mono">key = dp-cp</text><text x="873" y="209" class="mono">PGC.dp_cp</text><text x="873" y="234" class="mono">R5 ← [1,3,5,7]</text><rect x="18" y="317" width="1143" height="211" rx="7" class="ghost"/><text x="31" y="345" class="">expert view：请求 ep</text><text x="31" y="375" class="mono">shape [1,4,2,2]</text><text x="31" y="404" class="mono">pp · expt_dp · ep · expt_tp</text><text x="31" y="428" class="dim">arange → reshape，左轴慢 / 右轴快</text><text x="31" y="463" class="mono">source [2] → target [3]</text><text x="31" y="492" class="mono">moveaxis → pp · expt_dp · expt_tp · ep</text><path d="M499,417 L539,417" class="main"/><rect x="555" y="360" width="245" height="30" rx="7" class="ghost"/><text x="567" y="381" class="mono">[0,1,2,3]</text><rect x="555" y="395" width="245" height="30" rx="7" class="acc1"/><text x="567" y="416" class="mono">[4,5,6,7]</text><rect x="555" y="430" width="245" height="30" rx="7" class="ghost"/><text x="567" y="451" class="mono">[8,9,10,11]</text><rect x="555" y="465" width="245" height="30" rx="7" class="ghost"/><text x="567" y="486" class="mono">[12,13,14,15]</text><text x="555" y="345" class="dim">reshape → 每行一个组</text><path d="M813,417 L843,417" class="main"/><rect x="858" y="377" width="285" height="95" rx="7" class="acc1"/><text x="873" y="404" class="mono">key = (expert, ep)</text><text x="873" y="434" class="mono">PGC.ep</text><text x="873" y="459" class="mono">R5 ← [4,5,6,7]</text><text x="28" y="564" class="mono">shared_dims = pp</text><path d="M251,557 L282,557" class="main"/><text x="301" y="564" class="mono">两套枚举均为 R5 → [5,13]</text><path d="M770,557 L805,557" class="main"/><text x="825" y="564" class="mono">一个 _pgs[pp] handle</text><rect x="22" y="589" width="1136" height="48" rx="7" class="acc2"/><text x="38" y="618" class="cap">先 create_pg；get_pg 只取句柄。再建同键 → KeyError；destroy 按对象身份去重。</text><text x="28" y="676" class="mono">rank_enum</text><path d="M142,670 L200,670" class="main"/><text x="218" y="676" class="mono">PyTorch new_subgroups_by_enumeration</text><line x1="194" y1="650" x2="194" y2="718" class="boundary"/><line x1="654" y1="650" x2="654" y2="718" class="boundary"/><path d="M667,670 L723,670" class="main"/><text x="742" y="676" class="mono">handle → _pgs[key] → PGC</text><text x="219" y="710" class="dim">依赖边界：NCCL内部启动不在本图证据内</text></svg>