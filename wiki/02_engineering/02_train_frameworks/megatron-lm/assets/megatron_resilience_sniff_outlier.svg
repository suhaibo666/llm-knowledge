<text class="ti" x="28" y="32" text-anchor="start">图 3　凭什么说这张卡有问题：中位数 + MAD + 下界，而不是均值 ± σ</text>
<text class="su" x="28" y="52" text-anchor="start">同一组 AllReduce 带宽读数（GB/s，8 个 rank 跑同一个合成负载，差异只可能来自硬件或链路）</text>
<text class="tx" x="28" y="72" text-anchor="start">故障集群：两张卡明显偏低</text>
<rect class="band2" x="103.15063580902098" y="118" width="440.84936419097903" height="222"/>
<text class="sm" x="323.5753179045105" y="94" text-anchor="middle">均值 ± 2σ = 136.4 ± 49.1：带太宽，一根都没判出</text>
<rect class="band" x="406.0613273592832" y="122" width="137.9386726407168" height="214"/>
<path class="medline" d="M 501.93223186782416 122 L 501.93223186782416 336"/>
