<rect class="acc2" x="86" y="286" width="47.19798375805095" height="18" rx="4"/>
<text class="costtx" x="554" y="299" text-anchor="start">92</text>
<text class="sm" x="28" y="325" text-anchor="start">rank 7</text>
<rect class="acc2" x="86" y="312" width="72.8490618874265" height="18" rx="4"/>
<text class="costtx" x="554" y="325" text-anchor="start">96</text>
<text class="cap" x="86" y="352" text-anchor="start">横轴自 84.6 起，不是 0 —— 本图比较的是与中位数的偏离</text>
<text class="tx" x="660" y="72" text-anchor="start">健康集群：全部在噪声范围内</text>
<rect class="band" x="718" y="122" width="298" height="214"/>
<path class="medline" d="M 936.449152542373 122 L 936.449152542373 336"/>
<text class="dim" x="936.449152542373" y="114" text-anchor="middle">median 150 ± threshold 15</text>
<text class="sm" x="660" y="143" text-anchor="start">rank 0</text>
<rect class="neutral" x="718" y="130" width="234.23305084745766" height="18" rx="4"/>
