<rect class="neutral" x="718" y="286" width="234.23305084745766" height="18" rx="4"/>
<text class="sm" x="1026" y="299" text-anchor="start">151</text>
<text class="sm" x="660" y="325" text-anchor="start">rank 7</text>
<rect class="neutral" x="718" y="312" width="202.6652542372882" height="18" rx="4"/>
<text class="sm" x="1026" y="325" text-anchor="start">149</text>
<text class="cap" x="718" y="352" text-anchor="start">横轴自 136.2 起，不是 0 —— 本图比较的是与中位数的偏离</text>
<rect class="acc2" x="28" y="380" width="608" height="120" rx="8"/>
<text class="tx" x="40" y="401" text-anchor="start">MAD 判据抓到 2 张卡，均值 ± 2σ 抓到 0 张</text>
<path class="edge" d="M 40 409 L 624 409"/>
<text class="sm" x="40" y="427" text-anchor="start">median = 149.5，MAD = 2，下界 = median × 0.1 = 14.95</text>
<text class="sm" x="40" y="443" text-anchor="start">threshold = max(MAD, 下界) = 14.95 → 命中 rank 6, 7</text>
<text class="sm" x="40" y="459" text-anchor="start">对照：mean = 136.38（被两张坏卡拉低），σ = 24.53（被它们拉大）</text>
<text class="sm" x="40" y="475" text-anchor="start">2σ = 49.06 反而比两张坏卡的偏离还大 —— 离群点把判据自己撑开了</text>
<rect class="neutral" x="656" y="380" width="588" height="120" rx="8"/>
<text class="tx" x="668" y="401" text-anchor="start">下界挡住的是反方向的错误：健康集群上的误报</text>
<path class="edge" d="M 668 409 L 1232 409"/>
<text class="sm" x="668" y="427" text-anchor="start">median = 150，MAD = 1 —— 集群健康时 MAD 会非常小。</text>
<text class="sm" x="668" y="443" text-anchor="start">纯按 MAD 判（阈值 1）会把 2 根正常测量噪声报成离群；</text>
<text class="sm" x="668" y="459" text-anchor="start">加上下界后 threshold = 15，命中 0 根。</text>
<text class="sm" x="668" y="475" text-anchor="start">注：源码常量注释写的是「10% of mean」，实现取的是 median × 0.10，两者不一致。</text>
</svg>