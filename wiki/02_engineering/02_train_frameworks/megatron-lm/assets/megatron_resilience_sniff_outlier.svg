<text class="costtx" x="1066" y="221" text-anchor="start">去掉下界会误报这根</text>
<text class="sm" x="660" y="247" text-anchor="start">rank 4</text>
<rect class="ghost" x="718" y="234" width="186.88135593220352" height="18" rx="4"/>
<text class="sm" x="1026" y="247" text-anchor="start">148</text>
