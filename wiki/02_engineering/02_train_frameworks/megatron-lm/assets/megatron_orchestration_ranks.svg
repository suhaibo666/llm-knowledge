="502" width="286" height="30" rx="7" class="ghost"/><text x="488" y="523" class="mono">[1,3,9,11]</text><rect x="476" y="537" width="286" height="30" rx="7" class="ghost"/><text x="488" y="558" class="mono">[4,6,12,14]</text><rect x="476" y="572" width="286" height="30" rx="7" class="acc1"/><text x="488" y="593" class="mono">[5,7,13,15]</text><text x="852" y="485" class="dim">另求 mask=00010</text><rect x="836" y="499" width="297" height="67" rx="7" class="acc1"/><text x="856" y="526" class="mono">[1,5]</text><text x="856" y="551" class="dim">dense / expert 完全相等</text><rect x="18" y="631" width="1143" height="164" rx="7" class="ghost"/><text x="32" y="656" class="">alternative · expert</text><text x="32" y="683" class="mono">tp-cp-ep-pp-dp</text><text x="32" y="712" class="mono">sizes [1,1,4,2,2]   mask 00100</text><text x="32" y="741" class="mono">stride [1,1,1,4,8]</text><text x="32" y="771" class="dim">ep：组内变这些轴，其余轴固定</text><path d="M427,705 L462,705" class="main"/><rect x="476" y="641" width="286" height="30" rx="7" class="ghost"/><text x="488" y="662" class="mono">[0,1,2,3]</text><rect x="476" y="676" width="286" height="30" rx="7" class="acc1"/><text x="488" y="697" class="mono">[4,5,6,7]</text><rect x="476" y="711" width="286" height="30" rx="7" class="ghost"/><text x="488" y="732" class="mono">[8,9,10,11]</text><rect x="476" y="746" width="286" height="30" rx="7" class="ghost"/><text x="488" y="767" class="mono">[12,13,14,15]</text><text x="852" y="659" class="dim">另求 mask=00010</text><rect x="836" y="673" width="297" height="67" rx="7" class="acc1"/><text x="856" y="700" class="mono">[1,5]</text><text x="856" y="725" class="dim">dense / expert 完全相等</text><text x="28" y="837" class="mono">default dense：固定 tp=1 ep=0 pp=0；组内 cp=0 dp=1</text><text x="28" y="866" class="mono">decompose → r = 1×1 + 0×2 + 0×4 + 1×4 + 0×8 = 5；mask只让组内坐标变化</text><text x="28" y="914" class="cap">每个 rank 按相同顺序遍历名单</text><path d="M298,908 L346,908" class="main"/><text x="360" y="914" class="mono">create_group → new_group</text><line x1="704" y1="891" x2="704" y2="971" class="boundary"/><path d="M656,908 L733,908" class="main"/><text x="750" y="914" class="cap">PyTorch：返回当前 rank 的 handle</text><text x="29" y="957" class="cap">不变量：每族名单覆盖全部 rank 一次；名单相等不保证不同建组调用的 handle 相同。</text></svg>