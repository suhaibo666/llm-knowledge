<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="984" viewBox="0 0 1180 984"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#263445;font-size:16px}.title{font-size:23px;font-weight:700}.dim{font-size:14px;fill:#526174}.cap{font-size:16px}.mono{font-family:Consolas,monospace;font-size:16px}.neutral{fill:#fff;stroke:#aeb9c6}.ghost{fill:#f5f7fa;stroke:#dae0e7}.acc1{fill:#e8f1fb;stroke:#2f6fba;stroke-width:2}.acc2{fill:#fff1e5;stroke:#c77b31;stroke-width:2}.main{stroke:#2f6fba;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.aux{stroke:#9aa8b7;stroke-width:1.4;fill:none}.boundary{stroke:#9aa8b7;stroke-width:1.4;stroke-dasharray:6 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f6fba"/></marker></defs><rect width="1180" height="984" fill="white"/><text x="25" y="36" class="title">同一 R5：两种 order × dense / expert 分解</text><text x="25" y="65" class="dim">输入 R0…R15；TP=2 CP=2 PP=2；ETP=1 EP=4；offset=0</text><text x="25" y="97" class="">order → sizes / mask / stride</text><text x="474" y="97" class="">枚举全部成员名单</text><text x="852" y="97" class="">R5 的 PP 组</text><rect x="18" y="109" width="1143" height="164" rx="7" class="ghost"/><text x="32" y="134" class="">default · dense</text><text x="32" y="161" class="mono">tp-cp-ep-dp-pp</text><text x="32" y="190" class="mono">sizes [2,2,1,2,2]   mask 01010</text><text x="32" y="219" class="mono">stride [1,2,4,4,8]</text><text x="32" y="249" class="dim">dp-cp：组内变这些轴，其余轴固定</text><path d="M427,183 L462,183" class="main"/><rect x="476" y="119" width="286" height="30" rx="7" class="ghost"/><text x="488" y="140" class="mono">[0,2,4,6]</text><rect x="476" y="154" width="286" height="30" rx="7" class="acc1"/><text x="488" y="175" class="mono">[1,3,5,7]</text><rect x="476" y="189" width="286" height="30" rx="7" class="ghost"/><text x="488" y="210" class="mono">[8,10,12,14]</text><rect x="4