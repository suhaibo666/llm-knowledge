<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1077" role="img" aria-label="selective / normal：回放区域内的计算与通信一起重做"><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#1f2937;font-size:16px}
.title{font-size:23px;font-weight:650}.subtitle{fill:#64748b;font-size:15px}
.cap{fill:#64748b;font-size:14px}.rowname{font-weight:650;font-size:16px}
.neutral{fill:#fff;stroke:#cbd5e1}.ghost{fill:#f8fafc;stroke:#e2e8f0}
.acc1{fill:#eff6ff;stroke:#2563eb}.acc2{fill:#fff7ed;stroke:#d97706}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#a)}
.aux{stroke:#94a3b8;stroke-width:1.2}.box{rx:7;stroke-width:1.2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><rect width="1240" height="1077" fill="#fff"/><text class="title" x="24" y="34">selective / normal：回放区域内的计算与通信一起重做</text><text class="subtitle" x="24" y="61">microbatch A · X0[4,1,4] · t0…t3 · BF16 · TP=2 · SP off · L0 内替换对应子模块</text><text class="rowname" x="198" y="99">保存输入 → 原前向区域</text><text class="rowname" x="455" y="99">输出 / 跨间隔状态</text><text class="rowname" x="712" y="99">上游梯度到达后的 replay</text><text class="rowname" x="969" y="99">恢复后 backward / 新增成本</text><g data-plane="core_attn"><rect class="ghost box" x="24" y="122" width="1192" height="158"/><text class="rowname" x="36" y="150">core_attn</text><g data-cell="core_attn-0"><rect class="neutral box" x="186" y="134" width="247" height="134"/><text class="" x="198" y="160">Q,K,V + mask + enum</text><text class="" x="198" y="183">QKᵀ→softmax/dropout→PV</text><text class="" x="198" y="206">DSA tensor kwargs 位置传递</text></g><path class="arrow" d="M 433 201 h 8"/><g data-cell="core_attn-1"><rect class="neutral box" x="443" y="134" width="247" height="134"/><text class="" x="455" y="160">输出 O → output projection</text><text class="" x="455" y="183">保留 Q/K/V；内部图不保留</text><text class="" x="455" y="206">QKV 投影在 checkpoint 外</text></g><path class="arrow" d="M 690 201 h 8"/><g data-cell="core_attn-2"><rect class="acc1 box" x="700" y="134" width="247" height="134"/><text class="" x="712" y="160">dO → 重跑 core attention</text><text class="" x="712" y="183">同 RNG / mask / extra</text><text class="" x="712" y="206">tensors</text><text class="" x="712" y="229">backend CP 通信若在内也重跑</text></g><path class="arrow" d="M 947 201 h 8"/><g data-cell="core_attn-3"><rect class="acc2 box" x="957" y="134" width="247" height="134"/><text class="" x="969" y="160">B(attention) → dQ,dK,dV</text><text class="" x="969" y="183">再由投影 B 得 dX0,dW</text><text class="" x="969" y="206">fused attention 可能无大收</text><text class="" x="969" y="229">益</text></g></g><g data-plane="mlp"><rect class="ghost box" x="24" y="292" width="1192" height="158"/><text class="rowname" x="36" y="320">mlp</text><text class="rowname" x="36" y="343">dense only</text><g data-cell="mlp-0"><rect class="neutral box" x="186" y="304" width="247" height="134"/><text class="" x="198" y="330">U = pre-MLP norm(X)</text><text class="" x="198" y="353">FC1 → activation → FC2</text><text class="" x="198" y="376">区域内 TP collective</text></g><path class="arrow" d="M 433 371 h 8"/><g data-cell="mlp-1"><rect class="neutral box" x="443" y="304" width="247" height="134"/><text class="" x="455" y="330">M → residual / 后层</text><text class="" x="455" y="353">保存 U + RNG</text><text class="" x="455" y="376">FC1/act 内部图释放</text></g><path class="arrow" d="M 690 371 h 8"/><g data-cell="mlp-2"><rect class="acc1 box" x="700" y="304" width="247" height="134"/><text class="" x="712" y="330">dM → replay 整 dense MLP</text><text class="" x="712" y="353">重做两组 GEMM 与通信</text><text class="" x="712" y="376">MLP 输出图重建</text></g><path class="arrow" d="M 947 371 h 8"/><g data-cell="mlp-3"><rect class="acc2 box" x="957" y="304" width="247" height="134"/><text class="" x="969" y="330">B(FC2),B(act),B(FC1)</text><text class="" x="969" y="353">得到 dU,dW1,dW2</text><text class="" x="969" y="376">MoE layer 不由 mlp 值启用</text></g></g><g data-plane="moe"><rect class="ghost box" x="24" y="462" width="1192" height="158"/><text class="rowname" x="36" y="490">moe</text><text class="rowname" x="36" y="513">full MoE region</text><g data-cell="moe-0"><rect class="neutral box" x="186" y="474" width="247" height="134"/><text class="" x="198" y="500">U: t0,t1,t2,t3</text><text class="" x="198" y="523">route / permutation /</text><text class="" x="198" y="546">dispatch</text><text class="" x="198" y="569">t0,t2→E0; t1,t3→E1</text></g><path class="arrow" d="M 433 541 h 8"/><g data-cell="moe-1"><rect class="neutral box" x="443" y="474" width="247" height="134"/><text class="" x="455" y="500">expert→combine→token</text><text class="" x="455" y="523">order</text><text class="" x="455" y="546">M + shared output</text><text class="" x="455" y="569">保留 U 与路由输入元数据</text></g><path class="arrow" d="M 690 541 h 8"/><g data-cell="moe-2"><rect class="acc1 box" x="700" y="474" width="247" height="134"/><text class="" x="712" y="500">dM → replay route/dispatch</text><text class="" x="712" y="523">重建 expert 顺序与概率</text><text class="" x="712" y="546">expert→combine 恢复 token</text></g><path class="arrow" d="M 947 541 h 8"/><g data-cell="moe-3"><rect class="acc2 box" x="957" y="474" width="247" height="134"/><text class="" x="969" y="500">B(combine)→B(expert)</text><text class="" x="969" y="523">→B(dispatch/router)→dU,dW</text><text class="" x="969" y="546">+EP A2A；overlap 入口禁 moe</text></g></g><g data-plane="shared_experts"><rect class="ghost box" x="24" y="632" width="1192" height="158"/><text class="rowname" x="36" y="660">shared_experts</text><g data-cell="shared_experts-0"><rect class="neutral box" x="186" y="644" width="247" height="134"/><text class="" x="198" y="670">同 U → shared MLP</text><text class="" x="198" y="693">FC1→activation→FC2</text><text class="" x="198" y="716">routed branch 在区域外</text></g><path class="arrow" d="M 433 711 h 8"/><g data-cell="shared_experts-1"><rect class="neutral box" x="443" y="644" width="247" height="134"/><text class="" x="455" y="670">S 与 routed output 汇合</text><text class="" x="455" y="693">保存 U + RNG</text><text class="" x="455" y="716">共享支路内部图释放</text></g><path class="arrow" d="M 690 711 h 8"/><g data-cell="shared_experts-2"><rect class="acc1 box" x="700" y="644" width="247" height="134"/><text class="" x="712" y="670">dS → replay shared MLP</text><text class="" x="712" y="693">不重发 routed tokens</text><text class="" x="712" y="716">恢复共享分支图</text></g><path class="arrow" d="M 947 711 h 8"/><g data-cell="shared_experts-3"><rect class="acc2 box" x="957" y="644" width="247" height="134"/><text class="" x="969" y="670">B(shared) → dU,dWshared</text><text class="" x="969" y="693">+本支路 GEMM/TP 通信</text><text class="" x="969" y="716">不能 shared-expert-overlap</text></g></g><g data-plane="gdn"><rect class="ghost box" x="24" y="802" width="1192" height="205"/><text class="rowname" x="36" y="830">gdn</text><text class="rowname" x="36" y="853">GDN / KDA</text><g data-cell="gdn-0"><rect class="neutral box" x="186" y="814" width="247" height="181"/><text class="" x="198" y="840">X0 按 CP token 分片</text><text class="" x="198" y="863">in-proj → CP→HP A2A</text><text class="" x="198" y="886">所有 token / 半数 heads</text><text class="" x="198" y="909">conv → delta rule</text></g><path class="arrow" d="M 433 904.5 h 8"/><g data-cell="gdn-1"><rect class="neutral box" x="443" y="814" width="247" height="181"/><text class="" x="455" y="840">norm → HP→CP A2A</text><text class="" x="455" y="863">out-proj → O</text><text class="" x="455" y="886">rank0 t0,t3 / rank1 t1,t2</text><text class="" x="455" y="909">保存 X0，内部图释放</text></g><path class="arrow" d="M 690 904.5 h 8"/><g data-cell="gdn-2"><rect class="acc1 box" x="700" y="814" width="247" height="181"/><text class="" x="712" y="840">dO → replay 完整区域</text><text class="" x="712" y="863">两向 A2A + conv + delta</text><text class="" x="712" y="886">+norm + out-proj</text><text class="" x="712" y="909">chunkwise kernel: 外部边界</text></g><path class="arrow" d="M 947 904.5 h 8"/><g data-cell="gdn-3"><rect class="acc2 box" x="957" y="814" width="247" height="181"/><text class="" x="969" y="840">B(out-proj)→CP→HP</text><text class="" x="969" y="863">B(norm/delta/conv)</text><text class="" x="969" y="886">HP→CP→B(in-proj)</text><text class="" x="969" y="909">dX0,dW；两向 replay 通信</text></g></g><text class="cap" x="24" y="1036">GDN/KDA headwise 例：CP rank0=t0,t3；rank1=t1,t2。HP 后每 rank 拥有 t0…t3 的半数 heads。</text><text class="cap" x="24" y="1059">kernel 内部归依赖合约；此图只证明本仓包装、布局和调用顺序，非 kernel 内实现测量。</text></svg>
