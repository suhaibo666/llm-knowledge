<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1078" role="img" aria-label="同一四层，分组策略与模型入口共同决定 replay"><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#1f2937;font-size:16px}
.title{font-size:23px;font-weight:650}.subtitle{fill:#64748b;font-size:15px}
.cap{fill:#64748b;font-size:14px}.rowname{font-weight:650;font-size:16px}
.neutral{fill:#fff;stroke:#cbd5e1}.ghost{fill:#f8fafc;stroke:#e2e8f0}
.acc1{fill:#eff6ff;stroke:#2563eb}.acc2{fill:#fff7ed;stroke:#d97706}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#a)}
.aux{stroke:#94a3b8;stroke-width:1.2}.box{rx:7;stroke-width:1.2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><rect width="1240" height="1078" fill="#fff"/><text class="title" x="24" y="34">同一四层，分组策略与模型入口共同决定 replay</text><text class="subtitle" x="24" y="61">microbatch A · X0[4,1,4] · t0…t3 · BF16 · TP=2 · SP off</text><text class="rowname" x="198" y="99">原前向选择 / 区域</text><text class="rowname" x="455" y="99">保留边界</text><text class="rowname" x="712" y="99">反向重建顺序</text><text class="rowname" x="969" y="99">结果与限制</text><g data-plane="uniform"><rect class="ghost box" x="24" y="122" width="1192" height="158"/><text class="rowname" x="36" y="150">full / uniform</text><text class="rowname" x="36" y="173">n=2</text><g data-cell="uniform-0"><rect class="neutral box" x="186" y="134" width="247" height="134"/><text class="" x="198" y="160">checkpoint L0→L1</text><text class="" x="198" y="183">checkpoint L2→L3</text><text class="" x="198" y="206">每块 no-grad 原前向</text></g><path class="arrow" d="M 433 201 h 8"/><g data-cell="uniform-1"><rect class="neutral box" x="443" y="134" width="247" height="134"/><text class="" x="455" y="160">保留 X0 + RNG</text><text class="" x="455" y="183">保留 X2 + RNG</text><text class="" x="455" y="206">2 个区域</text></g><path class="arrow" d="M 690 201 h 8"/><g data-cell="uniform-2"><rect class="acc1 box" x="700" y="134" width="247" height="134"/><text class="" x="712" y="160">replay L2→L3 → B</text><text class="" x="712" y="183">replay L0→L1 → B</text><text class="" x="712" y="206">4 次层前向回放</text></g><path class="arrow" d="M 947 201 h 8"/><g data-cell="uniform-3"><rect class="acc2 box" x="957" y="134" width="247" height="134"/><text class="" x="969" y="160">少保留 chunk 边界</text><text class="" x="969" y="183">chunk 越大，重建图越大</text><text class="" x="969" y="206">仅 chunk 尾可取中间特征</text></g></g><g data-plane="block"><rect class="ghost box" x="24" y="292" width="1192" height="158"/><text class="rowname" x="36" y="320">full / block</text><text class="rowname" x="36" y="343">n=2</text><g data-cell="block-0"><rect class="neutral box" x="186" y="304" width="247" height="134"/><text class="" x="198" y="330">checkpoint L0</text><text class="" x="198" y="353">checkpoint L1</text><text class="" x="198" y="376">L2→L3 正常保存内部图</text></g><path class="arrow" d="M 433 371 h 8"/><g data-cell="block-1"><rect class="neutral box" x="443" y="304" width="247" height="134"/><text class="" x="455" y="330">保留 X0,X1 + RNG</text><text class="" x="455" y="353">尾部 L2,L3 内部图保留</text><text class="" x="455" y="376">2 个区域</text></g><path class="arrow" d="M 690 371 h 8"/><g data-cell="block-2"><rect class="acc1 box" x="700" y="304" width="247" height="134"/><text class="" x="712" y="330">正常 B(L3),B(L2)</text><text class="" x="712" y="353">replay L1→B，再 L0→B</text><text class="" x="712" y="376">2 次层前向回放</text></g><path class="arrow" d="M 947 371 h 8"/><g data-cell="block-3"><rect class="acc2 box" x="957" y="304" width="247" height="134"/><text class="" x="969" y="330">只支付选中层 replay</text><text class="" x="969" y="353">量化输入无 grad：窗口后移</text><text class="" x="969" y="376">不能承诺永远物理前 N 层</text></g></g><g data-plane="hybrid"><rect class="ghost box" x="24" y="462" width="1192" height="158"/><text class="rowname" x="36" y="490">GPT / Hybrid</text><text class="rowname" x="36" y="513">sibling entry</text><g data-cell="hybrid-0"><rect class="neutral box" x="186" y="474" width="247" height="134"/><text class="" x="198" y="500">GPT: 自有 checkpointed</text><text class="" x="198" y="523">Hybrid: 共享 recompute.py</text><text class="" x="198" y="546">同一 L0…L3 分组规则</text></g><path class="arrow" d="M 433 541 h 8"/><g data-cell="hybrid-1"><rect class="neutral box" x="443" y="474" width="247" height="134"/><text class="" x="455" y="500">TransformerLayer: 全 kwargs</text><text class="" x="455" y="523">能力位包装: 保留路由输入</text><text class="" x="455" y="546">裸 Mamba: 窄 kwargs</text></g><path class="arrow" d="M 690 541 h 8"/><g data-cell="hybrid-2"><rect class="acc1 box" x="700" y="474" width="247" height="134"/><text class="" x="712" y="500">重建同类型层与原输出</text><text class="" x="712" y="523">包装返回 hidden,context</text><text class="" x="712" y="546">裸层返回 hidden</text></g><path class="arrow" d="M 947 541 h 8"/><g data-cell="hybrid-3"><rect class="acc2 box" x="957" y="474" width="247" height="134"/><text class="" x="969" y="500">能力位避免循环 import</text><text class="" x="969" y="523">GPT block eager 漏 padding</text><text class="" x="969" y="546">共享 Hybrid 分支已保留</text></g></g><g data-plane="mtp"><rect class="ghost box" x="24" y="632" width="1192" height="158"/><text class="rowname" x="36" y="660">ordinary MTP</text><text class="rowname" x="36" y="683">Hybrid MTP</text><g data-cell="mtp-0"><rect class="neutral box" x="186" y="644" width="247" height="134"/><text class="" x="198" y="670">X4 + decoder_input</text><text class="" x="198" y="693">普通: proj + MTP layer</text><text class="" x="198" y="716">Hybrid: 内部 HybridStack</text></g><path class="arrow" d="M 433 711 h 8"/><g data-cell="mtp-1"><rect class="neutral box" x="443" y="644" width="247" height="134"/><text class="" x="455" y="670">普通 uniform 要 n=1</text><text class="" x="455" y="693">普通 block 留原图</text><text class="" x="455" y="716">Hybrid 委托内部 full</text></g><path class="arrow" d="M 690 711 h 8"/><g data-cell="mtp-2"><rect class="acc1 box" x="700" y="644" width="247" height="134"/><text class="" x="712" y="670">ordinary uniform replay</text><text class="" x="712" y="693">ordinary block: warn/skip</text><text class="" x="712" y="716">Hybrid: 内部 stack replay</text></g><path class="arrow" d="M 947 711 h 8"/><g data-cell="mtp-3"><rect class="acc2 box" x="957" y="644" width="247" height="134"/><text class="" x="969" y="670">dX4 必须返回 decoder</text><text class="" x="969" y="693">不是所有 MTP 都 skip block</text><text class="" x="969" y="716">MTP loss 缩放仍由训练层管</text></g></g><g data-plane="ep-overlap-full"><rect class="ghost box" x="24" y="802" width="1192" height="206"/><text class="rowname" x="36" y="830">EP overlap full</text><text class="rowname" x="36" y="853">Recompute</text><text class="rowname" x="36" y="876">Segment</text><g data-cell="ep-overlap-full-0"><rect class="neutral box" x="186" y="814" width="247" height="182"/><text class="" x="198" y="840">含 MTP=1，公共配置要求：</text><text class="" x="198" y="863">uniform n=1: L0|L1|L2|L3</text><text class="" x="198" y="886">+MTP = 5 段</text><text class="" x="198" y="909">block n=2: L0|L1</text><text class="" x="198" y="932">+MTP = 3 段；L2,L3 正常图</text></g><path class="arrow" d="M 433 905 h 8"/><g data-cell="ep-overlap-full-1"><rect class="neutral box" x="443" y="814" width="247" height="182"/><text class="" x="455" y="840">每段 capture</text><text class="" x="455" y="863">input/state/RNG</text><text class="" x="455" y="886">no-grad 节点后清 transient</text><text class="" x="455" y="909">不走 checkpoint / 不分存</text><text class="" x="455" y="932">MTP bridge old grad carrier</text><text class="" x="455" y="955">无量化 block 窗口后移</text></g><path class="arrow" d="M 690 905 h 8"/><g data-cell="ep-overlap-full-2"><rect class="acc1 box" x="700" y="814" width="247" height="182"/><text class="" x="712" y="840">段尾 backward 前 replay</text><text class="" x="712" y="863">attn→dispatch→MLP→</text><text class="" x="712" y="886">combine</text><text class="" x="712" y="909">→mhc_post→mtp_post</text><text class="" x="712" y="932">重建节点图后逐节点 B</text><text class="" x="712" y="955">MTP 两方法均独立 replay</text></g><path class="arrow" d="M 947 905 h 8"/><g data-cell="ep-overlap-full-3"><rect class="acc2 box" x="957" y="814" width="247" height="182"/><text class="" x="969" y="840">replay A2A 暴露；原 overlap</text><text class="" x="969" y="863"> 在</text><text class="" x="969" y="886">新 bridge leaf 接旧梯度</text><text class="" x="969" y="909">段头 B 后 release input</text><text class="" x="969" y="932">零 dropout / 非 delayed FP8</text><text class="" x="969" y="955">低层可多层 ≠ 公共配置放行</text></g></g><text class="cap" x="24" y="1037">四层例：uniform=2 区域/4 回放；block=2 区域/2 回放；PP w=4,k=2 → False,False,True,True。</text><text class="cap" x="24" y="1060">分组数字不等于完整显存；每条路线最后都需要输入/参数梯度完成并经 finalizer 交付。</text></svg>
