<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="430" viewBox="0 0 1220 430" role="img"><title>同一 token 路线的部分图与整段图</title><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;font-size:15px;fill:#2A313B}.title{font-size:23px;font-weight:700}.small{font-size:13px;fill:#626B77}.bold{font-weight:700}.neutral{fill:#fff;stroke:#C7CCD3}.ghost{fill:#F7F6F3;stroke:#DDD9D2}.acc1{fill:#EAF1FD;stroke:#2563EB}.acc2{fill:#FCF1E6;stroke:#C3651F}.arrow{fill:none;stroke:#98A1AD;stroke-width:1.3}.main{stroke:#2563EB;stroke-width:2}.dash{fill:none;stroke:#C3651F;stroke-dasharray:5 4}</style><defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#98A1AD"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="26" y="37" class="title">同一 token 路线的部分图与整段图</text><text x="26" y="68" class="small">同一 attention → router → experts/通信 → 合并输出；边界决定哪里保留动态处理，哪里支付静态容量。</text><text x="26" y="121" class="bold">partial</text><rect x="218" y="94" width="151" height="46" rx="6" class="neutral"/><text x="227" y="121" class="small">图内</text><path d="M370,116 L379,116" class="arrow aux" marker-end="url(#head)"/><rect x="382" y="94" width="151" height="46" rx="6" class="neutral"/><text x="391" y="121" class="small">图内</text><path d="M534,116 L543,116" class="arrow aux" marker-end="url(#head)"/><rect x="546" y="94" width="151" height="46" rx="6" class="ghost"/><text x="555" y="121" class="small">eager</text><path d="M698,116 L707,116" class="arrow aux" marker-end="url(#head)"/><rect x="710" y="94" width="151" height="46" rx="6" class="ghost"/><text x="719" y="121" class="small">eager</text><text x="892" y="112" class="small">BWD 沿边界返回</text><text x="892" y="133" class="small">输出 → loss → backward</text><text x="26" y="191" class="bold">drop-and-pad</text><rect x="218" y="164" width="151" height="46" rx="6" class="neutral"/><text x="227" y="191" class="small">图内</text><path d="M370,186 L379,186" class="arrow aux" marker-end="url(#head)"/><rect x="382" y="164" width="151" height="46" rx="6" class="neutral"/><text x="391" y="191" class="small">图内</text><path d="M534,186 L543,186" class="arrow aux" marker-end="url(#head)"/><rect x="546" y="164" width="151" height="46" rx="6" class="neutral"/><text x="555" y="191" class="small">固定专家容量</text><path d="M698,186 L707,186" class="arrow aux" marker-end="url(#head)"/><rect x="710" y="164" width="151" height="46" rx="6" class="neutral"/><text x="719" y="191" class="small">图内</text><text x="892" y="182" class="small">丢弃 / padding 成本</text><text x="892" y="203" class="small">输出 → loss → backward</text><text x="26" y="261" class="bold">HybridEP whole</text><rect x="218" y="234" width="151" height="46" rx="6" class="neutral"/><text x="227" y="261" class="small">TE 图内</text><path d="M370,256 L379,256" class="arrow aux" marker-end="url(#head)"/><rect x="382" y="234" width="151" height="46" rx="6" class="neutral"/><text x="391" y="261" class="small">TE 图内</text><path d="M534,256 L543,256" class="arrow aux" marker-end="url(#head)"/><rect x="546" y="234" width="151" height="46" rx="6" class="neutral"/><text x="555" y="261" class="small">rank 容量 + stash</text><path d="M698,256 L707,256" class="arrow aux" marker-end="url(#head)"/><rect x="710" y="234" width="151" height="46" rx="6" class="neutral"/><text x="719" y="261" class="small">TE 图内</text><text x="892" y="252" class="small">溢出硬失败；固定调度</text><text x="892" y="273" class="small">输出 → loss → backward</text><text x="26" y="331" class="bold">full_iteration</text><rect x="218" y="304" width="151" height="46" rx="6" class="neutral"/><text x="227" y="331" class="small">整步图</text><path d="M370,326 L379,326" class="arrow aux" marker-end="url(#head)"/><rect x="382" y="304" width="151" height="46" rx="6" class="neutral"/><text x="391" y="331" class="small">整步图</text><path d="M534,326 L543,326" class="arrow aux" marker-end="url(#head)"/><rect x="546" y="304" width="151" height="46" rx="6" class="neutral"/><text x="555" y="331" class="small">须可捕获</text><path d="M698,326 L707,326" class="arrow aux" marker-end="url(#head)"/><rect x="710" y="304" width="151" height="46" rx="6" class="neutral"/><text x="719" y="331" class="small">整步图</text><text x="892" y="322" class="small">整步 F/B；optimizer 图外</text><text x="892" y="343" class="small">输出 → loss → backward</text><text x="26" y="403" class="small">TE 内部的量化/融合/捕获由依赖实现；静态容量或捕获区域都不能直接换算加速比。</text></svg>
