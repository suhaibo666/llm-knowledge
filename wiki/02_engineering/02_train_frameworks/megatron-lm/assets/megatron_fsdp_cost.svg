<text class="tx" x="40" y="385" text-anchor="start">怎么算的（none=no_shard，og=optim_grads，ogp=optim_grads_params）</text>
<path class="edge" d="M 40 393 L 656 393"/>
<text class="sm" x="40" y="411" text-anchor="start">no_shard：W+G+M+O 全复制 = 16 B；optim：W+G + (M+O)/D = 5.5 B；optim_grads：W + (G+M+O)/D = 3.75 B</text>
<text class="sm" x="40" y="427" text-anchor="start">optim_grads_params：(W+G+M+O)/D = 2 B；HSDP 外层复制 = 2 B；HFSDP：(W+G)/D + (M+O)/(D·O) = 0.875 B</text>
<text class="sm" x="40" y="443" text-anchor="start">G：main_grads_dtype=None → 参数 dtype（bf16 2 B），fp8 参数 → bf16；M：main_params_dtype 默认 fp32</text>
<text class="costtx" x="40" y="459" text-anchor="start">O = Adam 两个 fp32 状态（假设）；整模型 8.03B 参数：ogp 每 rank 14.96 GiB，no_shard 119.66 GiB</text>
<text class="sm" x="40" y="475" text-anchor="start">vocab 不进 unit 账，进整模型账；TP=1，没有 strided shard</text>
<text class="pt" x="708" y="92" text-anchor="start">瞬态：一个 unit 的未分片桶 × 持久池槽数（MiB / rank）</text>
