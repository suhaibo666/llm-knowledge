<svg xmlns="http://www.w3.org/2000/svg" width="1122" height="735" viewBox="0 0 1122 735" role="img"><title>从同一组数复演：统计、尺度、量化与 GEMM 重建</title><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;font-size:15px;fill:#2A313B}.title{font-size:23px;font-weight:700}.small{font-size:13px;fill:#626B77}.bold{font-weight:700}.neutral{fill:#fff;stroke:#C7CCD3}.ghost{fill:#F7F6F3;stroke:#DDD9D2}.acc1{fill:#EAF1FD;stroke:#2563EB}.acc2{fill:#FCF1E6;stroke:#C3651F}.arrow{fill:none;stroke:#98A1AD;stroke-width:1.3}.main{stroke:#2563EB;stroke-width:2}.dash{fill:none;stroke:#C3651F;stroke-dasharray:5 4}</style><defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#98A1AD"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="26" y="37" class="title">从同一组数复演：统计、尺度、量化与 GEMM 重建</text><text x="26" y="69" class="bold">同一 X 的非零片段 [0.25, 0.5, 3, 6]；同一 W 列 [1, -1, 1, 1]；未量化 Z₀₀ = 8.75</text><text x="26" y="96" class="small">教学整数码本：q = clip(round(x / s), −Q, Q)，x̂ = s q；恰好半格远离零舍入。不是 TE 内核或 FP8/FP4 格式模拟。</text><text x="35" y="135" class="bold">策略 / Q</text><text x="205" y="135" class="bold">统计 amax → 尺度 s</text><text x="425" y="135" class="bold">量化码 q</text><text x="620" y="135" class="bold">重建 x̂</text><text x="902" y="135" class="bold">重建 GEMM / 误差</text><rect x="26" y="153" width="1070" height="84" rx="6" class="ghost"/><text x="36" y="183" class="bold">当前共享</text><text x="36" y="212" class="small">Q = 3</text><text x="205" y="182" class="">[6]</text><text x="205" y="209" class="bold">→ [2]</text><text x="425" y="197" class="bold">[0, 0, 2, 3]</text><text x="620" y="197" class="bold">[0, 0, 4, 6]</text><text x="902" y="182" class="bold">Ẑ₀₀ = 10</text><text x="902" y="210" class="small">|Ẑ − Z| = 1.25</text><rect x="26" y="253" width="1070" height="84" rx="6" class="acc2"/><text x="36" y="283" class="bold">历史共享</text><text x="36" y="312" class="small">Q = 3</text><text x="205" y="282" class="">[3]</text><text x="205" y="309" class="bold">→ [1]</text><text x="425" y="297" class="bold">[0, 1, 3, 3]</text><text x="620" y="297" class="bold">[0, 1, 3, 3]</text><text x="902" y="282" class="bold">Ẑ₀₀ = 5</text><text x="902" y="310" class="small">|Ẑ − Z| = 3.75</text><rect x="26" y="353" width="1070" height="84" rx="6" class="ghost"/><text x="36" y="383" class="bold">当前分组</text><text x="36" y="412" class="small">Q = 3</text><text x="205" y="382" class="">[0.5, 6]</text><text x="205" y="409" class="bold">→ [0.167, 2]</text><text x="425" y="397" class="bold">[2, 3, 2, 3]</text><text x="620" y="397" class="bold">[0.333, 0.5, 4, 6]</text><text x="902" y="382" class="bold">Ẑ₀₀ = 9.833</text><text x="902" y="410" class="small">|Ẑ − Z| = 1.083</text><rect x="26" y="453" width="1070" height="84" rx="6" class="ghost"/><text x="36" y="483" class="bold">二幂尺度</text><text x="36" y="512" class="small">Q = 3</text><text x="205" y="482" class="">[0.5, 6]</text><text x="205" y="509" class="bold">→ [0.25, 2]</text><text x="425" y="497" class="bold">[1, 2, 2, 3]</text><text x="620" y="497" class="bold">[0.25, 0.5, 4, 6]</text><text x="902" y="482" class="bold">Ẑ₀₀ = 9.75</text><text x="902" y="510" class="small">|Ẑ − Z| = 1</text><rect x="26" y="553" width="1070" height="84" rx="6" class="ghost"/><text x="36" y="583" class="bold">更少码值</text><text x="36" y="612" class="small">Q = 1</text><text x="205" y="582" class="">[0.5, 6]</text><text x="205" y="609" class="bold">→ [0.5, 6]</text><text x="425" y="597" class="bold">[1, 1, 1, 1]</text><text x="620" y="597" class="bold">[0.5, 0.5, 6, 6]</text><text x="902" y="582" class="bold">Ẑ₀₀ = 12</text><text x="902" y="610" class="small">|Ẑ − Z| = 3.25</text><text x="26" y="681" class="small">W 在每条路径恰好重建；每组整数点积再乘 sX × sW 后求和。历史行用 3，本轮记录 6 供下次使用。</text><text x="26" y="707" class="small">分组只用两个元素以便手算；二幂尺度与更少码值仅演示设计约束，不指定 MXFP8 / NVFP4 的实际块、码本或舍入。</text></svg>
