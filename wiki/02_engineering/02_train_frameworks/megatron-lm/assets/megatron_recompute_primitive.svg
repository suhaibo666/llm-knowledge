<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1057" role="img" aria-label="输入留存与反向恢复：输出身份也是状态"><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#1f2937;font-size:16px}
.title{font-size:23px;font-weight:650}.subtitle{fill:#64748b;font-size:15px}
.cap{fill:#64748b;font-size:14px}.rowname{font-weight:650;font-size:16px}
.neutral{fill:#fff;stroke:#cbd5e1}.ghost{fill:#f8fafc;stroke:#e2e8f0}
.acc1{fill:#eff6ff;stroke:#2563eb}.acc2{fill:#fff7ed;stroke:#d97706}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#a)}
.aux{stroke:#94a3b8;stroke-width:1.2}.box{rx:7;stroke-width:1.2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><rect width="1240" height="1057" fill="#fff"/><text class="title" x="24" y="34">输入留存与反向恢复：输出身份也是状态</text><text class="subtitle" x="24" y="61">microbatch A · X0[4,1,4] · t0…t3 · BF16 · TP=2 · SP off</text><text class="rowname" x="198" y="99">原前向 f → g</text><text class="rowname" x="455" y="99">前反向间隔</text><text class="rowname" x="712" y="99">loss backward / replay</text><text class="rowname" x="969" y="99">消费者梯度 → 参数交付</text><g data-plane="ordinary"><rect class="ghost box" x="24" y="122" width="1192" height="158"/><text class="rowname" x="36" y="150">ordinary</text><text class="rowname" x="36" y="173">checkpoint</text><g data-cell="ordinary-0"><rect class="neutral box" x="186" y="134" width="247" height="134"/><text class="" x="198" y="160">X → f(no-grad) → Y</text><text class="" x="198" y="183">Y → g → Z → loss</text><text class="" x="198" y="206">保存 X + 原前向 RNG</text></g><path class="arrow" d="M 433 201 h 8"/><g data-cell="ordinary-1"><rect class="neutral box" x="443" y="134" width="247" height="134"/><text class="" x="455" y="160">X: 16 el / 32 B</text><text class="" x="455" y="183">f 内部图不保留</text><text class="" x="455" y="206">g 保存的 Y 仍存活</text></g><path class="arrow" d="M 690 201 h 8"/><g data-cell="ordinary-2"><rect class="acc1 box" x="700" y="134" width="247" height="134"/><text class="" x="712" y="160">dY 到达 checkpoint</text><text class="" x="712" y="183">恢复 RNG → f(grad)</text><text class="" x="712" y="206">还原环境 RNG → B(f)</text></g><path class="arrow" d="M 947 201 h 8"/><g data-cell="ordinary-3"><rect class="neutral box" x="957" y="134" width="247" height="134"/><text class="" x="969" y="160">返回 dX，累积 dθ</text><text class="" x="969" y="183">g 先算 dφ 与 dY</text><text class="" x="969" y="206">finalize grads → optimizer</text></g></g><g data-plane="without-output"><rect class="ghost box" x="24" y="292" width="1192" height="158"/><text class="rowname" x="36" y="320">Checkpoint</text><text class="rowname" x="36" y="343">WithoutOutput</text><g data-cell="without-output-0"><rect class="neutral box" x="186" y="304" width="247" height="134"/><text class="" x="198" y="330">X → f(no-grad) → Y</text><text class="" x="198" y="353">g 的 backward 保存 Y</text><text class="" x="198" y="376">g 完成后，hook 绑定 Z</text></g><path class="arrow" d="M 433 371 h 8"/><g data-cell="without-output-1"><rect class="acc2 box" x="443" y="304" width="247" height="134"/><text class="" x="455" y="330">Y storage.resize_(0)</text><text class="" x="455" y="353">保留旧 Tensor / views</text><text class="" x="455" y="376">X + RNG + metadata 留下</text></g><path class="arrow" d="M 690 371 h 8"/><g data-cell="without-output-2"><rect class="acc1 box" x="700" y="304" width="247" height="134"/><text class="" x="712" y="330">dZ hook → replay f</text><text class="" x="712" y="353">旧 StorageImpl 共享新值</text><text class="" x="712" y="376">g backward 前恢复 Y</text></g><path class="arrow" d="M 947 371 h 8"/><g data-cell="without-output-3"><rect class="neutral box" x="957" y="304" width="247" height="134"/><text class="" x="969" y="330">B(g) → dφ,dY</text><text class="" x="969" y="353">CWO B(f) → dθ,dX</text><text class="" x="969" y="376">ctx/replay 引用清空</text></g></g><g data-plane="tp-saved-input"><rect class="ghost box" x="24" y="462" width="1192" height="158"/><text class="rowname" x="36" y="490">distribute_saved</text><text class="rowname" x="36" y="513">_activations</text><g data-cell="tp-saved-input-0"><rect class="neutral box" x="186" y="474" width="247" height="134"/><text class="" x="198" y="500">f 原前向读完整 X</text><text class="" x="198" y="523">之后 flatten / new copy</text><text class="" x="198" y="546">rank0 [0,8)</text></g><path class="arrow" d="M 433 541 h 8"/><g data-cell="tp-saved-input-1"><rect class="acc2 box" x="443" y="474" width="247" height="134"/><text class="" x="455" y="500">rank1 [8,16)</text><text class="" x="455" y="523">每 rank 8 el / 16 B</text><text class="" x="455" y="546">只切 args[0]，非全部输入</text></g><path class="arrow" d="M 690 541 h 8"/><g data-cell="tp-saved-input-2"><rect class="acc1 box" x="700" y="474" width="247" height="134"/><text class="" x="712" y="500">TP all-gather → full X</text><text class="" x="712" y="523">恢复 [4,1,4] → f(grad)</text><text class="" x="712" y="546">AG 后按 stream 顺序使用</text></g><path class="arrow" d="M 947 541 h 8"/><g data-cell="tp-saved-input-3"><rect class="neutral box" x="957" y="474" width="247" height="134"/><text class="" x="969" y="500">B(f) 返回完整输入梯度</text><text class="" x="969" y="523">原层 TP 通信照常执行</text><text class="" x="969" y="546">+AG，回放峰值重现 full X</text></g></g><g data-plane="te-dependency"><rect class="ghost box" x="24" y="632" width="1192" height="158"/><text class="rowname" x="36" y="660">FP8 / FP4</text><text class="rowname" x="36" y="683">TE checkpoint</text><g data-cell="te-dependency-0"><rect class="neutral box" x="186" y="644" width="247" height="134"/><text class="" x="198" y="670">量化 full / MLP / MoE</text><text class="" x="198" y="693">传函数、位置输入、TP组</text><text class="" x="198" y="716">RNG getter、分存开关</text></g><path class="arrow" d="M 433 711 h 8"/><g data-cell="te-dependency-1"><rect class="acc2 box" x="443" y="644" width="247" height="134"/><text class="" x="455" y="670">Megatron → TE 边界</text><text class="" x="455" y="693">版本 ≥1.5 新 kwargs</text><text class="" x="455" y="716">更旧版本用位置签名</text></g><path class="arrow" d="M 690 711 h 8"/><g data-cell="te-dependency-2"><rect class="acc1 box" x="700" y="644" width="247" height="134"/><text class="" x="712" y="670">TE checkpoint 返回 Y</text><text class="" x="712" y="693">回放/量化元数据：</text><text class="" x="712" y="716">TE 合约，非本仓内部证明</text></g><path class="arrow" d="M 947 711 h 8"/><g data-cell="te-dependency-3"><rect class="neutral box" x="957" y="644" width="247" height="134"/><text class="" x="969" y="670">按调用接口回传梯度</text><text class="" x="969" y="693">延迟 FP8 MTP 外层 context</text><text class="" x="969" y="716">内部容量/数值须依赖验证</text></g></g><g data-layout="tp-saved-identity"><rect class="ghost box" x="24" y="802" width="1192" height="183"/><text class="rowname" x="40" y="827">同一 X 的元素身份：先完整前向，再切保存面；回放前恢复</text><text class="cap" x="40" y="855">X0[4,1,4] · 32 B</text><rect class="neutral" x="40" y="866" width="30" height="22"/><text class="cap" x="43" y="882">x0</text><rect class="neutral" x="72" y="866" width="30" height="22"/><text class="cap" x="75" y="882">x1</text><rect class="neutral" x="104" y="866" width="30" height="22"/><text class="cap" x="107" y="882">x2</text><rect class="neutral" x="136" y="866" width="30" height="22"/><text class="cap" x="139" y="882">x3</text><rect class="neutral" x="40" y="890" width="30" height="22"/><text class="cap" x="43" y="906">x4</text><rect class="neutral" x="72" y="890" width="30" height="22"/><text class="cap" x="75" y="906">x5</text><rect class="neutral" x="104" y="890" width="30" height="22"/><text class="cap" x="107" y="906">x6</text><rect class="neutral" x="136" y="890" width="30" height="22"/><text class="cap" x="139" y="906">x7</text><rect class="neutral" x="40" y="914" width="30" height="22"/><text class="cap" x="43" y="930">x8</text><rect class="neutral" x="72" y="914" width="30" height="22"/><text class="cap" x="75" y="930">x9</text><rect class="neutral" x="104" y="914" width="30" height="22"/><text class="cap" x="107" y="930">x10</text><rect class="neutral" x="136" y="914" width="30" height="22"/><text class="cap" x="139" y="930">x11</text><rect class="neutral" x="40" y="938" width="30" height="22"/><text class="cap" x="43" y="954">x12</text><rect class="neutral" x="72" y="938" width="30" height="22"/><text class="cap" x="75" y="954">x13</text><rect class="neutral" x="104" y="938" width="30" height="22"/><text class="cap" x="107" y="954">x14</text><rect class="neutral" x="136" y="938" width="30" height="22"/><text class="cap" x="139" y="954">x15</text><path class="arrow" d="M 182 908 H 313"/><text class="cap" x="190" y="898">原前向之后 copy</text><text class="cap" x="330" y="859">rank0 [0,8) · 16 B</text><rect class="acc2" x="330" y="866" width="30" height="22"/><text class="cap" x="333" y="882">x0</text><rect class="acc2" x="362" y="866" width="30" height="22"/><text class="cap" x="365" y="882">x1</text><rect class="acc2" x="394" y="866" width="30" height="22"/><text class="cap" x="397" y="882">x2</text><rect class="acc2" x="426" y="866" width="30" height="22"/><text class="cap" x="429" y="882">x3</text><rect class="acc2" x="458" y="866" width="30" height="22"/><text class="cap" x="461" y="882">x4</text><rect class="acc2" x="490" y="866" width="30" height="22"/><text class="cap" x="493" y="882">x5</text><rect class="acc2" x="522" y="866" width="30" height="22"/><text class="cap" x="525" y="882">x6</text><rect class="acc2" x="554" y="866" width="30" height="22"/><text class="cap" x="557" y="882">x7</text><text class="cap" x="330" y="913">rank1 [8,16) · 16 B</text><rect class="acc2" x="330" y="921" width="30" height="22"/><text class="cap" x="333" y="937">x8</text><rect class="acc2" x="362" y="921" width="30" height="22"/><text class="cap" x="365" y="937">x9</text><rect class="acc2" x="394" y="921" width="30" height="22"/><text class="cap" x="397" y="937">x10</text><rect class="acc2" x="426" y="921" width="30" height="22"/><text class="cap" x="429" y="937">x11</text><rect class="acc2" x="458" y="921" width="30" height="22"/><text class="cap" x="461" y="937">x12</text><rect class="acc2" x="490" y="921" width="30" height="22"/><text class="cap" x="493" y="937">x13</text><rect class="acc2" x="522" y="921" width="30" height="22"/><text class="cap" x="525" y="937">x14</text><rect class="acc2" x="554" y="921" width="30" height="22"/><text class="cap" x="557" y="937">x15</text><path class="arrow" d="M 601 907 H 786"/><text class="cap" x="609" y="895">backward: TP all-gather</text><text class="cap" x="805" y="855">每 rank 重建 X0 · 32 B</text><rect class="acc1" x="805" y="866" width="30" height="22"/><text class="cap" x="808" y="882">x0</text><rect class="acc1" x="837" y="866" width="30" height="22"/><text class="cap" x="840" y="882">x1</text><rect class="acc1" x="869" y="866" width="30" height="22"/><text class="cap" x="872" y="882">x2</text><rect class="acc1" x="901" y="866" width="30" height="22"/><text class="cap" x="904" y="882">x3</text><rect class="acc1" x="805" y="890" width="30" height="22"/><text class="cap" x="808" y="906">x4</text><rect class="acc1" x="837" y="890" width="30" height="22"/><text class="cap" x="840" y="906">x5</text><rect class="acc1" x="869" y="890" width="30" height="22"/><text class="cap" x="872" y="906">x6</text><rect class="acc1" x="901" y="890" width="30" height="22"/><text class="cap" x="904" y="906">x7</text><rect class="acc1" x="805" y="914" width="30" height="22"/><text class="cap" x="808" y="930">x8</text><rect class="acc1" x="837" y="914" width="30" height="22"/><text class="cap" x="840" y="930">x9</text><rect class="acc1" x="869" y="914" width="30" height="22"/><text class="cap" x="872" y="930">x10</text><rect class="acc1" x="901" y="914" width="30" height="22"/><text class="cap" x="904" y="930">x11</text><rect class="acc1" x="805" y="938" width="30" height="22"/><text class="cap" x="808" y="954">x12</text><rect class="acc1" x="837" y="938" width="30" height="22"/><text class="cap" x="840" y="954">x13</text><rect class="acc1" x="869" y="938" width="30" height="22"/><text class="cap" x="872" y="954">x14</text><rect class="acc1" x="901" y="938" width="30" height="22"/><text class="cap" x="904" y="954">x15</text><text class="" x="968" y="884">detach → replay f</text><text class="" x="968" y="907">得到 dX0 与 dθ</text><text class="" x="968" y="930">非半个输入直接计算</text></g><text class="cap" x="24" y="1016">局部可算例：x=2, w=3, mask=2, v=5 → y=12, z=60, loss=28800, dx=1800, dw=19200, dv=11520。</text><text class="cap" x="24" y="1039">数值为 16 个元素共享标量权重的解析演示；RNG 恢复不代表通信或 optimizer 已完成。</text></svg>
