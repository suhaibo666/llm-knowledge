<text class="sm" x="998" y="292" text-anchor="start">对照 672 MB（全留 GPU，条高按 224 MB 满格）</text>
<rect class="acc1" x="998" y="98" width="214" height="62" rx="8"/>
<text class="tx" x="1008" y="117" text-anchor="start">margin = 2 组</text>
<text class="sm" x="1008" y="134" text-anchor="start">组名去重数；L3 两组不 offload</text>
<text class="sm" x="1008" y="149" text-anchor="start">反向前两组因此无需等待</text>
<rect class="acc2" x="998" y="188" width="214" height="62" rx="8"/>
<text class="tx" x="1008" y="207" text-anchor="start">本例阻塞 0 单位</text>
<text class="sm" x="1008" y="224" text-anchor="start">margin=0 时暴露 14 单位</text>
<text class="sm" x="1008" y="239" text-anchor="start">最后两组只能在 tensor_pop 同步拷回</text>
<text class="cap" x="28" y="328" text-anchor="start">F/B = 前向/反向，1a = 第 1 层 core_attn，1f = 第 1 层 expert_fc1；橙=须先等 reload 事件的反向，蓝边=margin 组的反向；拷贝条上的数字是组的 MB 数。</text>
<text class="cap" x="28" y="344" text-anchor="start">D2H 在 group_offload 之后由 d2h_stream 串行发起；H2D 由前一个反向组的 start 函数触发，因此预取距离 = margin。</text>
