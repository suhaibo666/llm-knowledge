<text class="ti" x="28" y="32" text-anchor="start">图 1　子模块级 offload：组提交触发 D2H，反向起点提前一组预取 H2D，margin 组不出 GPU</text>
<text class="su" x="28" y="52" text-anchor="start">PP=1、1 个 microbatch、3 层 × 2 组；前向每组 10、反向每组 20 单位；PCIe 16 MB/单位。所有格子由仿真算出。</text>
