<path class="edge" d="M 720 351 L 1232 351"/>
<text class="dim" x="720" y="369" text-anchor="start">gather 接收量随 (CP−1)/CP 饱和：CP2 10.01 → CP16 18.90 → CP128 21.08 MiB</text>
<text class="costtx" x="720" y="385" text-anchor="start">本地行数 65536/CP：CP2 32768 → CP16 4096 → CP128 512，可重叠的本地投影随之收窄</text>
<text class="sm" x="720" y="401" text-anchor="start">容量补齐随 CP 增长：CP2 16 行 → CP128 1024 行（每 rank 对齐到 8）</text>
<text class="sm" x="720" y="417" text-anchor="start">边界 P2P 固定 1.00 MiB / rank；local_rows ≥ d_window 给出 CP ≤ 512 的硬上限</text>
