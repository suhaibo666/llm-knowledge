<text class="ti" x="28" y="32" text-anchor="start">图 3　真实配方 THD64K / CP16 下每层每 rank 的通信量：压缩态 gather 对比朴素全量 KV AllGather</text>
<text class="su" x="28" y="52" text-anchor="start">mxfp8_THD64K_128GPU_TP1PP2EP64CP16.yaml：seq 65536，CP 16 → l_local 4096；hidden 4096，v_head_dim 512，indexer head_dim 128，window 128，bf16</text>
<text class="pt" x="28" y="92" text-anchor="start">每 rank 接收字节（MiB，log 刻度）：ratio-4 层与 ratio-128 层</text>
