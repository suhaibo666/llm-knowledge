<text class="tx" x="40" y="357" text-anchor="start">怎么算的</text>
<path class="edge" d="M 40 365 L 656 365"/>
<text class="sm" x="40" y="383" text-anchor="start">边界 P2P = d_window × hidden × 2 B = 128 × 4096 × 2 = 1.00 MiB（内部 rank 收 1 发 1，反向再各 1）</text>
<text class="sm" x="40" y="399" text-anchor="start">AG 接收 = (CP − 1) × c_cap × 行宽 × 2 B；KV 行宽 512、Indexer-K 行宽 128；缓冲 CP × c_cap 行</text>
<text class="sm" x="40" y="415" text-anchor="start">ratio-4：真实压缩行 16384，缓冲 16512 行，容量补齐 128 行（0.8%）</text>
<text class="costtx" x="40" y="431" text-anchor="start">朴素 = (CP − 1) × l_local × 512 × 2 B = 60.00 MiB；ratio-4 层压缩态 K+KV 合计 18.90 MiB</text>
<text class="pt" x="708" y="92" text-anchor="start">同一条 64K 序列，CP 从 2 扫到 128（ratio-4 层）</text>
