<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 440" width="1272" height="440" role="img">

  <defs>
    <marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker>
    <marker id="arrowAux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AEB6C2"/></marker>
    <marker id="arrowCost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C3651F"/></marker>
  </defs>
<style>
  text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .card{fill:#fff;stroke:#E4E7EC;stroke-width:1.2}
  .panel{fill:#FBFCFE;stroke:#D9DEE7;stroke-width:1.2}
  .neutral{fill:#fff;stroke:#AEB6C2;stroke-width:1.2}
  .ghost{fill:#F5F7FA;stroke:#D9DEE7;stroke-width:1.1}
  .acc1{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.5}
  .acc2{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.5}
  .main{fill:none;stroke:#2563EB;stroke-width:2;marker-end:url(#arrowMain)}
  .aux{fill:none;stroke:#AEB6C2;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arrowAux)}
  .cost{fill:none;stroke:#C3651F;stroke-width:2;marker-end:url(#arrowCost)}
  .edge{fill:none;stroke:#AEB6C2;stroke-width:1.4;stroke-dasharray:4 4}
  .ti{font-size:18px;font-weight:700;fill:#1F2430}
  .su{font-size:11.5px;fill:#747C88}
  .pt{font-size:14px;font-weight:700;fill:#2A313B}
  .tx{font-size:12px;fill:#38414D}
  .sm{font-size:10.5px;fill:#68717D}
  .dim{font-size:10.5px;font-weight:600;fill:#173F87}
  .costtx{font-size:10.5px;font-weight:600;fill:#8A4A11}
  .rank{font-size:11px;font-weight:700;fill:#5B6470}
  .cap{font-size:11px;fill:#747C88}
  .gl{fill:none;stroke:#C8CFDA;stroke-width:.9}
  .maxline{fill:none;stroke:#2563EB;stroke-width:2}
  .trigline{fill:none;stroke:#C3651F;stroke-width:2;stroke-dasharray:7 4}
  .refline{fill:none;stroke:#C8CFDA;stroke-width:1;stroke-dasharray:3 4}
  .band{fill:#F5F7FA;stroke:none}
</style>
<text class="ti" x="28" y="32" text-anchor="start">图 3　aux-loss 的跨 rank 归一：闭式因子被前提推翻，不是被精度推翻</text>
<text class="su" x="28" y="52" text-anchor="start">--calculate-per-token-loss 下 finalize_model_grads 会按全局非 padding token 数整体相除，本图看的是分子怎么补</text>
<text class="tx" x="28" y="88" text-anchor="start">THD packing / dynamic CP：同组各 rank 有效 token 数不等</text>
<text class="rank" x="88" y="108" text-anchor="start">有效 token 数</text>
<text class="rank" x="482" y="108" text-anchor="start">闭式 / 实测 = 权重偏差</text>
<text class="sm" x="28" y="147" text-anchor="start">rank 0</text>
<rect class="acc2" x="88" y="134" width="394" height="20" rx="4"/>
<text class="sm" x="96" y="147" text-anchor="start">512</text>
<text class="costtx" x="482" y="147" text-anchor="start">2048 / 1600 = 1.28×</text>
<text class="sm" x="28" y="177" text-anchor="start">rank 1</text>
<rect class="acc2" x="88" y="164" width="295.5" height="20" rx="4"/>
<text class="sm" x="96" y="177" text-anchor="start">384</text>
<text class="costtx" x="482" y="177" text-anchor="start">1536 / 1600 = 0.96×</text>
<text class="sm" x="28" y="207" text-anchor="start">rank 2</text>
<rect class="acc2" x="88" y="194" width="344.75" height="20" rx="4"/>
<text class="sm" x="96" y="207" text-anchor="start">448</text>
<text class="costtx" x="482" y="207" text-anchor="start">1792 / 1600 = 1.12×</text>
<text class="sm" x="28" y="237" text-anchor="start">rank 3</text>
<rect class="acc2" x="88" y="224" width="197" height="20" rx="4"/>
<text class="sm" x="96" y="237" text-anchor="start">256</text>
<text class="costtx" x="482" y="237" text-anchor="start">1024 / 1600 = 0.64×</text>
<text class="dim" x="28" y="270" text-anchor="start">all_reduce(SUM) = 1600；闭式 local×4 逐 rank 见右列</text>
<text class="tx" x="656" y="88" text-anchor="start">定长且无 padding：闭式因子与实测完全一致</text>
<text class="rank" x="716" y="108" text-anchor="start">有效 token 数</text>
<text class="rank" x="1110" y="108" text-anchor="start">闭式 / 实测 = 权重偏差</text>
<text class="sm" x="656" y="147" text-anchor="start">rank 0</text>
<rect class="ghost" x="716" y="134" width="394" height="20" rx="4"/>
<text class="sm" x="724" y="147" text-anchor="start">512</text>
<text class="sm" x="1110" y="147" text-anchor="start">2048 / 2048 = 1×</text>
<text class="sm" x="656" y="177" text-anchor="start">rank 1</text>
<rect class="ghost" x="716" y="164" width="394" height="20" rx="4"/>
<text class="sm" x="724" y="177" text-anchor="start">512</text>
<text class="sm" x="1110" y="177" text-anchor="start">2048 / 2048 = 1×</text>
<text class="sm" x="656" y="207" text-anchor="start">rank 2</text>
<rect class="ghost" x="716" y="194" width="394" height="20" rx="4"/>
<text class="sm" x="724" y="207" text-anchor="start">512</text>
<text class="sm" x="1110" y="207" text-anchor="start">2048 / 2048 = 1×</text>
<text class="sm" x="656" y="237" text-anchor="start">rank 3</text>
<rect class="ghost" x="716" y="224" width="394" height="20" rx="4"/>
<text class="sm" x="724" y="237" text-anchor="start">512</text>
<text class="sm" x="1110" y="237" text-anchor="start">2048 / 2048 = 1×</text>
<text class="dim" x="656" y="270" text-anchor="start">all_reduce(SUM) = 2048；闭式 local×4 逐 rank 见右列</text>
<rect class="acc2" x="28" y="286" width="590" height="112" rx="8"/>
<text class="tx" x="40" y="307" text-anchor="start">闭式因子错在哪</text>
<path class="edge" d="M 40 315 L 606 315"/>
<text class="sm" x="40" y="333" text-anchor="start">local × group_size 假设「同组每个 rank 的有效 token 数相等」。</text>
<text class="sm" x="40" y="349" text-anchor="start">本例最重的 rank 被高估 1.28×，最轻的被低估到 0.64×，</text>
<text class="sm" x="40" y="365" text-anchor="start">于是同一个 aux loss 在不同 rank 上被赋予不同权重 —— 而它本该是一个全局量。</text>
<text class="sm" x="40" y="381" text-anchor="start">注释原话：valid token counts can differ by rank/group.</text>
<rect class="neutral" x="646" y="286" width="600" height="112" rx="8"/>
<text class="tx" x="658" y="307" text-anchor="start">代价：每个 aux-loss 域每步多一次 all_reduce</text>
<path class="edge" d="M 658 315 L 1234 315"/>
<text class="sm" x="658" y="333" text-anchor="start">实测法把本域有效 token 数装进张量，沿 aux_loss_scale_reduce_groups 逐组求和。</text>
<text class="sm" x="658" y="349" text-anchor="start">判据不是「实测更准」，而是闭式因子的前提在变长与动态 CP 下不再成立；</text>
<text class="sm" x="658" y="365" text-anchor="start">宁可每步多付一次标量 all_reduce，也不留一个会静默算错的常数。</text>
<text class="sm" x="658" y="381" text-anchor="start">reduce_group 缺失时直接 assert，不做猜测性回退。</text>
</svg>