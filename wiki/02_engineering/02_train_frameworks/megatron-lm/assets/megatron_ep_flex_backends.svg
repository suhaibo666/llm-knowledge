<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1248" width="100%" role="img" aria-label="Flex 四后端独立数据面：DeepEP、DeepEPv2、HybridEP、NCCL-EP 对同一全局四 token、每 rank 两 token 路由执行分发、专家计算、合并和反向对偶">
<metadata id="megatron-ep-figure-contract">{"tokensGlobal":4,"tokensLocalPerRank":2,"experts":4,"topk":2,"ep":2,"tp":1,"edges":8,"remoteEdges":4,"remoteUniqueRankCopies":3,"capacityAtHalf":1,"droppedEdgesAtHalf":0,"capacityAtOnePointFive":2,"slotsPerOwnedExpertAfterA2A":4,"realSlotsPerOwnedExpert":2,"zeroSlotsPerOwnedExpert":2,"backends":["DeepEP","DeepEPv2","HybridEP","NCCL-EP"],"inferenceSibling":{"field":"inference_moe_token_dispatcher_type","values":["nccl","nvls"],"classes":["NCCLAllGatherDispatcher","NVLSAllGatherVDispatcher"],"selector":"InferenceMode.is_active","owners":["30_megatron_rl_posttraining_consistency_analysis","31_megatron_inference_engine_analysis"]}}</metadata>
<style>
  text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .card{fill:#fff;stroke:#E4E7EC;stroke-width:1.2}
  .panel{fill:#FBFCFE;stroke:#D9DEE7;stroke-width:1.2}
  .neutral{fill:#fff;stroke:#AEB6C2;stroke-width:1.2}
  .ghost{fill:#F5F7FA;stroke:#D9DEE7;stroke-width:1.1}
  .acc1{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.5}
  .acc2{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.5}
  .main{fill:none;stroke:#2563EB;stroke-width:2;marker-end:url(#arrowMain)}
  .aux{fill:none;stroke:#AEB6C2;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arrowAux)}
  .cost{fill:none;stroke:#C3651F;stroke-width:2;marker-end:url(#arrowCost)}
  .ti{font-size:18px;font-weight:700;fill:#1F2430}
  .su{font-size:11.5px;fill:#747C88}
  .pt{font-size:14px;font-weight:700;fill:#2A313B}
  .tx{font-size:12px;fill:#38414D}
  .sm{font-size:10.5px;fill:#68717D}
  .dim{font-size:10.5px;font-weight:600;fill:#173F87}
  .costtx{font-size:10.5px;font-weight:600;fill:#8A4A11}
  .rank{font-size:11px;font-weight:700;fill:#5B6470}
  .cap{font-size:11px;fill:#747C88}
</style>
  <defs>
    <marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker>
    <marker id="arrowAux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AEB6C2"/></marker>
    <marker id="arrowCost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C3651F"/></marker>
  </defs>
<rect class="card" x="0.5" y="0.5" width="1599" height="1247" rx="14"/>
<text class="ti" x="28" y="36" text-anchor="start">Flex 二级选择不是一个黑盒：四个 manager 的数据布局与付款点</text>
<text class="su" x="28" y="58" text-anchor="start">T_global=4 · T_local=2/rank；每 rank hidden=[2,H]、router=[2,4]；8 edge / 4 remote / 3 remote rank-copy</text>
<rect class="panel" x="22" y="76" width="1556" height="250" rx="12"/>
<text class="pt" x="42" y="106" text-anchor="start">① DeepEP（moe_flex_dispatcher_backend=deepep）</text>
<text class="su" x="42" y="126" text-anchor="start">冻结依赖 DeepEP@af9a040；v1 Buffer 先按目标 rank 去重传 token，MCore 再展开成本地 expert-major edge。</text>
<rect class="ghost" x="42" y="146" width="230" height="112" rx="8"/>
<text class="tx" x="157" y="180.5" text-anchor="middle">router → MCore top-k</text>
<text class="sm" x="157" y="197.5" text-anchor="middle">r0/r1 各 [2,H]</text>
<text class="sm" x="157" y="214.5" text-anchor="middle">indices/weights: [2,2]</text>
<text class="sm" x="157" y="231.5" text-anchor="middle">逻辑 edge = 8</text>
<path class="cost" d="M 272 202 L 294 202"/>
<rect class="acc2" x="294" y="146" width="230" height="112" rx="8"/>
<text class="tx" x="409" y="180.5" text-anchor="middle">MCore ↔ DeepEP 边界</text>
<text class="sm" x="409" y="197.5" text-anchor="middle">Buffer.dispatch</text>
<text class="sm" x="409" y="214.5" text-anchor="middle">每目标 rank 一份 token</text>
<text class="sm" x="409" y="231.5" text-anchor="middle">remote rank-copy = 3</text>
<path class="main" d="M 524 202 L 546 202"/>
<rect class="acc1" x="546" y="146" width="230" height="112" rx="8"/>
<text class="tx" x="661" y="180.5" text-anchor="middle">MCore 局部再 permute</text>
<text class="sm" x="661" y="197.5" text-anchor="middle">r0 收唯一 t0,t1,t3</text>
<text class="sm" x="661" y="214.5" text-anchor="middle">→ e0/e1 共 4 edge</text>
<text class="sm" x="661" y="231.5" text-anchor="middle">r1 对称为 4 edge</text>
<path class="main" d="M 776 202 L 798 202"/>
<rect class="neutral" x="798" y="146" width="230" height="112" rx="8"/>
<text class="tx" x="913" y="180.5" text-anchor="middle">expert-major + local MLP</text>
<text class="sm" x="913" y="197.5" text-anchor="middle">e0:[t0,t3]</text>
<text class="sm" x="913" y="214.5" text-anchor="middle">e1:[t1,t3]</text>
<text class="sm" x="913" y="231.5" text-anchor="middle">TEGrouped/Sequential 在此消费 p</text>
<path class="main" d="M 1028 202 L 1050 202"/>
<rect class="acc2" x="1050" y="146" width="506" height="112" rx="8"/>
<text class="tx" x="1303" y="163.5" text-anchor="middle">combine / 账本</text>
<text class="sm" x="1303" y="180.5" text-anchor="middle">MCore unpermute 已累计加权 edge</text>
<text class="sm" x="1303" y="197.5" text-anchor="middle">Buffer.combine(x, handle)</text>
<text class="sm" x="1303" y="214.5" text-anchor="middle">forward 不传 route weights</text>
<text class="sm" x="1303" y="231.5" text-anchor="middle">layout/buffer + 默认 20 SM</text>
<text class="sm" x="1303" y="248.5" text-anchor="middle">精确收件数与 layout 带同步</text>
<text class="dim" x="42" y="287" text-anchor="start">Backward：combineᵀ 按 handle dispatch dY；expert 反向穿过 p 得 p·dY 与 dp；dispatchᵀ 再 combine dX/dp 回 origin。</text>
<text class="sm" x="42" y="309" text-anchor="start">依赖边界：MCore 负责 local expert-major 重排；DeepEP@af9a040 负责 v1 NVLink/RDMA 搬运。其 internode kernel 对同一目标 RDMA 域只发送一份 token。</text>
<rect class="panel" x="22" y="334" width="1556" height="250" rx="12"/>
<text class="pt" x="42" y="364" text-anchor="start">② DeepEPv2（moe_flex_dispatcher_backend=deepepv2）</text>
<text class="su" x="42" y="384" text-anchor="start">冻结依赖 DeepEP@af9a040；ElasticBuffer 的非展开收件布局之后，仍由 MCore 做第二次 per-expert permute。</text>
<rect class="ghost" x="42" y="404" width="230" height="112" rx="8"/>
<text class="tx" x="157" y="438.5" text-anchor="middle">router → MCore top-k</text>
<text class="sm" x="157" y="455.5" text-anchor="middle">同一 [2,H] / rank</text>
<text class="sm" x="157" y="472.5" text-anchor="middle">indices/weights: [2,2]</text>
<text class="sm" x="157" y="489.5" text-anchor="middle">逻辑 edge = 8</text>
<path class="cost" d="M 272 460 L 294 460"/>
<rect class="acc2" x="294" y="404" width="230" height="112" rx="8"/>
<text class="tx" x="409" y="438.5" text-anchor="middle">MCore ↔ DeepEPv2 边界</text>
<text class="sm" x="409" y="455.5" text-anchor="middle">ElasticBuffer.dispatch</text>
<text class="sm" x="409" y="472.5" text-anchor="middle">do_expand=false</text>
<text class="sm" x="409" y="489.5" text-anchor="middle">自动或显式 SM/QP</text>
<path class="main" d="M 524 460 L 546 460"/>
<rect class="acc1" x="546" y="404" width="230" height="112" rx="8"/>
<text class="tx" x="661" y="438.5" text-anchor="middle">MCore 局部再 permute</text>
<text class="sm" x="661" y="455.5" text-anchor="middle">non-expanded recv token</text>
<text class="sm" x="661" y="472.5" text-anchor="middle">→ 本 rank 4 expert edge</text>
<text class="sm" x="661" y="489.5" text-anchor="middle">tokens_per_expert=[2,2]</text>
<path class="main" d="M 776 460 L 798 460"/>
<rect class="neutral" x="798" y="404" width="230" height="112" rx="8"/>
<text class="tx" x="913" y="438.5" text-anchor="middle">expert-major + local MLP</text>
<text class="sm" x="913" y="455.5" text-anchor="middle">e2:[t1,t2]</text>
<text class="sm" x="913" y="472.5" text-anchor="middle">e3:[t0,t2]</text>
<text class="sm" x="913" y="489.5" text-anchor="middle">本地消费 p 后再 unpermute</text>
<path class="main" d="M 1028 460 L 1050 460"/>
<rect class="acc2" x="1050" y="404" width="506" height="112" rx="8"/>
<text class="tx" x="1303" y="421.5" text-anchor="middle">combine / 账本</text>
<text class="sm" x="1303" y="438.5" text-anchor="middle">Elastic combine 累计已加权输出</text>
<text class="sm" x="1303" y="455.5" text-anchor="middle">全局缓存/按需放大 buffer</text>
<text class="sm" x="1303" y="472.5" text-anchor="middle">ranks≤1024 · experts≤2048 · local≤256</text>
<text class="sm" x="1303" y="489.5" text-anchor="middle">float32 probs；num_sms=0 自动</text>
<text class="sm" x="1303" y="506.5" text-anchor="middle">默认精确计数有 CPU sync</text>
<text class="dim" x="42" y="545" text-anchor="start">Backward：Elastic combine 的反向调 dispatch；Elastic dispatch 的反向调 combine；相同 handle 恢复 origin 与 route-weight gradient。</text>
<text class="sm" x="42" y="567" text-anchor="start">依赖边界：MCore 管 local rearrangement；DeepEP@af9a040 管 ElasticBuffer。源码发布测量只适用于其指定机器/shape，不是本例加速保证。</text>
<rect class="panel" x="22" y="592" width="1556" height="250" rx="12"/>
<text class="pt" x="42" y="622" text-anchor="start">③ HybridEP（moe_flex_dispatcher_backend=hybridep）</text>
<text class="su" x="42" y="642" text-anchor="start">dispatch_with_permute 直接返回 expert-major；与 NCCL-EP 一样不调用 MCore 二次 local permute，但这里由 HybridEP 融合通信与两级 permute。</text>
<rect class="ghost" x="42" y="662" width="230" height="112" rx="8"/>
<text class="tx" x="157" y="696.5" text-anchor="middle">router → MCore map</text>
<text class="sm" x="157" y="713.5" text-anchor="middle">同一 [2,H] / rank</text>
<text class="sm" x="157" y="730.5" text-anchor="middle">routing_map/probs</text>
<text class="sm" x="157" y="747.5" text-anchor="middle">逻辑 edge = 8</text>
<path class="cost" d="M 272 718 L 294 718"/>
<rect class="acc2" x="294" y="662" width="230" height="112" rx="8"/>
<text class="tx" x="409" y="696.5" text-anchor="middle">MCore ↔ HybridEP 边界</text>
<text class="sm" x="409" y="713.5" text-anchor="middle">dispatch_with_permute</text>
<text class="sm" x="409" y="730.5" text-anchor="middle">通信 + 两级 permute</text>
<text class="sm" x="409" y="747.5" text-anchor="middle">实现依赖未在 main 冻结</text>
<path class="main" d="M 524 718 L 546 718"/>
<rect class="acc1" x="546" y="662" width="230" height="112" rx="8"/>
<text class="tx" x="661" y="696.5" text-anchor="middle">直接 expert-major</text>
<text class="sm" x="661" y="713.5" text-anchor="middle">r0: e0/e1 各 2</text>
<text class="sm" x="661" y="730.5" text-anchor="middle">r1: e2/e3 各 2</text>
<text class="sm" x="661" y="747.5" text-anchor="middle">无需 MCore 二次 permute</text>
<path class="main" d="M 776 718 L 798 718"/>
<rect class="neutral" x="798" y="662" width="230" height="112" rx="8"/>
<text class="tx" x="913" y="696.5" text-anchor="middle">local expert MLP</text>
<text class="sm" x="913" y="713.5" text-anchor="middle">有效 edge 共 8</text>
<text class="sm" x="913" y="730.5" text-anchor="middle">rank 超预算：依赖内 drop</text>
<text class="sm" x="913" y="747.5" text-anchor="middle">handle flag → over_budget</text>
<path class="main" d="M 1028 718 L 1050 718"/>
<rect class="acc2" x="1050" y="662" width="506" height="112" rx="8"/>
<text class="tx" x="1303" y="679.5" text-anchor="middle">恢复 / overflow</text>
<text class="sm" x="1303" y="696.5" text-anchor="middle">handle 恢复 [2,H]</text>
<text class="sm" x="1303" y="713.5" text-anchor="middle">常规 PagedStashRunner：整步重跑</text>
<text class="sm" x="1303" y="730.5" text-anchor="middle">清 rank cap/stash → dropless</text>
<text class="sm" x="1303" y="747.5" text-anchor="middle">仅已捕获 TE whole-MoE 图</text>
<text class="sm" x="1303" y="764.5" text-anchor="middle">RuntimeError，禁止动态 fallback</text>
<text class="dim" x="42" y="803" text-anchor="start">Backward：先完成含 drop 的首轮 F/B 并汇总 over_budget；常规整步清梯度后 dropless 重跑，成功轮才定义最终梯度。</text>
<text class="sm" x="42" y="825" text-anchor="start">依赖边界：MCore 只证 wrapper、flag 与 rerun；DeepEP@af9a040 main 不含 HybridEPBuffer，不臆测其 hop。动态计数仍可能 DtoH。</text>
<rect class="panel" x="22" y="850" width="1556" height="250" rx="12"/>
<text class="pt" x="42" y="880" text-anchor="start">④ NCCL-EP（moe_flex_dispatcher_backend=ncclep）</text>
<text class="su" x="42" y="900" text-anchor="start">TE ep_dispatch 直接返回 expert-major packed buffer；同样不调用 MCore 二次 local permute，只做 valid narrow / capacity 恢复。</text>
<rect class="ghost" x="42" y="920" width="230" height="112" rx="8"/>
<text class="tx" x="157" y="954.5" text-anchor="middle">router → MCore top-k</text>
<text class="sm" x="157" y="971.5" text-anchor="middle">同一 [2,H] / rank</text>
<text class="sm" x="157" y="988.5" text-anchor="middle">indices/weights: [2,2]</text>
<text class="sm" x="157" y="1005.5" text-anchor="middle">逻辑 edge = 8</text>
<path class="cost" d="M 272 976 L 294 976"/>
<rect class="acc2" x="294" y="920" width="230" height="112" rx="8"/>
<text class="tx" x="409" y="954.5" text-anchor="middle">MCore ↔ TE 边界</text>
<text class="sm" x="409" y="971.5" text-anchor="middle">ep_dispatch(buffer,…)</text>
<text class="sm" x="409" y="988.5" text-anchor="middle">collective bootstrap + barrier</text>
<text class="sm" x="409" y="1005.5" text-anchor="middle">TE 实现未纳入冻结源</text>
<path class="main" d="M 524 976 L 546 976"/>
<rect class="acc1" x="546" y="920" width="230" height="112" rx="8"/>
<text class="tx" x="661" y="954.5" text-anchor="middle">直接 expert-major</text>
<text class="sm" x="661" y="971.5" text-anchor="middle">不调用 MCore 二次 local permute</text>
<text class="sm" x="661" y="988.5" text-anchor="middle">有效段每 expert = 2</text>
<text class="sm" x="661" y="1005.5" text-anchor="middle">dynamic narrow / static slack</text>
<path class="main" d="M 776 976 L 798 976"/>
<rect class="neutral" x="798" y="920" width="230" height="112" rx="8"/>
<text class="tx" x="913" y="954.5" text-anchor="middle">local fused MLP 消费 p</text>
<text class="sm" x="913" y="971.5" text-anchor="middle">dynamic: 本 rank 4 edge</text>
<text class="sm" x="913" y="988.5" text-anchor="middle">static: 固定 capacity view</text>
<text class="sm" x="913" y="1005.5" text-anchor="middle">输出已加权再扩回 buffer</text>
<path class="main" d="M 1028 976 L 1050 976"/>
<rect class="acc2" x="1050" y="920" width="506" height="112" rx="8"/>
<text class="tx" x="1303" y="937.5" text-anchor="middle">combine / 账本</text>
<text class="sm" x="1303" y="954.5" text-anchor="middle">ep_combine(buffer,…) → [2,H]</text>
<text class="sm" x="1303" y="971.5" text-anchor="middle">动态 count 有 DtoH .item()</text>
<text class="sm" x="1303" y="988.5" text-anchor="middle">token ceiling 按 64 对齐</text>
<text class="sm" x="1303" y="1005.5" text-anchor="middle">budget 再按 expert alignment</text>
<text class="sm" x="1303" y="1022.5" text-anchor="middle">每轮 fresh EpBuffer</text>
<text class="dim" x="42" y="1061" text-anchor="start">Backward：MCore 保留 TE autograd 边界；梯度必须由 ep_combine 回 expert、ep_dispatch 回 origin，但未冻结 TE 源，内部 transpose 不作实现断言。</text>
<text class="sm" x="42" y="1083" text-anchor="start">依赖边界：static 需 SM100+、TE fused grouped-MLP/op-fuser 与环境开关；symmetric-memory 仍 NotImplemented；rank capacity overflow 是硬失败。</text>
<rect class="neutral" x="22" y="1116" width="1556" height="92" rx="10"/>
<text class="dim" x="42" y="1144" text-anchor="start">共同不变量：T_global=4、T_local=2/rank；local router [2,4] → dispatch → expert-major → 加权 MLP → combine → origin [2,H]。</text>
<text class="cap" x="42" y="1167" text-anchor="start">capacity 同例：f=.5 → C=1/丢 0 真边；f=1.5 + pad → C=2，A2A 后每本地 expert 4=2 真+2 零 slots。</text>
<text class="cap" x="42" y="1190" text-anchor="start">HybridEP 超预算是 drop+over_budget+常规 dropless rerun；NCCL-EP 依赖侧 hard trap。蓝=依赖，橙=通信/同步/资源。</text>
</svg>
