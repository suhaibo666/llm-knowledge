<text class="tx" x="844" y="602" text-anchor="start">对照：完整词表 KL = 0.2729，无 ghost 的稀疏和 = 0.3254</text>
<text class="costtx" x="844" y="622" text-anchor="start">ghost 保住尾部总质量 0.1585，丢掉尾部形状：差 0.0417</text>
