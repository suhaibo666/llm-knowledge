<text class="pt" x="40" y="686" text-anchor="start">C · 字节账（每 token 原始 payload，不计 tar / zstd）：V = 131,072（2^17 上限），K = 64，值 2 B</text>
<rect class="ghost" x="40" y="698" width="300" height="64" rx="8"/>
<text class="tx" x="52" y="719" text-anchor="start">被否掉：稠密 logits</text>
<path class="edge" d="M 52 727 L 328 727"/>
<text class="sm" x="52" y="745" text-anchor="start">V × 2 B = 262,144 B / token</text>
<rect class="ghost" x="352" y="698" width="320" height="64" rx="8"/>
<text class="tx" x="364" y="719" text-anchor="start">被否掉：top-K + int32 索引</text>
<path class="edge" d="M 364 727 L 660 727"/>
<text class="sm" x="364" y="745" text-anchor="start">K × (2 + 4) = 384 B / token</text>
<rect class="acc1" x="684" y="698" width="548" height="64" rx="8"/>
<text class="tx" x="696" y="719" text-anchor="start">现行：top-K + uint16 低位 + bool 第 17 位</text>
<path class="edge" d="M 696 727 L 1220 727"/>
<text class="dim" x="696" y="745" text-anchor="start">K × (2 + 2 + 1) = 320 B / token；对稠密 819.2×，对 int32 合计省 16.7%</text>
