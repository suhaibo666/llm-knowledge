<text class="ti" x="28" y="32" text-anchor="start">图 2 · 存的是跨 TP 的全局 top-K，算的是 TP 感知的稀疏 KL</text>
<text class="su" x="28" y="52" text-anchor="start">算例 B：V = 16，TP = 2（每 shard 8 个词），K = 4，一个 token；教师 / 学生 logits 脚本写死，其余数字由复刻的 _process_single_microbatch、pack_indices、topk_kl_div 算出</text>
<rect class="panel" x="28" y="68" width="1216" height="262" rx="10"/>
<text class="pt" x="40" y="90" text-anchor="start">A · producer（教师）：局部 top-K → 跨 TP 的 logsumexp → gather 到 tp0 取全局 top-K → 17 位打包</text>
<text class="sm" x="40" y="108" text-anchor="start">局部 top-K 在 fp32 logit 上选；global_lse = max_lse + log Σ exp(lse_r − max_lse)（MAX 再 SUM 两次 all_reduce）；logprob = logit − global_lse，只算 top-K 位置</text>
