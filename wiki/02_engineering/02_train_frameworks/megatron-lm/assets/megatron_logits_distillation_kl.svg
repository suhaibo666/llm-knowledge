<text class="sm" x="732" y="420" text-anchor="start">offset = 8·0 = 0；命中 idx [1, 3]</text>
<text class="sm" x="732" y="436" text-anchor="start">gather 命中的 log p_S：-1.655, -2.655</text>
<text class="sm" x="732" y="452" text-anchor="start">未命中 → clamp 后 gather，再被 mask 置 0</text>
<text class="sm" x="982" y="420" text-anchor="start">Σ p_S(hit) = 0.2615 → TP SUM 0.7128</text>
<text class="sm" x="982" y="436" text-anchor="start">ghost 项 = -0.0942（只 tp0 计入）</text>
<text class="dim" x="982" y="452" text-anchor="start">贡献_0 = 0.2697</text>
