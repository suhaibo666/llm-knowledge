<text class="sm" x="40" y="318" text-anchor="start">values 转 save_dtype（默认 fp16）后连同两条带经 torch.save 进 _pending_writes[iteration]；V ≤ 2^17 由 assert 守住</text>
<rect class="panel" x="28" y="346" width="1216" height="302" rx="10"/>
<text class="pt" x="40" y="368" text-anchor="start">B · consumer（学生）：核内跨 TP 归一化 + 本 shard 的稀疏贡献，wrapper 做 TP 求和与 α 加权</text>
<text class="sm" x="40" y="386" text-anchor="start">两次 all_reduce：logits_max 取 MAX（detach，只为数值稳定）、sum_exp 取 SUM（dist_nn，可微）；ghost 残差的 Σ p_S(hit) 再 SUM 一次</text>
<text class="rank" x="40" y="428" text-anchor="start">tp0</text>
