<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1030" viewBox="0 0 1180 1030" role="img"><title>同一交叉熵目标：保存完整概率，或保存统计量再重算</title><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#233044;font-size:17px}.title{font-size:25px;font-weight:700}.label{font-weight:700}.small{font-size:15px}.neutral{fill:#fff;stroke:#cbd5e1}.ghost{fill:#f8fafc;stroke:#e2e8f0}.acc1{fill:#eff6ff;stroke:#60a5fa}.acc2{fill:#fff7ed;stroke:#fb923c}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="25" y="38" class="title">从完整概率留存，到分块重建</text><text x="25" y="69" class="">X₀=(1,0), X₁=(0,1)；Wⱼ=(ln(j+1),ln(8−j))；标签 y=(6,1)</text><text x="25" y="96" class="small">数学例子：N=2, d=2, V=8；橙格是标签项。实际 GPU 形状须满足对齐条件。</text><text x="25" y="139" class="">exp(Z₀)</text><rect x="145" y="116" width="53" height="32" rx="5" class="neutral"/><text x="153" y="138" class="">1</text><rect x="202" y="116" width="53" height="32" rx="5" class="neutral"/><text x="210" y="138" class="">2</text><rect x="259" y="116" width="53" height="32" rx="5" class="neutral"/><text x="267" y="138" class="">3</text><rect x="316" y="116" width="53" height="32" rx="5" class="neutral"/><text x="324" y="138" class="">4</text><rect x="373" y="116" width="53" height="32" rx="5" class="neutral"/><text x="381" y="138" class="">5</text><rect x="430" y="116" width="53" height="32" rx="5" class="neutral"/><text x="438" y="138" class="">6</text><rect x="487" y="116" width="53" height="32" rx="5" class="acc2"/><text x="495" y="138" class="">7</text><rect x="544" y="116" width="53" height="32" rx="5" class="neutral"/><text x="552" y="138" class="">8</text><text x="25" y="181" class="">exp(Z₁)</text><rect x="145" y="158" width="53" height="32" rx="5" class="neutral"/><text x="153" y="180" class="">8</text><rect x="202" y="158" width="53" height="32" rx="5" class="acc2"/><text x="210" y="180" class="">7</text><rect x="259" y="158" width="53" height="32" rx="5" class="neutral"/><text x="267" y="180" class="">6</text><rect x="316" y="158" width="53" height="32" rx="5" class="neutral"/><text x="324" y="180" class="">5</text><rect x="373" y="158" width="53" height="32" rx="5" class="neutral"/><text x="381" y="180" class="">4</text><rect x="430" y="158" width="53" height="32" rx="5" class="neutral"/><text x="438" y="180" class="">3</text><rect x="487" y="158" width="53" height="32" rx="5" class="neutral"/><text x="495" y="180" class="">2</text><rect x="544" y="158" width="53" height="32" rx="5" class="neutral"/><text x="552" y="180" class="">1</text><path d="M670 151 L724 151" class="arrow"/><rect x="745" y="110" width="408" height="94" rx="5" class="acc1"/><text x="761" y="139" class="">每行 Σexp(Z)=36；目标 exp(Zᵧ)=7</text><text x="761" y="170" class="">loss = ln(36/7) = 1.637609</text><rect x="25" y="230" width="1128" height="81" rx="5" class="neutral"/><text x="40" y="255" class="label">普通 CE · TP=2</text><text x="240" y="255" class="">XWᵀ → 每卡 Z[2,4]</text><text x="670" y="255" class="small">MAX[2] → SUM[2] → SUM[2]</text><text x="240" y="288" class="">保留 P[2,4] FP32 → dZ；输出层求本地 dW、归约 dX</text><rect x="25" y="323" width="1128" height="81" rx="5" class="neutral"/><text x="40" y="348" class="label">native · TP=2</text><text x="240" y="348" class="">XWᵀ → 每卡 Z[2,4]</text><text x="670" y="348" class="small">MAX[2] → SUM[4]（目标项＋指数和）</text><text x="240" y="381" class="">保留 P[2,4] FP32 → BF16 dZ；输出层求本地 dW、归约 dX</text><rect x="25" y="416" width="1128" height="81" rx="5" class="ghost"/><text x="40" y="441" class="label">te · TP=2</text><text x="240" y="441" class="">XWᵀ → 每卡 Z[2,4]</text><text x="670" y="441" class="small">TE CE(logits, labels, TP group) → loss</text><text x="240" y="474" class="">依赖 autograd → dZ → dX / dW；内部未核验</text><text x="40" y="525" class="small">TE：训练入口禁用；图中的 loss 表示目标契约，不是运行验证。</text><rect x="25" y="546" width="1128" height="282" rx="5" class="acc1"/><text x="40" y="575" class="label">linear 前向 · 无 TP：每两列一块，只写块统计量</text><rect x="45" y="594" width="198" height="86" rx="5" class="neutral"/><text x="55" y="619" class="">词表 0–1</text><text x="55" y="645" class="">m=ln2, a=1.500</text><text x="55" y="670" class="small">指数和=3</text><rect x="260" y="594" width="198" height="86" rx="5" class="neutral"/><text x="270" y="619" class="">词表 2–3</text><text x="270" y="645" class="">m=ln4, a=1.750</text><text x="270" y="670" class="small">指数和=7</text><rect x="475" y="594" width="198" height="86" rx="5" class="neutral"/><text x="485" y="619" class="">词表 4–5</text><text x="485" y="645" class="">m=ln6, a=1.833</text><text x="485" y="670" class="small">指数和=11</text><rect x="690" y="594" width="198" height="86" rx="5" class="neutral"/><text x="700" y="619" class="">词表 6–7</text><text x="700" y="645" class="">m=ln8, a=1.875</text><text x="700" y="670" class="small">指数和=15</text><text x="934" y="622" class="">同样处理 X₁</text><text x="934" y="650" class="small">得到逆序块</text><path d="M450 688 L450 715" class="arrow"/><text x="40" y="748" class="">合并：m=ln8，a=4.5；q=ln7 → 两份 loss=1.637609</text><text x="40" y="783" class="label">ctx：X、W、y、m、a、有效数；完整 Z / P 不保留</text><text x="40" y="812" class="small">合并不变量：exp(m′)·a′ = exp(m₁)·a₁ + exp(m₂)·a₂</text><rect x="25" y="846" width="1128" height="161" rx="5" class="acc2"/><text x="40" y="875" class="label">linear 反向 · sum 目标：重算 Z 块 → P 块 → D 块 → 立即求梯度</text><text x="40" y="916" class="">D₀ =</text><rect x="115" y="893" width="53" height="32" rx="5" class="neutral"/><text x="123" y="915" class="">1</text><rect x="172" y="893" width="53" height="32" rx="5" class="neutral"/><text x="180" y="915" class="">2</text><rect x="229" y="893" width="53" height="32" rx="5" class="neutral"/><text x="237" y="915" class="">3</text><rect x="286" y="893" width="53" height="32" rx="5" class="neutral"/><text x="294" y="915" class="">4</text><rect x="343" y="893" width="53" height="32" rx="5" class="neutral"/><text x="351" y="915" class="">5</text><rect x="400" y="893" width="53" height="32" rx="5" class="neutral"/><text x="408" y="915" class="">6</text><rect x="457" y="893" width="53" height="32" rx="5" class="neutral"/><text x="465" y="915" class="">-29</text><rect x="514" y="893" width="53" height="32" rx="5" class="neutral"/><text x="522" y="915" class="">8</text><text x="575" y="916" class="">/ 36</text><text x="678" y="918" class="">每块 dX += DₖWₖ；dWₖ = DₖᵀX</text><text x="40" y="953" class="">D₁ = (8, -29, 6, 5, 4, 3, 2, 1) / 36</text><text x="40" y="984" class="small">支付：HBM 中的 D 块 + FP32 dX/ΔX；输出头矩阵乘 3 遍 → 4 遍</text></svg>