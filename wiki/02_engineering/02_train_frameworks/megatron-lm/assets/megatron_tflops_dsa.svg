<text class="ti" x="28" y="32" text-anchor="start">图 3　DSA：稀疏 core 的缩放在长度加权均值处求值；indexer 的打分仍是 L²，只是系数小</text>
<text class="su" x="28" y="52" text-anchor="start">top-k=256；本例 L̄ = ΣLᵢ²/ΣLᵢ = 1,064,960/1,920 = 554.67；MLA q_lora=128 kv_lora=64 qk=48 rope=16 v=64；indexer 4 头 × 32</text>
<rect class="panel" x="70" y="100" width="430" height="240" rx="4"/>
<path class="refline" d="M 70 280 L 500 280"/>
<text class="sm" x="64" y="284" text-anchor="end">0.25</text>
