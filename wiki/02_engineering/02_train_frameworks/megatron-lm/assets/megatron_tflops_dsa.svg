<text class="sm" x="64" y="164" text-anchor="end">0.75</text>
<path class="refline" d="M 70 100 L 500 100"/>
<text class="sm" x="64" y="104" text-anchor="end">1</text>
<path class="gl" d="M 70 340 L 70 345"/>
