<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1480 1040" width="100%" role="img" aria-label="Megatron TP 从 token 到 loss 再到 embedding 梯度的完整训练闭环">
<style>
  text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .card{fill:#fff;stroke:#E4E7EC;stroke-width:1.2}
  .panel{fill:#FBFCFE;stroke:#D9DEE7;stroke-width:1.2}
  .neutral{fill:#fff;stroke:#AEB6C2;stroke-width:1.2}
  .ghost{fill:#F5F7FA;stroke:#D9DEE7;stroke-width:1.1}
  .acc1{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.5}
  .acc2{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.5}
  .main{fill:none;stroke:#2563EB;stroke-width:2;marker-end:url(#arrowMain)}
  .aux{fill:none;stroke:#AEB6C2;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arrowAux)}
  .cost{fill:none;stroke:#C3651F;stroke-width:2;marker-end:url(#arrowCost)}
  .ti{font-size:18px;font-weight:700;fill:#1F2430}
  .su{font-size:11.5px;fill:#747C88}
  .pt{font-size:14px;font-weight:700;fill:#2A313B}
  .tx{font-size:12px;fill:#38414D}
  .sm{font-size:10.5px;fill:#68717D}
  .dim{font-size:10.5px;font-weight:600;fill:#173F87}
  .costtx{font-size:10.5px;font-weight:600;fill:#8A4A11}
  .rank{font-size:11px;font-weight:700;fill:#5B6470}
  .cap{font-size:11px;fill:#747C88}
  .cell0{fill:#DCE9FB;stroke:#fff;stroke-width:.8}
  .cell1{fill:#9CC2F3;stroke:#fff;stroke-width:.8}
</style>
  <defs>
    <marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker>
    <marker id="arrowAux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AEB6C2"/></marker>
    <marker id="arrowCost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C3651F"/></marker>
  </defs>
<rect class="card" x="0.5" y="0.5" width="1479" height="1039" rx="14"/>
<text class="ti" x="28" y="36" text-anchor="start">TP 在 dense GPT 训练中的前向、Loss 与反向闭环</text>
<text class="su" x="28" y="57" text-anchor="start">非 SP · MHA 基准 · tp=2 · heads/rank = 2 · FFN/rank = 8 · vocab/rank = 8</text>
<rect class="panel" x="20" y="86" width="1440" height="164" rx="12"/>
<text class="pt" x="40" y="116" text-anchor="start">① 训练前向：token 到逐 token loss</text>
<rect class="ghost" x="42" y="146" width="120" height="76" rx="8"/>
<text class="tx" x="102" y="180" text-anchor="middle">token ids</text>
<text class="sm" x="102" y="196" text-anchor="middle">每 rank 相同</text>
<rect class="acc1" x="186" y="146" width="190" height="76" rx="8"/>
<text class="tx" x="281" y="172" text-anchor="middle">VocabParallelEmbedding</text>
<text class="sm" x="281" y="188" text-anchor="middle">vocab rows 16→8/rank</text>
<text class="sm" x="281" y="204" text-anchor="middle">lookup 后 AR</text>
<rect class="neutral" x="400" y="146" width="178" height="76" rx="8"/>
<text class="tx" x="489" y="180" text-anchor="middle">Transformer ×L</text>
<text class="sm" x="489" y="196" text-anchor="middle">下方展开单层</text>
<rect class="acc1" x="602" y="146" width="150" height="76" rx="8"/>
<text class="tx" x="677" y="180" text-anchor="middle">LM head</text>
<text class="sm" x="677" y="196" text-anchor="middle">Column Parallel</text>
<rect class="acc1" x="776" y="146" width="144" height="76" rx="8"/>
<text class="tx" x="848" y="180" text-anchor="middle">分片 logits</text>
<text class="sm" x="848" y="196" text-anchor="middle">N×8/rank</text>
<rect class="acc2" x="944" y="146" width="228" height="76" rx="8"/>
<text class="tx" x="1058" y="172" text-anchor="middle">VocabParallelCE</text>
<text class="sm" x="1058" y="188" text-anchor="middle">MAX AR + 2×SUM AR</text>
<text class="sm" x="1058" y="204" text-anchor="middle">不聚合 N×V logits</text>
<rect class="neutral" x="1196" y="146" width="210" height="76" rx="8"/>
<text class="tx" x="1301" y="172" text-anchor="middle">逐 token loss</text>
<text class="sm" x="1301" y="188" text-anchor="middle">N 个标量</text>
<text class="sm" x="1301" y="204" text-anchor="middle">各 TP rank 等价</text>
<path class="main" d="M 162 184 L 186 184"/>
<path class="main" d="M 376 184 L 400 184"/>
<path class="main" d="M 578 184 L 602 184"/>
<path class="main" d="M 752 184 L 776 184"/>
<path class="main" d="M 920 184 L 944 184"/>
<path class="main" d="M 1172 184 L 1196 184"/>
<rect class="panel" x="20" y="274" width="1440" height="300" rx="12"/>
<text class="pt" x="40" y="304" text-anchor="start">② Transformer layer 前向展开：两个 Column→local→Row 闭合区</text>
<text class="rank" x="48" y="365" text-anchor="start">Attention</text>
<rect class="neutral" x="136" y="330" width="178" height="70" rx="8"/>
<text class="tx" x="225" y="361" text-anchor="middle">Input LayerNorm</text>
<text class="sm" x="225" y="377" text-anchor="middle">完整 H，逐 token</text>
<rect class="acc1" x="338" y="330" width="178" height="70" rx="8"/>
<text class="tx" x="427" y="361" text-anchor="middle">linear_qkv</text>
<text class="sm" x="427" y="377" text-anchor="middle">Column Parallel</text>
<rect class="neutral" x="540" y="330" width="178" height="70" rx="8"/>
<text class="tx" x="629" y="361" text-anchor="middle">Core Attention</text>
<text class="sm" x="629" y="377" text-anchor="middle">2 heads/rank</text>
<rect class="acc1" x="742" y="330" width="178" height="70" rx="8"/>
<text class="tx" x="831" y="361" text-anchor="middle">linear_proj</text>
<text class="sm" x="831" y="377" text-anchor="middle">Row Parallel</text>
<rect class="acc2" x="944" y="330" width="178" height="70" rx="8"/>
<text class="tx" x="1033" y="361" text-anchor="middle">all-reduce</text>
<text class="sm" x="1033" y="377" text-anchor="middle">N×H partial sum</text>
<rect class="neutral" x="1146" y="330" width="220" height="70" rx="8"/>
<text class="tx" x="1256" y="361" text-anchor="middle">BDA + residual</text>
<text class="sm" x="1256" y="377" text-anchor="middle">N×H replicated</text>
<path class="main" d="M 314 365 L 338 365"/>
<path class="main" d="M 516 365 L 540 365"/>
<path class="main" d="M 718 365 L 742 365"/>
<path class="main" d="M 920 365 L 944 365"/>
<path class="main" d="M 1122 365 L 1146 365"/>
<text class="rank" x="48" y="477" text-anchor="start">MLP</text>
<rect class="neutral" x="136" y="442" width="178" height="70" rx="8"/>
<text class="tx" x="225" y="473" text-anchor="middle">Pre-MLP Norm</text>
<text class="sm" x="225" y="489" text-anchor="middle">完整 H，逐 token</text>
<rect class="acc1" x="338" y="442" width="178" height="70" rx="8"/>
<text class="tx" x="427" y="465" text-anchor="middle">linear_fc1</text>
<text class="sm" x="427" y="481" text-anchor="middle">GeLU preact/rank = 8</text>
<text class="sm" x="427" y="497" text-anchor="middle">SwiGLU preact/rank = 16</text>
<rect class="neutral" x="540" y="442" width="178" height="70" rx="8"/>
<text class="tx" x="629" y="473" text-anchor="middle">GeLU / SwiGLU</text>
<text class="sm" x="629" y="489" text-anchor="middle">activation/rank = 8</text>
<rect class="acc1" x="742" y="442" width="178" height="70" rx="8"/>
<text class="tx" x="831" y="473" text-anchor="middle">linear_fc2</text>
<text class="sm" x="831" y="489" text-anchor="middle">Row Parallel</text>
<rect class="acc2" x="944" y="442" width="178" height="70" rx="8"/>
<text class="tx" x="1033" y="473" text-anchor="middle">all-reduce</text>
<text class="sm" x="1033" y="489" text-anchor="middle">N×H partial sum</text>
<rect class="neutral" x="1146" y="442" width="220" height="70" rx="8"/>
<text class="tx" x="1256" y="473" text-anchor="middle">BDA + residual</text>
<text class="sm" x="1256" y="489" text-anchor="middle">N×H replicated</text>
<path class="main" d="M 314 477 L 338 477"/>
<path class="main" d="M 516 477 L 540 477"/>
<path class="main" d="M 718 477 L 742 477"/>
<path class="main" d="M 920 477 L 944 477"/>
<path class="main" d="M 1122 477 L 1146 477"/>
<rect class="ghost" x="1120" y="520" width="286" height="42" rx="8"/>
<text class="tx" x="1263" y="529" text-anchor="middle">通信账</text>
<text class="sm" x="1263" y="545" text-anchor="middle">朴素 TP：每层前向 2 次规约</text>
<text class="sm" x="1263" y="561" text-anchor="middle">反向 2 次 Column dgrad AR</text>
<rect class="panel" x="20" y="598" width="1440" height="192" rx="12"/>
<text class="pt" x="40" y="628" text-anchor="start">③ 训练反向：loss 梯度右向左返回参数分片</text>
<rect class="acc1" x="42" y="660" width="190" height="88" rx="8"/>
<text class="tx" x="137" y="692" text-anchor="middle">Embedding wgrad local</text>
<text class="sm" x="137" y="708" text-anchor="middle">只更新命中的 vocab rows</text>
<text class="sm" x="137" y="724" text-anchor="middle">前向 AR 的 backward 为 identity</text>
<rect class="neutral" x="266" y="660" width="220" height="88" rx="8"/>
<text class="tx" x="376" y="692" text-anchor="middle">Transformer backward</text>
<text class="sm" x="376" y="708" text-anchor="middle">每层 qkv/fc1 dgrad AR</text>
<text class="sm" x="376" y="724" text-anchor="middle">Row dgrad 保持分片</text>
<rect class="acc2" x="520" y="660" width="190" height="88" rx="8"/>
<text class="tx" x="615" y="692" text-anchor="middle">LM head dgrad AR</text>
<text class="sm" x="615" y="708" text-anchor="middle">求和各 vocab shard</text>
<text class="sm" x="615" y="724" text-anchor="middle">本地计算 weight grad</text>
<rect class="acc1" x="744" y="660" width="178" height="88" rx="8"/>
<text class="tx" x="833" y="692" text-anchor="middle">sharded logits grad</text>
<text class="sm" x="833" y="708" text-anchor="middle">N×8/rank</text>
<text class="sm" x="833" y="724" text-anchor="middle">不聚合全词表</text>
<rect class="neutral" x="956" y="660" width="230" height="88" rx="8"/>
<text class="tx" x="1071" y="692" text-anchor="middle">CE backward：local logits grad</text>
<text class="sm" x="1071" y="708" text-anchor="middle">softmax shard 减 owner target</text>
<text class="sm" x="1071" y="724" text-anchor="middle">无额外 TP collective</text>
<rect class="ghost" x="1220" y="660" width="186" height="88" rx="8"/>
<text class="tx" x="1313" y="692" text-anchor="middle">loss grad</text>
<text class="sm" x="1313" y="708" text-anchor="middle">N 个上游标量</text>
<text class="sm" x="1313" y="724" text-anchor="middle">每 rank 同形</text>
<path class="main" d="M 266 704 L 232 704"/>
<path class="main" d="M 520 704 L 486 704"/>
<path class="main" d="M 744 704 L 710 704"/>
<path class="main" d="M 956 704 L 922 704"/>
<path class="main" d="M 1220 704 L 1186 704"/>
<rect class="panel" x="20" y="814" width="1440" height="154" rx="12"/>
<text class="pt" x="40" y="844" text-anchor="start">④ 词表边界的选择与代价</text>
<rect class="neutral" x="48" y="866" width="416" height="82" rx="8"/>
<text class="tx" x="256" y="895" text-anchor="middle">Embedding 沿 vocab rows 切</text>
<text class="sm" x="256" y="911" text-anchor="middle">避免每 rank 保存整表</text>
<text class="sm" x="256" y="927" text-anchor="middle">代价：forward 1 AR，或 SP 下 1 RS</text>
<rect class="neutral" x="532" y="866" width="416" height="82" rx="8"/>
<text class="tx" x="740" y="895" text-anchor="middle">LM head 沿 vocab outputs 切</text>
<text class="sm" x="740" y="911" text-anchor="middle">避免生成/聚合 N×V logits</text>
<text class="sm" x="740" y="927" text-anchor="middle">代价：backward hidden dgrad 1 AR</text>
<rect class="acc2" x="1016" y="866" width="416" height="82" rx="8"/>
<text class="tx" x="1224" y="895" text-anchor="middle">CE 直接消费 vocab shards</text>
<text class="sm" x="1224" y="911" text-anchor="middle">只恢复 max、target logit、exp sum</text>
<text class="sm" x="1224" y="927" text-anchor="middle">代价：forward 3 次 N-元素规约</text>
<text class="cap" x="28" y="1004" text-anchor="start">蓝色：本地分片计算；橙色：TP collective。图画逻辑边界；linear+CE 融合路径可不显式 materialize 分片 logits。</text>
<text class="cap" x="28" y="1024" text-anchor="start">基准路径中，Attention/MLP 的 Row 前向 AR 与 Column 反向 dgrad AR 构成每层 2+2 次规约。</text>
</svg>
