<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1012" width="100%" role="img" aria-label="GPTDataset 三级索引把一个下标翻译成跨文档 token 切片，并把 S 加 1 的缓冲区变成 tokens 与 labels 两个重叠视图">
<style>
  text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .card{fill:#fff;stroke:#E4E7EC;stroke-width:1.2}
  .panel{fill:#FBFCFE;stroke:#D9DEE7;stroke-width:1.2}
  .neutral{fill:#fff;stroke:#AEB6C2;stroke-width:1.2}
  .ghost{fill:#F5F7FA;stroke:#D9DEE7;stroke-width:1.1}
  .acc1{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.5}
  .acc2{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.5}
  .zoom{fill:#FBFCFE;stroke:#AEB6C2;stroke-width:1.2;stroke-dasharray:4 3}
  .main{fill:none;stroke:#2563EB;stroke-width:2;marker-end:url(#arrowMain)}
  .aux{fill:none;stroke:#AEB6C2;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arrowAux)}
  .cost{fill:none;stroke:#C3651F;stroke-width:2;marker-end:url(#arrowCost)}
  .cut{fill:none;stroke:#2563EB;stroke-width:2}
  .cutcost{fill:none;stroke:#C3651F;stroke-width:1.6;stroke-dasharray:4 3}
  .lead{fill:none;stroke:#AEB6C2;stroke-width:1.1}
  .ti{font-size:18px;font-weight:700;fill:#1F2430}
  .su{font-size:11.5px;fill:#747C88}
  .pt{font-size:14px;font-weight:700;fill:#2A313B}
  .tx{font-size:12px;fill:#38414D}
  .sm{font-size:10.5px;fill:#68717D}
  .dim{font-size:10.5px;font-weight:600;fill:#173F87}
  .costtx{font-size:10.5px;font-weight:600;fill:#8A4A11}
  .rank{font-size:11px;font-weight:700;fill:#5B6470}
  .cap{font-size:11px;fill:#747C88}
  .cell0{fill:#DCE9FB;stroke:#fff;stroke-width:.8}
  .cell1{fill:#9CC2F3;stroke:#fff;stroke-width:.8}
</style>
  <defs>
    <marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker>
    <marker id="arrowAux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AEB6C2"/></marker>
    <marker id="arrowCost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C3651F"/></marker>
  </defs>
<rect class="card" x="0.5" y="0.5" width="1399" height="1011" rx="14"/>
<text class="ti" x="28" y="36" text-anchor="start">三级索引：把一个下标翻译成一段跨文档的 token 切片</text>
<text class="su" x="28" y="57" text-anchor="start">S=1024 · ε=1 · sample_index[j]=(2, 300) · sample_index[j+1]=(5, 24) · 文档长度 740 / 260 / 300 / 880</text>
<rect class="panel" x="20" y="82" width="1360" height="150" rx="12"/>
<text class="pt" x="40" y="112" text-anchor="start">① 三次查表，没有扫描</text>
<rect class="neutral" x="48" y="132" width="208" height="74" rx="8"/>
<text class="tx" x="152" y="157" text-anchor="middle">shuffle_index[k]</text>
<text class="sm" x="152" y="173" text-anchor="middle">决定喂入顺序</text>
<text class="sm" x="152" y="189" text-anchor="middle">→ 得到 j</text>
<rect class="acc1" x="296" y="132" width="250" height="74" rx="8"/>
<text class="tx" x="421" y="157" text-anchor="middle">sample_index[j] = (2, 300)</text>
<text class="sm" x="421" y="173" text-anchor="middle">(进入 document_index 的下标 i,</text>
<text class="sm" x="421" y="189" text-anchor="middle">该文档内的 token 偏移 o)</text>
<rect class="acc1" x="586" y="132" width="250" height="74" rx="8"/>
<text class="tx" x="711" y="157" text-anchor="middle">sample_index[j+1] = (5, 24)</text>
<text class="sm" x="711" y="173" text-anchor="middle">下一条样本的起点</text>
<text class="sm" x="711" y="189" text-anchor="middle">两行正好夹住第 j 条样本</text>
<rect class="neutral" x="876" y="132" width="230" height="74" rx="8"/>
<text class="tx" x="991" y="157" text-anchor="middle">document_index[2..5]</text>
<text class="sm" x="991" y="173" text-anchor="middle">4 个文档号</text>
<text class="sm" x="991" y="189" text-anchor="middle">逐段 IndexedDataset.get</text>
<path class="main" d="M 256 169 L 296 169"/>
<path class="main" d="M 546 169 L 586 169"/>
<path class="main" d="M 836 169 L 876 169"/>
<path class="aux" d="M 1106 169 L 1130 169"/>
<rect class="zoom" x="1130" y="130" width="230" height="78" rx="10"/>
<text class="tx" x="1144" y="154" text-anchor="start">三跳全是查表</text>
<text class="sm" x="1144" y="173" text-anchor="start">不扫描 token 流 → O(1) 随机读</text>
<text class="sm" x="1144" y="192" text-anchor="start">索引建好即落盘，跨 rank 一致</text>
<rect class="panel" x="20" y="248" width="1360" height="300" rx="12"/>
<text class="pt" x="40" y="278" text-anchor="start">② 两条切口把连续 token 流切出一条样本</text>
<rect class="ghost" x="60" y="330" width="170.64" height="56" rx="4"/>
<rect class="acc1" x="230.64" y="330" width="250.28" height="56" rx="4"/>
<text class="sm" x="270.46" y="318" text-anchor="middle">document_index[2]</text>
<text class="sm" x="270.46" y="364" text-anchor="middle">740 token</text>
<rect class="acc1" x="480.92" y="330" width="147.89" height="56" rx="4"/>
<text class="sm" x="554.86" y="318" text-anchor="middle">document_index[3]</text>
<text class="sm" x="554.86" y="364" text-anchor="middle">260 token</text>
<path class="lead" d="M 480.92 324 L 480.92 392"/>
<rect class="acc1" x="628.81" y="330" width="170.64" height="56" rx="4"/>
<text class="sm" x="714.13" y="318" text-anchor="middle">document_index[4]</text>
<text class="sm" x="714.13" y="364" text-anchor="middle">300 token</text>
<path class="lead" d="M 628.81 324 L 628.81 392"/>
<rect class="acc1" x="799.45" y="330" width="13.65" height="56" rx="4"/>
<rect class="ghost" x="813.1" y="330" width="486.9" height="56" rx="4"/>
<text class="sm" x="1049.72" y="318" text-anchor="middle">document_index[5]</text>
<text class="sm" x="1049.72" y="364" text-anchor="middle">880 token</text>
<path class="lead" d="M 799.45 324 L 799.45 392"/>
<path class="cut" d="M 230.64 306 L 230.64 414"/>
<path class="cut" d="M 813.1 306 L 813.1 414"/>
<text class="dim" x="238.64" y="424" text-anchor="start">切口 1：sample_index[j] = (2, 300)</text>
<text class="dim" x="821.1" y="424" text-anchor="start">切口 2：sample_index[j+1] = (5, 24)</text>
<rect class="neutral" x="60" y="438" width="200" height="68" rx="8"/>
<text class="tx" x="160" y="460" text-anchor="middle">段 1</text>
<text class="sm" x="160" y="476" text-anchor="middle">document_index[2][300:740)</text>
<text class="sm" x="160" y="492" text-anchor="middle">440 token</text>
<rect class="neutral" x="276" y="438" width="200" height="68" rx="8"/>
<text class="tx" x="376" y="460" text-anchor="middle">段 2</text>
<text class="sm" x="376" y="476" text-anchor="middle">document_index[3][0:260)</text>
<text class="sm" x="376" y="492" text-anchor="middle">260 token</text>
<rect class="neutral" x="492" y="438" width="200" height="68" rx="8"/>
<text class="tx" x="592" y="460" text-anchor="middle">段 3</text>
<text class="sm" x="592" y="476" text-anchor="middle">document_index[4][0:300)</text>
<text class="sm" x="592" y="492" text-anchor="middle">300 token</text>
<rect class="neutral" x="708" y="438" width="200" height="68" rx="8"/>
<text class="tx" x="808" y="460" text-anchor="middle">段 4</text>
<text class="sm" x="808" y="476" text-anchor="middle">document_index[5][0:25)</text>
<text class="sm" x="808" y="492" text-anchor="middle">24+ε = 25 token</text>
<rect class="acc1" x="924" y="438" width="376" height="68" rx="8"/>
<text class="tx" x="1112" y="460" text-anchor="middle">Σ = 1025 = S+ε</text>
<text class="sm" x="1112" y="476" text-anchor="middle">numpy.concatenate → (1025,) int64</text>
<text class="sm" x="1112" y="492" text-anchor="middle">零拷贝只读视图 → 一次拷贝并加宽</text>
<text class="sm" x="40" y="522" text-anchor="start">文档是变长的，样本边界不认文档边界：document_index[2] 的前 300 个 token 属于样本 j−1，document_index[5] 的后 856 个属于样本 j+1。</text>
<text class="costtx" x="40" y="538" text-anchor="start">切口 2 同时是样本 j+1 的起点：样本 j 在这里多读 ε=1 个 token，因此相邻两条样本在扁平流上重叠恰好 1 个 token。</text>
<rect class="panel" x="20" y="568" width="1360" height="380" rx="12"/>
<text class="pt" x="40" y="598" text-anchor="start">③ 一块缓冲区，两个错开一格的视图</text>
<rect class="cell0" x="200" y="630" width="56" height="46"/>
<text class="sm" x="228" y="620" text-anchor="middle">0</text>
<rect class="cell1" x="256" y="630" width="56" height="46"/>
<text class="sm" x="284" y="620" text-anchor="middle">1</text>
<rect class="cell1" x="312" y="630" width="56" height="46"/>
<text class="sm" x="340" y="620" text-anchor="middle">2</text>
<rect class="cell1" x="368" y="630" width="56" height="46"/>
<text class="sm" x="396" y="620" text-anchor="middle">3</text>
<rect class="cell1" x="424" y="630" width="56" height="46"/>
<text class="sm" x="452" y="620" text-anchor="middle">4</text>
<rect class="cell1" x="564" y="630" width="56" height="46"/>
<text class="sm" x="592" y="620" text-anchor="middle">1020</text>
<rect class="cell1" x="620" y="630" width="56" height="46"/>
<text class="sm" x="648" y="620" text-anchor="middle">1021</text>
<rect class="cell1" x="676" y="630" width="56" height="46"/>
<text class="sm" x="704" y="620" text-anchor="middle">1022</text>
<rect class="cell1" x="732" y="630" width="56" height="46"/>
<text class="sm" x="760" y="620" text-anchor="middle">1023</text>
<rect class="acc2" x="788" y="630" width="56" height="46"/>
<text class="sm" x="816" y="620" text-anchor="middle">1024</text>
<text class="pt" x="522" y="659" text-anchor="middle">⋯</text>
<text class="tx" x="60" y="658" text-anchor="start">text</text>
<text class="dim" x="60" y="675" text-anchor="start">(1025,) int64</text>
<rect class="acc1" x="200" y="702" width="588" height="32" rx="6"/>
<text class="tx" x="494" y="723" text-anchor="middle">tokens = text[:-1]   (1024,)</text>
<rect class="acc1" x="256" y="746" width="588" height="32" rx="6"/>
<text class="tx" x="550" y="767" text-anchor="middle">labels = text[1:]   (1024,)</text>
<path class="cutcost" d="M 816 680 L 816 746"/>
<rect class="zoom" x="900" y="614" width="440" height="132" rx="10"/>
<text class="tx" x="914" y="646" text-anchor="start">一块缓冲区，两个视图</text>
<text class="sm" x="914" y="665" text-anchor="start">重叠区间 [1, 1024)：1023 个 token 共享同一段内存</text>
<text class="sm" x="914" y="684" text-anchor="start">.contiguous() 对一维 step-1 切片原样返回自身</text>
<text class="sm" x="914" y="703" text-anchor="start">tokens[tokens == pad] = 0 直接改这块缓冲区</text>
<text class="sm" x="914" y="722" text-anchor="start">（pad→0 幂等，所以重叠写入无害）</text>
<rect class="neutral" x="200" y="836" width="190" height="48" rx="8"/>
<text class="tx" x="295" y="856" text-anchor="middle">仅 tokens</text>
<text class="sm" x="295" y="872" text-anchor="middle">下标 0</text>
<rect class="acc1" x="406" y="836" width="250" height="48" rx="8"/>
<text class="tx" x="531" y="856" text-anchor="middle">两个视图共享</text>
<text class="sm" x="531" y="872" text-anchor="middle">下标 1 … 1023</text>
<rect class="acc2" x="672" y="836" width="210" height="48" rx="8"/>
<text class="tx" x="777" y="856" text-anchor="middle">仅 labels（ε）</text>
<text class="sm" x="777" y="872" text-anchor="middle">下标 1024</text>
<text class="sm" x="900" y="856" text-anchor="start">第 1024 个 token 同时是样本 j+1 的第 0 个：</text>
<text class="sm" x="900" y="874" text-anchor="start">sample_index[j+1] 指回 document_index[5] 偏移 24。</text>
<text class="cap" x="28" y="970" text-anchor="start">不变量：三索引复合成一次 O(1) 随机读——shuffle 定顺序、sample 定切口、document 定文档号，三跳之后才第一次碰 .bin。</text>
<text class="cap" x="28" y="990" text-anchor="start">相邻样本在扁平流上以 S=1024 为步长、S+ε=1025 为窗口，重叠恰好 ε=1 个 token；tokens 与 labels 是同一块缓冲区上错开一格的两个视图，不是两份拷贝。</text>
</svg>
