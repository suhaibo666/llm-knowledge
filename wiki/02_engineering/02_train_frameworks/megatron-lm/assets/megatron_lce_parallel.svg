<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1040" viewBox="0 0 1180 1040" role="img"><title>linear 的 DP TP SP 前反向所有权</title><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#233044;font-size:17px}.title{font-size:25px;font-weight:700}.label{font-weight:700}.small{font-size:15px}.neutral{fill:#fff;stroke:#cbd5e1}.ghost{fill:#f8fafc;stroke:#e2e8f0}.acc1{fill:#eff6ff;stroke:#60a5fa}.acc2{fill:#fff7ed;stroke:#fb923c}.arrow{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#a)}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="25" y="38" class="title">同一 loss，三种 hidden 所有权</text><text x="25" y="71" class="">N=2, d=2, V=8, C=2；W₀₋₃ 属 rank 0，W₄₋₇ 属 rank 1；标签 (6,1) 在 TP 内复制</text><rect x="25" y="92" width="1128" height="116" rx="5" class="ghost"/><text x="40" y="121" class="label">无 TP / 一个 DP 副本内部</text><text x="40" y="152" class="">X[2,2] + W[8,2] → 4 个词表块 → 合并统计 → 两份 loss</text><text x="40" y="186" class="">反向：4 块 D → dX[2,2]、dW[8,2]；本核无 DP collective（loss=1.637609）</text><text x="25" y="246" class="label">TP 前向：两卡有完整 X；先按块编号 MAX，再重标定本地指数和</text><rect x="25" y="264" width="546" height="201" rx="5" class="neutral"/><text x="40" y="293" class="label">rank 0：X₀、X₁；W 行 0–3</text><text x="40" y="328" class="">X0 的块 m：(ln2, ln4)</text><text x="40" y="352" class="small">块 a：(1.5, 1.75)</text><text x="40" y="373" class="">X1 的块 m：(ln8, ln6)</text><text x="40" y="397" class="small">块 a：(1.875, 1.833)</text><text x="40" y="447" class="small">先备份本地 m，才能用原缩放恢复指数和</text><rect x="607" y="264" width="546" height="201" rx="5" class="neutral"/><text x="622" y="293" class="label">rank 1：X₀、X₁；W 行 4–7</text><text x="622" y="328" class="">X0 的块 m：(ln6, ln8)</text><text x="622" y="352" class="small">块 a：(1.833, 1.875)</text><text x="622" y="373" class="">X1 的块 m：(ln4, ln2)</text><text x="622" y="397" class="small">块 a：(1.75, 1.5)</text><text x="622" y="447" class="small">先备份本地 m，才能用原缩放恢复指数和</text><path d="M297 473 L297 495" class="arrow"/><path d="M870 473 L870 495" class="arrow"/><rect x="25" y="508" width="1128" height="143" rx="5" class="acc1"/><text x="40" y="537" class="label">① MAX[2,2]：X₀ → (ln6, ln8)；X₁ → (ln8, ln6)</text><text x="40" y="571" class="">② 专用流 SUM 目标项[2]：rank 0=(0,ln7)，rank 1=(ln7,0)</text><text x="40" y="601" class="">③ 当前流 SUM 指数和[2]：rank 0=(1.25, 3.25)，rank 1=(3.25, 1.25)</text><text x="40" y="632" class="small">事件等待完成 → 每卡 (m=ln8,a=4.5,q=ln7) → loss=(1.637609, 1.637609)</text><rect x="25" y="672" width="1128" height="127" rx="5" class="acc2"/><text x="40" y="700" class="label">TP 反向：每卡收到相同 g=(1,1)，只计算本地词表的梯度</text><text x="40" y="732" class="">rank 0 的 dX₀=(0.284, 0.494)；rank 1 的 dX₀=(-0.583, -0.183)</text><text x="40" y="764" class="">SUM all-reduce FP32 dX[2,2] → dX₀=(-0.299, 0.311)；dW[4,2] 各留原 owner</text><rect x="25" y="820" width="1128" height="192" rx="5" class="neutral"/><text x="40" y="851" class="label">SP 在上述 TP 路径外，再增加聚合与切回</text><text x="40" y="889" class="">入口：rank 0 只有 X₀[1,2]</text><text x="630" y="889" class="">入口：rank 1 只有 X₁[1,2]</text><path d="M240 895 L240 909" class="arrow"/><path d="M845 895 L845 909" class="arrow"/><text x="395" y="890" class="small">all-gather → 两卡复制</text><text x="40" y="935" class="">两卡保存 global_hidden[2,2] → 执行上述三次前向归约与完整 dX all-reduce</text><text x="40" y="958" class="">反向归约后：rank 0 取 dX₀ 并 clone；rank 1 取 dX₁ 并 clone → 转回输入 dtype</text><text x="40" y="990" class="small">边界：源码是 all-reduce 后切片；SP 不把词表核限制为仅处理本地 token。</text></svg>