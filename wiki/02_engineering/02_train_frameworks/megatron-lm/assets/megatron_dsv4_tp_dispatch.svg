<rect class="neutral" x="836" y="434" width="408" height="102" rx="8"/>
<text class="tx" x="848" y="455" text-anchor="start">mHC 参数怎么算、怎么同步</text>
<path class="edge" d="M 848 463 L 1232 463"/>
<text class="sm" x="848" y="481" text-anchor="start">mapping_proj = nn.Linear(n·C → n²+2n)：n=4、C=512 → [24, 2048]</text>
<text class="sm" x="848" y="497" text-anchor="start">映射在 fp32 里算（权重 mark_keep_in_fp32），H 再转回激活 dtype</text>
<text class="dim" x="848" y="513" text-anchor="start">sequence_parallel 属性 → finalize_model_grads 按 TP group 求和</text>
<text class="sm" x="848" y="529" text-anchor="start">Sinkhorn 后端：Triton → cuTile → native；MHC_FORCE_BACKEND 强制</text>
