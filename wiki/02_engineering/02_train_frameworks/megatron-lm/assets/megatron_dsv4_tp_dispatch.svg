<rect class="acc1" x="655" y="244" width="152" height="38" rx="5"/>
<text class="dim" x="731" y="258" text-anchor="middle">A</text>
<text class="sm" x="731" y="273" text-anchor="middle">all → csa_sparse_attn</text>
<rect class="neutral" x="20" y="304" width="798" height="166" rx="8"/>
<text class="tx" x="32" y="325" text-anchor="start">读法</text>
<path class="edge" d="M 32 333 L 806 333"/>
<text class="sm" x="32" y="351" text-anchor="start">谓词：use_fused = attention_backend ≠ unfused ∧ dsa_kernel_backend ≠ none；has_indexer = ratio &gt; 1 ∧ n_comp &gt; 0 ∧ indexer 已建</text>
<text class="sm" x="32" y="367" text-anchor="start">indexer 只在 ratio == 4 ∧ ¬csa_dense_mode 时构建；compressor 只在 ratio &gt; 1 时构建（W 层两者都没有）</text>
<text class="dim" x="32" y="383" text-anchor="start">6 种路径：unfused·A、A、unfused·B、unfused·C、B、C；带 indexer loss 的格子 2 个（acc2）</text>
<text class="sm" x="32" y="399" text-anchor="start">Path B / C / A 的 kernel：FlashMLA 前向 + cuDNN DSA 反向；B 把 indexer 的 KL 反向提前到前向里算好</text>
<text class="costtx" x="32" y="415" text-anchor="start">attention_backend=unfused 时即使 dsa_kernel_backend=cudnn 也走 unfused·B（DSAIndexerLoss + torch）</text>
<text class="sm" x="32" y="431" text-anchor="start">H 层在 S &lt; 128 时 n_compressed = 0：S=64 的 cudnn·train 走 A（window → csa_sparse_attn）</text>
<text class="sm" x="32" y="447" text-anchor="start">THD 与 SBHD 的分派谓词相同，CP&gt;1 另走 _forward_thd_cp；fused compressor 的 gate 另见正文</text>
<rect class="panel" x="836" y="74" width="408" height="178" rx="8"/>
<text class="tx" x="848" y="94" text-anchor="start">Sinkhorn：softmax(行)+ε → 列归一 → (行归一, 列归一)×(k−1)</text>
