<text class="dim" x="573" y="126" text-anchor="middle">A</text>
<text class="sm" x="573" y="141" text-anchor="middle">window → csa_sparse_attn</text>
<rect class="acc1" x="655" y="112" width="152" height="38" rx="5"/>
<text class="dim" x="731" y="126" text-anchor="middle">A</text>
<text class="sm" x="731" y="141" text-anchor="middle">window → csa_sparse_attn</text>
<text class="tx" x="28" y="174" text-anchor="start">C（ratio 4）</text>
<rect class="acc2" x="181" y="156" width="152" height="38" rx="5"/>
<text class="costtx" x="257" y="170" text-anchor="middle">unfused·B</text>
<text class="sm" x="257" y="185" text-anchor="middle">DSAIndexerLoss + torch</text>
<rect class="ghost" x="339" y="156" width="152" height="38" rx="5"/>
<text class="sm" x="415" y="170" text-anchor="middle">unfused·C</text>
<text class="sm" x="415" y="185" text-anchor="middle">qk_topk_naive + torch</text>
<rect class="acc2" x="497" y="156" width="152" height="38" rx="5"/>
<text class="costtx" x="573" y="170" text-anchor="middle">B</text>
<text class="sm" x="573" y="185" text-anchor="middle">fused indexer + attn</text>
<rect class="acc1" x="655" y="156" width="152" height="38" rx="5"/>
<text class="dim" x="731" y="170" text-anchor="middle">C</text>
<text class="sm" x="731" y="185" text-anchor="middle">topk → csa_sparse_attn</text>
<text class="tx" x="28" y="218" text-anchor="start">C + csa_dense_mode</text>
<rect class="ghost" x="181" y="200" width="152" height="38" rx="5"/>
<text class="sm" x="257" y="214" text-anchor="middle">unfused·A</text>
<text class="sm" x="257" y="229" text-anchor="middle">all compressed + torch</text>
<rect class="ghost" x="339" y="200" width="152" height="38" rx="5"/>
