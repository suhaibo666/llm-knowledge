<text class="ti" x="28" y="32" text-anchor="start">图 3　同一层走哪条 kernel 路径，以及 mHC 映射几步就近似双随机</text>
<text class="su" x="28" y="52" text-anchor="start">左：CompressedSparseAttention.forward 的分派（S=4,096，attention_backend=fused）；右：hyper_connection.py::_sinkhorn_iterations 在 n=4 上的收敛（确定性 logits）</text>
<rect class="panel" x="20" y="74" width="798" height="210" rx="8"/>
<text class="rank" x="257" y="92" text-anchor="middle">unfused · train</text>
<text class="rank" x="415" y="92" text-anchor="middle">unfused · eval</text>
<text class="rank" x="573" y="92" text-anchor="middle">cudnn · train</text>
<text class="rank" x="731" y="92" text-anchor="middle">cudnn · eval</text>
<path class="edge" d="M 28 99 L 810 99"/>
<text class="tx" x="28" y="130" text-anchor="start">W（ratio 0）</text>
