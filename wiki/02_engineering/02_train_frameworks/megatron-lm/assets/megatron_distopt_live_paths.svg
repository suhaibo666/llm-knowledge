<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1660" width="100%" role="img" aria-label="同一组参数在 native DistributedOptimizer、Torch FSDP2、Megatron-FSDP 与 LayerWise 两种 layout 中的常驻所有权、梯度归属、更新交接与参数重建对照">
<style>
  text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .card{fill:#fff;stroke:#E4E7EC;stroke-width:1.2}
