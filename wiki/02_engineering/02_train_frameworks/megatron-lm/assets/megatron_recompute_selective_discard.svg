<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1224" role="img" aria-label="selective / output-discard：消费者反向读 storage 前必须恢复"><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#1f2937;font-size:16px}
.title{font-size:23px;font-weight:650}.subtitle{fill:#64748b;font-size:15px}
.cap{fill:#64748b;font-size:14px}.rowname{font-weight:650;font-size:16px}
.neutral{fill:#fff;stroke:#cbd5e1}.ghost{fill:#f8fafc;stroke:#e2e8f0}
.acc1{fill:#eff6ff;stroke:#2563eb}.acc2{fill:#fff7ed;stroke:#d97706}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#a)}
.aux{stroke:#94a3b8;stroke-width:1.2}.box{rx:7;stroke-width:1.2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><rect width="1240" height="1224" fill="#fff"/><text class="title" x="24" y="34">selective / output-discard：消费者反向读 storage 前必须恢复</text><text class="subtitle" x="24" y="61">microbatch A · X0[4,1,4] · t0…t3 · BF16 · TP=2 · SP off · t0…t3 身份始终不变</text><text class="rowname" x="198" y="99">保存输入 → producer</text><text class="rowname" x="455" y="99">consumer 完成后 discard</text><text class="rowname" x="712" y="99">consumer-grad trigger → replay</text><text class="rowname" x="969" y="99">consumer B → producer B</text><g data-plane="layernorm"><rect class="ghost box" x="24" y="122" width="1192" height="158"/><text class="rowname" x="36" y="150">layernorm</text><g data-cell="layernorm-0"><rect class="neutral box" x="186" y="134" width="247" height="134"/><text class="" x="198" y="160">X / residual → norm</text><text class="" x="198" y="183">U → attention / MLP</text><text class="" x="198" y="206">真实 norm，Identity 跳过</text></g><path class="arrow" d="M 433 201 h 8"/><g data-cell="layernorm-1"><rect class="acc2 box" x="443" y="134" width="247" height="134"/><text class="" x="455" y="160">丢 U storage / 保留 X</text><text class="" x="455" y="183">后继必须直接保存 U</text><text class="" x="455" y="206">量化消费者保存 original</text><text class="" x="455" y="229">input</text></g><path class="arrow" d="M 690 201 h 8"/><g data-cell="layernorm-2"><rect class="acc1 box" x="700" y="134" width="247" height="134"/><text class="" x="712" y="160">attention/MLP 输出 hook</text><text class="" x="712" y="183">先 replay norm → 恢复 U</text><text class="" x="712" y="206">图条件可能禁 pre-MLP norm</text></g><path class="arrow" d="M 947 201 h 8"/><g data-cell="layernorm-3"><rect class="neutral box" x="957" y="134" width="247" height="134"/><text class="" x="969" y="160">B(consumer) 读取 U</text><text class="" x="969" y="183">dU → B(norm) → dX,dθ</text><text class="" x="969" y="206">不重做整个投影</text></g></g><g data-plane="moe_act"><rect class="ghost box" x="24" y="292" width="1192" height="158"/><text class="rowname" x="36" y="320">moe_act</text><text class="rowname" x="36" y="343">non-fused</text><g data-cell="moe_act-0"><rect class="neutral box" x="186" y="304" width="247" height="134"/><text class="" x="198" y="330">routed FC1 输出 A</text><text class="" x="198" y="353">A,bias,probs → bias_act</text><text class="" x="198" y="376">B → FC2</text></g><path class="arrow" d="M 433 371 h 8"/><g data-cell="moe_act-1"><rect class="acc2 box" x="443" y="304" width="247" height="134"/><text class="" x="455" y="330">FC2 F 后释放 B storage</text><text class="" x="455" y="353">保存 A,bias,permuted_probs</text><text class="" x="455" y="376">不重算外层 EP dispatch</text></g><path class="arrow" d="M 690 371 h 8"/><g data-cell="moe_act-2"><rect class="acc1 box" x="700" y="304" width="247" height="134"/><text class="" x="712" y="330">FC2 输出 hook → act replay</text><text class="" x="712" y="353">恢复 B 的旧 storage/views</text><text class="" x="712" y="376">FC2 backward 现在可读 B</text></g><path class="arrow" d="M 947 371 h 8"/><g data-cell="moe_act-3"><rect class="neutral box" x="957" y="304" width="247" height="134"/><text class="" x="969" y="330">B(FC2)→dB,dW2</text><text class="" x="969" y="353">B(act)→dA,dprobs</text><text class="" x="969" y="376">再 B(FC1)→dU,dW1</text></g></g><g data-plane="moe_act-fused"><rect class="ghost box" x="24" y="462" width="1192" height="158"/><text class="rowname" x="36" y="490">moe_act</text><text class="rowname" x="36" y="513">TE fused sibling</text><g data-cell="moe_act-fused-0"><rect class="neutral box" x="186" y="474" width="247" height="134"/><text class="" x="198" y="500">A→scaled act→FC2</text><text class="" x="198" y="523">_make_fused_ops 组装 TE op</text><text class="" x="198" y="546">activation_recompute_in_mlp</text></g><path class="arrow" d="M 433 541 h 8"/><g data-cell="moe_act-fused-1"><rect class="acc2 box" x="443" y="474" width="247" height="134"/><text class="" x="455" y="500">inspect.signature 有此参数</text><text class="" x="455" y="523">才向 TE op 传重算开关</text><text class="" x="455" y="546">缺参数也构建 op</text></g><path class="arrow" d="M 690 541 h 8"/><g data-cell="moe_act-fused-2"><rect class="acc1 box" x="700" y="474" width="247" height="134"/><text class="" x="712" y="500">Megatron → TE op boundary</text><text class="" x="712" y="523">回放和存储: 依赖实现</text><text class="" x="712" y="546">本仓未证明同 CWO 的收益</text></g><path class="arrow" d="M 947 541 h 8"/><g data-cell="moe_act-fused-3"><rect class="neutral box" x="957" y="474" width="247" height="134"/><text class="" x="969" y="500">接口交付 FC2/FC1 梯度</text><text class="" x="969" y="523">额外计算/容量不编造</text><text class="" x="969" y="546">同 token 与概率乘法契约</text></g></g><g data-plane="mla_up_proj"><rect class="ghost box" x="24" y="632" width="1192" height="158"/><text class="rowname" x="36" y="660">mla_up_proj</text><g data-cell="mla_up_proj-0"><rect class="neutral box" x="186" y="644" width="247" height="134"/><text class="" x="198" y="670">compressed Q / KV</text><text class="" x="198" y="693">k_pos + RoPE</text><text class="" x="198" y="716">up projection + RoPE→QKV</text></g><path class="arrow" d="M 433 711 h 8"/><g data-cell="mla_up_proj-1"><rect class="acc2 box" x="443" y="644" width="247" height="134"/><text class="" x="455" y="670">QKV → core attention</text><text class="" x="455" y="693">core F 后释放 Q/K/V</text><text class="" x="455" y="716">压缩输入继续保存</text></g><path class="arrow" d="M 690 711 h 8"/><g data-cell="mla_up_proj-2"><rect class="acc1 box" x="700" y="644" width="247" height="134"/><text class="" x="712" y="670">core O hook → up+RoPE</text><text class="" x="712" y="693">恢复 Q/K/V 所有输出</text><text class="" x="712" y="716">attention B 前完成</text></g><path class="arrow" d="M 947 711 h 8"/><g data-cell="mla_up_proj-3"><rect class="neutral box" x="957" y="644" width="247" height="134"/><text class="" x="969" y="670">B(core)→dQ,dK,dV</text><text class="" x="969" y="693">B(up+RoPE)→dlatents,dW</text><text class="" x="969" y="716">额外 up GEMM，不只 softmax</text></g></g><g data-plane="gdn_norm_out"><rect class="ghost box" x="24" y="802" width="1192" height="182"/><text class="rowname" x="36" y="830">gdn_norm_out</text><text class="rowname" x="36" y="853">GDN / KDA</text><g data-cell="gdn_norm_out-0"><rect class="neutral box" x="186" y="814" width="247" height="158"/><text class="" x="198" y="840">D + gate 在 HP 布局</text><text class="" x="198" y="863">all tokens / half heads</text><text class="" x="198" y="886">norm → HP→CP A2A</text><text class="" x="198" y="909">N → out projection</text></g><path class="arrow" d="M 433 893 h 8"/><g data-cell="gdn_norm_out-1"><rect class="acc2 box" x="443" y="814" width="247" height="158"/><text class="" x="455" y="840">out-proj F 后释放 N</text><text class="" x="455" y="863">保留 D/gate 与 inverse map</text><text class="" x="455" y="886">rank0 t0,t3 / rank1 t1,t2</text><text class="" x="455" y="909">不与整个 gdn 同选</text></g><path class="arrow" d="M 690 893 h 8"/><g data-cell="gdn_norm_out-2"><rect class="acc1 box" x="700" y="814" width="247" height="158"/><text class="" x="712" y="840">out O hook → norm + A2A</text><text class="" x="712" y="863">再次恢复 CP token 布局</text><text class="" x="712" y="886">N storage 恢复</text><text class="" x="712" y="909">无 in-proj/conv/delta</text><text class="" x="712" y="932">replay</text></g><path class="arrow" d="M 947 893 h 8"/><g data-cell="gdn_norm_out-3"><rect class="neutral box" x="957" y="814" width="247" height="158"/><text class="" x="969" y="840">B(out-proj) 读 N→dN,dW</text><text class="" x="969" y="863">B(restore): CP→HP</text><text class="" x="969" y="886">B(norm)→dD,dgate</text><text class="" x="969" y="909">再走原 delta/conv B</text></g></g><g data-plane="mhc"><rect class="ghost box" x="24" y="996" width="1192" height="158"/><text class="rowname" x="36" y="1024">mhc</text><text class="rowname" x="36" y="1047">grouped CWO</text><g data-cell="mhc-0"><rect class="neutral box" x="186" y="1008" width="247" height="134"/><text class="" x="198" y="1034">C0 多 stream → aggregate</text><text class="" x="198" y="1057">norm / residual / expand</text><text class="" x="198" y="1080">checkpoint 输入相互依赖</text></g><path class="arrow" d="M 433 1075 h 8"/><g data-cell="mhc-1"><rect class="acc2 box" x="443" y="1008" width="247" height="134"/><text class="" x="455" y="1034">组尾统一 discard</text><text class="" x="455" y="1057">每 checkpoint 自有 RNG</text><text class="" x="455" y="1080">组边界保留</text></g><path class="arrow" d="M 690 1075 h 8"/><g data-cell="mhc-2"><rect class="acc1 box" x="700" y="1008" width="247" height="134"/><text class="" x="712" y="1034">统一 hook 或 schedule</text><text class="" x="712" y="1057">barrier</text><text class="" x="712" y="1080">按原 forward 注册顺序恢复</text><text class="" x="712" y="1103">固定 slot 详见 mHC 图</text></g><path class="arrow" d="M 947 1075 h 8"/><g data-cell="mhc-3"><rect class="neutral box" x="957" y="1008" width="247" height="134"/><text class="" x="969" y="1034">消费者 B→各 CWO B</text><text class="" x="969" y="1057">梯度回到 streams/mappings</text><text class="" x="969" y="1080">不能独立任意触发</text></g></g><text class="cap" x="24" y="1183">CWO 额外减少的是后继保存的 output storage；producer input、实际副本和静态 graph slots 仍占显存。</text><text class="cap" x="24" y="1206">普通 checkpoint 不能替代这个 storage 生命周期；合法配置也不保证所有后端都真正采用同一机制。</text></svg>
