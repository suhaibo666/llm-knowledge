<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="532" viewBox="0 0 1020 532" role="img"><title>固定地址如何承载变化的微批总数</title><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;font-size:15px;fill:#2A313B}.title{font-size:23px;font-weight:700}.small{font-size:13px;fill:#626B77}.bold{font-weight:700}.neutral{fill:#fff;stroke:#C7CCD3}.ghost{fill:#F7F6F3;stroke:#DDD9D2}.acc1{fill:#EAF1FD;stroke:#2563EB}.acc2{fill:#FCF1E6;stroke:#C3651F}.arrow{fill:none;stroke:#98A1AD;stroke-width:1.3}.main{stroke:#2563EB;stroke-width:2}.dash{fill:none;stroke:#C3651F;stroke-dasharray:5 4}</style><defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#98A1AD"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="26" y="37" class="title">固定地址如何承载变化的微批总数</text><text x="26" y="65" class="small">冻结源码 PP2 测试顺序；同槽下一次前向必须晚于上次反向完成。不是实际时间比例。</text><rect x="180" y="91" width="94" height="45" rx="6" class="acc1"/><text x="208" y="120" class="bold">F0</text><rect x="281" y="91" width="94" height="45" rx="6" class="acc1"/><text x="309" y="120" class="bold">F1</text><rect x="382" y="91" width="94" height="45" rx="6" class="ghost"/><text x="410" y="120" class="bold">B0</text><rect x="483" y="91" width="94" height="45" rx="6" class="acc1"/><text x="511" y="120" class="bold">F2</text><rect x="584" y="91" width="94" height="45" rx="6" class="ghost"/><text x="612" y="120" class="bold">B1</text><rect x="685" y="91" width="94" height="45" rx="6" class="acc1"/><text x="713" y="120" class="bold">F3</text><rect x="786" y="91" width="94" height="45" rx="6" class="ghost"/><text x="814" y="120" class="bold">B2</text><rect x="887" y="91" width="94" height="45" rx="6" class="ghost"/><text x="915" y="120" class="bold">B3</text><text x="26" y="119" class="bold">执行顺序</text><rect x="180" y="157" width="94" height="35" rx="6" class="neutral"/><text x="220" y="181" class="">1</text><rect x="281" y="157" width="94" height="35" rx="6" class="neutral"/><text x="321" y="181" class="">2</text><rect x="382" y="157" width="94" height="35" rx="6" class="neutral"/><text x="422" y="181" class="">1</text><rect x="483" y="157" width="94" height="35" rx="6" class="neutral"/><text x="523" y="181" class="">2</text><rect x="584" y="157" width="94" height="35" rx="6" class="neutral"/><text x="624" y="181" class="">1</text><rect x="685" y="157" width="94" height="35" rx="6" class="neutral"/><text x="725" y="181" class="">2</text><rect x="786" y="157" width="94" height="35" rx="6" class="neutral"/><text x="826" y="181" class="">1</text><rect x="887" y="157" width="94" height="35" rx="6" class="neutral"/><text x="927" y="181" class="">0</text><text x="26" y="181" class="bold">未完成微批</text><text x="26" y="266" class="bold">固定槽位 0</text><rect x="180" y="228" width="801" height="61" rx="6" class="ghost"/><rect x="183" y="233" width="289" height="49" rx="6" class="acc1"/><text x="198" y="263" class="">microbatch 0：F0 → B0</text><rect x="486" y="233" width="390" height="49" rx="6" class="acc1"/><text x="501" y="263" class="">microbatch 2：F2 → B2</text><text x="26" y="360" class="bold">固定槽位 1</text><rect x="180" y="322" width="801" height="61" rx="6" class="ghost"/><rect x="284" y="327" width="390" height="49" rx="6" class="acc1"/><text x="299" y="357" class="">microbatch 1：F1 → B1</text><rect x="688" y="327" width="289" height="49" rx="6" class="acc1"/><text x="703" y="357" class="">microbatch 3：F3 → B3</text><rect x="26" y="436" width="950" height="69" rx="6" class="acc2"/><text x="44" y="463" class="bold">4 个微批，峰值 2 个存活槽位；BWD 完成后才释放本次保存状态。</text><text x="44" y="490" class="small">图/地址长期存在；随微批更新的是其中的数据。先复用再反向会覆盖尚需使用的激活。</text></svg>
