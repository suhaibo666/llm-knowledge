<text class="tx" x="712" y="245" text-anchor="start">读法</text>
<path class="edge" d="M 712 253 L 1232 253"/>
<text class="sm" x="712" y="271" text-anchor="start">① 第一步只 prefill 到批内最短 prompt（3 token），之后每步整批推进 1 个位置：</text>
<text class="costtx" x="712" y="287" text-anchor="start">   长 prompt 被逐 token「走」完（p 格，共 8 槽·步），完成的行仍被计算（× 格）</text>
<text class="sm" x="712" y="303" text-anchor="start">② 的空转最多：R1(10 token) 在 s1 装不进 max_tokens，队头 break 把 R2 也拦住；</text>
<text class="sm" x="712" y="319" text-anchor="start">   R3(12 token) 要等到没有别的活跃请求才能独占一步（s8）</text>
<text class="dim" x="712" y="335" text-anchor="start">③ 把 R1/R3 的 prefill 切成 chunk 塞进预算缝隙，每步 token ≤ 12，R3 在 s4 进入</text>
<text class="sm" x="712" y="351" text-anchor="start">③ 的代价：chunked 请求在最后一个 chunk 之前不出 token，且一次只允许一条</text>
<text class="sm" x="712" y="367" text-anchor="start">连续批处理不是自动赢：它把「批」拆成槽位与 token 两个预算，队头 FIFO 是硬规则</text>
<text class="sm" x="712" y="383" text-anchor="start">本图不复刻 KV 块、pause、Mamba、投机解码；每条 decode 请求每步恰好 1 token</text>
<rect class="acc2" x="700" y="426" width="544" height="102" rx="8"/>
<text class="tx" x="712" y="447" text-anchor="start">为什么 max_tokens 是一步的硬预算</text>
<path class="edge" d="M 712 455 L 1232 455"/>
<text class="sm" x="712" y="473" text-anchor="start">InferenceConfig.max_tokens：「primarily limited by prefill activation memory usage」</text>
<text class="sm" x="712" y="489" text-anchor="start">非 chunked 模式下 prompt 长于 max_tokens 的请求在 _add_request 直接 FAILED</text>
<text class="costtx" x="712" y="505" text-anchor="start">（TokenOverflowError，非暂态）；chunked 模式才允许它分段进入</text>
</svg>