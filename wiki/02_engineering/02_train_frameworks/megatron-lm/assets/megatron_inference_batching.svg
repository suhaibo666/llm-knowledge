<text class="ti" x="28" y="32" text-anchor="start">图 2　同一批请求：定长批、连续批处理、连续批处理 + chunked prefill</text>
<text class="su" x="28" y="52" text-anchor="start">算例：max_requests=3 个槽位，max_tokens=12（一步的 prefill 激活预算）；P&lt;n&gt; 整段 prefill，c&lt;n&gt; 一个 chunk，d decode</text>
<text class="pt" x="28" y="92" text-anchor="start">① 定长批（legacy static engine 语义）</text>
<text class="sm" x="28" y="108" text-anchor="start">同进同出：整批共用一份 sampling_params；P 整段 prefill，p 逐 token 走 prompt，d decode，× 已完成仍被计算</text>
