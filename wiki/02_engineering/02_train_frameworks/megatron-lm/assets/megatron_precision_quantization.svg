<svg xmlns="http://www.w3.org/2000/svg" width="1104" height="818" viewBox="0 0 1104 818" role="img"><title>量化改变表示，不抹去反向依赖</title><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;font-size:15px;fill:#2A313B}.title{font-size:23px;font-weight:700}.small{font-size:13px;fill:#626B77}.bold{font-weight:700}.neutral{fill:#fff;stroke:#C7CCD3}.ghost{fill:#F7F6F3;stroke:#DDD9D2}.acc1{fill:#EAF1FD;stroke:#2563EB}.acc2{fill:#FCF1E6;stroke:#C3651F}.arrow{fill:none;stroke:#98A1AD;stroke-width:1.3}.main{stroke:#2563EB;stroke-width:2}.dash{fill:none;stroke:#C3651F;stroke-dasharray:5 4}</style><defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#98A1AD"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="26" y="37" class="title">量化改变表示，不抹去反向依赖</text><text x="26" y="65" class="small">每条 lane：X[128,128]、W[128,128] → 同一 GEMM → Z[128,128]</text><rect x="218" y="85" width="552" height="510" rx="6" class="ghost"/><text x="238" y="109" class="bold">TE 依赖边界：这里标接口语义，不模拟 TE 内核</text><text x="28" y="109" class="bold">Megatron 选择</text><text x="802" y="109" class="bold">消费与反向</text><rect x="26" y="126" width="168" height="51" rx="6" class="neutral"/><text x="37" y="149" class="bold">delayed</text><text x="37" y="169" class="small">同一 X、W</text><path d="M195,152 L234,152" class="arrow main" marker-end="url(#head)"/><rect x="240" y="126" width="510" height="51" rx="6" class="acc1"/><text x="250" y="148" class="">历史 amax → delayed scale</text><text x="250" y="168" class="small">历史与规约状态</text><path d="M752,152 L790,152" class="arrow main" marker-end="url(#head)"/><rect x="800" y="126" width="278" height="51" rx="6" class="neutral"/><text x="812" y="148" class="">Z → bias/GeLU → A → loss</text><text x="812" y="168" class="small">BWD：GZ·Wᵀ 与 Xᵀ·GZ</text><rect x="26" y="190" width="168" height="51" rx="6" class="neutral"/><text x="37" y="213" class="bold">tensorwise</text><text x="37" y=