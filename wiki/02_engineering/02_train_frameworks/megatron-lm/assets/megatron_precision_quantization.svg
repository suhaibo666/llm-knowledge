 custom</text><text x="37" y="425" class="small">同一 X、W</text><path d="M195,408 L234,408" class="arrow main" marker-end="url(#head)"/><rect x="240" y="382" width="510" height="51" rx="6" class="ghost"/><text x="250" y="404" class="">工厂 → CustomRecipe</text><text x="250" y="424" class="small">数值/保存由工厂定义</text><path d="M752,408 L790,408" class="arrow main" marker-end="url(#head)"/><rect x="800" y="382" width="278" height="51" rx="6" class="neutral"/><text x="812" y="404" class="">Z → bias/GeLU → A → loss</text><text x="812" y="424" class="small">BWD：GZ·Wᵀ 与 Xᵀ·GZ</text><rect x="26" y="446" width="168" height="51" rx="6" class="neutral"/><text x="37" y="469" class="bold">nvfp4</text><text x="37" y="489" class="small">同一 X、W</text><path d="M195,472 L234,472" class="arrow main" marker-end="url(#head)"/><rect x="240" y="446" width="510" height="51" rx="6" class="acc1"/><text x="250" y="468" class="">NVFP4 recipe → packed bytes</text><text x="250" y="488" class="small">scale/amax 不随 bytes 消失</text><path d="M752,472 L790,472" class="arrow main" marker-end="url(#head)"/><rect x="800" y="446" width="278" height="51" rx="6" class="neutral"/><text x="812" y="468" class="">Z → bias/GeLU → A → loss</text><text x="812" y="488" class="small">BWD：GZ·Wᵀ 与 Xᵀ·GZ</text><rect x="26" y="510" width="168" height="51" rx="6" class="neutral"/><text x="37" y="533" class="bold">FP4 custom</text><text x="37" y="553" class="small">同一 X、W</text><path d="M195,536 L234,536" class="arrow main" marker-end="url(#head)"/><rect x="240" y="510" width="510" height="51" rx="6" class="ghost"/><text x="250" y="532" class="">工厂 → CustomRecipe</text><text x="250" y="552" class="small">实际位宽/算法另验</text><path d="M752,536 L790,536" class="arrow main" marker-end="url(#head)"/><rect x="800" y="510" width="278" height="51" rx="6" class="neutral"/><text x="812" y="532" class="">Z → bias/GeLU → A → loss</text><text x="812" y="552" class="small">BWD：GZ·Wᵀ 与 Xᵀ·GZ</text><text x="26" y="623" class="bold">单份操作数的名义载荷（不含 S、padding、转置、高精度副本）</text><text x="26" y="664" class="">BF16</text><rect x="157" y="642" width="384" height="27" rx="6" class="ghost"/><text x="549" y="662" class="">32 KiB</text><text x="645" y="662" class="">原始表示</text><text x="26" y="705" class="">FP8</text><rect x="157" y="683" width="192" height="27" rx="6" class="acc1"/><text x="357" y="703" class="">16 KiB</text><text x="645" y="703" class="">另加 S；custom 不承诺此位宽</text><text x="26" y="746" class="">packed FP4</text><rect x="157" y="724" width="96" height="27" rx="6" class="acc2"/><text x="261" y="744" class="">8 KiB</text><text x="645" y="744" class="">另加 S；custom 不承诺此位宽</text><text x="26" y="792" class="small">不变量：输出形状不变；前向乘加仍为 4,194,304 FLOPs。缩放布局与反向保存由 TE/工厂决定。</text></svg>
