<text class="ti" x="28" y="32" text-anchor="start">图 3　CUDA graph 尺寸枚举：指数递减用更少的图换「与规模无关」的 padding 上界</text>
<text class="su" x="28" y="52" text-anchor="start">算例：tp_size=2，decode 图上界 cuda_graph_max_tokens = max_requests × (num_speculative_tokens+1) = 64；每个尺寸各捕获一张 decode-only 图</text>
<text class="pt" x="28" y="96" text-anchor="start">EXPONENTIAL（默认）：从 max 逐次减半到 tp_size</text>
