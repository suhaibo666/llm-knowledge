<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="535" viewBox="0 0 1180 535"><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',Arial,sans-serif;fill:#263445;font-size:16px}.title{font-size:23px;font-weight:700}.dim{font-size:14px;fill:#526174}.cap{font-size:16px}.mono{font-family:Consolas,monospace;font-size:16px}.neutral{fill:#fff;stroke:#aeb9c6}.ghost{fill:#f5f7fa;stroke:#dae0e7}.acc1{fill:#e8f1fb;stroke:#2f6fba;stroke-width:2}.acc2{fill:#fff1e5;stroke:#c77b31;stroke-width:2}.main{stroke:#2f6fba;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.aux{stroke:#9aa8b7;stroke-width:1.4;fill:none}.boundary{stroke:#9aa8b7;stroke-width:1.4;stroke-dasharray:6 5}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2f6fba"/></marker></defs><rect width="1180" height="535" fill="white"/><text x="25" y="36" class="title">父组之后的派生规则：继续跟踪 R5</text><rect x="20" y="64" width="1139" height="100" rx="7" class="ghost"/><text x="35" y="93" class="">hierarchical CP</text><text x="35" y="123" class="mono">CP [5,7] / levels [1,2]</text><path d="M492,107 L532,107" class="main"/><rect x="552" y="79" width="585" height="42" rx="7" class="acc1"/><text x="568" y="107" class="mono">[5] → [5,7]</text><text x="558" y="144" class="dim">每一级单独建组；乘积必须等于 CP</text><rect x="20" y="175" width="1139" height="100" rx="7" class="ghost"/><text x="35" y="204" class="">dynamic DP×CP</text><text x="35" y="234" class="mono">DP×CP [1,3,5,7] / min=1</text><path d="M492,218 L532,218" class="main"/><rect x="552" y="190" width="585" height="42" rx="7" class="acc1"/><text x="568" y="218" class="mono">[5] → [5,7] → [1,3,5,7]</text><text x="558" y="255" class="dim">幂次连续切片；完整父组由 getter 回退</text><rect x="20" y="286" width="1139" height="100" rx="7" class="ghost"/><text x="35" y="315" class="">partial DP</text><text x="35" y="345" class="mono">DP×CP [1,3,5,7] / instances=2</text><path d="M492,329 L532,329" class="main"/><rect x="552" y="301" width="585" height="42" rx="7" class="acc1"/><text x="568" y="329" class="mono">[5,7]</text><text x="558" y="366" class="dim">仅切 intra；inter 复用下方 expert 组</text><rect x="20" y="397" width="1139" height="100" rx="7" class="ghost"/><text x="35" y="426" class="">partial expert DP</text><text x="35" y="456" class="mono">EDP [1,5] / instances=2</text><path d="M492,440 L532,440" class="main"/><rect x="552" y="412" width="585" height="42" rx="7" class="acc1"/><text x="568" y="440" class="mono">[5] + [1,5]</text><text x="558" y="477" class="dim">各层新组；inter 由 dense / expert 共享，可启用 dp_replica</text><text x="28" y="523" class="cap">只构造成员域；CP交换、梯度规约、参数聚合的执行与等待分别由13/16页拥有。</text></svg>