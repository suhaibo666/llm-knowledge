<text class="sm" x="1150" y="224" text-anchor="end">训练时间</text>
<text class="dim" x="310" y="82" text-anchor="middle">on_training_step_start 关掉 setup 段</text>
<text class="pt" x="28" y="242" text-anchor="start">阈值更新闸门（复刻 _maybe_update_timeouts）</text>
