<rect class="neutral" x="28" y="424" width="600" height="86" rx="8"/>
<text class="tx" x="40" y="445" text-anchor="start">每道闸门挡住的是一种把阈值算歪的方式</text>
<path class="edge" d="M 40 453 L 616 453"/>
<text class="sm" x="40" y="471" text-anchor="start">step：样本 &lt; 16 次迭代就不动阈值，头几步的一次性开销会把它抬得离谱。</text>
<text class="sm" x="40" y="487" text-anchor="start">setup：只有加载过持久 checkpoint 才算数 —— 内存里的本地快照读得太快，会低估 setup。</text>
<text class="sm" x="40" y="503" text-anchor="start">checkpointing：异步存档下跨 run 波动过大，源码直接放弃更新这一段。</text>
<rect class="ghost" x="648" y="424" width="596" height="86" rx="8"/>
<text class="tx" x="660" y="445" text-anchor="start">依赖边界：阈值到底怎么算，不在本仓</text>
<path class="edge" d="M 660 453 L 1232 453"/>
<text class="sm" x="660" y="471" text-anchor="start">Megatron 只决定「哪些 section 现在有资格更新」，然后调用</text>
<text class="sm" x="660" y="487" text-anchor="start">rmon_cli.calculate_and_set_section_timeouts(...)，并把结果 json 落盘。</text>
<text class="sm" x="660" y="503" text-anchor="start">反推公式、分位数、安全裕度都在 nvidia_resiliency_ext 内部，本页不作陈述。</text>
</svg>