<text class="sm" x="1030" y="145" text-anchor="middle">step（eval 也记这里）</text>
<text class="rank" x="28" y="182" text-anchor="start">checkpointing</text>
<rect class="acc2" x="830" y="164" width="100" height="26" rx="5"/>
<text class="sm" x="880" y="181" text-anchor="middle">checkpointing</text>
<path class="gl" d="M 150 206 L 1150 206"/>
