<text class="ti" x="28" y="32" text-anchor="start">图 2　NVRx 只记三个 section；「现在能不能更新阈值」由四道闸门决定</text>
<text class="su" x="28" y="52" text-anchor="start">warmup 期（前 5 次迭代）根本不开 section，阈值也就不会被一次性开销带偏</text>
<text class="rank" x="28" y="110" text-anchor="start">setup</text>
<rect class="acc1" x="150" y="92" width="160" height="26" rx="5"/>
<text class="sm" x="230" y="109" text-anchor="middle">start_section("setup")</text>
<text class="rank" x="28" y="146" text-anchor="start">step</text>
