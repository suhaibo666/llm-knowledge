<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1460 800" width="100%" role="img" aria-label="长度 16 的连续 buffer 按四个 DP rank 等分，参数 p 从世界位置 2 到 7 跨越 rank0 和 rank1 shard，并映射到四套坐标">
<style>
  text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .card{fill:#fff;stroke:#E4E7EC;stroke-width:1.2}
  .panel{fill:#FBFCFE;stroke:#D9DEE7;stroke-width:1.2}
  .neutral{fill:#fff;stroke:#AEB6C2;stroke-width:1.2}
  .ghost{fill:#F5F7FA;stroke:#D9DEE7;stroke-width:1.1}
  .acc1{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.5}
  .acc2{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.5}
  .main{fill:none;stroke:#2563EB;stroke-width:2;marker-end:url(#arrowMain)}
  .aux{fill:none;stroke:#AEB6C2;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arrowAux)}
  .cost{fill:none;stroke:#C3651F;stroke-width:2;marker-end:url(#arrowCost)}
  .ti{font-size:18px;font-weight:700;fill:#1F2430}
  .su{font-size:11.5px;fill:#747C88}
  .pt{font-size:14px;font-weight:700;fill:#2A313B}
  .tx{font-size:12px;fill:#38414D}
  .sm{font-size:10.5px;fill:#68717D}
  .dim{font-size:10.5px;font-weight:600;fill:#173F87}
  .costtx{font-size:10.5px;font-weight:600;fill:#8A4A11}
  .rank{font-size:11px;font-weight:700;fill:#5B6470}
  .cap{font-size:11px;fill:#747C88}
  .cellq{fill:#EEF1F5;stroke:#fff}
  .cellp{fill:#9CC2F3;stroke:#fff}
  .cellr{fill:#DCE9FB;stroke:#fff}
  .cellpad{fill:#F1E2D2;stroke:#fff}
</style>
  <defs>
    <marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker>
    <marker id="arrowAux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AEB6C2"/></marker>
    <marker id="arrowCost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C3651F"/></marker>
  </defs>
<rect class="card" x="0.5" y="0.5" width="1459" height="799" rx="14"/>
<text class="ti" x="28" y="38" text-anchor="start">连续 buffer 的等分边界可以切进一个 parameter</text>
<text class="su" x="28" y="60" text-anchor="start">N=16 · d=4 · shard=4 · p world [2, 7)；蓝色 p 跨过 world index 4</text>
<text class="pt" x="72" y="104" text-anchor="start">param_data / grad_data 的统一 world index</text>
<rect class="cellq" x="72" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="107" y="157" text-anchor="middle">q[0]</text>
<text class="sm" x="107" y="179" text-anchor="middle">w0</text>
<rect class="cellq" x="144" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="179" y="157" text-anchor="middle">q[1]</text>
<text class="sm" x="179" y="179" text-anchor="middle">w1</text>
<rect class="cellp" x="216" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="251" y="157" text-anchor="middle">p[0]</text>
<text class="sm" x="251" y="179" text-anchor="middle">w2</text>
<rect class="cellp" x="288" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="323" y="157" text-anchor="middle">p[1]</text>
<text class="sm" x="323" y="179" text-anchor="middle">w3</text>
<rect class="cellp" x="360" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="395" y="157" text-anchor="middle">p[2]</text>
<text class="sm" x="395" y="179" text-anchor="middle">w4</text>
<rect class="cellp" x="432" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="467" y="157" text-anchor="middle">p[3]</text>
<text class="sm" x="467" y="179" text-anchor="middle">w5</text>
<rect class="cellp" x="504" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="539" y="157" text-anchor="middle">p[4]</text>
<text class="sm" x="539" y="179" text-anchor="middle">w6</text>
<rect class="cellr" x="576" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="611" y="157" text-anchor="middle">r[0]</text>
<text class="sm" x="611" y="179" text-anchor="middle">w7</text>
<rect class="cellr" x="648" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="683" y="157" text-anchor="middle">r[1]</text>
<text class="sm" x="683" y="179" text-anchor="middle">w8</text>
<rect class="cellr" x="720" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="755" y="157" text-anchor="middle">r[2]</text>
<text class="sm" x="755" y="179" text-anchor="middle">w9</text>
<rect class="cellr" x="792" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="827" y="157" text-anchor="middle">r[3]</text>
<text class="sm" x="827" y="179" text-anchor="middle">w10</text>
<rect class="cellr" x="864" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="899" y="157" text-anchor="middle">r[4]</text>
<text class="sm" x="899" y="179" text-anchor="middle">w11</text>
<rect class="cellr" x="936" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="971" y="157" text-anchor="middle">r[5]</text>
<text class="sm" x="971" y="179" text-anchor="middle">w12</text>
<rect class="cellpad" x="1008" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="1043" y="157" text-anchor="middle">pad[0]</text>
<text class="sm" x="1043" y="179" text-anchor="middle">w13</text>
<rect class="cellpad" x="1080" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="1115" y="157" text-anchor="middle">pad[1]</text>
<text class="sm" x="1115" y="179" text-anchor="middle">w14</text>
<rect class="cellpad" x="1152" y="132" width="70" height="62" rx="3"/>
<text class="tx" x="1187" y="157" text-anchor="middle">pad[2]</text>
<text class="sm" x="1187" y="179" text-anchor="middle">w15</text>
<path d="M 72 207 v 10 h 286 v -10" fill="none" stroke="#2563EB" stroke-width="1.5"/>
<text class="dim" x="215" y="236" text-anchor="middle">rank0 world [0, 4)</text>
<path d="M 360 207 v 10 h 286 v -10" fill="none" stroke="#2563EB" stroke-width="1.5"/>
<text class="dim" x="503" y="236" text-anchor="middle">rank1 world [4, 8)</text>
<path d="M 648 207 v 10 h 286 v -10" fill="none" stroke="#2563EB" stroke-width="1.5"/>
<text class="dim" x="791" y="236" text-anchor="middle">rank2 world [8, 12)</text>
<path d="M 936 207 v 10 h 286 v -10" fill="none" stroke="#2563EB" stroke-width="1.5"/>
<text class="dim" x="1079" y="236" text-anchor="middle">rank3 world [12, 16)</text>
<rect class="panel" x="52" y="270" width="1356" height="124" rx="12"/>
<text class="pt" x="72" y="302" text-anchor="start">parameter boundary ≠ shard boundary</text>
<text class="tx" x="72" y="326" text-anchor="start">p 的 5 个元素不会整体归一张卡：rank0 更新 p[0,2)，rank1 更新 p[2,5)。rank2/3 对 p 没有交集。</text>
<rect class="acc1" x="72" y="344" width="214" height="40" rx="8"/>
<text class="tx" x="179" y="359.5" text-anchor="middle">rank0: p[0, 2)</text>
<text class="sm" x="179" y="376.5" text-anchor="middle">world [2,4)</text>
<rect class="acc1" x="304" y="344" width="214" height="40" rx="8"/>
<text class="tx" x="411" y="359.5" text-anchor="middle">rank1: p[2, 5)</text>
<text class="sm" x="411" y="376.5" text-anchor="middle">world [4,7)</text>
<rect class="ghost" x="536" y="344" width="214" height="40" rx="8"/>
<text class="tx" x="643" y="359.5" text-anchor="middle">rank2 / rank3</text>
<text class="sm" x="643" y="376.5" text-anchor="middle">p intersection = ∅</text>
<rect class="neutral" x="1128" y="292" width="252" height="80" rx="8"/>
<text class="tx" x="1254" y="319" text-anchor="middle">为什么这样切</text>
<text class="sm" x="1254" y="336" text-anchor="middle">RS receive 与 state/update</text>
<text class="sm" x="1254" y="353" text-anchor="middle">都能直接读连续 local view</text>
<text class="pt" x="52" y="438" text-anchor="start">同一交集的四套 range（bucket offset = 0）</text>
<rect class="panel" x="52" y="466" width="628" height="214" rx="12"/>
<text class="pt" x="72" y="496" text-anchor="start">rank0 拿到 p 的前 2 个元素</text>
<text class="tx" x="80" y="530" text-anchor="start">gbuf_world       [2,4)</text>
<text class="tx" x="80" y="560" text-anchor="start">gbuf_world_in_bucket [2,4)</text>
<text class="tx" x="80" y="590" text-anchor="start">gbuf_local       [2,4)</text>
<text class="dim" x="80" y="620" text-anchor="start">param            [0,2)</text>
<rect class="panel" x="730" y="466" width="628" height="214" rx="12"/>
<text class="pt" x="750" y="496" text-anchor="start">rank1 拿到 p 的后 3 个元素</text>
<text class="tx" x="758" y="530" text-anchor="start">gbuf_world       [4,7)</text>
<text class="tx" x="758" y="560" text-anchor="start">gbuf_world_in_bucket [4,7)</text>
<text class="tx" x="758" y="590" text-anchor="start">gbuf_local       [0,3)</text>
<text class="dim" x="758" y="620" text-anchor="start">param            [2,5)</text>
<rect class="acc2" x="52" y="706" width="284" height="62" rx="8"/>
<text class="tx" x="194" y="724" text-anchor="middle">存储成本</text>
<text class="sm" x="194" y="741" text-anchor="middle">N 必须可被 d 整除</text>
<text class="sm" x="194" y="758" text-anchor="middle">不够则 padding</text>
<rect class="neutral" x="356" y="706" width="482" height="62" rx="8"/>
<text class="tx" x="597" y="732.5" text-anchor="middle">映射成本</text>
<text class="sm" x="597" y="749.5" text-anchor="middle">同一 shard 要维护 world / bucket / local / param 坐标</text>
<rect class="acc1" x="858" y="706" width="550" height="62" rx="8"/>
<text class="tx" x="1133" y="732.5" text-anchor="middle">正确性收益</text>
<text class="sm" x="1133" y="749.5" text-anchor="middle">collective、main/model copy、optimizer update 共用同一连续 range</text>
<text class="cap" x="28" y="788" text-anchor="start">等分原语示例：省略 native builder 的64/128对齐；pad只通信、不更新。真实小参数布局另算，见LayerWise 13→256。</text>
</svg>
