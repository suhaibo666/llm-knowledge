<text class="sm" x="410" y="591" text-anchor="start">全局行 4–5，16 B</text>
<path class="main" d="M 286 580 L 394 580"/>
<rect class="neutral" x="614" y="552" width="204" height="56" rx="8"/>
<text class="rank" x="624" y="572" text-anchor="start">ReadItem 1：chunk 3</text>
<text class="sm" x="624" y="591" text-anchor="start">全局行 6–7，16 B</text>
<path class="main" d="M 286 580 L 394 580"/>
<text class="dim" x="836" y="585" text-anchor="start">2 条 ReadItem 拼出 4×4 = 32 B</text>
<rect class="ghost" x="1024" y="486" width="132" height="122" rx="8"/>
<rect class="acc2" x="1030" y="480" width="120" height="22" rx="6"/>
<text class="sm" x="1090" y="495" text-anchor="middle">PyTorch DCP</text>
<text class="sm" x="1034" y="522" text-anchor="start">求交在这里：</text>
<text class="sm" x="1034" y="538" text-anchor="start">create_read_items_</text>
<text class="sm" x="1034" y="552" text-anchor="start">  for_chunk_list</text>
<text class="sm" x="1034" y="570" text-anchor="start">Megatron 只递</text>
<text class="sm" x="1034" y="584" text-anchor="start">chunk 清单，</text>
<text class="sm" x="1034" y="598" text-anchor="start">不做这一步</text>
<text class="cap" x="28" y="648" text-anchor="start">成立的两条前置：len(local_shape)+prepend_axis_num == len(global_shape)，且每个轴上 global_offset % local_shape == 0（validate_metadata_integrity）。第二条就是"规则网格"的落点。</text>
<text class="cap" x="28" y="668" text-anchor="start">注意存端与载端的 global_shape 必须一致（[8, 4]）：MCoreLoadPlanner._validate_global_shapes 不匹配就抛 CheckpointingException，除非该张量声明 allow_shape_mismatch。</text>
