<text class="sm" x="878" y="166" text-anchor="start">chunk 0 = 行 0–1</text>
<text class="sm" x="878" y="190" text-anchor="start">chunk 1 = 行 2–3</text>
<text class="sm" x="878" y="214" text-anchor="start">chunk 2 = 行 4–5</text>
<text class="sm" x="878" y="238" text-anchor="start">chunk 3 = 行 6–7</text>
<text class="sm" x="816" y="262" text-anchor="start">axis_fragmentations=(4,1)：网格被切成 4×1 个 chunk</text>
<rect class="panel" x="20" y="292" width="1140" height="122" rx="8"/>
<text class="pt" x="36" y="316" text-anchor="start">② 盘上：只有 4 个 main replica 进入写盘计划</text>
<text class="sm" x="36" y="334" text-anchor="start">keep_only_main_replica 默认 True：写盘量 64 B 而不是 128 B，省掉的正是 4 份 DP 副本。</text>
<rect class="acc1" x="36" y="346" width="186" height="56" rx="8"/>
<text class="rank" x="46" y="366" text-anchor="start">chunk 0 ← rank 0</text>
<text class="sm" x="46" y="385" text-anchor="start">offset=(0,0) size=(2,4) 16 B</text>
