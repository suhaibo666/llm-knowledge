<text class="ti" x="28" y="32" text-anchor="start">图 1　同一张权重：TP4×DP2 存、TP2×DP1 载</text>
<text class="su" x="28" y="52" text-anchor="start">layer0.mlp.fc1.weight 全局 [8, 4] bf16 = 64 B。描述子只说"我是全局的哪一块"，两端都不知道对方的并行度。</text>
<rect class="panel" x="20" y="70" width="1140" height="208" rx="8"/>
<text class="pt" x="36" y="94" text-anchor="start">① 存端：8 个 rank 各交一份纯元数据的描述子</text>
<text class="sm" x="36" y="112" text-anchor="start">同一 TP 位置的两个 DP rank 描述子逐字段相同，只有 replica_id 不同 —— 去冗余的全部依据就是这一个字段。</text>
