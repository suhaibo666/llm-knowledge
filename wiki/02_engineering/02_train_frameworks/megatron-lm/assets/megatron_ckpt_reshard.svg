<text class="sm" x="634" y="385" text-anchor="start">offset=(6,0) size=(2,4) 16 B</text>
<rect class="acc2" x="824" y="346" width="320" height="56" rx="8"/>
<text class="rank" x="834" y="366" text-anchor="start">丢弃：rank 4, 5, 6, 7（replica_id=1）</text>
<text class="costtx" x="834" y="385" text-anchor="start">省下 64 B 写盘与同等的 I/O 时间</text>
<rect class="panel" x="20" y="428" width="1140" height="200" rx="8"/>
<text class="pt" x="36" y="452" text-anchor="start">③ 载端：换成 TP=2，两个 rank 各要 [4,4]</text>
<text class="sm" x="36" y="470" text-anchor="start">载端描述子里没有任何"上次存的是 TP4"的信息；它只声明自己想要哪一块，求交由 DCP 完成。</text>
<rect class="acc1" x="36" y="486" width="250" height="56" rx="8"/>
<text class="rank" x="46" y="506" text-anchor="start">rank 0  (tp=0)</text>
<text class="dim" x="46" y="525" text-anchor="start">off=(0,0) shape=(4,4) frag=(2,1)</text>
