<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 560" width="1272" height="560" role="img">

  <defs>
    <marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker>
    <marker id="arrowAux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AEB6C2"/></marker>
    <marker id="arrowCost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C3651F"/></marker>
  </defs>
<style>
  text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .card{fill:#fff;stroke:#E4E7EC;stroke-width:1.2}
  .panel{fill:#FBFCFE;stroke:#D9DEE7;stroke-width:1.2}
  .neutral{fill:#fff;stroke:#AEB6C2;stroke-width:1.2}
  .ghost{fill:#F5F7FA;stroke:#D9DEE7;stroke-width:1.1}
  .acc1{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.5}
  .acc2{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.5}
  .main{fill:none;stroke:#2563EB;stroke-width:2;marker-end:url(#arrowMain)}
  .aux{fill:none;stroke:#AEB6C2;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arrowAux)}
  .cost{fill:none;stroke:#C3651F;stroke-width:2;marker-end:url(#arrowCost)}
  .edge{fill:none;stroke:#AEB6C2;stroke-width:1.4;stroke-dasharray:4 4}
  .ti{font-size:18px;font-weight:700;fill:#1F2430}
  .su{font-size:11.5px;fill:#747C88}
  .pt{font-size:14px;font-weight:700;fill:#2A313B}
  .tx{font-size:12px;fill:#38414D}
  .sm{font-size:10.5px;fill:#68717D}
  .dim{font-size:10.5px;font-weight:600;fill:#173F87}
  .costtx{font-size:10.5px;font-weight:600;fill:#8A4A11}
  .rank{font-size:11px;font-weight:700;fill:#5B6470}
  .cap{font-size:11px;fill:#747C88}
  .gl{fill:none;stroke:#C8CFDA;stroke-width:.9}
  .curve{fill:none;stroke:#2563EB;stroke-width:2}
  .trigline{fill:none;stroke:#C3651F;stroke-width:2;stroke-dasharray:7 4}
  .refline{fill:none;stroke:#C8CFDA;stroke-width:1;stroke-dasharray:3 4}
  .band{fill:#F5F7FA;stroke:none}
  .bar1{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.2}
  .bar0{fill:#fff;stroke:#AEB6C2;stroke-width:1.2}
  .bar2{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.2}
  .barg{fill:#F5F7FA;stroke:#D9DEE7;stroke-width:1.1}
  .dot{fill:#C3651F;stroke:none}
</style>
<text class="ti" x="28" y="32" text-anchor="start">图 2　上报值对真正执行的 GEMM 的偏差：每种效应各推向哪边、推多少</text>
<text class="su" x="28" y="52" text-anchor="start">同一算例的 MoE lane，上报值固定 = 1.943e11 FLOPs；条长 = 该口径下的 FLOPs / 上报值</text>
<path class="refline" d="M 550 82 L 550 428"/>
<text class="sm" x="550" y="76" text-anchor="middle">0.5</text>
<path class="refline" d="M 640 82 L 640 428"/>
<text class="sm" x="640" y="76" text-anchor="middle">0.75</text>
<path class="trigline" d="M 730 82 L 730 428"/>
<text class="sm" x="730" y="76" text-anchor="middle">1</text>
<path class="refline" d="M 850 82 L 850 428"/>
<text class="sm" x="850" y="76" text-anchor="middle">4/3</text>
<text class="tx" x="28" y="102" text-anchor="start">(a) THD padding：旧口径 vs 新口径</text>
<text class="sm" x="28" y="118" text-anchor="start">旧 2,048 token / 2,097,152 对 → 新 1,920 / 1,064,960</text>
<rect class="bar2" x="370" y="92" width="405.88601036269426" height="22" rx="3"/>
<text class="sm" x="376" y="107" text-anchor="start">旧口径 batch×seq（已修掉）</text>
<text class="sm" x="781.8860103626943" y="107" text-anchor="start">1.127</text>
<rect class="bar1" x="370" y="120" width="360" height="22" rx="3"/>
<text class="sm" x="376" y="135" text-anchor="start">新口径 = 真正执行</text>
<text class="sm" x="736" y="135" text-anchor="start">1</text>
<text class="costtx" x="890" y="108" text-anchor="start">旧口径高 +12.7%：token-linear ×1.067，core ×1.969</text>
<text class="tx" x="28" y="190" text-anchor="start">(b) MoE 容量丢弃 20% 的路由 token</text>
<text class="sm" x="28" y="206" text-anchor="start">路由专家占上报 37.3%；公式无 capacity 项</text>
<rect class="bar1" x="370" y="180" width="360" height="22" rx="3"/>
<text class="sm" x="376" y="195" text-anchor="start">上报值（不变）</text>
<text class="sm" x="736" y="195" text-anchor="start">1</text>
<rect class="bar0" x="370" y="208" width="333.139896373057" height="22" rx="3"/>
<text class="sm" x="376" y="223" text-anchor="start">真正执行</text>
<text class="sm" x="709.139896373057" y="223" text-anchor="start">0.925</text>
<text class="costtx" x="890" y="196" text-anchor="start">上报 / 执行 = 1.081（高估 +8.1%）</text>
<text class="tx" x="28" y="278" text-anchor="start">(c) 全量重计算：前向再跑一遍</text>
<text class="sm" x="28" y="294" text-anchor="start">公式里 3× 是常量，没有 recompute 项</text>
<rect class="bar1" x="370" y="268" width="360" height="22" rx="3"/>
<text class="sm" x="376" y="283" text-anchor="start">上报值（不变）</text>
<text class="sm" x="736" y="283" text-anchor="start">1</text>
<rect class="bar0" x="370" y="296" width="480" height="22" rx="3"/>
<text class="sm" x="376" y="311" text-anchor="start">真正执行 = 4/3 × 上报</text>
<text class="sm" x="856" y="311" text-anchor="start">1.333</text>
<text class="dim" x="890" y="284" text-anchor="start">上报 / 执行 = 0.75（低估 −25%）</text>
<text class="tx" x="28" y="366" text-anchor="start">(d) (b) 与 (c) 同时发生</text>
<text class="sm" x="28" y="382" text-anchor="start">方向相反的两个偏差在同一份日志里部分抵消</text>
<rect class="bar1" x="370" y="356" width="360" height="22" rx="3"/>
<text class="sm" x="376" y="371" text-anchor="start">上报值（不变）</text>
<text class="sm" x="736" y="371" text-anchor="start">1</text>
<rect class="bar0" x="370" y="384" width="444.1865284974093" height="22" rx="3"/>
<text class="sm" x="376" y="399" text-anchor="start">真正执行</text>
<text class="sm" x="820.1865284974093" y="399" text-anchor="start">1.234</text>
<text class="dim" x="890" y="372" text-anchor="start">上报 / 执行 = 0.810（低估 −19%）</text>
<rect class="neutral" x="28" y="442" width="600" height="96" rx="8"/>
<text class="tx" x="40" y="463" text-anchor="start">方向表</text>
<path class="edge" d="M 40 471 L 616 471"/>
<text class="sm" x="40" y="489" text-anchor="start">精确：dense、dropless MoE、THD 真实长度（varlen attention 只算真 token）</text>
<text class="sm" x="40" y="505" text-anchor="start">高估：MoE 容量丢弃（被丢的路由 GEMM 仍被计入）</text>
<text class="sm" x="40" y="521" text-anchor="start">低估：任何形式的重计算；以及从不计入的 norm / softmax / 通信</text>
<text class="sm" x="40" y="537" text-anchor="start">因此它是「等效吞吐」：假定被丢 token 也按当前速度处理、重跑的前向不算数</text>
<rect class="ghost" x="648" y="442" width="596" height="96" rx="8"/>
<text class="tx" x="660" y="463" text-anchor="start">为什么 (a) 已经不在偏差表里</text>
<path class="edge" d="M 660 471 L 1232 471"/>
<text class="sm" x="660" y="489" text-anchor="start">token-linear 乘 total_real_tokens_in_batch，core 乘 seqlen_squared_sum_in_batch，</text>
<text class="sm" x="660" y="505" text-anchor="start">docstring 承诺 neither kind of padding shows up in the reported FLOPs；</text>
<text class="sm" x="660" y="521" text-anchor="start">但这条前提是有人把真实 cu_seqlens 喂给累加器 —— 见正文 §5.1 的接线边界。</text>
<text class="sm" x="660" y="537" text-anchor="start">(b) 没有对应的 TODO，是当前唯一留下的高估来源。</text>
</svg>