<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 1131" role="img" aria-label="mHC：恢复次序、梯度 barrier 与固定地址"><style>text{font-family:'Segoe UI','Microsoft YaHei',sans-serif;fill:#1f2937;font-size:16px}
.title{font-size:23px;font-weight:650}.subtitle{fill:#64748b;font-size:15px}
.cap{fill:#64748b;font-size:14px}.rowname{font-weight:650;font-size:16px}
.neutral{fill:#fff;stroke:#cbd5e1}.ghost{fill:#f8fafc;stroke:#e2e8f0}
.acc1{fill:#eff6ff;stroke:#2563eb}.acc2{fill:#fff7ed;stroke:#d97706}
.arrow{fill:none;stroke:#2563eb;stroke-width:2;marker-end:url(#a)}
.aux{stroke:#94a3b8;stroke-width:1.2}.box{rx:7;stroke-width:1.2}</style><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs><rect width="1240" height="1131" fill="#fff"/><text class="title" x="24" y="34">mHC：恢复次序、梯度 barrier 与固定地址</text><text class="subtitle" x="24" y="61">microbatch A · X0[4,1,4] · t0…t3 · BF16 · TP=2 · SP off · 2 streams: C0[4,1,8], 32 el / 64 B</text><text class="rowname" x="198" y="99">原前向 producer / consumer</text><text class="rowname" x="455" y="99">前反向间隔 owner</text><text class="rowname" x="712" y="99">loss backward 前恢复</text><text class="rowname" x="969" y="99">消费与释放边界</text><g data-plane="mhc-eager"><rect class="ghost box" x="24" y="122" width="1192" height="182"/><text class="rowname" x="36" y="150">eager group</text><text class="rowname" x="36" y="173">L0→L1; L2→L3</text><g data-cell="mhc-eager-0"><rect class="neutral box" x="186" y="134" width="247" height="158"/><text class="" x="198" y="160">compute_mappings 正常保留</text><text class="" x="198" y="183">C→aggregate→norm→attn</text><text class="" x="198" y="206">residual/post→norm→MLP</text><text class="" x="198" y="229">按顺序注册 CWO</text></g><path class="arrow" d="M 433 213 h 8"/><g data-cell="mhc-eager-1"><rect class="acc2 box" x="443" y="134" width="247" height="158"/><text class="" x="455" y="160">每组 manager 保存</text><text class="" x="455" y="183">checkpoints</text><text class="" x="455" y="206">每个 producer 独立 RNG</text><text class="" x="455" y="229">组尾保留 / 其余统一释放</text><text class="" x="455" y="252">不能给所有 CWO 一个 RNG</text></g><path class="arrow" d="M 690 213 h 8"/><g data-cell="mhc-eager-2"><rect class="acc1 box" x="700" y="134" width="247" height="158"/><text class="" x="712" y="160">组尾梯度 unified hook</text><text class="" x="712" y="183">recompute_now → 全组</text><text class="" x="712" y="206">按原 F 顺序逐个恢复</text><text class="" x="712" y="229">先 producer，再 dependent</text></g><path class="arrow" d="M 947 213 h 8"/><g data-cell="mhc-eager-3"><rect class="neutral box" x="957" y="134" width="247" height="158"/><text class="" x="969" y="160">consumer B 可读旧 storage</text><text class="" x="969" y="183">各 CWO B → streams/dW</text><text class="" x="969" y="206">ctx 清理不等于 arena 释放</text><text class="" x="969" y="229">容量受组边界和活读者限制</text></g></g><g data-plane="mhc-post-branches"><rect class="ghost box" x="24" y="316" width="1192" height="190"/><text class="rowname" x="36" y="344">post BDA</text><text class="rowname" x="36" y="367">exclusive A / B</text><g data-cell="mhc-post-branches-0"><rect class="neutral box" x="186" y="328" width="247" height="166"/><text class="" x="198" y="354">互斥 A: dropout=0 或 eval</text><text class="" x="198" y="377">fused/reference h_post-BDA</text><text class="" x="198" y="400">互斥 B: dropout&gt;0 且 train</text><text class="" x="198" y="423">h_res→h_post expand→BDA</text></g><path class="arrow" d="M 433 411 h 8"/><g data-cell="mhc-post-branches-1"><rect class="neutral box" x="443" y="328" width="247" height="166"/><text class="" x="455" y="354">只选 A 或 B 包入 CWO</text><text class="" x="455" y="377">保留所选 op 输入 + 原 RNG</text><text class="" x="455" y="400">组尾 discard 所选 op 输出</text><text class="" x="455" y="423">输入/RNG 跨前反向间隔</text></g><path class="arrow" d="M 690 411 h 8"/><g data-cell="mhc-post-branches-2"><rect class="acc1 box" x="700" y="328" width="247" height="166"/><text class="" x="712" y="354">A: replay fused/reference</text><text class="" x="712" y="377">op</text><text class="" x="712" y="400">B: replay 顺序 op</text><text class="" x="712" y="423">每 checkpoint 恢复同 RNG</text><text class="" x="712" y="446">重建被选 producer 的输出</text></g><path class="arrow" d="M 947 411 h 8"/><g data-cell="mhc-post-branches-3"><rect class="neutral box" x="957" y="328" width="247" height="166"/><text class="" x="969" y="354">恢复同 n-stream 输出</text><text class="" x="969" y="377">后继反向 → 所选 producer</text><text class="" x="969" y="400">反向</text><text class="" x="969" y="423">返回 mapping/input grads</text><text class="" x="969" y="446">full graph 不允许非零</text><text class="" x="969" y="469">dropout</text></g></g><g data-plane="mhc-ep-barrier"><rect class="ghost box" x="24" y="518" width="1192" height="158"/><text class="rowname" x="36" y="546">EP overlap</text><text class="rowname" x="36" y="569">explicit barrier</text><g data-cell="mhc-ep-barrier-0"><rect class="neutral box" x="186" y="530" width="247" height="134"/><text class="" x="198" y="556">正常 compute/comm 节点</text><text class="" x="198" y="579">manager 随在途 plan 独立</text><text class="" x="198" y="602">组尾 discard_all_outputs</text></g><path class="arrow" d="M 433 597 h 8"/><g data-cell="mhc-ep-barrier-1"><rect class="acc2 box" x="443" y="530" width="247" height="134"/><text class="" x="455" y="556">recompute node 在 compute</text><text class="" x="455" y="579">stream</text><text class="" x="455" y="602">BEFORE_COMBINE_BWD</text><text class="" x="455" y="625">所有 producer 仅此 phase</text></g><path class="arrow" d="M 690 597 h 8"/><g data-cell="mhc-ep-barrier-2"><rect class="acc1 box" x="700" y="530" width="247" height="134"/><text class="" x="712" y="556">recompute_until → 全组</text><text class="" x="712" y="579">先于 mhc_post/combine B</text><text class="" x="712" y="602">另一 phase 也仍全组 replay</text></g><path class="arrow" d="M 947 597 h 8"/><g data-cell="mhc-ep-barrier-3"><rect class="neutral box" x="957" y="530" width="247" height="134"/><text class="" x="969" y="556">恢复 → mhc_post B→combine</text><text class="" x="969" y="579"> B</text><text class="" x="969" y="602">顺序由节点/stream 依赖保证</text><text class="" x="969" y="625">不在 replay 点回收 slot</text></g></g><g data-plane="mhc-te-arena"><rect class="ghost box" x="24" y="688" width="1192" height="203"/><text class="rowname" x="36" y="716">TE attention split</text><text class="rowname" x="36" y="739">fixed-address</text><text class="rowname" x="36" y="762">arena</text><g data-cell="mhc-te-arena-0"><rect class="neutral box" x="186" y="700" width="247" height="179"/><text class="" x="198" y="726">eager aggregate producer</text><text class="" x="198" y="749">直接写 slot.writer</text><text class="" x="198" y="772">graph consumer 绑定同地址</text><text class="" x="198" y="795">input norm + attention 捕获</text></g><path class="arrow" d="M 433 789.5 h 8"/><g data-cell="mhc-te-arena-1"><rect class="acc2 box" x="443" y="700" width="247" height="179"/><text class="" x="455" y="726">slot 保留物理 allocation</text><text class="" x="455" y="749">discard 仅逻辑失效</text><text class="" x="455" y="772">checkpoint 持有输入与 RNG</text><text class="" x="455" y="795">不 resize captured storage</text></g><path class="arrow" d="M 690 789.5 h 8"/><g data-cell="mhc-te-arena-2"><rect class="acc1 box" x="700" y="700" width="247" height="179"/><text class="" x="712" y="726">验证 address/shape/dtype</text><text class="" x="712" y="749">replay 直接写同 slot</text><text class="" x="712" y="772">旧逻辑 tensor storage 衔接</text><text class="" x="712" y="795">不能新 tensor 换掉 graph 输</text><text class="" x="712" y="818">入</text></g><path class="arrow" d="M 947 789.5 h 8"/><g data-cell="mhc-te-arena-3"><rect class="neutral box" x="957" y="700" width="247" height="179"/><text class="" x="969" y="726">captured attention B 读</text><text class="" x="969" y="749">slot</text><text class="" x="969" y="772">mHC post B 也可能读取</text><text class="" x="969" y="795">recompute 返回非</text><text class="" x="969" y="818">last-reader</text><text class="" x="969" y="841">非</text><text class="" x="969" y="864">Hybrid/attn-only/mhc-only</text></g></g><g data-plane="mhc-full-graph"><rect class="ghost box" x="24" y="903" width="1192" height="158"/><text class="rowname" x="36" y="931">full_iteration</text><text class="rowname" x="36" y="954">captured lifecycle</text><g data-cell="mhc-full-graph-0"><rect class="neutral box" x="186" y="915" width="247" height="134"/><text class="" x="198" y="941">CWO 在 warmup bypass</text><text class="" x="198" y="964">capture 包含 producer</text><text class="" x="198" y="987">discard + replay + backward</text></g><path class="arrow" d="M 433 982 h 8"/><g data-cell="mhc-full-graph-1"><rect class="acc2 box" x="443" y="915" width="247" height="134"/><text class="" x="455" y="941">full graph 固定地址</text><text class="" x="455" y="964">零 attention/hidden dropout</text><text class="" x="455" y="987">local graph + mhc 被拒绝</text></g><path class="arrow" d="M 690 982 h 8"/><g data-cell="mhc-full-graph-2"><rect class="acc1 box" x="700" y="915" width="247" height="134"/><text class="" x="712" y="941">graph replay 重放已捕获操作</text><text class="" x="712" y="964">不是普通 checkpoint wrapper</text><text class="" x="712" y="987">普通 checkpoint capture</text><text class="" x="712" y="1010">bypass</text></g><path class="arrow" d="M 947 982 h 8"/><g data-cell="mhc-full-graph-3"><rect class="neutral box" x="957" y="915" width="247" height="134"/><text class="" x="969" y="941">图内 B → grads</text><text class="" x="969" y="964">图调度完成后 finalizer</text><text class="" x="969" y="987">optimizer-ready 另有同步</text></g></g><text class="cap" x="24" y="1090">BEFORE_ATTN_BWD 是另一个调用参数；所有 producer 仍只注册 BEFORE_COMBINE_BWD，尚无 phase 分区。</text><text class="cap" x="24" y="1113">每次恢复只证明后继能够继续读取；最后 reader、梯度同步和 optimizer 更新由各自 owner 承接。</text></svg>
