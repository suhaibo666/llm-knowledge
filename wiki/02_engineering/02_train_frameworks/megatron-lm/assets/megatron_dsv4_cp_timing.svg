<rect class="acc2" x="408.54545454545456" y="506" width="100.18181818181819" height="26" rx="4"/>
<text class="costtx" x="416.54545454545456" y="523" text-anchor="start">4</text>
<rect class="neutral" x="512.7272727272727" y="506" width="100.18181818181819" height="26" rx="4"/>
<text class="sm" x="520.7272727272727" y="523" text-anchor="start">5</text>
<rect class="acc2" x="616.909090909091" y="506" width="100.18181818181819" height="26" rx="4"/>
<text class="costtx" x="624.909090909091" y="523" text-anchor="start">6</text>
<rect class="neutral" x="721.0909090909091" y="506" width="100.18181818181819" height="26" rx="4"/>
<text class="sm" x="729.0909090909091" y="523" text-anchor="start">7</text>
<rect class="neutral" x="825.2727272727273" y="506" width="100.18181818181819" height="26" rx="4"/>
<text class="sm" x="833.2727272727273" y="523" text-anchor="start">8</text>
<rect class="neutral" x="929.4545454545455" y="506" width="100.18181818181819" height="26" rx="4"/>
<text class="sm" x="937.4545454545455" y="523" text-anchor="start">9</text>
<rect class="neutral" x="1033.6363636363637" y="506" width="100.18181818181819" height="26" rx="4"/>
<text class="sm" x="1041.6363636363637" y="523" text-anchor="start">10</text>
<rect class="acc2" x="1137.818181818182" y="547" width="100.18181818181819" height="26" rx="4"/>
<text class="costtx" x="1145.818181818182" y="564" text-anchor="start">11</text>
<rect class="acc1" x="200.1818181818182" y="544" width="204.36363636363637" height="14" rx="3"/>
<text class="dim" x="206.1818181818182" y="554.5" text-anchor="start">RS-KV·在飞</text>
<rect class="acc1" x="200.1818181818182" y="560" width="412.7272727272728" height="14" rx="3"/>
<text class="dim" x="206.1818181818182" y="570.5" text-anchor="start">RS-K·在飞</text>
<text class="sm" x="28" y="596" text-anchor="start">1 稀疏注意力反向</text>
<text class="sm" x="433.3333333333333" y="596" text-anchor="start">2 本地 indexer 梯度缩放</text>
<text class="sm" x="838.6666666666666" y="596" text-anchor="start">3 Indexer Q / weights 投影反向</text>
<text class="sm" x="28" y="610" text-anchor="start">4 wait RS-KV</text>
<text class="sm" x="433.3333333333333" y="610" text-anchor="start">5 attention-KV compressor 反向</text>
<text class="sm" x="838.6666666666666" y="610" text-anchor="start">6 wait RS-K</text>
<text class="sm" x="28" y="624" text-anchor="start">7 Indexer-K compressor 反向</text>
<text class="sm" x="433.3333333333333" y="624" text-anchor="start">8 压紧反向：散射到 local + boundary</text>
<text class="sm" x="838.6666666666666" y="624" text-anchor="start">9 Q 投影反向</text>
<text class="sm" x="28" y="638" text-anchor="start">10 KV 投影反向（boundary KV → boundary hidden）</text>
<text class="sm" x="433.3333333333333" y="638" text-anchor="start">11 P2P 边界梯度回送（阻塞）</text>
<text class="dim" x="28" y="652" text-anchor="start">RS-KV：RS 压缩 KV 发起，发起于 1 之后、wait 于 4 之前</text>
<text class="dim" x="28" y="666" text-anchor="start">RS-K：RS Indexer-K 发起，发起于 1 之后、wait 于 6 之前</text>
<rect class="neutral" x="28" y="700" width="600" height="182" rx="8"/>
<text class="tx" x="40" y="721" text-anchor="start">顺序不变量（脚本算出）</text>
<path class="edge" d="M 40 729 L 616 729"/>
<text class="dim" x="40" y="747" text-anchor="start">前向：AG-K 发起 → AG-KV 发起 → 本地 Indexer Q / weights 投影 → wait K → top-k → wait KV</text>
<text class="sm" x="40" y="763" text-anchor="start">反向 FromTopkFunc 内：sparse_attention_backward → launch_compressed_kv → launch_indexer</text>
<text class="sm" x="40" y="779" text-anchor="start">反向 autograd（就绪节点里序号大者先执行）：</text>
<text class="sm" x="40" y="795" text-anchor="start">  fused → q_weight_branch → wait_compressed_kv</text>
<text class="sm" x="40" y="811" text-anchor="start">  → attention_kv_compressor → wait_indexer → indexer_compressor</text>
<text class="sm" x="40" y="827" text-anchor="start">每个 wait 只被消费它的分支触发；unfused / 无 loss 的分支不走这条路，退回同步 RS</text>
<text class="sm" x="40" y="843" text-anchor="start">  （_GatherFromSequenceParallelRegionAsync.backward 保留同步 gather 的 RS 语义）</text>
<rect class="neutral" x="644" y="700" width="600" height="182" rx="8"/>
<text class="tx" x="656" y="721" text-anchor="start">锁定这些顺序的测试（冻结基线）</text>
<path class="edge" d="M 656 729 L 1232 729"/>
<text class="sm" x="656" y="747" text-anchor="start">test_csa_fused_sparse_attention.py::TestCPCommunicationOverlap::</text>
<text class="sm" x="656" y="763" text-anchor="start">  test_cp_backward_launches_collectives_in_dependency_order（发起顺序、梯度槽位）</text>
<text class="sm" x="656" y="779" text-anchor="start">  test_deferred_reduce_scatter_waits_follow_consumer_branch_order（wait 顺序）</text>
<text class="sm" x="656" y="795" text-anchor="start">  test_deferred_reduce_scatter_wait_requires_published_handle（未发起即消费 → RuntimeError）</text>
<text class="sm" x="656" y="811" text-anchor="start">  test_deferred_reduce_scatter_wait_is_branch_local（wait 后 handle 置空）</text>
<text class="sm" x="656" y="827" text-anchor="start">tests/unit_tests/tensor_parallel/test_mappings.py：async gather / reduce-scatter 与同步版等价</text>
<text class="costtx" x="656" y="843" text-anchor="start">本图不写时长：真实重叠比例取决于 NCCL 带宽与本地投影的 GEMM 规模</text>
</svg>