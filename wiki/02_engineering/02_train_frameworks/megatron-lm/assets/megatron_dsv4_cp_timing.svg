<rect class="neutral" x="512.7272727272727" y="114" width="100.18181818181819" height="26" rx="4"/>
<text class="sm" x="520.7272727272727" y="131" text-anchor="start">5</text>
<rect class="neutral" x="616.909090909091" y="114" width="100.18181818181819" height="26" rx="4"/>
<text class="sm" x="624.909090909091" y="131" text-anchor="start">6</text>
<rect class="acc2" x="721.0909090909091" y="114" width="100.18181818181819" height="26" rx="4"/>
<text class="costtx" x="729.0909090909091" y="131" text-anchor="start">7</text>
<rect class="neutral" x="825.2727272727273" y="114" width="100.18181818181819" height="26" rx="4"/>
<text class="sm" x="833.2727272727273" y="131" text-anchor="start">8</text>
<rect class="acc2" x="929.4545454545455" y="114" width="100.18181818181819" height="26" rx="4"/>
<text class="costtx" x="937.4545454545455" y="131" text-anchor="start">9</text>
<rect class="neutral" x="1033.6363636363637" y="114" width="100.18181818181819" height="26" rx="4"/>
<text class="sm" x="1041.6363636363637" y="131" text-anchor="start">10</text>
<rect class="neutral" x="1137.818181818182" y="114" width="100.18181818181819" height="26" rx="4"/>
<text class="sm" x="1145.818181818182" y="131" text-anchor="start">11</text>
<rect class="acc1" x="512.7272727272727" y="152" width="204.36363636363637" height="14" rx="3"/>
<text class="dim" x="518.7272727272727" y="162.5" text-anchor="start">AG-K·在飞</text>
<rect class="acc1" x="616.909090909091" y="168" width="308.5454545454545" height="14" rx="3"/>
<text class="dim" x="622.909090909091" y="178.5" text-anchor="start">AG-KV·在飞</text>
<text class="sm" x="28" y="204" text-anchor="start">1 P2P 左边界 hidden</text>
<text class="sm" x="433.3333333333333" y="204" text-anchor="start">2 Q / KV 投影 + CP-aware RoPE（含 boundary KV）</text>
<text class="sm" x="838.6666666666666" y="204" text-anchor="start">3 压紧 hidden_compact</text>
<text class="sm" x="28" y="218" text-anchor="start">4 Indexer-K compressor</text>
<text class="sm" x="433.3333333333333" y="218" text-anchor="start">5 attention-KV compressor</text>
<text class="sm" x="838.6666666666666" y="218" text-anchor="start">6 Indexer Q 投影 + RoPE + weights 投影</text>
<text class="sm" x="28" y="232" text-anchor="start">7 wait K</text>
<text class="sm" x="433.3333333333333" y="232" text-anchor="start">8 seq-major 重排 + top-k</text>
<text class="sm" x="838.6666666666666" y="232" text-anchor="start">9 wait KV</text>
<text class="sm" x="28" y="246" text-anchor="start">10 cat + build_attention_indices</text>
<text class="sm" x="433.3333333333333" y="246" text-anchor="start">11 融合稀疏注意力 + indexer loss</text>
<text class="dim" x="28" y="260" text-anchor="start">AG-K：AG Indexer-K，发起于 4 之后、wait 于 7 之前</text>
<text class="dim" x="28" y="274" text-anchor="start">AG-KV：AG 压缩 KV，发起于 5 之后、wait 于 9 之前</text>
<text class="pt" x="28" y="306" text-anchor="start">② 前向·无 indexer 的层（ratio 128）：同一入口，但 gather 是同步的</text>
<text class="sm" x="28" y="322" text-anchor="start">没有可与之重叠的本地投影，压缩 KV 走 gather_from_sequence_parallel_region，返回前阻塞</text>
<text class="rank" x="84" y="353" text-anchor="end">计算流</text>
<text class="rank" x="84" y="389" text-anchor="end">通信流</text>
<path class="gl" d="M 90 349 L 1244 349"/>
<path class="gl" d="M 90 385 L 1244 385"/>
<rect class="acc2" x="96" y="372" width="159.71428571428572" height="26" rx="4"/>
<text class="costtx" x="104" y="389" text-anchor="start">1</text>
<rect class="neutral" x="259.7142857142857" y="336" width="159.71428571428572" height="26" rx="4"/>
<text class="sm" x="267.7142857142857" y="353" text-anchor="start">2</text>
<rect class="neutral" x="423.42857142857144" y="336" width="159.71428571428572" height="26" rx="4"/>
<text class="sm" x="431.42857142857144" y="353" text-anchor="start">3</text>
<rect class="neutral" x="587.1428571428571" y="336" width="159.71428571428572" height="26" rx="4"/>
<text class="sm" x="595.1428571428571" y="353" text-anchor="start">4</text>
<rect class="acc2" x="750.8571428571429" y="372" width="159.71428571428572" height="26" rx="4"/>
<text class="costtx" x="758.8571428571429" y="389" text-anchor="start">5</text>
<rect class="neutral" x="914.5714285714287" y="336" width="159.71428571428572" height="26" rx="4"/>
<text class="sm" x="922.5714285714287" y="353" text-anchor="start">6</text>
<rect class="neutral" x="1078.2857142857142" y="336" width="159.71428571428572" height="26" rx="4"/>
<text class="sm" x="1086.2857142857142" y="353" text-anchor="start">7</text>
<text class="sm" x="28" y="416" text-anchor="start">1 P2P 左边界 hidden</text>
<text class="sm" x="433.3333333333333" y="416" text-anchor="start">2 Q / KV 投影 + CP-aware RoPE</text>
<text class="sm" x="838.6666666666666" y="416" text-anchor="start">3 压紧 hidden_compact</text>
<text class="sm" x="28" y="430" text-anchor="start">4 attention-KV compressor</text>
<text class="sm" x="433.3333333333333" y="430" text-anchor="start">5 同步 AG 压缩 KV</text>
<text class="sm" x="838.6666666666666" y="430" text-anchor="start">6 build_attention_indices（全部可见块）</text>
<text class="sm" x="28" y="444" text-anchor="start">7 稀疏注意力</text>
<text class="pt" x="28" y="476" text-anchor="start">③ 反向·融合 indexer-loss 路径：FusedCSAIndexerSparseAttnFromTopkFunc.backward + 两个延迟 wait</text>
<text class="sm" x="28" y="492" text-anchor="start">两个 RS 都在稀疏注意力反向之后发起，KV 先于 K；wait 只在各自 compressor 的反向分支上，由 autograd 序号从大到小的调度自然错开</text>
<text class="rank" x="84" y="523" text-anchor="end">计算流</text>
<text class="rank" x="84" y="564" text-anchor="end">通信流</text>
