<text class="ti" x="28" y="32" text-anchor="start">图 2　Stage 2 的重叠：前向两个异步 AllGather 藏在本地投影后面，反向两个 reduce-scatter 只在消费分支等待</text>
<text class="su" x="28" y="52" text-anchor="start">块按源码语句序等宽排列，不表示时长；蓝 = 在飞的异步集合通信，橙 = 阻塞点（同步 P2P / 同步 gather / wait）</text>
<text class="pt" x="28" y="84" text-anchor="start">① 前向·有 indexer 的层（ratio 4）：_forward_thd_cp</text>
<text class="sm" x="28" y="100" text-anchor="start">每个 rank 都先发 Indexer-K 再发压缩 KV，所以集合通信入队顺序全组一致；两次 wait 各自紧贴第一个消费者</text>
<text class="rank" x="84" y="131" text-anchor="end">计算流</text>
<text class="rank" x="84" y="172" text-anchor="end">通信流</text>
<path class="gl" d="M 90 127 L 1244 127"/>
<path class="gl" d="M 90 168 L 1244 168"/>
<rect class="acc2" x="96" y="155" width="100.18181818181819" height="26" rx="4"/>
