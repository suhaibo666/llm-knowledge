height="45" rx="6" class="neutral"/><text x="452" y="233" class="">bias + GeLU</text><text x="853" y="228" class="small">免去独立 U 往返</text><text x="853" y="250" class="small">反向仍保存所需输入</text><text x="26" y="328" class="bold">Graph + 融合</text><text x="26" y="353" class="small">1 次图提交</text><rect x="219" y="292" width="601" height="66" rx="6" class="acc1"/><rect x="230" y="302" width="178" height="45" rx="6" class="neutral"/><text x="245" y="330" class="">GEMM</text><path d="M411,324 L432,324" class="arrow main" marker-end="url(#head)"/><rect x="437" y="302" width="178" height="45" rx="6" class="neutral"/><text x="452" y="330" class="">bias + GeLU</text><text x="853" y="325" class="small">免去独立 U 往返</text><text x="853" y="347" class="small">图内设备工作仍存在</text><text x="26" y="419" class="bold">捕获边界扩展：同一 attention → router → experts/通信 → 合并输出</text><text x="26" y="471" class="bold">partial</text><rect x="218" y="444" width="151" height="46" rx="6" class="neutral"/><text x="227" y="471" class="small">图内</text><path d="M370,466 L379,466" class="arrow aux" marker-end="url(#head)"/><rect x="382" y="444" width="151" height="46" rx="6" class="neutral"/><text x="391" y="471" class="small">图内</text><path d="M534,466 L543,466" class="arrow aux" marker-end="url(#head)"/><rect x="546" y="444" width="151" height="46" rx="6" class="ghost"/><text x="555" y="471" class="small">eager</text><path d="M698,466 L707,466" class="arrow aux" marker-end="url(#head)"/><rect x="710" y="444" width="151" height="46" rx="6" class="ghost"/><text x="719" y="471" class="small">eager</text><text x="892" y="462" class="small">BWD 沿边界返回</text><text x="892" y="483" class="small">输出 → loss → backward</text><text x="26" y="541" class="bold">drop-and-pad</text><rect x="218" y="514" width="151" height="46" rx="6" class="neutral"/><text x="227" y="541" class="small">图内</text><path d="M370,536 L379,536" class="arrow aux" marker-end="url(#head)"/><rect x="382" y="514" width="151" height="46" rx="6" class="neutral"/><text x="391" y="541" class="small">图内</text><path d="M534,536 L543,536" class="arrow aux" marker-end="url(#head)"/><rect x="546" y="514" width="151" height="46" rx="6" class="neutral"/><text x="555" y="541" class="small">固定专家容量</text><path d="M698,536 L707,536" class="arrow aux" marker-end="url(#head)"/><rect x="710" y="514" width="151" height="46" rx="6" class="neutral"/><text x="719" y="541" class="small">图内</text><text x="892" y="532" class="small">丢弃 / padding 成本</text><text x="892" y="553" class="small">输出 → loss → backward</text><text x="26" y="611" class="bold">HybridEP whole</text><rect x="218" y="584" width="151" height="46" rx="6" class="neutral"/><text x="227" y="611" class="small">TE 图内</text><path d="M370,606 L379,606" class="arrow aux" marker-end="url(#head)"/><rect x="382" y="584" width="151" height="46" rx="6" class="neutral"/><text x="391" y="611" class="small">TE 图内</text><path d="M534,606 L543,606" class="arrow aux" marker-end="url(#head)"/><rect x="546" y="584" width="151" height="46" rx="6" class="neutral"/><text x="555" y="611" class="small">rank 容量 + stash</text><path d="M698,606 L707,606" class="arrow aux" marker-end="url(#head)"/><rect x="710" y="584" width="151" height="46" rx="6" class="neutral"/><text x="719" y="611" class="small">TE 图内</text><text x="892" y="602" class="small">溢出硬失败；固定调度</text><text x="892" y="623" class="small">输出 → loss → backward</text><text x="26" y="681" class="bold">full_iteration</text><rect x="218" y="654" width="151" height="46" rx="6" class="neutral"/><text x="227" y="681" class="small">整步图</text><path d="M370,676 L379,676" class="arrow aux" marker-end="url(#head)"/><rect x="382" y="654" width="151" height="46" rx="6" class="neutral"/><text x="391" y="681" class="small">整步图</text><path d="M534,676 L543,676" class="arrow aux" marker-end="url(#head)"/><rect x="546" y="654" width="151" height="46" rx="6" class="neutral"/><text x="555" y="681" class="small">须可捕获</text><path d="M698,676 L707,676" class="arrow aux" marker-end="url(#head)"/><rect x="710" y="654" width="151" height="46" rx="6" class="neutral"/><text x="719" y="681" class="small">整步图</text><text x="892" y="672" class="small">整步 F/B；optimizer 图外</text><text x="892" y="693" class="small">输出 → loss → backward</text><text x="26" y="755" class="small">图上提交数是教学模型，非测量 kernel 数；TE 内部的量化/融合/捕获由依赖实现，不能由此换算加速比。</text></svg>
