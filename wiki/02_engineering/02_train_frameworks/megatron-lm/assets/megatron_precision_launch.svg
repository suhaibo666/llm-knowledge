<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="445" viewBox="0 0 1220 445" role="img"><title>融合减少中间流量，Graph 减少主机提交</title><style>text{font-family:'Microsoft YaHei','Segoe UI',sans-serif;font-size:15px;fill:#2A313B}.title{font-size:23px;font-weight:700}.small{font-size:13px;fill:#626B77}.bold{font-weight:700}.neutral{fill:#fff;stroke:#C7CCD3}.ghost{fill:#F7F6F3;stroke:#DDD9D2}.acc1{fill:#EAF1FD;stroke:#2563EB}.acc2{fill:#FCF1E6;stroke:#C3651F}.arrow{fill:none;stroke:#98A1AD;stroke-width:1.3}.main{stroke:#2563EB;stroke-width:2}.dash{fill:none;stroke:#C3651F;stroke-dasharray:5 4}</style><defs><marker id="head" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#98A1AD"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><text x="26" y="37" class="title">融合减少中间流量，Graph 减少主机提交</text><text x="26" y="66" class="small">X → GEMM → Z → bias → U → GeLU → A。U 为 BF16 32 KiB；横向仅表顺序，不表耗时；纯融合对照须对齐 GeLU 近似。</text><text x="26" y="134" class="bold">eager 基础</text><text x="26" y="159" class="small">3 次操作提交</text><rect x="230" y="108" width="178" height="45" rx="6" class="neutral"/><text x="245" y="136" class="">GEMM</text><path d="M411,130 L432,130" class="arrow main" marker-end="url(#head)"/><rect x="437" y="108" width="178" height="45" rx="6" class="neutral"/><text x="452" y="136" class="">bias</text><path d="M618,130 L639,130" class="arrow main" marker-end="url(#head)"/><rect x="644" y="108" width="178" height="45" rx="6" class="neutral"/><text x="659" y="136" class="">GeLU</text><text x="853" y="131" class="bold">U 写 + 读 = 64 KiB</text><text x="853" y="153" class="small">反向仍保存所需输入</text><text x="26" y="231" class="bold">eager + 融合</text><text x="26" y="256" class="small">2 次操作提交</text><rect x="230" y="205" width="178" height="45" rx="6" class="neutral"/><text x="245" y="233" class="">GEMM</text><path d="M411,227 L432,227" class="arrow main" marker-end="url(#head)"/><rect x="437" y="205" width="178" height="45" rx="6" class="neutral"/><text x="452" y="233" class="">bias + GeLU</text><text x="853" y="228" class="small">免去独立 U 往返</text><text x="853" y="250" class="small">反向仍保存所需输入</text><text x="26" y="328" class="bold">Graph + 融合</text><text x="26" y="353" class="small">1 次图提交</text><rect x="219" y="292" width="601" height="66" rx="6" class="acc1"/><rect x="230" y="302" width="178" height="45" rx="6" class="neutral"/><text x="245" y="330" class="">GEMM</text><path d="M411,324 L432,324" class="arrow main" marker-end="url(#head)"/><rect x="437" y="302" width="178" height="45" rx="6" class="neutral"/><text x="452" y="330" class="">bias + GeLU</text><text x="853" y="325" class="small">免去独立 U 往返</text><text x="853" y="347" class="small">图内设备工作仍存在</text><text x="26" y="419" class="small">图上提交数是教学模型，非测量 kernel 数；三种机制组合后仍需核对整步成本与数值。</text></svg>
