<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 470" width="1272" height="470" role="img">

  <defs>
    <marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker>
    <marker id="arrowAux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AEB6C2"/></marker>
    <marker id="arrowCost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C3651F"/></marker>
  </defs>
<style>
  text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .card{fill:#fff;stroke:#E4E7EC;stroke-width:1.2}
  .panel{fill:#FBFCFE;stroke:#D9DEE7;stroke-width:1.2}
  .neutral{fill:#fff;stroke:#AEB6C2;stroke-width:1.2}
  .ghost{fill:#F5F7FA;stroke:#D9DEE7;stroke-width:1.1}
  .acc1{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.5}
  .acc2{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.5}
  .main{fill:none;stroke:#2563EB;stroke-width:2;marker-end:url(#arrowMain)}
  .aux{fill:none;stroke:#AEB6C2;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arrowAux)}
  .cost{fill:none;stroke:#C3651F;stroke-width:2;marker-end:url(#arrowCost)}
  .edge{fill:none;stroke:#AEB6C2;stroke-width:1.4;stroke-dasharray:4 4}
  .ti{font-size:18px;font-weight:700;fill:#1F2430}
  .su{font-size:11.5px;fill:#747C88}
  .pt{font-size:14px;font-weight:700;fill:#2A313B}
  .tx{font-size:12px;fill:#38414D}
  .sm{font-size:10.5px;fill:#68717D}
  .dim{font-size:10.5px;font-weight:600;fill:#173F87}
  .costtx{font-size:10.5px;font-weight:600;fill:#8A4A11}
  .rank{font-size:11px;font-weight:700;fill:#5B6470}
  .cap{font-size:11px;fill:#747C88}
  .gl{fill:none;stroke:#C8CFDA;stroke-width:.9}
  .plotline{fill:none;stroke:#2563EB;stroke-width:2.2}
  .plotflat{fill:none;stroke:#C3651F;stroke-width:2.2}
  .plotstep{fill:none;stroke:#5B6470;stroke-width:2;stroke-dasharray:6 4}
  .refline{fill:none;stroke:#C8CFDA;stroke-width:1;stroke-dasharray:3 4}
  .dot1{fill:#2563EB}
  .dot2{fill:#C3651F}
</style>
<text class="ti" x="28" y="32" text-anchor="start">图 1　一次 mixed-precision step：每一步把什么交给下一步</text>
<text class="su" x="28" y="52" text-anchor="start">MixedPrecisionOptimizer.step 的固定顺序；方框下方是跨边界的交接张量（identity · dtype · 持有者）</text>
<rect class="neutral" x="28" y="84" width="224" height="96" rx="8"/>
<text class="rank" x="42" y="108" text-anchor="start">①</text>
<text class="tx" x="74" y="108" text-anchor="start">prepare_grads</text>
<path class="edge" d="M 42 118 L 238 118"/>
<text class="sm" x="42" y="138" text-anchor="start">_copy_model_grads_to_main_grads</text>
<text class="sm" x="42" y="154" text-anchor="start">÷ loss scale，扫 inf/nan</text>
<path class="main" d="M 254 132 L 267 132"/>
<rect class="ghost" x="28" y="214" width="224" height="62" rx="6"/>
<text class="dim" x="140" y="236" text-anchor="middle">main_param.grad</text>
<text class="sm" x="140" y="256" text-anchor="middle">fp32 · optimizer</text>
<rect class="acc2" x="270" y="84" width="224" height="96" rx="8"/>
<text class="rank" x="284" y="108" text-anchor="start">闸门</text>
<text class="tx" x="316" y="108" text-anchor="start">found_inf_flag</text>
<path class="edge" d="M 284 118 L 480 118"/>
<text class="sm" x="284" y="138" text-anchor="start">MAX all-reduce 到全组一致</text>
<text class="sm" x="284" y="154" text-anchor="start">为真则整步丢弃</text>
<path class="main" d="M 496 132 L 509 132"/>
<rect class="ghost" x="270" y="214" width="224" height="62" rx="6"/>
<text class="dim" x="382" y="236" text-anchor="middle">found_inf (1 元素)</text>
<text class="sm" x="382" y="256" text-anchor="middle">fp32 · grad-stats 组</text>
<rect class="neutral" x="512" y="84" width="224" height="96" rx="8"/>
<text class="rank" x="526" y="108" text-anchor="start">②</text>
<text class="tx" x="558" y="108" text-anchor="start">clip_grad_norm</text>
<path class="edge" d="M 526 118 L 722 118"/>
<text class="sm" x="526" y="138" text-anchor="start">SUM all-reduce 求 ‖g‖</text>
<text class="sm" x="526" y="154" text-anchor="start">MTP 组另算另裁</text>
<path class="main" d="M 738 132 L 751 132"/>
<rect class="ghost" x="512" y="214" width="224" height="62" rx="6"/>
<text class="dim" x="624" y="236" text-anchor="middle">total_norm</text>
<text class="sm" x="624" y="256" text-anchor="middle">fp32 · grad-stats 组</text>
<rect class="neutral" x="754" y="84" width="224" height="96" rx="8"/>
<text class="rank" x="768" y="108" text-anchor="start">③④</text>
<text class="tx" x="800" y="108" text-anchor="start">step_with_ready_grads</text>
<path class="edge" d="M 768 118 L 964 118"/>
<text class="sm" x="768" y="138" text-anchor="start">base optimizer 在 master 上更新</text>
<text class="sm" x="768" y="154" text-anchor="start">count_zeros 在其前，仅日志</text>
<path class="main" d="M 980 132 L 993 132"/>
<rect class="ghost" x="754" y="214" width="224" height="62" rx="6"/>
<text class="dim" x="866" y="236" text-anchor="middle">main_param.data</text>
<text class="sm" x="866" y="256" text-anchor="middle">fp32 · optimizer</text>
<rect class="neutral" x="996" y="84" width="224" height="96" rx="8"/>
<text class="rank" x="1010" y="108" text-anchor="start">⑤</text>
<text class="tx" x="1042" y="108" text-anchor="start">copy back</text>
<path class="edge" d="M 1010 118 L 1206 118"/>
<text class="sm" x="1010" y="138" text-anchor="start">_copy_main_params_to_model_params</text>
<text class="sm" x="1010" y="154" text-anchor="start">或写 DistOpt 的 param buffer</text>
<rect class="acc2" x="996" y="214" width="224" height="62" rx="6"/>
<text class="dim" x="1108" y="236" text-anchor="middle">model_param.data</text>
<text class="sm" x="1108" y="256" text-anchor="middle">bf16 · 模型</text>
<text class="rank" x="28" y="202" text-anchor="start">交接物</text>
<path class="cost" d="M 382 278 L 382 322"/>
<rect class="acc2" x="28" y="330" width="600" height="110" rx="8"/>
<text class="tx" x="40" y="351" text-anchor="start">闸门为真：整步丢弃，链条在这里断开</text>
<path class="edge" d="M 40 359 L 616 359"/>
<text class="sm" x="40" y="377" text-anchor="start">step() 立即 return (False, None, None) —— 参数一个字节都不改</text>
<text class="sm" x="40" y="393" text-anchor="start">grad_scaler.update(True) 已在 prepare_grads 内先行记账</text>
<text class="sm" x="40" y="409" text-anchor="start">train_step 跨 model-parallel 组做逻辑与，再决定 skipped_iter</text>
<text class="sm" x="40" y="425" text-anchor="start">scheduler 不推进：跳过的这一步不消耗 LR/WD schedule</text>
<rect class="neutral" x="648" y="330" width="624" height="110" rx="8"/>
<text class="tx" x="660" y="351" text-anchor="start">为什么闸门在裁剪之前，而不是之后</text>
<path class="edge" d="M 660 359 L 1260 359"/>
<text class="sm" x="660" y="377" text-anchor="start">裁剪要先求全局范数，非有限梯度会把 ‖g‖ 直接污染成 inf/nan，</text>
<text class="sm" x="660" y="393" text-anchor="start">缩放因子 clip_grad/‖g‖ 于是失去意义，还白付一次 SUM all-reduce。</text>
<text class="sm" x="660" y="409" text-anchor="start">被否掉的替代：先裁剪再查 —— 判据不是省一次通信，而是裁剪本身</text>
<text class="sm" x="660" y="425" text-anchor="start">在非有限输入上没有定义；闸门必须先于任何依赖 ‖g‖ 的计算。</text>
</svg>