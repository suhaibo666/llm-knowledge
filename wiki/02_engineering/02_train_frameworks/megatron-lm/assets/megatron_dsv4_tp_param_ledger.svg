<text class="cap" x="28" y="528" text-anchor="start">芯片：acc1 = Column/Row 接口（gather_output=False / input_is_parallel=True，tp_group 只有 1 个 rank）</text>
<text class="cap" x="28" y="544" text-anchor="start">acc2 = 精度例外：FP8 上下文外 BF16、mark_keep_in_fp32；其余随 params_dtype 或外层 FP8 上下文</text>
<text class="cap" x="28" y="560" text-anchor="start">q_layernorm / kv_layernorm 用 attention_latent_norm_epsilon（默认继承 layernorm_epsilon）</text>
<text class="cap" x="28" y="576" text-anchor="start">__post_init__ 把 qk_head_dim 与 kv_lora_rank 改写成 v_head_dim − qk_pos_emb_head_dim = 8，配置写的 16 / 64 不生效</text>
<rect class="neutral" x="766" y="74" width="478" height="118" rx="8"/>
<text class="tx" x="778" y="95" text-anchor="start">TP group（size 1）：三条源码事实</text>
<path class="edge" d="M 778 103 L 1232 103"/>
<text class="sm" x="778" y="121" text-anchor="start">DSv4HybridAttention.__init__ 断言 get_pg_size(pg_collection.tp) == 1</text>
<text class="sm" x="778" y="137" text-anchor="start">Attention.__init__：heads_per_partition = 8/1 = 8；CSA n_local_heads 不除 TP</text>
<text class="sm" x="778" y="153" text-anchor="start">TELinear(parallel_mode="duplicated") 断言 tp_group is None</text>
<text class="dim" x="778" y="169" text-anchor="start">接口保留 Column/Row 形状，但 group 只有一个 rank、没有 AG/RS</text>
<rect class="acc2" x="766" y="206" width="478" height="118" rx="8"/>
<text class="tx" x="778" y="227" text-anchor="start">若 TP&gt;1 要证明的四项（分析重建，源码沉默）</text>
<path class="edge" d="M 778 235 L 1232 235"/>
<text class="sm" x="778" y="253" text-anchor="start">① 三个接口投影沿哪一维分片，attn_sink 与 indexer 的 head 和怎样跟着分</text>
<text class="sm" x="778" y="269" text-anchor="start">② 复制的 compressor / indexer 各 rank 算出同一组 top-k 还是各算各的</text>
<text class="sm" x="778" y="285" text-anchor="start">③ compressed K / KV 的 collective 在 TP 与 CP 两个 group 上按什么顺序发生</text>
<text class="costtx" x="778" y="301" text-anchor="start">④ duplicated 参数的梯度在哪个 group 归并；fused kernel 只吃扁平 (rows, H, D)</text>
<rect class="neutral" x="766" y="338" width="478" height="230" rx="8"/>
<text class="tx" x="778" y="359" text-anchor="start">账本合计</text>
<path class="edge" d="M 778 367 L 1232 367"/>
<text class="dim" x="778" y="385" text-anchor="start">C 层 6,358,504 参数，linear_proj 4,194,304（66%）</text>
<text class="sm" x="778" y="401" text-anchor="start">indexer.linear_wq_b 1,572,864（25%）；duplicated 共 7 个张量 1,998,848</text>
<text class="sm" x="778" y="417" text-anchor="start">H 层 4,475,112：compressor coff=1，wkv/wgate [16, 512]、ape [128, 16]</text>
<text class="sm" x="778" y="433" text-anchor="start">W 层 4,456,664；csa_dense_mode 的 C 层 4,489,576（去掉整个 indexer）</text>
<text class="sm" x="778" y="449" text-anchor="start">接口投影 3 个张量 4,227,072 参数，全部在 size-1 的 TP group 里</text>
<text class="costtx" x="778" y="465" text-anchor="start">fp32 保持 3 个张量 1,160 参数；FP8 上下文外 BF16 5 个张量 327,680 参数</text>
<text class="sm" x="778" y="481" text-anchor="start">DSv4-Flash 配方 C 层（hidden 4,096、64 heads、v_head_dim 512）：126,098,624</text>
<text class="sm" x="778" y="497" text-anchor="start">其中 linear_proj 33,554,432（27%），wq_b 8,388,608，FP8 外 BF16 10,747,904</text>
<text class="sm" x="778" y="513" text-anchor="start">mHC（n=4）：mapping_proj [24, 2048] = 49,152 参数 + 3 alpha + 24 bias，fp32</text>
<text class="sm" x="778" y="529" text-anchor="start">linear_proj 在 fp8/fp4 下 set_save_original_input：不存量化副本</text>
<text class="sm" x="778" y="545" text-anchor="start">delay_wgrad_compute 下 backward_dw 逐个冲刷 TE 线性层（含 compressor/indexer）</text>
</svg>