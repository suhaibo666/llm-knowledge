<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1492" width="100%" role="img" aria-label="同一个 N=16 flat buffer 从 forward 与 backward-ready 梯度出发，对照普通 all-reduce、标准 reduce-scatter、custom FP32 accumulation reduce-scatter 和 multi-instance HSDP">
<style>
  text{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
  .card{fill:#fff;stroke:#E4E7EC;stroke-width:1.2}
  .panel{fill:#FBFCFE;stroke:#D9DEE7;stroke-width:1.2}
  .neutral{fill:#fff;stroke:#AEB6C2;stroke-width:1.2}
  .ghost{fill:#F5F7FA;stroke:#D9DEE7;stroke-width:1.1}
  .acc1{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.5}
  .acc2{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.5}
  .main{fill:none;stroke:#2563EB;stroke-width:2;marker-end:url(#arrowMain)}
  .aux{fill:none;stroke:#AEB6C2;stroke-width:1.4;stroke-dasharray:5 4;marker-end:url(#arrowAux)}
  .cost{fill:none;stroke:#C3651F;stroke-width:2;marker-end:url(#arrowCost)}
  .ti{font-size:18px;font-weight:700;fill:#1F2430}
  .su{font-size:11.5px;fill:#747C88}
  .pt{font-size:14px;font-weight:700;fill:#2A313B}
  .tx{font-size:12px;fill:#38414D}
  .sm{font-size:10.5px;fill:#68717D}
  .dim{font-size:10.5px;font-weight:600;fill:#173F87}
  .costtx{font-size:10.5px;font-weight:600;fill:#8A4A11}
  .rank{font-size:11px;font-weight:700;fill:#5B6470}
  .cap{font-size:11px;fill:#747C88}
  .cellq{fill:#EEF1F5;stroke:#fff}
  .cellp{fill:#9CC2F3;stroke:#fff}
  .cellr{fill:#DCE9FB;stroke:#fff}
  .cellpad{fill:#F1E2D2;stroke:#fff}
</style>
  <defs>
    <marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563EB"/></marker>
    <marker id="arrowAux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#AEB6C2"/></marker>
    <marker id="arrowCost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C3651F"/></marker>
  </defs>
<metadata id="markdown-contract" data-contract-sha256="ee0d5d662bf4f02204f5fc6211ad5e9b0a159d5c14a45e26d40b382be429093a">16_megatron_distributed_optimizer_analysis.md::distopt-figure-contract</metadata>
<rect class="card" x="0.5" y="0.5" width="1599" height="1491" rx="14"/>
<text class="ti" x="28" y="38" text-anchor="start">四条 gradient data plane：同一 flat buffer、同一 rank-1 owner 检查点</text>
<text class="su" x="28" y="60" text-anchor="start">N=16 · d=4 · q[0,2) | p[2,7) | r[7,13) | pad[13,16) · wire=bf16 (2 B/element)</text>
<rect class="panel" x="22" y="82" width="1556" height="126" rx="12"/>
<text class="pt" x="42" y="110" text-anchor="start">共享前置：forward → loss → gradient-ready / backward handoff</text>
<rect class="acc1" x="42" y="126" width="250" height="62" rx="8"/>
<text class="tx" x="167" y="152.5" text-anchor="middle">full parameter view</text>
<text class="sm" x="167" y="169.5" text-anchor="middle">q | p | r | pad</text>
<path class="main" d="M 292 157 L 336 157"/>
<rect class="neutral" x="336" y="126" width="250" height="62" rx="8"/>
<text class="tx" x="461" y="152.5" text-anchor="middle">forward local compute</text>
<text class="sm" x="461" y="169.5" text-anchor="middle">F(P, batch_s) → loss_s</text>
<path class="main" d="M 586 157 L 630 157"/>
<rect class="neutral" x="630" y="126" width="250" height="62" rx="8"/>
<text class="tx" x="755" y="152.5" text-anchor="middle">backward local compute</text>
<text class="sm" x="755" y="169.5" text-anchor="middle">G^(s), full N=16</text>
<path class="main" d="M 880 157 L 924 157"/>
<rect class="acc2" x="924" y="126" width="250" height="62" rx="8"/>
<text class="tx" x="1049" y="152.5" text-anchor="middle">gradient-ready gate</text>
<text class="sm" x="1049" y="169.5" text-anchor="middle">final microbatch + full bucket</text>
<path class="main" d="M 1174 157 L 1218 157"/>
<rect class="acc2" x="1218" y="126" width="250" height="62" rx="8"/>
<text class="tx" x="1343" y="152.5" text-anchor="middle">start_grad_sync</text>
<text class="sm" x="1343" y="169.5" text-anchor="middle">选择下方一条 lane</text>
<g data-plane="ordinary-all-reduce">
<rect class="panel" x="22" y="228" width="1556" height="222" rx="12"/>
<text class="pt" x="42" y="258" text-anchor="start">A. 普通 all-reduce：只有 plain non-LayerWise optimizer 把 group-full gradient 直接用于 replica-full update</text>
<text class="su" x="42" y="278" text-anchor="start">gate: plain non-LayerWise optimizer 的 use_distributed_optimizer=False；或 DistOpt force_all_reduce。LayerWise 有独立 live lanes。</text>
<rect class="neutral" x="42" y="294" width="250" height="88" rx="8"/>
<text class="tx" x="167" y="325" text-anchor="middle">one AR group inputs</text>
<text class="sm" x="167" y="342" text-anchor="middle">plain non-LayerWise: whole DP</text>
<text class="sm" x="167" y="359" text-anchor="middle">force+k&gt;1: one instance</text>
<path class="main" d="M 292 338 L 336 338"/>
<rect class="acc2" x="336" y="294" width="250" height="88" rx="8"/>
<text class="tx" x="461" y="325" text-anchor="middle">all-reduce</text>
<text class="sm" x="461" y="342" text-anchor="middle">SUM or AVG</text>
<text class="sm" x="461" y="359" text-anchor="middle">full payload M=32 B</text>
<path class="main" d="M 586 338 L 630 338"/>
<rect class="acc1" x="630" y="294" width="250" height="88" rx="8"/>
<text class="tx" x="755" y="325" text-anchor="middle">group-local full grad</text>
<text class="sm" x="755" y="342" text-anchor="middle">global only if k=1</text>
<text class="sm" x="755" y="359" text-anchor="middle">k&gt;1 remains partial</text>
<path class="main" d="M 880 338 L 924 338"/>
<rect class="neutral" x="924" y="294" width="250" height="88" rx="8"/>
<text class="tx" x="1049" y="325" text-anchor="middle">update ownership splits</text>
<text class="sm" x="1049" y="342" text-anchor="middle">plain non-LayerWise optimizer: full update</text>
<text class="sm" x="1049" y="359" text-anchor="middle">DistOpt: local shard only</text>
<path class="main" d="M 1174 338 L 1218 338"/>
<rect class="acc1" x="1218" y="294" width="250" height="88" rx="8"/>
<text class="tx" x="1343" y="325" text-anchor="middle">next parameter visibility</text>
<text class="sm" x="1343" y="342" text-anchor="middle">plain path: full P local</text>
<text class="sm" x="1343" y="359" text-anchor="middle">DistOpt: intra parameter AG</text>
<text class="dim" x="42" y="404" text-anchor="start">同步点：同步调用返回，或 finish_grad_sync 等 handle。理想 ring：2(d−1)M/d = 48 B/rank。</text>
<text class="sm" x="42" y="427" text-anchor="start">force_all_reduce+k&gt;1：intra full AR 48 B + inter local-shard AR 8 B + AG 24 B = 80 B/rank；所有 DP rank 都不持有全局 full gradient。</text>
</g>
<g data-plane="standard-reduce-scatter">
<rect class="panel" x="22" y="468" width="1556" height="238" rx="12"/>
<text class="pt" x="42" y="498" text-anchor="start">B. 标准 reduce-scatter：gradient owner 分片，step 后 parameter all-gather 重建</text>
<text class="su" x="42" y="518" text-anchor="start">gate: Distributed Optimizer + custom FP32 accumulation off；同一个 rank1 range [4,8)。</text>
<rect class="neutral" x="42" y="534" width="250" height="88" rx="8"/>
<text class="tx" x="167" y="565" text-anchor="middle">4 × full contribution</text>
<text class="sm" x="167" y="582" text-anchor="middle">q | p | r | pad</text>
<text class="sm" x="167" y="599" text-anchor="middle">input buffer N=16</text>
<path class="main" d="M 292 578 L 336 578"/>
<rect class="acc2" x="336" y="534" width="250" height="88" rx="8"/>
<text class="tx" x="461" y="565" text-anchor="middle">reduce-scatter</text>
<text class="sm" x="461" y="582" text-anchor="middle">intra group d=4</text>
<text class="sm" x="461" y="599" text-anchor="middle">network ≈ 24 B/rank</text>
<path class="main" d="M 586 578 L 630 578"/>
<rect class="acc1" x="630" y="534" width="250" height="88" rx="8"/>
<text class="tx" x="755" y="565" text-anchor="middle">rank1 local owner</text>
<text class="sm" x="755" y="582" text-anchor="middle">[4,8), length 4</text>
<text class="sm" x="755" y="599" text-anchor="middle">p[2:5] + r[0]</text>
<path class="main" d="M 880 578 L 924 578"/>
<rect class="neutral" x="924" y="534" width="250" height="88" rx="8"/>
<text class="tx" x="1049" y="565" text-anchor="middle">local compute</text>
<text class="sm" x="1049" y="582" text-anchor="middle">update main/state shard</text>
<text class="sm" x="1049" y="599" text-anchor="middle">state ≈ P/4</text>
<path class="main" d="M 1174 578 L 1218 578"/>
<rect class="acc2" x="1218" y="534" width="250" height="88" rx="8"/>
<text class="tx" x="1343" y="565" text-anchor="middle">parameter all-gather</text>
<text class="sm" x="1343" y="582" text-anchor="middle">4 shards → full P</text>
<text class="sm" x="1343" y="599" text-anchor="middle">wait before consumer</text>
<text class="dim" x="42" y="646" text-anchor="start">同步/重建：finish_grad_sync 交付 local grad；AG 另需 24 B/rank，RS+AG=48 B。</text>
<text class="sm" x="42" y="681" text-anchor="start">owner/data：RS 后非 local grad_data 不可解释为 full reduced gradient；next-forward visibility 以 AG wait 为准。</text>
</g>
<g data-plane="custom-fp32-accumulation-reduce-scatter">
<rect class="panel" x="22" y="724" width="1556" height="318" rx="12"/>
<text class="pt" x="42" y="754" text-anchor="start">C. custom FP32 accumulation RS：lower-precision all_to_all_single + owner-local FP32 sum</text>
<text class="su" x="42" y="774" text-anchor="start">同例 rank1：C_s→1 = G^(s)[4:8)；通信结束不等于 custom reduction 已完成。</text>
<rect class="neutral" x="42" y="792" width="250" height="94" rx="8"/>
<text class="tx" x="167" y="826" text-anchor="middle">rank-specific chunks</text>
<text class="sm" x="167" y="843" text-anchor="middle">C_0→1 … C_3→1</text>
<text class="sm" x="167" y="860" text-anchor="middle">4 elements/source</text>
<path class="main" d="M 292 839 L 336 839"/>
<rect class="acc2" x="336" y="792" width="250" height="94" rx="8"/>
<text class="tx" x="461" y="826" text-anchor="middle">all_to_all_single</text>
<text class="sm" x="461" y="843" text-anchor="middle">lower-precision wire</text>
<text class="sm" x="461" y="860" text-anchor="middle">network ≈ 24 B/rank</text>
<path class="main" d="M 586 839 L 630 839"/>
<rect class="acc2" x="630" y="792" width="250" height="94" rx="8"/>
<text class="tx" x="755" y="826" text-anchor="middle">A1 full-size temp</text>
<text class="sm" x="755" y="843" text-anchor="middle">[C_0→1 | … | C_3→1]</text>
<text class="sm" x="755" y="860" text-anchor="middle">N=16 = 32 B bf16</text>
<path class="main" d="M 880 839 L 924 839"/>
<rect class="neutral" x="924" y="792" width="250" height="94" rx="8"/>
<text class="tx" x="1049" y="826" text-anchor="middle">custom handle.wait</text>
<text class="sm" x="1049" y="843" text-anchor="middle">view 4×4; FP32 accumulation</text>
<text class="sm" x="1049" y="860" text-anchor="middle">local sum temp=16 B</text>
<path class="main" d="M 1174 839 L 1218 839"/>
<rect class="acc1" x="1218" y="792" width="250" height="94" rx="8"/>
<text class="tx" x="1343" y="826" text-anchor="middle">downcast / copy</text>
<text class="sm" x="1343" y="843" text-anchor="middle">output [4,8) = p[2:5] + r[0]</text>
<text class="sm" x="1343" y="860" text-anchor="middle">local update → AG</text>
<rect class="acc2" x="42" y="908" width="462" height="94" rx="8"/>
<text class="costtx" x="60" y="934" text-anchor="start">同步与生命周期</text>
<text class="sm" x="60" y="956" text-anchor="start">successor dispatch 先 drain 已发 predecessor</text>
<text class="sm" x="60" y="978" text-anchor="start">overlap 由 custom handle.wait 完成 A2A + sum + copy</text>
<rect class="neutral" x="526" y="908" width="462" height="94" rx="8"/>
<text class="dim" x="544" y="934" text-anchor="start">hard constraints</text>
<text class="sm" x="544" y="956" text-anchor="start">SUM · N%d=0 · overlap: one bucket / bucket group</text>
<text class="sm" x="544" y="978" text-anchor="start">num_distributed_optimizer_instances = 1</text>
<rect class="acc1" x="1010" y="908" width="458" height="94" rx="8"/>
<text class="dim" x="1028" y="934" text-anchor="start">增量成本与重建</text>
<text class="sm" x="1028" y="956" text-anchor="start">+ full LP temp M (32 B) + FP32 N/d (16 B)</text>
<text class="sm" x="1028" y="978" text-anchor="start">例：+48 B temp；随后 parameter AG 24 B</text>
<text class="cap" x="42" y="1024" text-anchor="start">precision owner：wire/output 仍为 lower precision；只有 owner-local reduction 在 FP32。</text>
</g>
<g data-plane="multi-instance-hsdp">
<rect class="panel" x="22" y="1060" width="1556" height="384" rx="12"/>
<text class="pt" x="42" y="1090" text-anchor="start">D. HSDP / num_distributed_optimizer_instances=2：intra RS + inter local-shard all-reduce</text>
<text class="su" x="42" y="1110" text-anchor="start">same N=16 buffer · total D=8 · k=2 instances · intra size s=4</text>
<rect class="neutral" x="42" y="1128" width="250" height="98" rx="8"/>
<text class="tx" x="167" y="1164" text-anchor="middle">group topology</text>
<text class="sm" x="167" y="1181" text-anchor="middle">I0={0,1,2,3}</text>
<text class="sm" x="167" y="1198" text-anchor="middle">I1={4,5,6,7}</text>
<path class="main" d="M 292 1177 L 336 1177"/>
<rect class="acc2" x="336" y="1128" width="250" height="98" rx="8"/>
<text class="tx" x="461" y="1164" text-anchor="middle">intra reduce-scatter</text>
<text class="sm" x="461" y="1181" text-anchor="middle">I0 与 I1 各自 RS</text>
<text class="sm" x="461" y="1198" text-anchor="middle">24 B/rank</text>
<path class="main" d="M 586 1177 L 630 1177"/>
<rect class="acc2" x="630" y="1128" width="250" height="98" rx="8"/>
<text class="tx" x="755" y="1164" text-anchor="middle">inter instance AR</text>
<text class="sm" x="755" y="1181" text-anchor="middle">same local slot</text>
<text class="sm" x="755" y="1198" text-anchor="middle">{0,4} {1,5} {2,6} {3,7}</text>
<path class="main" d="M 880 1177 L 924 1177"/>
<rect class="acc1" x="924" y="1128" width="250" height="98" rx="8"/>
<text class="tx" x="1049" y="1164" text-anchor="middle">replicated owner</text>
<text class="sm" x="1049" y="1181" text-anchor="middle">rank1 &amp; rank5 own [4,8)</text>
<text class="sm" x="1049" y="1198" text-anchor="middle">inter traffic=8 B/rank</text>
<path class="main" d="M 1174 1177 L 1218 1177"/>
<rect class="neutral" x="1218" y="1128" width="250" height="98" rx="8"/>
<text class="tx" x="1343" y="1164" text-anchor="middle">local update + intra AG</text>
<text class="sm" x="1343" y="1181" text-anchor="middle">每 instance 重建 full P</text>
<text class="sm" x="1343" y="1198" text-anchor="middle">AG=24 B/rank</text>
<rect class="acc2" x="42" y="1250" width="462" height="126" rx="8"/>
<text class="costtx" x="60" y="1276" text-anchor="start">同步/latency</text>
<text class="sm" x="60" y="1298" text-anchor="start">dense bucket-group collection: 1 shared stream</text>
<text class="sm" x="60" y="1320" text-anchor="start">expert bucket-group collection: another shared stream</text>
<text class="sm" x="60" y="1342" text-anchor="start">not one stream per bucket group</text>
<text class="sm" x="60" y="1364" text-anchor="start">RS→inter AR async_op=False；finish: compute wait_stream</text>
<rect class="neutral" x="526" y="1250" width="462" height="126" rx="8"/>
<text class="dim" x="544" y="1276" text-anchor="start">HBM / owner trade-off</text>
<text class="sm" x="544" y="1298" text-anchor="start">main/state ≈ P/s=P/4，而非 full-D 的 P/8</text>
<text class="sm" x="544" y="1320" text-anchor="start">owner/state 在两个 instance 各复制一份</text>
<text class="sm" x="544" y="1342" text-anchor="start">跨 instance 只规约 local shard M/s=8 B payload</text>
<text class="sm" x="544" y="1364" text-anchor="start">选择：fast intra / slow inter，或接受复制换拓扑</text>
<rect class="acc1" x="1010" y="1250" width="458" height="126" rx="8"/>
<text class="dim" x="1028" y="1276" text-anchor="start">字节/选择</text>
<text class="sm" x="1028" y="1298" text-anchor="start">24 B intra RS + 8 B inter AR + 24 B AG = 56 B/rank</text>
<text class="sm" x="1028" y="1320" text-anchor="start">48 B forced intra AR + 8 B inter AR + 24 B AG = 80 B/rank</text>
<text class="sm" x="1028" y="1342" text-anchor="start">forced AR 后只有 local shard 经 inter AR 成为 global</text>
<text class="sm" x="1028" y="1364" text-anchor="start">这是拓扑推导，不是源码吞吐保证</text>
<text class="cap" x="42" y="1404" text-anchor="start">force_all_reduce+k&gt;1：full gradient 只在 intra-instance group 内成立；跨 instance 只 all-reduce local shard。</text>
<text class="cap" x="42" y="1426" text-anchor="start">限制：custom FP32 accumulation RS 与 multi-instance HSDP 不可同时启用。</text>
</g>
<text class="cap" x="28" y="1474" text-anchor="start">N=16为等分原语示例，省略native 64/128对齐；pad只通信、不更新；字节为bf16算法估算，不是NCCL实测。</text>
</svg>
