</style><rect width="1180" height="930" fill="white"/>
<text x="24" y="34" class="ti" text-anchor="start">MTP 是辅助目标：补丁把梯度关在 MTP 层里；两次 roll 让标签对齐 t[i+2]，mask 却因此早一位</text>
<text x="24" y="56" class="su" text-anchor="start">示例：一条样本 P = 3 个 prompt token、R = 4 个 response token（T = 7），loss_mask 全 1，--mtp-num-layers 1，CP = 1；token 用下标 t0…t6 表示</text>
<rect x="24" y="72" width="1132" height="382" rx="10" class="panel"/>
<text x="40" y="96" class="pt" text-anchor="start">① 同一条样本在 get_batch 与 megatron.patch 的 _postprocess 里怎样对齐（位置 i 的 MTP-1 看到 h_i 与 t[i+1]，预测 t[i+2]）</text>
<text x="40" y="132" class="tx" text-anchor="start">位置 i</text>
<text x="432" y="132" class="tx" text-anchor="middle">0</text>
<text x="512" y="132" class="tx" text-anchor="middle">1</text>
<text x="592" y="132" class="tx" text-anchor="middle">2</text>
<text x="672" y="132" class="tx" text-anchor="middle">3</text>
<text x="752" y="132" class="tx" text-anchor="middle">4</text>
<text x="832" y="132" class="tx" text-anchor="middle">5</text>
<text x="912" y="132" class="tx" text-anchor="middle">6</text>
<text x="40" y="155" class="tx" text-anchor="start">tokens（mtp_labels 的来源）</text>
<text x="40" y="169" class="sm" text-anchor="start">data.py::get_batch</text>
<rect x="395" y="144" width="74" height="28" rx="4" class="ghost"/>
<text x="432" y="162" class="mo" text-anchor="middle">t0</text>
<rect x="475" y="144" width="74" height="28" rx="4" class="ghost"/>
<text x="512" y="162" class="mo" text-anchor="middle">t1</text>
<rect x="555" y="144" width="74" height="28" rx="4" class="ghost"/>
<text x="592" y="162" class="mo" text-anchor="middle">t2</text>
<rect x="635" y="144" width="74" height="28" rx="4" class="neutral"/>
<text x="672" y="162" class="mo" text-anchor="middle">t3</text>
<rect x="715" y="144" width="74" height="28" rx="4" class="neutral"/>
<text x="752" y="162" class="mo" text-anchor="middle">t4</text>
<rect x="795" y="144" width="74" height="28" rx="4" class="neutral"/>
<text x="832" y="162" class="mo" text-anchor="middle">t5</text>
<rect x="875" y="144" width="74" height="28" rx="4" class="neutral"/>
<text x="912" y="162" class="mo" text-anchor="middle">t6</text>
<text x="962" y="162" class="sm" text-anchor="start">prompt t0–t2 · response t3–t6</text>
<text x="40" y="191" class="tx" text-anchor="start">full_loss_masks = F.pad(mask, (P−1, 1))</text>
<text x="40" y="205" class="sm" text-anchor="start">已按"位置 i → t[i+1]"对齐</text>
<rect x="395" y="180" width="74" height="28" rx="4" class="ghost"/>
<text x="432" y="198" class="mo" text-anchor="middle">0</text>
<rect x="475" y="180" width="74" height="28" rx="4" class="ghost"/>
<text x="512" y="198" class="mo" text-anchor="middle">0</text>
<rect x="555" y="180" width="74" height="28" rx="4" class="neutral"/>
<text x="592" y="198" class="mo" text-anchor="middle">1</text>
<rect x="635" y="180" width="74" height="28" rx="4" class="neutral"/>
<text x="672" y="198" class="mo" text-anchor="middle">1</text>
<rect x="715" y="180" width="74" height="28" rx="4" class="neutral"/>
<text x="752" y="198" class="mo" text-anchor="middle">1</text>
<rect x="795" y="180" width="74" height="28" rx="4" class="neutral"/>
<text x="832" y="198" class="mo" text-anchor="middle">1</text>
<rect x="875" y="180" width="74" height="28" rx="4" class="ghost"/>
<text x="912" y="198" class="mo" text-anchor="middle">0</text>
<text x="962" y="198" class="sm" text-anchor="start">与主 loss 目标同一坐标</text>
<text x="40" y="227" class="tx" text-anchor="start">主 loss 目标 t[i+1]</text>
<text x="40" y="241" class="sm" text-anchor="start">loss.py::_build_shifted_tokens</text>
<rect x="395" y="216" width="74" height="28" rx="4" class="ghost"/>
<text x="432" y="234" class="mo" text-anchor="middle">t1</text>
<rect x="475" y="216" width="74" height="28" rx="4" class="ghost"/>
<text x="512" y="234" class="mo" text-anchor="middle">t2</text>
<rect x="555" y="216" width="74" height="28" rx="4" class="neutral"/>
<text x="592" y="234" class="mo" text-anchor="middle">t3</text>
<rect x="635" y="216" width="74" height="28" rx="4" class="neutral"/>
<text x="672" y="234" class="mo" text-anchor="middle">t4</text>
<rect x="715" y="216" width="74" height="28" rx="4" class="neutral"/>
<text x="752" y="234" class="mo" text-anchor="middle">t5</text>
<rect x="795" y="216" width="74" height="28" rx="4" class="neutral"/>
<text x="832" y="234" class="mo" text-anchor="middle">t6</text>
<rect x="875" y="216" width="74" height="28" rx="4" class="ghost"/>
<text x="912" y="234" class="mo" text-anchor="middle">—</text>
<text x="962" y="234" class="sm" text-anchor="start">mask=1 处恰好是 t3–t6</text>
<text x="40" y="263" class="tx" text-anchor="start">MTP-1 输入 Emb(t[i+1])</text>
<text x="40" y="277" class="sm" text-anchor="start">_get_embeddings：input_ids roll 1 次</text>
<rect x="395" y="252" width="74" height="28" rx="4" class="neutral"/>
<text x="432" y="270" class="mo" text-anchor="middle">t1</text>
<rect x="475" y="252" width="74" height="28" rx="4" class="neutral"/>
<text x="512" y="270" class="mo" text-anchor="middle">t2</text>
<rect x="555" y="252" width="74" height="28" rx="4" class="neutral"/>
<text x="592" y="270" class="mo" text-anchor="middle">t3</text>
<rect x="635" y="252" width="74" height="28" rx="4" class="neutral"/>
<text x="672" y="270" class="mo" text-anchor="middle">t4</text>
<rect x="715" y="252" width="74" height="28" rx="4" class="neutral"/>
<text x="752" y="270" class="mo" text-anchor="middle">t5</text>
<rect x="795" y="252" width="74" height="28" rx="4" class="neutral"/>
<text x="832" y="270" class="mo" text-anchor="middle">t6</text>
<rect x="875" y="252" width="74" height="28" rx="4" class="ghost"/>
<text x="912" y="270" class="mo" text-anchor="middle">0</text>
<text x="962" y="270" class="sm" text-anchor="start">末位清零</text>
<text x="40" y="299" class="tx" text-anchor="start">mtp_labels：补丁预 roll + 循环 roll</text>
<text x="40" y="313" class="sm" text-anchor="start">= t[i+2]</text>
<rect x="395" y="288" width="74" height="28" rx="4" class="neutral"/>
<text x="432" y="306" class="mo" text-anchor="middle">t2</text>
<rect x="475" y="288" width="74" height="28" rx="4" class="neutral"/>
<text x="512" y="306" class="mo" text-anchor="middle">t3</text>
<rect x="555" y="288" width="74" height="28" rx="4" class="neutral"/>
<text x="592" y="306" class="mo" text-anchor="middle">t4</text>
<rect x="635" y="288" width="74" height="28" rx="4" class="neutral"/>
<text x="672" y="306" class="mo" text-anchor="middle">t5</text>
<rect x="715" y="288" width="74" height="28" rx="4" class="neutral"/>
<text x="752" y="306" class="mo" text-anchor="middle">t6</text>
<rect x="795" y="288" width="74" height="28" rx="4" class="ghost"/>
<text x="832" y="306" class="mo" text-anchor="middle">0</text>
<rect x="875" y="288" width="74" height="28" rx="4" class="ghost"/>
<text x="912" y="306" class="mo" text-anchor="middle">0</text>
<text x="962" y="306" class="sm" text-anchor="start">= MTP-1 的预测对象</text>
<text x="40" y="335" class="tx" text-anchor="start">loss_mask：补丁预 roll + 循环 roll</text>
<text x="40" y="349" class="sm" text-anchor="start">= full[i+2]</text>
<rect x="395" y="324" width="74" height="28" rx="4" class="acc2"/>
<text x="432" y="342" class="mo" text-anchor="middle">1</text>
<rect x="475" y="324" width="74" height="28" rx="4" class="acc2"/>
<text x="512" y="342" class="mo" text-anchor="middle">1</text>
<rect x="555" y="324" width="74" height="28" rx="4" class="acc2"/>
<text x="592" y="342" class="mo" text-anchor="middle">1</text>
<rect x="635" y="324" width="74" height="28" rx="4" class="acc2"/>
<text x="672" y="342" class="mo" text-anchor="middle">1</text>
<rect x="715" y="324" width="74" height="28" rx="4" class="ghost"/>
<text x="752" y="342" class="mo" text-anchor="middle">0</text>
<rect x="795" y="324" width="74" height="28" rx="4" class="ghost"/>
<text x="832" y="342" class="mo" text-anchor="middle">0</text>
<rect x="875" y="324" width="74" height="28" rx="4" class="ghost"/>
<text x="912" y="342" class="mo" text-anchor="middle">0</text>
<text x="962" y="342" class="sm" text-anchor="start">num_tokens = 4</text>
<text x="40" y="371" class="tx" text-anchor="start">计入 MTP loss 的目标（补丁后实际）</text>
<text x="40" y="385" class="sm" text-anchor="start">label × mask</text>
<rect x="395" y="360" width="74" height="28" rx="4" class="acc2"/>
<text x="432" y="378" class="mo" text-anchor="middle">t2</text>
<rect x="475" y="360" width="74" height="28" rx="4" class="acc1"/>
<text x="512" y="378" class="mo" text-anchor="middle">t3</text>
<rect x="555" y="360" width="74" height="28" rx="4" class="acc1"/>
<text x="592" y="378" class="mo" text-anchor="middle">t4</text>
<rect x="635" y="360" width="74" height="28" rx="4" class="acc1"/>
<text x="672" y="378" class="mo" text-anchor="middle">t5</text>
<rect x="715" y="360" width="74" height="28" rx="4" class="acc2"/>
<text x="752" y="378" class="mo" text-anchor="middle">t6 未计</text>
<rect x="795" y="360" width="74" height="28" rx="4" class="ghost"/>
<text x="832" y="378" class="mo" text-anchor="middle"></text>
<rect x="875" y="360" width="74" height="28" rx="4" class="ghost"/>
<text x="912" y="378" class="mo" text-anchor="middle"></text>
<text x="962" y="378" class="sm" text-anchor="start">t2–t5：多 t2、漏 t6</text>
<text x="40" y="407" class="tx" text-anchor="start">对照：mask 只随循环 roll 1 次</text>
<text x="40" y="421" class="sm" text-anchor="start">= full[i+1]</text>
<rect x="395" y="396" width="74" height="28" rx="4" class="ghost"/>
<text x="432" y="414" class="mo" text-anchor="middle"></text>
<rect x="475" y="396" width="74" height="28" rx="4" class="dep"/>
<text x="512" y="414" class="mo" text-anchor="middle">t3</text>
<rect x="555" y="396" width="74" height="28" rx="4" class="dep"/>
<text x="592" y="414" class="mo" text-anchor="middle">t4</text>
<rect x="635" y="396" width="74" height="28" rx="4" class="dep"/>
<text x="672" y="414" class="mo" text-anchor="middle">t5</text>
<rect x="715" y="396" width="74" height="28" rx="4" class="dep"/>
<text x="752" y="414" class="mo" text-anchor="middle">t6</text>
<rect x="795" y="396" width="74" height="28" rx="4" class="ghost"/>
<text x="832" y="414" class="mo" text-anchor="middle"></text>
<rect x="875" y="396" width="74" height="28" rx="4" class="ghost"/>
<text x="912" y="414" class="mo" text-anchor="middle"></text>
<text x="962" y="414" class="sm" text-anchor="start">t3–t6 = response</text>
<text x="40" y="440" class="sm" text-anchor="start">静态复算（分析判断，未运行）：mask 在 get_batch 已经左移过一位，补丁的预 roll 又移一位，计入集合整体早一位；P ≥ 3 时每条样本计数仍为 R，P = 2 时只剩 R − 1。</text>
<rect x="24" y="464" width="1132" height="300" rx="10" class="panel"/>
