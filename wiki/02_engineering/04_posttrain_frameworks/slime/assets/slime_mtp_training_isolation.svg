<text x="40" y="798" class="pt" text-anchor="start">③ CI 门禁 tests/test_mimo_7B_mtp_only_grad.py：先把 policy 梯度压成 0，再看剩下的梯度落在哪</text>
<rect x="40" y="812" width="214" height="46" rx="5" class="neutral"/>
<text x="147" y="831.5" class="mo" text-anchor="middle">--rollout-max-response-len 128</text>
<text x="147" y="846.5" class="sm" text-anchor="middle">全部 response 截断</text>
<path d="M256 835 L268 835" class="main"/>
<rect x="272" y="812" width="196" height="46" rx="5" class="neutral"/>
<text x="370" y="831.5" class="mo" text-anchor="middle">--rm-type deepscaler</text>
<text x="370" y="846.5" class="sm" text-anchor="middle">无 &lt;/think&gt; → reward 0</text>
