<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="930" viewBox="0 0 1180 930" role="img" aria-labelledby="title desc">
<title id="title">slime 在线 MTP 训练：一条样本的标签与 mask 对齐，以及 MTP loss 的梯度切断</title>
<desc id="desc">面板①以 P=3、R=4 的样本逐位置展示 full_loss_masks、主 loss 目标、MTP-1 的输入、补丁两次 roll 后的 mtp_labels 与 loss_mask，以及实际计入的目标 t2 到 t5 与对照的 t3 到 t6。面板②对比上游 Megatron-LM 1dcf0daf 与 slime megatron.patch 下位置 i=2 的 MTP loss 反向传播落点。面板③是 CI 门禁的前提与断言。</desc>
<defs><marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker><marker id="arrowCost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C3651F"/></marker><marker id="arrowAux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#8C95A3"/></marker></defs>
<style>
