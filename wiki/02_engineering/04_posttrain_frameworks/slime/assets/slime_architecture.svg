<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="810" viewBox="0 0 1120 810" role="img" aria-labelledby="title desc"><title id="title">slime 四层八模块静态架构</title><desc id="desc">场景入口、应用编排、后训练合同、后端适配四层向下连接外部运行时。右侧表示可选工作流扩展和横切观测恢复。箭头不表示训练时间顺序。</desc><defs><marker id="main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker><marker id="aux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#C3651F"/></marker></defs><style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#2A313B}.title{font-size:24px;font-weight:700}.heading{font-size:18px;font-weight:650}.label{font-size:17px;font-weight:600}.sub{font-size:14px;fill:#5B6470}.neutral{fill:#fff;stroke:#C7CCD3;stroke-width:1.4}.ghost{fill:#F7F6F3;stroke:#DDD9D2;stroke-width:1.2}.acc1{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.4}.acc2{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.4}.arrow{fill:none}.main{stroke:#2563EB;stroke-width:2.2}.aux{stroke:#C3651F;stroke-width:1.5;stroke-dasharray:5 4}</style><rect width="1120" height="810" fill="white"/>
