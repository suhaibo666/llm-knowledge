<text x="221" y="388" class="sm" text-anchor="middle">提交一整波</text>
<text x="221" y="402" class="sm" text-anchor="middle">4 组 → pendings</text>
<text x="343" y="388" class="sm" text-anchor="middle">zero-std 拒绝</text>
<text x="343" y="402" class="sm" text-anchor="middle">remaining −1</text>
<text x="465" y="388" class="sm" text-anchor="middle">入选</text>
<text x="465" y="402" class="sm" text-anchor="middle">len(data) +1</text>
<text x="587" y="388" class="sm" text-anchor="middle">入选</text>
<text x="587" y="402" class="sm" text-anchor="middle">len(data) +1</text>
<text x="709" y="388" class="sm" text-anchor="middle">目标满 → abort</text>
<text x="709" y="402" class="sm" text-anchor="middle">等 1 个 pending</text>
<rect x="800" y="116" width="340" height="196" rx="8" class="ghost"/>
<text x="812" y="136" class="pt" text-anchor="start">两个计数器的分工</text>
<text x="812" y="156" class="tx" text-anchor="start">remaining_batch_size：已提交且未被拒的候选组数；</text>
<text x="812" y="173" class="tx" text-anchor="start">低于 target 2 时再补一整波 4 组，不是只补缺口。</text>
<text x="812" y="193" class="tx" text-anchor="start">len(data)：已入选组数；达到 2 即退出并 abort。</text>
<text x="812" y="213" class="tx" text-anchor="start">B 被拒：remaining 4 → 3，仍 ≥ 2，不补采。</text>
<text x="812" y="233" class="tx" text-anchor="start">入选 A、C，按 group[0].index 排序后交训练。</text>
<text x="812" y="253" class="tx" text-anchor="start">D 在途：仅 partial_rollout 开时整组回 buffer，</text>
<text x="812" y="270" class="tx" text-anchor="start">否则丢弃；有 response 的 Sample 记 start_rollout_id。</text>
<text x="812" y="294" class="cap" text-anchor="start">信号量 1024 按请求数限流，不按 token 或 KV 预算。</text>
<rect x="800" y="324" width="340" height="78" rx="8" class="acc2"/>
<text x="812" y="344" class="tx" text-anchor="start">abort 不是精确取消：对默认 router 全部 worker</text>
<text x="812" y="361" class="tx" text-anchor="start">发 abort_all，再查 /v1/loads 直到 0；</text>
<text x="812" y="378" class="tx" text-anchor="start">load 查询异常只告警并返回，不证明已排空。</text>
<text x="812" y="395" class="tx" text-anchor="start">超出目标的已完成组不训练也不回收（源码 NOTE）。</text>
<rect x="24" y="490" width="640" height="396" rx="10" class="panel"/>
<text x="40" y="514" class="pt" text-anchor="start">同一循环的两条变体（8 个候选组，A B C 均为零方差）</text>
<text x="40" y="540" class="tx" text-anchor="start">① check_reward_nonzero_std：连续拒绝 → remaining 低于 2 → 再提交一整波</text>
<rect x="40" y="548" width="70" height="46" rx="4" class="cell"/>
<text x="75" y="564" class="sm" text-anchor="middle">+4</text>
<text x="75" y="580" class="mono" text-anchor="middle">r=4 d=0</text>
<rect x="114" y="548" width="70" height="46" rx="4" class="acc2"/>
<text x="149" y="564" class="sm" text-anchor="middle">B 拒</text>
<text x="149" y="580" class="mono" text-anchor="middle">r=3 d=0</text>
<rect x="188" y="548" width="70" height="46" rx="4" class="acc2"/>
<text x="223" y="564" class="sm" text-anchor="middle">A 拒</text>
<text x="223" y="580" class="mono" text-anchor="middle">r=2 d=0</text>
<rect x="262" y="548" width="70" height="46" rx="4" class="acc2"/>
<text x="297" y="564" class="sm" text-anchor="middle">C 拒</text>
<text x="297" y="580" class="mono" text-anchor="middle">r=1 d=0</text>
<rect x="336" y="548" width="70" height="46" rx="4" class="cell"/>
<text x="371" y="564" class="sm" text-anchor="middle">+4</text>
<text x="371" y="580" class="mono" text-anchor="middle">r=5 d=0</text>
<rect x="410" y="548" width="70" height="46" rx="4" class="acc1"/>
<text x="445" y="564" class="sm" text-anchor="middle">D 入</text>
<text x="445" y="580" class="mono" text-anchor="middle">r=5 d=1</text>
<rect x="484" y="548" width="70" height="46" rx="4" class="acc1"/>
<text x="519" y="564" class="sm" text-anchor="middle">E 入</text>
<text x="519" y="580" class="mono" text-anchor="middle">r=5 d=2</text>
<rect x="558" y="548" width="70" height="46" rx="4" class="ghost"/>
<text x="593" y="564" class="sm" text-anchor="middle">abort</text>
<text x="593" y="580" class="mono" text-anchor="middle">r=5 d=2</text>
<text x="40" y="612" class="cap" text-anchor="start">B、A、C 依次被拒，remaining 3 → 2 → 1；t3 再提交 E F G H（+4）</text>
<text x="40" y="628" class="cap" text-anchor="start">随后 D、E 入选；abort 时 3 组在途，代价是多付一整波生成与 RM。</text>
<text x="40" y="658" class="tx" text-anchor="start">② check_reward_nonzero_std_with_fallback：remaining ≤ target 时保留零方差组</text>
<rect x="40" y="666" width="70" height="46" rx="4" class="cell"/>
<text x="75" y="682" class="sm" text-anchor="middle">+4</text>
<text x="75" y="698" class="mono" text-anchor="middle">r=4 d=0</text>
<rect x="114" y="666" width="70" height="46" rx="4" class="acc2"/>
<text x="149" y="682" class="sm" text-anchor="middle">B 拒</text>
<text x="149" y="698" class="mono" text-anchor="middle">r=3 d=0</text>
<rect x="188" y="666" width="70" height="46" rx="4" class="acc2"/>
<text x="223" y="682" class="sm" text-anchor="middle">A 拒</text>
<text x="223" y="698" class="mono" text-anchor="middle">r=2 d=0</text>
<rect x="262" y="666" width="70" height="46" rx="4" class="acc1"/>
<text x="297" y="682" class="sm" text-anchor="middle">C 兜底入</text>
<text x="297" y="698" class="mono" text-anchor="middle">r=2 d=1</text>
<rect x="336" y="666" width="70" height="46" rx="4" class="acc1"/>
<text x="371" y="682" class="sm" text-anchor="middle">D 入</text>
<text x="371" y="698" class="mono" text-anchor="middle">r=2 d=2</text>
<rect x="410" y="666" width="70" height="46" rx="4" class="ghost"/>
<text x="445" y="682" class="sm" text-anchor="middle">abort</text>
<text x="445" y="698" class="mono" text-anchor="middle">r=2 d=2</text>
<text x="40" y="730" class="cap" text-anchor="start">B、A 被拒后 remaining=2 ≤ 2，C 虽零方差仍入选（keep_when_insufficient）</text>
<text x="40" y="746" class="cap" text-anchor="start">C、D 凑满，不再补采，abort 时 0 组在途；代价是送进一个无梯度信号的组。</text>
<text x="40" y="782" class="cap" text-anchor="start">abort 后按 index 排序 → rollout_sample_filter_path 原地改 remove_sample</text>
<text x="40" y="800" class="cap" text-anchor="start">→ rollout_all_samples_process_path 看到全部已完成组（含被拒者，不含在途回收者）。</text>
<text x="40" y="824" class="cap" text-anchor="start">未接 dynamic_sampling_filter_path 时 call_dynamic_filter 恒返回 keep=True，</text>
<text x="40" y="842" class="cap" text-anchor="start">循环退化为"取够 rollout_batch_size 个先完成的组"。</text>
<text x="40" y="866" class="cap" text-anchor="start">蓝：入选与决定性判定；橙：拒绝、abort 与回收。灰条为在途时间；柱内 r/d 为事件后的 remaining_batch_size / len(data)。</text>
