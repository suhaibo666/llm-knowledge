  .dep{fill:#F5F7FA;stroke:#AEB6C2;stroke-width:1.1;stroke-dasharray:4 3}
  .acc1{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.5}
  .acc2{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.5}
  .cell{fill:#fff;stroke:#AEB6C2;stroke-width:1.1}
  .bar{fill:#E8ECF2;stroke:#AEB6C2;stroke-width:1}
  .tick{stroke:#D9DEE7;stroke-width:1;stroke-dasharray:3 3}
</style><rect width="1180" height="858" fill="white"/>
<text x="24" y="34" class="ti" text-anchor="start">默认接收循环：四个候选组、两个计数器、一次 abort</text>
<text x="24" y="56" class="su" text-anchor="start">rollout_batch_size=2 · over_sampling_batch_size=4 · n_samples_per_prompt=4 · 信号量 = sglang_server_concurrency 512 × 2 engines = 1024（本例 16 个请求不受限）</text>
<rect x="24" y="76" width="1132" height="430" rx="10" class="panel"/>
<text x="40" y="100" class="pt" text-anchor="start">generate_rollout_async：接收单位是整组（4 条 Sample 全部生成并打完 reward），FIRST_COMPLETED 取最先完成的组</text>
<text x="231" y="124" class="sm" text-anchor="middle">t0</text>
<path d="M170 132 L170 276" class="tick"/>
