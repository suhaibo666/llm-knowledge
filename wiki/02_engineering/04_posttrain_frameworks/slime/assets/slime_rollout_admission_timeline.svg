<rect x="694" y="722" width="446" height="64" rx="8" class="acc1"/>
<text x="706" y="742" class="tx" text-anchor="start">t3 消费者线程 get_completed_groups(limit=2) → A B</text>
<text x="706" y="760" class="tx" text-anchor="start">队列留下 [C] 给下一轮（"queue stays warm"）</text>
<text x="706" y="778" class="tx" text-anchor="start">t2 闸门关：qsize 2 ≥ 2 停止补位，但在途 C 仍可完成入队</text>
<text x="694" y="812" class="cap" text-anchor="start">队列无界：done-callback 在 loop 线程内 put，有界队列满时会冻住全部在途生成。</text>
<text x="694" y="830" class="cap" text-anchor="start">含 ABORTED 成员的组回 data_buffer.add_samples，不进队列；异常 task 只记日志。</text>
<text x="694" y="848" class="cap" text-anchor="start">默认动态过滤、轮末 sample filter 与 all-samples 钩子都在被替换的循环里，此处不运行。</text>
<text x="24" y="890" class="su" text-anchor="start">源码基线：THUDM/slime@681b3adca541 · 复现 generate_rollout_async / abort / should_drop_dynamic_filter_output / check_reward_nonzero_std(_with_fallback) / AsyncRolloutWorker._loop</text>
