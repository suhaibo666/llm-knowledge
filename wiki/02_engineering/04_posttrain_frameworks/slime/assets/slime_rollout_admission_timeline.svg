<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="858" viewBox="0 0 1180 858" role="img" aria-labelledby="title desc">
<title id="title">slime rollout 接收循环：四个候选组如何得到两个训练组，abort 时在途组怎样回收</title>
<desc id="desc">上方时间线展示 over-sampling 提交、FIRST_COMPLETED 接收、动态过滤拒绝、目标满后按 abort_mode 走服务端 abort 与 partial 回收判定，以及 remaining_batch_size 与 len(data) 两个计数器；下方展示连续拒绝触发补采与 with_fallback 兜底。</desc>
<style>
