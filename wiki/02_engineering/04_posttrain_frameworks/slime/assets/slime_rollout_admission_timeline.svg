<path d="M414 132 L414 276" class="tick"/>
<text x="597" y="124" class="sm" text-anchor="middle">t3</text>
<path d="M536 132 L536 276" class="tick"/>
<text x="719" y="124" class="sm" text-anchor="middle">t4</text>
<path d="M658 132 L658 276" class="tick"/>
<text x="160" y="151" class="sm" text-anchor="end">A · 样本 0–3</text>
<text x="160" y="164" class="sm" text-anchor="end">reward 1 0 0 1</text>
<rect x="174" y="140" width="358" height="22" rx="4" class="bar"/>
<rect x="422" y="140" width="106" height="22" rx="4" class="acc1"/>
<text x="475" y="155" class="sm" text-anchor="middle">完成 → 通过</text>
<text x="160" y="185" class="sm" text-anchor="end">B · 样本 4–7</text>
<text x="160" y="198" class="sm" text-anchor="end">reward 1 1 1 1</text>
<rect x="174" y="174" width="236" height="22" rx="4" class="bar"/>
<rect x="300" y="174" width="106" height="22" rx="4" class="acc2"/>
<text x="353" y="189" class="sm" text-anchor="middle">完成 → 拒绝</text>
<text x="160" y="219" class="sm" text-anchor="end">C · 样本 8–11</text>
<text x="160" y="232" class="sm" text-anchor="end">reward 0 0 1 0</text>
<rect x="174" y="208" width="480" height="22" rx="4" class="bar"/>
<rect x="544" y="208" width="106" height="22" rx="4" class="acc1"/>
<text x="597" y="223" class="sm" text-anchor="middle">完成 → 通过</text>
<text x="160" y="253" class="sm" text-anchor="end">D · 样本 12–15</text>
<text x="160" y="266" class="sm" text-anchor="end">reward 1 0 1 1</text>
<rect x="174" y="242" width="602" height="22" rx="4" class="bar"/>
<rect x="666" y="242" width="106" height="22" rx="4" class="acc2"/>
<text x="719" y="257" class="sm" text-anchor="middle">在途 → 回收</text>
<text x="160" y="304" class="mono" text-anchor="end">remaining_batch_size</text>
<rect x="178" y="288" width="106" height="22" rx="4" class="cell"/>
<text x="231" y="303" class="mono" text-anchor="middle">4</text>
<rect x="300" y="288" width="106" height="22" rx="4" class="acc1"/>
<text x="353" y="303" class="mono" text-anchor="middle">3</text>
<rect x="422" y="288" width="106" height="22" rx="4" class="cell"/>
<text x="475" y="303" class="mono" text-anchor="middle">3</text>
<rect x="544" y="288" width="106" height="22" rx="4" class="cell"/>
<text x="597" y="303" class="mono" text-anchor="middle">3</text>
<rect x="666" y="288" width="106" height="22" rx="4" class="cell"/>
<text x="719" y="303" class="mono" text-anchor="middle">3</text>
<text x="160" y="330" class="mono" text-anchor="end">len(data)</text>
<rect x="178" y="314" width="106" height="22" rx="4" class="cell"/>
<text x="231" y="329" class="mono" text-anchor="middle">0</text>
<rect x="300" y="314" width="106" height="22" rx="4" class="cell"/>
<text x="353" y="329" class="mono" text-anchor="middle">0</text>
<rect x="422" y="314" width="106" height="22" rx="4" class="acc1"/>
<text x="475" y="329" class="mono" text-anchor="middle">1</text>
<rect x="544" y="314" width="106" height="22" rx="4" class="acc1"/>
<text x="597" y="329" class="mono" text-anchor="middle">2</text>
<rect x="666" y="314" width="106" height="22" rx="4" class="cell"/>
<text x="719" y="329" class="mono" text-anchor="middle">2</text>
<text x="160" y="356" class="mono" text-anchor="end">pendings</text>
<rect x="178" y="340" width="106" height="22" rx="4" class="cell"/>
<text x="231" y="355" class="mono" text-anchor="middle">4</text>
<rect x="300" y="340" width="106" height="22" rx="4" class="cell"/>
<text x="353" y="355" class="mono" text-anchor="middle">3</text>
<rect x="422" y="340" width="106" height="22" rx="4" class="cell"/>
<text x="475" y="355" class="mono" text-anchor="middle">2</text>
<rect x="544" y="340" width="106" height="22" rx="4" class="cell"/>
<text x="597" y="355" class="mono" text-anchor="middle">1</text>
<rect x="666" y="340" width="106" height="22" rx="4" class="cell"/>
<text x="719" y="355" class="mono" text-anchor="middle">0</text>
<text x="231" y="388" class="sm" text-anchor="middle">提交一整波</text>
<text x="231" y="402" class="sm" text-anchor="middle">4 组 → pendings</text>
<text x="353" y="388" class="sm" text-anchor="middle">zero-std 拒绝</text>
<text x="353" y="402" class="sm" text-anchor="middle">remaining −1</text>
<text x="475" y="388" class="sm" text-anchor="middle">入选</text>
<text x="475" y="402" class="sm" text-anchor="middle">len(data) +1</text>
<text x="597" y="388" class="sm" text-anchor="middle">入选</text>
<text x="597" y="402" class="sm" text-anchor="middle">len(data) +1</text>
<text x="719" y="388" class="sm" text-anchor="middle">目标满 → abort</text>
<text x="719" y="402" class="sm" text-anchor="middle">等 1 个 pending</text>
<rect x="810" y="116" width="330" height="176" rx="8" class="ghost"/>
<text x="822" y="136" class="pt" text-anchor="start">两个计数器的分工</text>
<text x="822" y="156" class="tx" text-anchor="start">remaining_batch_size：已提交且未被拒的候选组；</text>
<text x="822" y="173" class="tx" text-anchor="start">低于 target 2 时再补一整波 4 组，不只补缺口。</text>
<text x="822" y="193" class="tx" text-anchor="start">len(data)：已入选组数；达到 2 即退出并 abort。</text>
<text x="822" y="213" class="tx" text-anchor="start">B 被拒：remaining 4 → 3，仍 ≥ 2，不补采。</text>
<text x="822" y="233" class="tx" text-anchor="start">入选 A、C，按 group[0].index 排序后交训练。</text>
<text x="822" y="253" class="tx" text-anchor="start">超出目标的已完成组不训练也不回收（源码 NOTE）。</text>
<text x="822" y="276" class="cap" text-anchor="start">信号量 1024 按请求数限流，不按 token 或 KV 预算。</text>
<rect x="810" y="304" width="330" height="96" rx="8" class="acc2"/>
<text x="822" y="324" class="tx" text-anchor="start">abort 按生成函数的 abort_mode 分两路：</text>
<text x="822" y="341" class="tx" text-anchor="start">默认 generate：对默认 router 全部 worker 发</text>
<text x="822" y="358" class="tx" text-anchor="start">abort_all，查 /v1/loads 到 0（查询异常只告警）；</text>
<text x="822" y="375" class="tx" text-anchor="start">abort_mode="request"：取消 task，不查负载。</text>
<text x="822" y="392" class="tx" text-anchor="start">两路都在等本地 pendings 返回后才回收。</text>
<rect x="40" y="416" width="1100" height="78" rx="8" class="acc2"/>
<text x="56" y="436" class="tx" text-anchor="start">t4 abort 细节（默认 generate，未设 abort_mode）：active_server_generations = 4 → GET /workers → 每个 worker 发 abort_all 并轮询 /v1/loads 到 0</text>
<text x="56" y="456" class="tx" text-anchor="start">D 的 4 条 /generate 以 finish_reason=abort 返回 → Sample._apply_meta_info 置 ABORTED；response_length = 6 4 0 8（示例假设）</text>
<text x="56" y="476" class="tx" text-anchor="start">partial 回收判定 any(ABORTED 且 response_length &gt; 0) = 是 → D 整组回 buffer；四条都是 0 → 不回收；abort 前已整组完成 → 不回收</text>
<rect x="24" y="520" width="1132" height="300" rx="10" class="panel"/>
<text x="40" y="544" class="pt" text-anchor="start">同一循环的两条过滤变体（8 个候选组，A B C 均为零方差）</text>
<text x="40" y="570" class="tx" text-anchor="start">① check_reward_nonzero_std：连续拒绝 → remaining 低于 2 → 再提交一整波</text>
<rect x="40" y="578" width="70" height="46" rx="4" class="cell"/>
<text x="75" y="594" class="sm" text-anchor="middle">+4</text>
<text x="75" y="610" class="mono" text-anchor="middle">r=4 d=0</text>
<rect x="114" y="578" width="70" height="46" rx="4" class="acc2"/>
<text x="149" y="594" class="sm" text-anchor="middle">B 拒</text>
<text x="149" y="610" class="mono" text-anchor="middle">r=3 d=0</text>
<rect x="188" y="578" width="70" height="46" rx="4" class="acc2"/>
<text x="223" y="594" class="sm" text-anchor="middle">A 拒</text>
<text x="223" y="610" class="mono" text-anchor="middle">r=2 d=0</text>
<rect x="262" y="578" width="70" height="46" rx="4" class="acc2"/>
<text x="297" y="594" class="sm" text-anchor="middle">C 拒</text>
<text x="297" y="610" class="mono" text-anchor="middle">r=1 d=0</text>
<rect x="336" y="578" width="70" height="46" rx="4" class="cell"/>
<text x="371" y="594" class="sm" text-anchor="middle">+4</text>
<text x="371" y="610" class="mono" text-anchor="middle">r=5 d=0</text>
<rect x="410" y="578" width="70" height="46" rx="4" class="acc1"/>
<text x="445" y="594" class="sm" text-anchor="middle">D 入</text>
<text x="445" y="610" class="mono" text-anchor="middle">r=5 d=1</text>
<rect x="484" y="578" width="70" height="46" rx="4" class="acc1"/>
<text x="519" y="594" class="sm" text-anchor="middle">E 入</text>
<text x="519" y="610" class="mono" text-anchor="middle">r=5 d=2</text>
<rect x="558" y="578" width="70" height="46" rx="4" class="ghost"/>
<text x="593" y="594" class="sm" text-anchor="middle">abort</text>
<text x="593" y="610" class="mono" text-anchor="middle">r=5 d=2</text>
<text x="40" y="642" class="cap" text-anchor="start">B、A、C 依次被拒，remaining 3 → 2 → 1；t3 再提交 E F G H（+4）</text>
<text x="40" y="658" class="cap" text-anchor="start">随后 D、E 入选；abort 时 3 组在途，代价是多付一整波生成与 RM。</text>
<text x="40" y="688" class="tx" text-anchor="start">② check_reward_nonzero_std_with_fallback：remaining ≤ target 时保留零方差组</text>
<rect x="40" y="696" width="70" height="46" rx="4" class="cell"/>
<text x="75" y="712" class="sm" text-anchor="middle">+4</text>
<text x="75" y="728" class="mono" text-anchor="middle">r=4 d=0</text>
<rect x="114" y="696" width="70" height="46" rx="4" class="acc2"/>
<text x="149" y="712" class="sm" text-anchor="middle">B 拒</text>
<text x="149" y="728" class="mono" text-anchor="middle">r=3 d=0</text>
<rect x="188" y="696" width="70" height="46" rx="4" class="acc2"/>
<text x="223" y="712" class="sm" text-anchor="middle">A 拒</text>
<text x="223" y="728" class="mono" text-anchor="middle">r=2 d=0</text>
<rect x="262" y="696" width="70" height="46" rx="4" class="acc1"/>
<text x="297" y="712" class="sm" text-anchor="middle">C 兜底入</text>
<text x="297" y="728" class="mono" text-anchor="middle">r=2 d=1</text>
<rect x="336" y="696" width="70" height="46" rx="4" class="acc1"/>
<text x="371" y="712" class="sm" text-anchor="middle">D 入</text>
<text x="371" y="728" class="mono" text-anchor="middle">r=2 d=2</text>
<rect x="410" y="696" width="70" height="46" rx="4" class="ghost"/>
<text x="445" y="712" class="sm" text-anchor="middle">abort</text>
<text x="445" y="728" class="mono" text-anchor="middle">r=2 d=2</text>
<text x="40" y="760" class="cap" text-anchor="start">B、A 被拒后 remaining=2 ≤ 2，C 虽零方差仍入选（keep_when_insufficient）</text>
<text x="40" y="776" class="cap" text-anchor="start">C、D 凑满，不再补采，abort 时 0 组在途；代价是送进一个无梯度信号的组。</text>
<rect x="690" y="564" width="450" height="214" rx="8" class="ghost"/>
<text x="702" y="584" class="pt" text-anchor="start">abort 之后的轮末处理</text>
<text x="702" y="606" class="tx" text-anchor="start">state.reset() 清空 remaining、pendings、aborted、</text>
<text x="702" y="623" class="tx" text-anchor="start">cancellable_tasks、active_server_generations。</text>
<text x="702" y="645" class="tx" text-anchor="start">入选组按 index 排序 → rollout_sample_filter_path 原地处理；</text>
<text x="702" y="662" class="tx" text-anchor="start">rollout_all_samples_process_path 看到全部已完成组</text>
<text x="702" y="679" class="tx" text-anchor="start">（含被拒者，不含 abort 时的在途组）。</text>
<text x="702" y="701" class="tx" text-anchor="start">未接 dynamic_sampling_filter_path 时 call_dynamic_filter</text>
<text x="702" y="718" class="tx" text-anchor="start">恒返回 keep=True，循环退化为"取够先完成的组"。</text>
<text x="702" y="740" class="tx" text-anchor="start">回收组由 generate_rollout 交 data_source.add_samples，</text>
<text x="702" y="757" class="tx" text-anchor="start">下一轮 buffer 先取（pop_first）。</text>
<text x="40" y="806" class="cap" text-anchor="start">蓝：入选与决定性判定；橙：拒绝、abort 与回收。灰条为在途时间；方块内 r/d 为事件后的 remaining_batch_size / len(data)。</text>
<text x="24" y="844" class="su" text-anchor="start">源码基线：THUDM/slime@4c193f1f3750 · 复现 generate_rollout_async / abort / should_drop_dynamic_filter_output / check_reward_nonzero_std(_with_fallback)</text>
</svg>
