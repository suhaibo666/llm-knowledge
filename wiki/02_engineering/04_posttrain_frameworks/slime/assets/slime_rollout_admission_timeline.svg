<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" role="img" aria-labelledby="title desc">
<title id="title">slime rollout 接收循环：四个候选组如何得到两个训练组，以及 fully-async 的池与队列</title>
<desc id="desc">上方时间线展示 over-sampling 提交、FIRST_COMPLETED 接收、动态过滤拒绝、目标满后 abort 与 partial 回收，以及 remaining_batch_size 与 len(data) 两个计数器；下方展示连续拒绝触发补采、with_fallback 兜底与 fully-async 的池容量、qsize 闸门和按缺口 drain。</desc>
<defs><marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker><marker id="arrowAux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AEB6C2"/></marker></defs>
