<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
<title id="title">slime packed MRoPE：逐样本归零，视觉块之后文本只推进 max(h, w) // merge</title>
<desc id="desc">上半部分按 build_packed_mrope_position_ids 重放两条 7-token 样本的 T/H/W 三轴坐标，样本边界处 current_position 归零，视觉块后的文本从 3 继续。下半部分解释推进量：视觉块在 H、W 轴上只占 max(h', w') 个坐标，方图与 1×4×6 非方图分别续接 3 与 4；被拒绝的按 token 数推进会得到 5 与 7；SGLang 上游 get_rope_index 的上一段最大值加一与 decode 的 delta 续算给出同一位置。</desc>
<defs><marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker></defs>
