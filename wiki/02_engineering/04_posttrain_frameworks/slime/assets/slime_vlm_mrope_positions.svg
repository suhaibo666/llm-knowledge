<text x="40" y="614" class="sm" text-anchor="start">规则等价于“文本从视觉块用过的最大坐标 + 1 开始”：推进量随图的长边增长，</text>
<text x="40" y="632" class="sm" text-anchor="start">不随面积增长；grid_t = 1（图像，视频先按帧拆成 t = 1）时 T 轴不影响最大值。</text>
<rect x="596" y="386" width="560" height="276" rx="10" class="panel"/>
<text x="612" y="410" class="pt" text-anchor="start">③ 同一输入下三种续接位置</text>
<rect x="612" y="428" width="528" height="48" rx="5" class="acc1"/>
<text x="624" y="447" class="tx" text-anchor="start">slime：+ max(h, w) // merge</text>
<text x="624" y="466" class="sm" text-anchor="start">方图 3，非方图 4</text>
<rect x="612" y="486" width="528" height="48" rx="5" class="acc2"/>
<text x="624" y="505" class="tx" text-anchor="start">按 token 数推进（被拒绝）</text>
<text x="624" y="524" class="sm" text-anchor="start">方图 5，非方图 7：空出坐标，与推理侧不一致</text>
<rect x="612" y="544" width="528" height="48" rx="5" class="dep"/>
<text x="624" y="563" class="tx" text-anchor="start">SGLang 纯图像分支 / 回退 get_rope_index（依赖侧源码）</text>
<text x="624" y="582" class="sm" text-anchor="start">next_pos += max(t, h', w')，或上一段 max() + 1：方图 3，非方图 4</text>
<rect x="612" y="602" width="528" height="48" rx="5" class="dep"/>
<text x="624" y="621" class="tx" text-anchor="start">decode 续算（依赖侧）：delta = max + 1 − len = -2</text>
<text x="624" y="640" class="sm" text-anchor="start">第一个生成 token 下标 7：训练侧 3 + (7 − 5) = 5，SGLang 7 + (-2) = 5</text>
<text x="24" y="688" class="cap" text-anchor="start">阅读顺序：① 逐样本归零与三轴坐标 → ② 推进量为什么是长边 → ③ 与被拒绝规则、SGLang 上游和 decode 续算对账。</text>
</svg>
