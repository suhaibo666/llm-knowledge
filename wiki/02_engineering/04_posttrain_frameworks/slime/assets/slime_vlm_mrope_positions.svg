<rect x="392" y="290" width="100" height="22" rx="4" class="acc1"/>
<text x="442" y="305" class="sm" text-anchor="middle">文本续接 3</text>
<rect x="496" y="290" width="360" height="22" rx="4" class="ghost"/>
<text x="676" y="305" class="sm" text-anchor="middle">样本 B：边界处归零，三轴与 A 相同</text>
<text x="40" y="305" class="sm" text-anchor="start">样本 A 分段</text>
<rect x="872" y="130" width="268" height="182" rx="6" class="neutral"/>
<text x="884" y="152" class="tx" text-anchor="start">样本 A 逐段（cursor / current_position）</text>
<text x="884" y="177" class="sm" text-anchor="start">#0 文本 99 → 位置 0，current = 1</text>
<text x="884" y="202" class="sm" text-anchor="start">#1–#4 视觉 4 个 token，start = 1</text>
<text x="884" y="227" class="sm" text-anchor="start">T 1 1 1 1｜H 1 1 2 2｜W 1 2 1 2</text>
<text x="884" y="252" class="sm" text-anchor="start">推进 max(4, 4) // 2 = 2 → current = 3</text>
<text x="884" y="277" class="sm" text-anchor="start">#5–#6 文本 98、7 → 位置 3、4</text>
<text x="884" y="302" class="sm" text-anchor="start">#7 cu_seqlens 边界 → current = 0</text>
<text x="40" y="340" class="tx" text-anchor="start">推进语句：current_position += max(int(grid[1]), int(grid[2])) // spatial_merge_size</text>
<text x="40" y="362" class="tx" text-anchor="start">样本 A：1 + max(4, 4) // 2 = 3，视觉块后的 98 从 3 继续；若按视觉 token 数推进则是 1 + 4 = 5</text>
<rect x="24" y="386" width="560" height="276" rx="10" class="panel"/>
<text x="40" y="410" class="pt" text-anchor="start">② 视觉块在 H、W 轴上只占 max(h', w') 个坐标</text>
