<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1030" viewBox="0 0 1180 1030" role="img" aria-labelledby="title desc">
<title id="title">slime OPD：一条 Sample 的 teacher 与学生 logprob 怎样对齐、注入 advantage 并被缩放</title>
<desc id="desc">三个面板：SGLang teacher 的输入 logprob 丢首项并尾部裁剪、Megatron 前向按 logits 位移取 response 位置，两边落到同一组 token；逐 token 的 d̂ 写进 advantage；白化消去纯蒸馏里的 λ 尺度，clip 让越界 token 的梯度为 0。</desc>
<defs><marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker></defs>
