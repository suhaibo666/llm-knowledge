<text x="364" y="154" class="tx" text-anchor="start">本地 layers.0–1 · weight0–1</text>
<text x="364" y="176" class="tx" text-anchor="start">全局 layers.0–1 · weight2–3</text>
<rect x="40" y="204" width="300" height="78" rx="6" class="neutral"/>
