<text x="50" y="244" class="tx" text-anchor="start">本地 layers.0–1 · weight0–1</text>
<text x="50" y="266" class="tx" text-anchor="start">全局 layers.2–3 · weight0–1</text>
<rect x="354" y="204" width="300" height="78" rx="6" class="neutral"/>
