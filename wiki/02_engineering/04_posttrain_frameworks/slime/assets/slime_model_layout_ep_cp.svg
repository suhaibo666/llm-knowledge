<text x="24" y="34" class="ti" text-anchor="start">身份与序列的两条布局规则：权重名按 PP/EP 恢复全局编号，黑盒模块在 CP 下先拼回整条序列</text>
<text x="24" y="56" class="su" text-anchor="start">玩具模型：4 层、4 个 expert，PP=2、EP=2；packed batch：a 序列 8 个 token、b 序列 4 个，CP=2、TP=1、pad 倍数 128</text>
<rect x="24" y="72" width="1132" height="262" rx="10" class="panel"/>
<text x="40" y="96" class="pt" text-anchor="start">④ named_params_and_buffers：decoder 层号加 PP offset，expert 下标加 EP offset；导入与导出共用这份全局名</text>
<rect x="40" y="114" width="300" height="78" rx="6" class="neutral"/>
