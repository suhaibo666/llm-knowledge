<text x="364" y="244" class="tx" text-anchor="start">本地 layers.0–1 · weight0–1</text>
<text x="364" y="266" class="tx" text-anchor="start">全局 layers.2–3 · weight2–3</text>
<path d="M670 202 L700 202" class="main"/>
<rect x="708" y="114" width="432" height="178" rx="6" class="acc1"/>
<text x="720" y="136" class="tx" text-anchor="start">_get_megatron_local_param_infos</text>
<text x="720" y="158" class="sm" text-anchor="start">PP 与 EP 两轮交换元数据后排序：每个 rank 都是同一份 16 个 expert fc1 名</text>
<text x="720" y="178" class="sm" text-anchor="start">再逐项校验 name / shape / dtype 一致</text>
<text x="720" y="200" class="sm" text-anchor="start">例：PP1·EP1 的本地 layers.1 · weight1</text>
<text x="720" y="218" class="sm" text-anchor="start">→ layers.3.mlp.experts.linear_fc1.weight3</text>
<text x="720" y="236" class="sm" text-anchor="start">→ model.layers.3.mlp.experts.3.gate_proj / up_proj</text>
<text x="720" y="260" class="sm" text-anchor="start">导入同样按全局名去读 HF 的 experts.{全局下标}</text>
<text x="720" y="280" class="sm" text-anchor="start">不在本 rank 的 expert 由 EP 组广播补齐</text>
<rect x="40" y="304" width="482" height="22" rx="4" class="acc2"/>
<text x="48" y="319" class="sm" text-anchor="start">MTP：EP rank 1 的 mtp.layers.0 … weight1 → weight3，层号仍为 0（不加 PP offset）</text>
<rect x="24" y="346" width="1132" height="318" rx="10" class="panel"/>
<text x="40" y="370" class="pt" text-anchor="start">⑤ HuggingfaceAttention.forward：CP&gt;1 时先 all-gather，再按“前段 rank 顺序、后段 rank 逆序”拼回原序列交给 GDN</text>
