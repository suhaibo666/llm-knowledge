<text x="748" y="573" class="sm" text-anchor="start">每条序列 chunk(2·CP)，取第 r 与 2·CP−1−r 段</text>
<text x="40" y="608" class="sm" text-anchor="start">代价：每个 CP rank 都对全局全部位置（含 pad）跑一遍 GDN；SP 下先按 TP 组 gather、输出再 scatter，模块内部没有 TP 切分</text>
<text x="40" y="628" class="sm" text-anchor="start">假设：每条序列本地长度是 2 的倍数、全局长度可被 2·CP 整除（由 slice_with_cp 的补齐保证），wrapper 自身不校验</text>
<text x="40" y="648" class="sm" text-anchor="start">allgather-CP（DSA 模式）是另一种连续等分布局，只允许 DSA 架构；本面板是默认 zigzag 布局</text>
<rect x="24" y="676" width="1132" height="304" rx="10" class="panel"/>
<text x="40" y="700" class="pt" text-anchor="start">⑥ 反向：两条 all-gather 都“只取本片梯度”；SP 成立，CP 下会丢掉其他 rank 输出对本片输入的梯度（分析判断）</text>
<text x="40" y="722" class="sm" text-anchor="start">分析模型：用前缀和 y_q = Σ_{p≤q} x_p 代替 GDN 的因果依赖、损失 L = Σ_q y_q，只看 a 序列；未在 slime 的 GPU 训练中验证</text>
