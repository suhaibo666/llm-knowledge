<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1000" viewBox="0 0 1180 1000" role="img" aria-labelledby="title desc">
<title id="title">slime 权重布局规则二：PP/EP 全局命名、HF 黑盒 GDN 的 CP 两段重组与反向梯度账</title>
<desc id="desc">面板四：4 层、4 个 expert，PP=2、EP=2 的四个 rank 各自把本地层号 0 到 1、expert 下标 0 到 1 加上 PP 与 EP offset，元数据交换后每个 rank 都看到同一份 16 个 expert fc1 名；MTP 层号不加 offset。面板五：CP=2 时两条 packed 序列按 zigzag 切给两个 rank，HF 包装层 all-gather 后按前段 rank 顺序、后段 rank 逆序拼回原序，GDN 之后按 chunk 取回各 rank 的两段。面板六：用前缀和代替 GDN 的因果依赖，比较 SP 与 CP 两条 all-gather 反向取本片与 reduce-scatter 的梯度，CP 取本片会丢掉其他 rank 输出对本片输入的梯度项。</desc>
<defs><marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker></defs>
