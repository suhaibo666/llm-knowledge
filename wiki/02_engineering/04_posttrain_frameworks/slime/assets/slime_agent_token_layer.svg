<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="630" viewBox="0 0 1180 630" role="img" aria-labelledby="title desc">
<title id="title">slime agent token 层：消息相等但 prompt_ids 漂移时的 CLEAN、REALIGN 与 FORK</title>
<desc id="desc">同一两轮会话在 linearize 时的 token 行与 loss_mask：turn 1 后 builder 持有 9 个 token，turn 2 的 prompt_ids 在位置 8 漂移；公共前缀 8、最近 response 起点 7，新 output 2 个 token 短于默认阈值 1024，走 REALIGN，A 整段改为 mask 0，只训练 2 个 token；阈值取 1 时走 FORK，两条 Sample 共训练 4 个 token，第二条带 13 个 prompt token 作为上下文。</desc>
<defs><marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker><marker id="arrowAux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AEB6C2"/></marker></defs>
