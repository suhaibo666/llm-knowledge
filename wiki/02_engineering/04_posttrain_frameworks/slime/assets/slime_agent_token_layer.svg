</style><rect width="1180" height="630" fill="white"/>
<text x="24" y="34" class="ti" text-anchor="start">token 层（get_trajectory）：消息已挂在同一条链上，prompt_ids 却与已持有的 token 不一致</text>
<text x="24" y="56" class="su" text-anchor="start">已持有 = turn 1 的 prompt 7 + A 2；turn 2 的 prompt_ids 在位置 8（A 回放的 &lt;/ast&gt;）被替换成 &lt;DRIFT&gt;；C = r:done &lt;/ast&gt;</text>
