<text x="1026.5" y="423" class="sm" text-anchor="middle">pub</text>
<text x="40" y="455" class="sm" text-anchor="start">actor Timer</text>
<rect x="200" y="440" width="232" height="22" rx="3" class="ghost"/>
<text x="316" y="455" class="sm" text-anchor="middle">train_wait</text>
<rect x="432" y="440" width="87" height="22" rx="3" class="neutral"/>
