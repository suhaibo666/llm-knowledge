<text x="40" y="534" class="sm" text-anchor="start">第 1 轮 perf：train_wait 5 + train 3 = step_time 8，wait_time_ratio = 5/8 = 0.625；推理侧每轮空闲 1</text>
<text x="40" y="552" class="sm" text-anchor="start">排队 = driver 在 ray.get(rollout_manager.save) 上等已提交的 generate，fence 随即返回；--save-interval 2 时不保存的轮次改在 fence 上等 3</text>
<text x="40" y="570" class="sm" text-anchor="start">max(7, 4) + 2 + 1 = 10 把等待在 max 外又算一次；interval 2 时轮首间隔 7、8 交替，滞后 1、2 交替</text>
<rect x="24" y="598" width="1132" height="176" rx="10" class="panel"/>
<text x="40" y="622" class="pt" text-anchor="start">③ 第 1 轮 perf/train_wait_time 按时间顺序拆段：有默认键的段与只剩残差的段</text>
<text x="40" y="657" class="tx" text-anchor="start">train.py</text>
<rect x="200" y="642" width="60" height="22" rx="3" class="ghost"/>
<text x="230" y="657" class="sm" text-anchor="middle">save 1</text>
<rect x="260" y="642" width="60" height="22" rx="3" class="ghost"/>
<text x="290" y="657" class="sm" text-anchor="middle">pub 1</text>
<rect x="320" y="642" width="360" height="22" rx="3" class="neutral"/>
<text x="500" y="657" class="sm" text-anchor="middle">rollout 6</text>
<rect x="680" y="642" width="60" height="22" rx="3" class="acc2"/>
<text x="710" y="657" class="sm" text-anchor="middle">data 1</text>
<rect x="740" y="642" width="60" height="22" rx="3" class="ghost"/>
<text x="770" y="657" class="sm" text-anchor="middle">pre 1</text>
<text x="812" y="657" class="sm" text-anchor="start">= 10：有键 3，残差 7（rollout_time 6 + 转换 1）</text>
<text x="40" y="693" class="tx" text-anchor="start">train_async.py</text>
<rect x="200" y="678" width="60" height="22" rx="3" class="ghost"/>
<text x="230" y="693" class="sm" text-anchor="middle">save 1</text>
<rect x="260" y="678" width="120" height="22" rx="3" class="hatch"/>
<text x="320" y="693" class="sm" text-anchor="middle">排队 2</text>
<rect x="380" y="678" width="60" height="22" rx="3" class="ghost"/>
<text x="410" y="693" class="sm" text-anchor="middle">pub 1</text>
<rect x="440" y="678" width="60" height="22" rx="3" class="ghost"/>
<text x="470" y="693" class="sm" text-anchor="middle">pre 1</text>
<text x="512" y="693" class="sm" text-anchor="start">= 5：有键 3，残差 2（driver 等待：本轮在 rollout_manager.save 排队）</text>
<text x="40" y="726" class="sm" text-anchor="start">键：save → perf/save_model_time，pub → perf/update_weights_time，pre → perf/data_preprocess_time，rollout → perf/rollout_time（rollout 侧记录）</text>
<text x="40" y="744" class="sm" text-anchor="start">data（样本转训练 dict、DP 切分、ray.put）与排队/fence 等待没有默认键；橙色段只能用 train_wait 减去同一条记录里的有键段得到，或在 driver 侧自建计时</text>
<text x="40" y="762" class="sm" text-anchor="start">update_weights 与 save_model 由 driver 在上一轮训练块之后调用，因此出现在下一条 perf 记录里；offload、整份磁盘 reload、eval、actor 权重 CPU 备份在本例取 0</text>
<text x="24" y="798" class="cap" text-anchor="start">阅读顺序：①② 对齐同一时间轴看关键路径 → ② 的橙色等待是两臂之差 → ③ 同一条 perf 记录里减去有键段，剩下的才是 driver 侧等待。</text>
</svg>
