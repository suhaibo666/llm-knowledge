<line x1="896" y1="498" x2="896" y2="504" class="axis"/>
<text x="896" y="516" class="sm" text-anchor="middle">24</text>
<line x1="954" y1="498" x2="954" y2="501" class="axis"/>
<line x1="1012" y1="498" x2="1012" y2="504" class="axis"/>
<text x="1012" y="516" class="sm" text-anchor="middle">28</text>
