<text x="40" y="276" class="sm" text-anchor="start">第 1 轮 perf：train_wait 10 + train 3 = step_time 13，wait_time_ratio = 10/13 = 0.769；推理侧每轮空闲 6</text>
<rect x="24" y="304" width="1132" height="280" rx="10" class="panel"/>
<text x="40" y="328" class="pt" text-anchor="start">② train_async.py：一轮 = max(6 + 1, 1 + 3 + 1) + 1 = 8；driver 等待 2 已在 max 内，D2 由 v1 生成，滞后 1</text>
<text x="40" y="359" class="sm" text-anchor="start">RolloutManager.generate</text>
