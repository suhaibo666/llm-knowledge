<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="818" viewBox="0 0 1180 818" role="img" aria-labelledby="title desc">
<title id="title">slime 训练闭环关键路径：同一组阶段时长在 train.py 与 train_async.py 上的周期、计时键与残差</title>
<desc id="desc">上面两块面板共用时间轴：train.py 每轮串行生成、训练、保存、发布，一轮 13；train_async.py 轮首提交下一轮生成并同时训练，保存轮的 DataSource 保存排在下一轮生成之后，一轮 max(7, 5) + 1 = 8，driver 等待 2 包含在 max 内。每块面板底部的 actor Timer 泳道给出 perf/train_wait_time 与 train 的窗口。第三块把第 1 轮的 train_wait 窗口拆段：data_preprocess、save_model、update_weights 有默认键，同步的 rollout 转换与异步的 driver 等待没有。</desc>
<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FCF1E6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#E7B98E" stroke-width="2"/></pattern></defs>
<style>
  text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;fill:#2A313B}
  .ti{font-size:19px;font-weight:700;fill:#1F2430}
  .su{font-size:12px;fill:#747C88}
  .pt{font-size:14px;font-weight:700}
  .tx{font-size:12px;fill:#38414D}
  .sm{font-size:10.5px;fill:#5B6470}
  .cap{font-size:11.5px;fill:#5B6470}
  .panel{fill:#FBFCFE;stroke:#D9DEE7;stroke-width:1.2}
  .neutral{fill:#fff;stroke:#AEB6C2;stroke-width:1.2}
  .ghost{fill:#F5F7FA;stroke:#D9DEE7;stroke-width:1.1}
  .acc1{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.5}
  .acc2{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.5}
  .hatch{fill:url(#hatch);stroke:#C3651F;stroke-width:1.5}
  .axis{stroke:#AEB6C2;stroke-width:1}
  .tick{stroke:#D9DEE7;stroke-width:1}
  .ruler{fill:none;stroke:#2563EB;stroke-width:1.6}
</style><rect width="1180" height="818" fill="white"/>
<text x="24" y="34" class="ti" text-anchor="start">训练闭环关键路径：train.py 把各段相加，train_async.py 取两条臂的较大者再加发布</text>
<text x="24" y="56" class="su" text-anchor="start">示例时长：rollout 6、数据转换 1、data_preprocess 1、训练块 3、save 1、update_weights 1；每轮保存，--update-weights-interval 1；t=0 时首推已完成</text>
<rect x="24" y="72" width="1132" height="218" rx="10" class="panel"/>
<text x="40" y="96" class="pt" text-anchor="start">① train.py：一轮 = 6 + 1 + 1 + 3 + 1 + 1 = 13；训练批 D1 由 v1 生成，版本滞后 0</text>
<text x="40" y="127" class="sm" text-anchor="start">RolloutManager.generate</text>
<rect x="200" y="112" width="174" height="22" rx="3" class="neutral"/>
<text x="287" y="127" class="sm" text-anchor="middle">rollout D0·v0</text>
