<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="700" viewBox="0 0 1180 700" role="img" aria-labelledby="title desc">
<title id="title">slime 权重同步：NCCL 与共卡 CUDA IPC 两条在线数据面</title>
<desc id="desc">上半部分是训推分离的 NCCL 数据面：PP 源 rank 建临时 group、逐桶持锁发 RPC 并广播；下半部分是共卡 CUDA IPC：前缀 engine 走句柄、越界 engine 走 NCCL 补发、MoE 专家走 rank 间定向 P2P，并标出 RPC 返回前拷贝是否完成取决于镜像补丁。两条时间条都标出服务暂停窗口。</desc>
<defs><marker id="arrowMain" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2563EB"/></marker><marker id="arrowAux" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#AEB6C2"/></marker></defs>
<style>
  text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;fill:#2A313B}
  .ti{font-size:19px;font-weight:700;fill:#1F2430}
  .su{font-size:12px;fill:#747C88}
  .pt{font-size:14px;font-weight:700}
  .tx{font-size:12px;fill:#38414D}
  .sm{font-size:10.5px;fill:#5B6470}
  .mono{font-size:11px;font-family:"SFMono-Regular",Menlo,Consolas,monospace;fill:#38414D}
  .cap{font-size:11.5px;fill:#5B6470}
  .panel{fill:#FBFCFE;stroke:#D9DEE7;stroke-width:1.2}
  .neutral{fill:#fff;stroke:#AEB6C2;stroke-width:1.2}
  .ghost{fill:#F5F7FA;stroke:#D9DEE7;stroke-width:1.1}
  .dep{fill:#F5F7FA;stroke:#AEB6C2;stroke-width:1.2;stroke-dasharray:5 4}
  .acc1{fill:#EAF1FD;stroke:#2563EB;stroke-width:1.5}
  .acc2{fill:#FCF1E6;stroke:#C3651F;stroke-width:1.5}
  .cell{fill:#fff;stroke:#AEB6C2;stroke-width:1.1}
  .cellu{fill:#EEF1F5;stroke:#AEB6C2;stroke-width:1.1}
  .win{fill:#EAF1FD;stroke:none}
  .main{fill:none;stroke:#2563EB;stroke-width:2;marker-end:url(#arrowMain)}
  .aux{fill:none;stroke:#AEB6C2;stroke-width:1.3;stroke-dasharray:5 4;marker-end:url(#arrowAux)}
</style><rect width="1180" height="700" fill="white"/>
<text x="24" y="34" class="ti" text-anchor="start">在线数据面：NCCL 与共卡 CUDA IPC 都在服务暂停窗口里搬运</text>
<text x="24" y="56" class="su" text-anchor="start">同一 4 卡训练（TP=2、DP=2）· ② 训推分离两个 engine（TP=2、TP=4）· ③ rollout 6 卡、每 engine 2 卡、actor 占槽位 0–3</text>
<rect x="24" y="70" width="1132" height="192" rx="10" class="panel"/>
<text x="40" y="94" class="pt" text-anchor="start">② NCCL（训推分离）：每个 PP 源 rank 建临时 group，逐桶 lock → RPC → broadcast</text>
<rect x="40" y="106" width="206" height="22" rx="4" class="acc1"/>
<text x="48" y="121" class="sm" text-anchor="start">rank 0 · PP 源（DP=0、TP=0）</text>
<rect x="40" y="132" width="206" height="22" rx="4" class="neutral"/>
<text x="48" y="147" class="sm" text-anchor="start">rank 1 · 只参加 TP all-gather</text>
<rect x="40" y="158" width="206" height="22" rx="4" class="ghost"/>
<text x="48" y="173" class="sm" text-anchor="start">rank 2 · DP 副本，gather 后跳过</text>
<rect x="40" y="184" width="206" height="22" rx="4" class="ghost"/>
<text x="48" y="199" class="sm" text-anchor="start">rank 3 · DP 副本，gather 后跳过</text>
<path d="M248 117 L300 117" class="main"/>
<rect x="304" y="104" width="300" height="100" rx="6" class="acc1"/>
<text x="316" y="124" class="tx" text-anchor="start">group "slime-pp_0"：world = 2 + 4 + 1 = 7</text>
<text x="316" y="144" class="tx" text-anchor="start">engine A（TP=2）rank_offset = 1</text>
<text x="316" y="162" class="tx" text-anchor="start">engine B（TP=4）rank_offset = 3</text>
<text x="316" y="188" class="sm" text-anchor="start">训练侧只占 rank 0；两边原有并行组不合并</text>
<rect x="620" y="104" width="522" height="100" rx="6" class="neutral"/>
<text x="632" y="124" class="tx" text-anchor="start">每个桶（持 RolloutManager 的 Ray 锁，防多个 PP 源交错广播）</text>
<text x="632" y="146" class="sm" text-anchor="start">① Lock.acquire　② RPC：names / dtypes / shapes / weight_version</text>
<text x="632" y="164" class="sm" text-anchor="start">③ dist.broadcast(src=0) → wait　④ ray.get → 清桶 → Lock.release</text>
<text x="632" y="188" class="sm" text-anchor="start">非专家、专家两遍之后各一次 Gloo barrier；SGLang 端 NCCL 收入自己的缓冲</text>
<rect x="156.09999999999997" y="212" width="873.8900000000001" height="44" rx="4" class="win"/>
<text x="159.09999999999997" y="223" class="sm" text-anchor="start">服务暂停窗口</text>
<rect x="40" y="228" width="115.09999999999998" height="22" rx="4" class="neutral"/>
<text x="97.54999999999998" y="243" class="sm" text-anchor="middle">version+1</text>
<rect x="159.09999999999997" y="228" width="90.73999999999998" height="22" rx="4" class="neutral"/>
<text x="204.46999999999997" y="243" class="sm" text-anchor="middle">pause</text>
<rect x="253.83999999999995" y="228" width="90.73999999999998" height="22" rx="4" class="neutral"/>
<text x="299.2099999999999" y="243" class="sm" text-anchor="middle">flush</text>
<rect x="348.5799999999999" y="228" width="136.1" height="22" rx="4" class="neutral"/>
<text x="416.62999999999994" y="243" class="sm" text-anchor="middle">量化 restore*</text>
<rect x="488.67999999999995" y="228" width="201.82999999999998" height="22" rx="4" class="neutral"/>
<text x="589.5949999999999" y="243" class="sm" text-anchor="middle">非专家：gather→转换→广播</text>
<rect x="694.51" y="228" width="209.60000000000002" height="22" rx="4" class="neutral"/>
<text x="799.31" y="243" class="sm" text-anchor="middle">专家：gather→EP 聚合→广播</text>
<rect x="908.11" y="228" width="118.87999999999998" height="22" rx="4" class="neutral"/>
<text x="967.55" y="243" class="sm" text-anchor="middle">量化后处理*</text>
<rect x="1030.99" y="228" width="109.00999999999998" height="22" rx="4" class="neutral"/>
<text x="1085.495" y="243" class="sm" text-anchor="middle">continue</text>
<rect x="24" y="274" width="1132" height="372" rx="10" class="panel"/>
<text x="40" y="298" class="pt" text-anchor="start">③ 共卡 CUDA IPC：每张卡持有完整桶，只把句柄交给同卡 SGLang rank；越界 engine 走 NCCL 补发</text>
<rect x="40" y="314" width="52" height="26" rx="4" class="cell"/>
<text x="66" y="331" class="sm" text-anchor="middle">槽位 0</text>
<rect x="96" y="314" width="52" height="26" rx="4" class="cell"/>
<text x="122" y="331" class="sm" text-anchor="middle">槽位 1</text>
<rect x="152" y="314" width="52" height="26" rx="4" class="cell"/>
<text x="178" y="331" class="sm" text-anchor="middle">槽位 2</text>
<rect x="208" y="314" width="52" height="26" rx="4" class="cell"/>
<text x="234" y="331" class="sm" text-anchor="middle">槽位 3</text>
<rect x="264" y="314" width="52" height="26" rx="4" class="ghost"/>
<text x="290" y="331" class="sm" text-anchor="middle">槽位 4</text>
<rect x="320" y="314" width="52" height="26" rx="4" class="ghost"/>
<text x="346" y="331" class="sm" text-anchor="middle">槽位 5</text>
<rect x="40" y="346" width="108" height="22" rx="4" class="acc1"/>
<text x="94" y="361" class="sm" text-anchor="middle">e0 [0,2) 前缀</text>
<rect x="152" y="346" width="108" height="22" rx="4" class="acc1"/>
<text x="206" y="361" class="sm" text-anchor="middle">e1 [2,4) 前缀</text>
<rect x="264" y="346" width="108" height="22" rx="4" class="acc2"/>
<text x="318" y="361" class="sm" text-anchor="middle">e2 [4,6) 越界</text>
<text x="40" y="390" class="sm" text-anchor="start">e0：Gloo 组 {0,1}，源 rank 0 收 2 个描述符 → 1 次 RPC</text>
<text x="40" y="408" class="sm" text-anchor="start">e1：Gloo 组 {2,3}，源 rank 2 收 2 个描述符 → 1 次 RPC</text>
<text x="40" y="426" class="sm" text-anchor="start">e2：4 + 2 &gt; 4 → 越界后缀，NCCL group "slime"，world 3</text>
<rect x="40" y="436" width="490" height="24" rx="5" class="acc2"/>
<text x="50" y="452" class="sm" text-anchor="start">pause / flush / 量化前后处理只发给 e0、e1；越界 e2 不在名单里</text>
<rect x="40" y="470" width="490" height="100" rx="8" class="dep"/>
<text x="52" y="488" class="sm" text-anchor="start">RPC 返回时 SGLang 的 GPU 拷贝是否已完成（依赖侧）</text>
<text x="52" y="508" class="sm" text-anchor="start">补丁镜像：sglang-deterministic.patch 在 load 后 synchronize → 已完成</text>
<text x="52" y="526" class="sm" text-anchor="start">上游 v0.5.15.post1：load_weights 排入拷贝即返回 → 不保证</text>
<text x="52" y="544" class="sm" text-anchor="start">slime：每桶新建 flattened tensor，del 后 ipc_collect / empty_cache</text>
<text x="52" y="562" class="sm" text-anchor="start">块何时被复用取决于 PyTorch CUDA IPC 引用计数（未核）</text>
<rect x="560" y="314" width="582" height="256" rx="8" class="neutral"/>
<text x="572" y="334" class="tx" text-anchor="start">MoE 定向路由：同 4 卡改成 TP=1、EP=4、8 专家；两个共卡 engine 各 EP=2</text>
<rect x="572" y="346" width="130" height="22" rx="4" class="cell"/>
<text x="637" y="361" class="sm" text-anchor="middle">训练 rank 0：e0 e1</text>
<rect x="712" y="346" width="130" height="22" rx="4" class="cell"/>
<text x="777" y="361" class="sm" text-anchor="middle">训练 rank 1：e2 e3</text>
<rect x="852" y="346" width="130" height="22" rx="4" class="cell"/>
<text x="917" y="361" class="sm" text-anchor="middle">训练 rank 2：e4 e5</text>
<rect x="992" y="346" width="130" height="22" rx="4" class="cell"/>
<text x="1057" y="361" class="sm" text-anchor="middle">训练 rank 3：e6 e7</text>
<rect x="572" y="402" width="272" height="22" rx="4" class="acc1"/>
<text x="708" y="417" class="sm" text-anchor="middle">推理 EP 分片 0（e0–e3）→ rank 0、2</text>
<rect x="854" y="402" width="272" height="22" rx="4" class="acc1"/>
<text x="990" y="417" class="sm" text-anchor="middle">推理 EP 分片 1（e4–e7）→ rank 1、3</text>
<path d="M637 369 L748 401" class="aux"/>
<path d="M637 369 L748 401" class="aux"/>
<path d="M777 369 L668 401" class="aux"/>
<path d="M777 369 L748 401" class="aux"/>
<path d="M777 369 L668 401" class="aux"/>
<path d="M777 369 L748 401" class="aux"/>
<path d="M917 369 L950 401" class="aux"/>
<path d="M917 369 L1030 401" class="aux"/>
<path d="M917 369 L950 401" class="aux"/>
<path d="M917 369 L1030 401" class="aux"/>
<path d="M1057 369 L950 401" class="aux"/>
<path d="M1057 369 L950 401" class="aux"/>
<text x="572" y="448" class="sm" text-anchor="start">P2P 发送 12 份专家包（目标即持有者时不发）；通用路径 EP 广播 24 份</text>
<text x="572" y="466" class="sm" text-anchor="start">每卡转换并交付：定向 4 个专家，通用路径 8 个</text>
<text x="572" y="484" class="sm" text-anchor="start">装批（每 rank staging ≤ 4 包）：batch0 = e0–e3，batch1 = e4–e7</text>
<text x="572" y="510" class="sm" text-anchor="start">准入：推理 PP=1、EP&gt;1、两侧专家 TP=1、无 EPLB 与冗余专家、全部共卡</text>
<text x="572" y="528" class="sm" text-anchor="start">任一不满足 → 记日志退回通用桶</text>
<text x="572" y="546" class="sm" text-anchor="start">只匹配 decoder 层 routed expert 的 linear_fc1 / linear_fc2</text>
<rect x="152.29375" y="592" width="854.4125000000001" height="44" rx="4" class="win"/>
<text x="155.29375" y="603" class="sm" text-anchor="start">服务暂停窗口</text>
<rect x="40" y="608" width="111.29374999999999" height="22" rx="4" class="neutral"/>
<text x="95.646875" y="623" class="sm" text-anchor="middle">version+1</text>
<rect x="155.29375" y="608" width="114.02374999999998" height="22" rx="4" class="neutral"/>
<text x="212.30562499999996" y="623" class="sm" text-anchor="middle">pause 前缀</text>
<rect x="273.3175" y="608" width="114.02374999999998" height="22" rx="4" class="neutral"/>
<text x="330.32937499999997" y="623" class="sm" text-anchor="middle">flush 前缀</text>
<rect x="391.34124999999995" y="608" width="132.29375" height="22" rx="4" class="neutral"/>
<text x="457.48812499999997" y="623" class="sm" text-anchor="middle">量化 restore*</text>
<rect x="527.635" y="608" width="195.29375" height="22" rx="4" class="neutral"/>
<text x="625.281875" y="623" class="sm" text-anchor="middle">CPU→GPU、重组、转换→IPC</text>
<rect x="726.92875" y="608" width="157.70375" height="22" rx="4" class="neutral"/>
<text x="805.7806250000001" y="623" class="sm" text-anchor="middle">专家定向 P2P→IPC*</text>
<rect x="888.6325" y="608" width="115.07374999999999" height="22" rx="4" class="neutral"/>
<text x="946.1693750000001" y="623" class="sm" text-anchor="middle">量化后处理*</text>
<rect x="1007.7062500000001" y="608" width="132.29375" height="22" rx="4" class="neutral"/>
<text x="1073.853125" y="623" class="sm" text-anchor="middle">continue 前缀</text>
<text x="24" y="668" class="cap" text-anchor="start">* 为条件步骤（compressed-tensors 量化、定向路由）。浅蓝底 = 服务暂停窗口；虚线框 = 依赖侧。复现 connect_rollout_engines / expert_routing。</text>
<text x="24" y="688" class="su" text-anchor="start">源码基线：THUDM/slime@4c193f1f3750 · 上游 sgl-project/sglang@0b3bb0cbe318（v0.5.15.post1）+ slime 的 docker/patch/latest/*.patch</text>
