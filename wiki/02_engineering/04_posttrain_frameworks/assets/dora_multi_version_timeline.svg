<path class="main" d="M 536.0 211 L 536.0 269"/>
<text class="dim" x="555.0" y="326" text-anchor="start">DP1 收回换 W3；请求 10 带 KV cache 迁到 DP3 续跑，剩余长度不变</text>
<rect class="cost" x="116.0" y="128" width="551.6" height="182" rx="4"/>
