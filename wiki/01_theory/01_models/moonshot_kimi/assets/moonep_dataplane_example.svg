<text x="858" y="644" class="t2" text-anchor="start">反向：远端读回槽梯度</text>
<text x="30" y="886" class="t1" text-anchor="start">前向：所有者按 experts_to_copy 把本地专家推到目标槽，一个 tile 读 1 次、扇出到全部目标；共 3 份</text>
<text x="30" y="914" class="t2" text-anchor="start">反向：所有者远端读各槽梯度、加进本地参数梯度；barrier 后每个目标 rank 在本地清零自己被读过的槽</text>
<text x="30" y="946" class="cap" text-anchor="start">每 rank 恰算 8 个 token；不变的是 buffer 与视图形状，变化的只有 dst、cu_seqlens 与 experts_to_copy 的取值</text>
