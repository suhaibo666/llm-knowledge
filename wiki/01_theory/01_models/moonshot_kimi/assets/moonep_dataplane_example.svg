<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="960" viewBox="0 0 1120 960"><title>MoonEP 数据面与权重面算例</title><desc>沿用 planning 算例：每对 rank 的条目数、rank 0 八行的来源与到达方式，以及专家权重的前向推送与梯度回收。</desc><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#2A313B;font-size:18px}.neutral{fill:#fff;stroke:#C7CCD3}.ghost{fill:#F7F6F3;stroke:#DDD9D2}.acc1{fill:#EAF1FD;stroke:#2563EB}.acc2{fill:#FCF1E6;stroke:#C3651F}.cap{font-size:17px;fill:#6B7280}.heading{font-size:22px;font-weight:600}.title{font-size:25px;font-weight:600}.t1{fill:#2563EB;font-weight:600}.t2{fill:#C3651F;font-weight:600}.mono{font-family:Menlo,Consolas,monospace;font-size:17px}.fwd{stroke:#2563EB;stroke-width:2.5;fill:none}.bwd{stroke:#C3651F;stroke-width:2;fill:none;stroke-dasharray:6 4}</style><defs><marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#2563EB"/></marker><marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#C3651F"/></marker></defs><rect width="1120" height="960" fill="white"/>
