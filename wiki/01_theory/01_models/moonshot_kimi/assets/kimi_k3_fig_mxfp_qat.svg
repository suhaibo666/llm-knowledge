<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
  </defs>
  <rect width="980" height="540" fill="#0a0a0a"/>
  <text x="490" y="34" fill="#f5f5f5" font-size="20" font-weight="600" text-anchor="middle">量化路线演进:K2 Thinking 的 INT4(后训练 QAT)→ K3 的 MXFP4 权重 + MXFP8 激活(SFT 起 QAT)</text>
  <text x="490" y="56" fill="#71717a" font-size="12" text-anchor="middle">依据:HF moonshotai/Kimi-K2-Thinking 模型卡、博客 §Architecture and Infrastructure、OCP MX v1.0 规范(块 k=32,E8M0 共享尺度)</text>

  <!-- timeline lane 1: K2 Thinking -->
  <text x="130" y="102" fill="#e5e5e5" font-size="15" font-weight="600">K2 Thinking / K2.5(2025-11 / 2026-01)</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="60" y="118" width="170" height="52" rx="8" fill="#111318" stroke="#4b5563"/>
    <text x="145" y="140" fill="#e5e5e5">预训练 + SFT(高精度)</text>
    <text x="145" y="158" fill="#71717a" font-size="11">BF16 权重</text>
    <rect x="280" y="118" width="200" height="52" rx="8" fill="#26170a" stroke="#f59e0b"/>
    <text x="380" y="140" fill="#fbbf24">post-training 阶段 QAT</text>
    <text x="380" y="158" fill="#a16207" font-size="11">仅 MoE 组件,INT4 weight-only</text>
    <rect x="530" y="118" width="200" height="52" rx="8" fill="#111318" stroke="#4b5563"/>
    <text x="630" y="140" fill="#e5e5e5">原生 INT4 推理(W4A16)</text>
    <text x="630" y="158" fill="#71717a" font-size="11">低延迟模式无损 2× 提速</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5" fill="none">
    <path d="M 230 144 H 274" marker-end="url(#a6)"/>
    <path d="M 480 144 H 524" marker-end="url(#a6)"/>
  </g>
  <text x="770" y="136" fill="#9ca3af" font-size="11.5">选 INT4 不选 FP4 的官方理由:</text>
  <text x="770" y="154" fill="#9ca3af" font-size="11.5">兼容非 Blackwell 硬件 + 加速 RL</text>

  <!-- timeline lane 2: K3 -->
  <text x="130" y="230" fill="#e5e5e5" font-size="15" font-weight="600">K3(2026-07)</text>
  <g font-size="12.5" text-anchor="middle">
    <rect x="60" y="246" width="170" height="52" rx="8" fill="#111318" stroke="#4b5563"/>
    <text x="145" y="268" fill="#e5e5e5">预训练(高精度)</text>
    <rect x="280" y="246" width="200" height="52" rx="8" fill="#26170a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="380" y="264" fill="#fbbf24">SFT 起全程 QAT</text>
    <text x="380" y="284" fill="#a16207" font-size="11">MXFP4 权重 + MXFP8 激活,贯穿 SFT→RL</text>
    <rect x="530" y="246" width="200" height="52" rx="8" fill="#0f1a2e" stroke="#3b82f6"/>
    <text x="630" y="264" fill="#60a5fa">部署即 MXFP4/MXFP8</text>
    <text x="630" y="284" fill="#71717a" font-size="11">2.8T 权重 ≈ 1.49 TB(含尺度)[推断]</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5" fill="none">
    <path d="M 230 272 H 274" marker-end="url(#a6)"/>
    <path d="M 480 272 H 524" marker-end="url(#a6)"/>
  </g>
  <text x="770" y="262" fill="#22c55e" font-size="11.5">对齐阶段就适配 4-bit 网格,</text>
  <text x="770" y="280" fill="#22c55e" font-size="11.5">部署零 PTQ 损失 [推断]</text>

  <!-- MX format detail -->
  <rect x="60" y="340" width="860 " height="120" rx="10" fill="#111318" stroke="#4b5563"/>
  <text x="490" y="366" fill="#e5e5e5" font-size="15" font-weight="600" text-anchor="middle">OCP Microscaling(MX)块格式:每 32 个元素共享一个 E8M0 尺度因子</text>
  <g font-size="11.5" text-anchor="middle">
    <rect x="120" y="382" width="72" height="30" rx="4" fill="#26170a" stroke="#f59e0b"/>
    <text x="156" y="402" fill="#fbbf24">E8M0 尺度</text>
    <g fill="#0f1a2e" stroke="#3b82f6">
      <rect x="200" y="382" width="40" height="30" rx="4"/>
      <rect x="246" y="382" width="40" height="30" rx="4"/>
      <rect x="292" y="382" width="40" height="30" rx="4"/>
      <rect x="338" y="382" width="40" height="30" rx="4"/>
    </g>
    <text x="220" y="402" fill="#60a5fa">e₁</text>
    <text x="266" y="402" fill="#60a5fa">e₂</text>
    <text x="312" y="402" fill="#60a5fa">e₃</text>
    <text x="358" y="402" fill="#60a5fa">e₄</text>
    <text x="404" y="402" fill="#71717a">… ×32</text>
    <text x="290" y="436" fill="#9ca3af">MXFP4:元素 E2M1(4bit)→ 有效 ≈4.25 bit/权重;MXFP8:E4M3/E5M2</text>
  </g>
  <text x="700" y="396" fill="#9ca3af" font-size="11.5" text-anchor="middle">原生硬件:NVIDIA Blackwell(B200/GB200)、AMD MI355X(CDNA4)</text>
  <text x="700" y="416" fill="#9ca3af" font-size="11.5" text-anchor="middle">Hopper(H100/H200/H800)无 FP4 tensor core</text>
  <text x="700" y="440" fill="#22c55e" font-size="11.5" text-anchor="middle">选开放 MX 标准而非 NVIDIA 私有 NVFP4 ⇒ "broad hardware compatibility"</text>

  <text x="490" y="496" fill="#71717a" font-size="12.5" text-anchor="middle">演进逻辑:INT4 是"迁就存量 Hopper"的过渡解;MXFP4/MXFP8 押注 Blackwell/CDNA4 及多厂商"加速卡"的原生微缩放支持</text>
  <text x="490" y="516" fill="#71717a" font-size="12.5" text-anchor="middle">(K3 博客通篇用 "accelerators" 而非 "GPUs" 描述部署硬件)</text>
</svg>
