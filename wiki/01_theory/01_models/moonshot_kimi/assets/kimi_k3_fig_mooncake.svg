<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="a5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="980" height="520" fill="#0a0a0a"/>
  <text x="490" y="34" fill="#f5f5f5" font-size="20" font-weight="600" text-anchor="middle">Mooncake 分离式推理 × K3:KVCache 为中心,存储换计算</text>
  <text x="490" y="56" fill="#71717a" font-size="12" text-anchor="middle">依据:github.com/kvcache-ai/Mooncake README(FAST'25 Best Paper)、博客 §Availability;结构为示意</text>

  <!-- requests -->
  <rect x="60" y="90" width="150" height="46" rx="8" fill="#111318" stroke="#4b5563"/>
  <text x="135" y="110" fill="#e5e5e5" font-size="13" text-anchor="middle">请求(coding 场景:</text>
  <text x="135" y="128" fill="#e5e5e5" font-size="13" text-anchor="middle">长系统提示+仓库上下文)</text>

  <!-- conductor -->
  <rect x="300" y="90" width="180" height="46" rx="8" fill="#0f1a2e" stroke="#3b82f6"/>
  <text x="390" y="110" fill="#60a5fa" font-size="13" text-anchor="middle">KVCache 感知调度器</text>
  <text x="390" y="128" fill="#71717a" font-size="11.5" text-anchor="middle">按缓存命中位置分派请求</text>
  <path d="M 210 113 H 294" stroke="#9ca3af" stroke-width="1.5" fill="none" marker-end="url(#a5)"/>

  <!-- prefill cluster -->
  <rect x="120" y="200" width="280" height="120" rx="10" fill="#111318" stroke="#4b5563"/>
  <text x="260" y="226" fill="#e5e5e5" font-size="15" font-weight="600" text-anchor="middle">Prefill 集群(算力密集)</text>
  <text x="260" y="250" fill="#9ca3af" font-size="12" text-anchor="middle">吃长输入、生产 KVCache</text>
  <text x="260" y="270" fill="#9ca3af" font-size="12" text-anchor="middle">K3:KDA 层产状态快照,MLA 层产 KV</text>
  <text x="260" y="296" fill="#71717a" font-size="11.5" text-anchor="middle">TTFT 约束下批内并行</text>

  <!-- decode cluster -->
  <rect x="580" y="200" width="280" height="120" rx="10" fill="#111318" stroke="#4b5563"/>
  <text x="720" y="226" fill="#e5e5e5" font-size="15" font-weight="600" text-anchor="middle">Decode 集群(带宽密集)</text>
  <text x="720" y="250" fill="#9ca3af" font-size="12" text-anchor="middle">大 batch 连续解码,TBT 约束</text>
  <text x="720" y="270" fill="#9ca3af" font-size="12" text-anchor="middle">K3:64+ 加速卡超节点,大 EP 摊 896 专家</text>
  <text x="720" y="296" fill="#71717a" font-size="11.5" text-anchor="middle">MoE 稀疏性 ⇒ 必须大 batch/大 EP</text>

  <path d="M 330 113 C 260 150 260 170 260 194" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#a5b)"/>
  <path d="M 450 113 C 640 150 700 170 712 194" stroke="#3b82f6" stroke-width="1.5" fill="none" marker-end="url(#a5b)"/>
  <path d="M 400 260 H 574" stroke="#f59e0b" stroke-width="1.8" fill="none" marker-end="url(#a5)"/>
  <text x="487" y="250" fill="#fbbf24" font-size="12" text-anchor="middle">KVCache 迁移</text>
  <text x="487" y="278" fill="#a16207" font-size="11" text-anchor="middle">Transfer Engine(RDMA,87–190 GB/s)</text>

  <!-- kvcache pool -->
  <rect x="120" y="370" width="740" height="76" rx="10" fill="#0f1a2e" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="490" y="396" fill="#60a5fa" font-size="15" font-weight="600" text-anchor="middle">分离式 KVCache 池(Mooncake Store)</text>
  <text x="490" y="418" fill="#9ca3af" font-size="12.5" text-anchor="middle">把 GPU 集群里闲置的 CPU / DRAM / SSD 池化成多级缓存 —— 用便宜存储换昂贵重算</text>
  <text x="490" y="438" fill="#71717a" font-size="11.5" text-anchor="middle">真实负载下让 Kimi 在同 SLO 内多扛 75% 请求(README);K2 时代已支撑 128×H200 PD 分离部署</text>

  <g stroke="#3b82f6" stroke-width="1.4" fill="none" opacity="0.8">
    <path d="M 260 320 V 364" marker-end="url(#a5b)"/>
    <path d="M 720 364 V 326" marker-end="url(#a5b)"/>
  </g>
  <text x="300" y="348" fill="#71717a" font-size="11">写入/驱逐</text>
  <text x="755" y="348" fill="#71717a" font-size="11">命中加载</text>

  <text x="490" y="486" fill="#22c55e" font-size="13.5" text-anchor="middle" font-weight="600">K3 官方 API 实测口径:coding 负载缓存命中率 &gt; 90% → 有效输入价 ≈ $0.57/MTok($0.30 命中 / $3.00 未中)</text>
</svg>
