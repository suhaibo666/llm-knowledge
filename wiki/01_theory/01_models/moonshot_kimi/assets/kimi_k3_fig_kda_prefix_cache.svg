<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9ca3af"/>
    </marker>
    <marker id="a4b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#0a0a0a"/>
  <text x="490" y="34" fill="#f5f5f5" font-size="20" font-weight="600" text-anchor="middle">KDA 为什么让传统 prefix caching 失效,以及 vLLM 里的解法</text>
  <text x="490" y="56" fill="#71717a" font-size="12" text-anchor="middle">依据:vLLM issue #26201(Prefix Caching for Hybrid Models)、PR #27654 / #42406;博客 §Architecture and Infrastructure</text>

  <!-- Left: full attention -->
  <text x="245" y="92" fill="#e5e5e5" font-size="15" font-weight="600" text-anchor="middle">全注意力层(MLA):KV 逐 token 追加</text>
  <g font-size="12" text-anchor="middle">
    <rect x="60" y="110" width="46" height="30" rx="4" fill="#1a2333" stroke="#3b82f6"/>
    <rect x="112" y="110" width="46" height="30" rx="4" fill="#1a2333" stroke="#3b82f6"/>
    <rect x="164" y="110" width="46" height="30" rx="4" fill="#1a2333" stroke="#3b82f6"/>
    <rect x="216" y="110" width="46" height="30" rx="4" fill="#1a2333" stroke="#3b82f6"/>
    <rect x="268" y="110" width="46" height="30" rx="4" fill="#111318" stroke="#4b5563"/>
    <rect x="320" y="110" width="46" height="30" rx="4" fill="#111318" stroke="#4b5563"/>
    <text x="83" y="130" fill="#60a5fa">KV₁</text>
    <text x="135" y="130" fill="#60a5fa">KV₂</text>
    <text x="187" y="130" fill="#60a5fa">KV₃</text>
    <text x="239" y="130" fill="#60a5fa">KV₄</text>
    <text x="291" y="130" fill="#e5e5e5">KV₅</text>
    <text x="343" y="130" fill="#e5e5e5">KV₆</text>
  </g>
  <text x="245" y="168" fill="#22c55e" font-size="12.5" text-anchor="middle">历史 KV 永远保留 → 任意长度共享前缀按块哈希直接复用</text>

  <!-- Left bottom: linear attention -->
  <text x="245" y="215" fill="#e5e5e5" font-size="15" font-weight="600" text-anchor="middle">KDA 层:只有一个定长状态,逐 token 覆写</text>
  <g font-size="12" text-anchor="middle">
    <rect x="150" y="235" width="90" height="56" rx="8" fill="#26170a" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="195" y="260" fill="#fbbf24">S_t</text>
    <text x="195" y="278" fill="#a16207" font-size="10.5">128×128 / 头</text>
    <path d="M 260 263 C 300 240 300 286 262 268" stroke="#f59e0b" stroke-width="1.4" fill="none" marker-end="url(#a4)"/>
    <text x="320" y="268" fill="#9ca3af" font-size="11.5">每读 1 个 token 就地更新</text>
  </g>
  <text x="245" y="322" fill="#ef4444" font-size="12.5" text-anchor="middle">S_t 覆写 S_{t−1}:没有"逐 token 的历史"可复用</text>
  <text x="245" y="342" fill="#ef4444" font-size="12.5" text-anchor="middle">传统按块哈希的 APC 对线性层直接失效</text>

  <!-- divider -->
  <line x1="490" y1="76" x2="490" y2="530" stroke="#27272a" stroke-width="1.5"/>

  <!-- Right: solution -->
  <text x="735" y="92" fill="#e5e5e5" font-size="15" font-weight="600" text-anchor="middle">解法:块边界状态快照(state checkpoint)</text>
  <g font-size="12" text-anchor="middle">
    <!-- token blocks -->
    <rect x="560" y="112" width="80" height="28" rx="4" fill="#111318" stroke="#4b5563"/>
    <text x="600" y="131" fill="#e5e5e5">block 1</text>
    <rect x="650" y="112" width="80" height="28" rx="4" fill="#111318" stroke="#4b5563"/>
    <text x="690" y="131" fill="#e5e5e5">block 2</text>
    <rect x="740" y="112" width="80" height="28" rx="4" fill="#111318" stroke="#4b5563"/>
    <text x="780" y="131" fill="#e5e5e5">block 3</text>
    <rect x="830" y="112" width="80" height="28" rx="4" fill="#111318" stroke="#4b5563"/>
    <text x="870" y="131" fill="#e5e5e5">block 4…</text>
    <!-- checkpoints -->
    <g stroke="#3b82f6" stroke-width="1.5" fill="none">
      <path d="M 640 140 V 168" marker-end="url(#a4b)"/>
      <path d="M 730 140 V 168" marker-end="url(#a4b)"/>
      <path d="M 820 140 V 168" marker-end="url(#a4b)"/>
    </g>
    <rect x="612" y="172" width="56" height="34" rx="6" fill="#0f1a2e" stroke="#3b82f6"/>
    <text x="640" y="194" fill="#60a5fa">S@16</text>
    <rect x="702" y="172" width="56" height="34" rx="6" fill="#0f1a2e" stroke="#3b82f6"/>
    <text x="730" y="194" fill="#60a5fa">S@32</text>
    <rect x="792" y="172" width="56" height="34" rx="6" fill="#0f1a2e" stroke="#3b82f6"/>
    <text x="820" y="194" fill="#60a5fa">S@48</text>
  </g>
  <text x="735" y="238" fill="#9ca3af" font-size="12.5" text-anchor="middle">prefill 时在每个 cache block 边界额外落一份 SSM/conv 状态快照</text>

  <!-- reuse flow -->
  <g font-size="12.5" text-anchor="middle">
    <rect x="560" y="266" width="350" height="88" rx="8" fill="#111318" stroke="#4b5563"/>
    <text x="735" y="290" fill="#e5e5e5">新请求命中共享前缀(如系统提示 + 会话历史)</text>
    <text x="735" y="312" fill="#e5e5e5">→ MLA 层:直接复用 KV block</text>
    <text x="735" y="334" fill="#e5e5e5">→ KDA 层:恢复 ≤ 前缀长度的最近快照,重算余段</text>
  </g>
  <text x="735" y="382" fill="#71717a" font-size="12" text-anchor="middle">两种模式:"all"(每块都存)/ "align"(对齐后处理,避免 CPU-GPU 同步)</text>

  <!-- PR chain -->
  <g font-size="12" text-anchor="start">
    <rect x="545" y="400" width="380" height="118" rx="8" fill="#0f1a2e" stroke="#3b82f6" opacity="0.9"/>
    <text x="565" y="424" fill="#60a5fa" font-weight="600">vLLM 落地链(GitHub API 核实):</text>
    <text x="565" y="446" fill="#e5e5e5">#27654 KDA 进 vLLM(2025-10-28,Kimi Linear day-0)</text>
    <text x="565" y="466" fill="#e5e5e5">#42406 hybrid 模型 align 前缀缓存(v0.25.0,2026-06)</text>
    <text x="565" y="486" fill="#e5e5e5">#44539 KDA conv state 统一 2-state 布局</text>
    <text x="565" y="506" fill="#e5e5e5">#44848 KimiLinear NIXL PD 分离;#43833 FlashKDA prefill</text>
  </g>

  <text x="245" y="420" fill="#22c55e" font-size="13" text-anchor="middle" font-weight="600">K3 官方表态(博客):</text>
  <text x="245" y="444" fill="#9ca3af" font-size="12.5" text-anchor="middle">"KDA 给传统 prefix caching 带来新挑战,</text>
  <text x="245" y="464" fill="#9ca3af" font-size="12.5" text-anchor="middle">我们已向 vLLM 社区贡献相应实现,随模型发布"</text>
  <text x="245" y="492" fill="#22c55e" font-size="12.5" text-anchor="middle">"KDA + prefill cache 让 K3 在这个规模和长上下文下</text>
  <text x="245" y="512" fill="#22c55e" font-size="12.5" text-anchor="middle">仍能以极具竞争力的 token 价格提供服务"</text>
</svg>
