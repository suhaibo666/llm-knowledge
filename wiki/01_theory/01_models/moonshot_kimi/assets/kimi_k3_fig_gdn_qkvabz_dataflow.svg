<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180" role="img" aria-labelledby="title desc">
  <title id="title">GDN 从隐藏状态到输出的单 token 数据流</title>
  <desc id="desc">从隐藏状态 x_t 计算 q、k、v、a、b、z，经过门控、状态衰减、Delta Rule 写入和查询读取，得到输出 y_t。每个数据流节点与公式逐一对应。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7faff"/>
      <stop offset="1" stop-color="#eef3fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#183153" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#16a34a"/>
    </marker>
    <style>
      .title { font: 700 34px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif; fill:#10233f; }
      .subtitle { font: 400 17px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif; fill:#52657d; }
      .section { font: 700 23px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif; fill:#10233f; }
      .node-title { font: 700 18px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif; fill:#10233f; }
      .body { font: 400 16px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif; fill:#20344f; }
      .small { font: 400 14px 'Microsoft YaHei','Noto Sans SC',Arial,sans-serif; fill:#5e718a; }
      .formula { font: 400 18px Cambria,'Times New Roman',serif; fill:#10233f; }
      .formula-strong { font: 700 20px Cambria,'Times New Roman',serif; fill:#10233f; }
      .code { font: 400 14px Consolas,'Courier New',monospace; fill:#20344f; }
      .step { font: 700 16px Arial,sans-serif; fill:#fff; text-anchor:middle; dominant-baseline:middle; }
      .flow-blue, .flow-orange, .flow-purple, .flow-green,
      .thin-blue, .thin-orange, .thin-purple, .bypass-orange {
        fill:none; stroke-linecap:round; stroke-linejoin:round;
      }
      .flow-blue { stroke:#2563eb; stroke-width:2.2; marker-end:url(#arrow-blue); }
      .flow-orange { stroke:#d97706; stroke-width:2.2; marker-end:url(#arrow-orange); }
      .flow-purple { stroke:#7c3aed; stroke-width:2.2; marker-end:url(#arrow-purple); }
      .flow-green { stroke:#16a34a; stroke-width:2.2; marker-end:url(#arrow-green); }
      .thin-blue { stroke:#2563eb; stroke-width:1.8; marker-end:url(#arrow-blue); }
      .thin-orange { stroke:#d97706; stroke-width:1.8; marker-end:url(#arrow-orange); }
      .thin-purple { stroke:#7c3aed; stroke-width:1.8; marker-end:url(#arrow-purple); }
      .bypass-orange { stroke:#d97706; stroke-width:1.7; stroke-dasharray:7 7; stroke-opacity:.82; marker-end:url(#arrow-orange); }
    </style>
  </defs>

  <rect width="1800" height="1180" fill="url(#bg)"/>
  <text x="55" y="54" class="title">GDN：从 xₜ 计算 q / k / v / a / b / z，再更新状态</text>
  <text x="55" y="84" class="subtitle">单 token / 单 head 视角；批次维省略。蓝色＝内容向量，橙色＝门控，紫色＝记忆状态，绿色＝输出。</text>

  <!-- Stage 1 -->
  <rect x="40" y="110" width="1720" height="355" rx="22" fill="#ffffff" stroke="#cbd7e6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="68" y="148" class="section">① 先从隐藏状态计算 q、k、v、a、b、z</text>

  <rect x="70" y="190" width="180" height="104" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="91" cy="211" r="16" fill="#2563eb"/><text x="91" y="212" class="step">1</text>
  <text x="160" y="225" class="node-title" text-anchor="middle">hidden state</text>
  <text x="160" y="258" class="formula" text-anchor="middle">xₜ ∈ ℝᵈᵐᵒᵈᵉˡ</text>
  <text x="160" y="282" class="small" text-anchor="middle">当前 token</text>

  <path d="M250 242 H310" class="flow-blue"/>
  <rect x="320" y="165" width="330" height="154" rx="17" fill="#eaf2ff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="343" cy="188" r="16" fill="#2563eb"/><text x="343" y="189" class="step">2</text>
  <text x="485" y="201" class="node-title" text-anchor="middle">融合输入投影</text>
  <text x="485" y="236" class="formula-strong" text-anchor="middle">uₜ = W_fused xₜ</text>
  <text x="485" y="271" class="formula" text-anchor="middle">uₜ → [mixed_qkvₜ, bₜ, aₜˡᵒʷ, zₜˡᵒʷ]</text>
  <text x="485" y="301" class="code" text-anchor="middle">fused_qkvbfg_a_proj → split</text>

  <!-- fan out -->
  <path d="M650 203 H700 Q710 203 710 193 V181 H760" class="thin-blue"/>
  <path d="M650 235 H720 Q730 235 730 245 V255 Q730 265 740 265 H760" class="thin-orange"/>
  <path d="M650 265 H690 Q700 265 700 275 V338 Q700 348 710 348 H760" class="thin-orange"/>
  <path d="M650 295 H670 Q680 295 680 305 V419 Q680 429 690 429 H760" class="thin-orange"/>

  <!-- qkv branch -->
  <rect x="770" y="142" width="255" height="78" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="897" y="174" class="node-title" text-anchor="middle">mixed_qkvₜ</text>
  <text x="897" y="201" class="small" text-anchor="middle">尚未做短卷积</text>
  <path d="M1025 181 H1080" class="thin-blue"/>
  <rect x="1090" y="142" width="270" height="78" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="1225" y="172" class="node-title" text-anchor="middle">causal short conv</text>
  <text x="1225" y="199" class="formula" text-anchor="middle">q̃ₜ, k̃ₜ, vₜ</text>
  <path d="M1360 181 H1415" class="thin-blue"/>
  <rect x="1425" y="133" width="290" height="96" rx="14" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <text x="1570" y="164" class="node-title" text-anchor="middle">Q/K L2Norm + scale</text>
  <text x="1570" y="191" class="formula" text-anchor="middle">qₜ=s·q̃ₜ/‖q̃ₜ‖₂</text>
  <text x="1570" y="216" class="formula" text-anchor="middle">kₜ=k̃ₜ/‖k̃ₜ‖₂；vₜ 不归一化</text>

  <!-- b branch -->
  <rect x="770" y="235" width="255" height="60" rx="13" fill="#fff2cc" stroke="#f59e0b" stroke-width="2"/>
  <text x="897" y="260" class="node-title" text-anchor="middle">写门 raw bₜ</text>
  <text x="897" y="283" class="small" text-anchor="middle">每个 head 一个标量</text>
  <path d="M1025 265 H1110" class="thin-orange"/>
  <rect x="1120" y="235" width="240" height="60" rx="13" fill="#fde7a5" stroke="#d97706" stroke-width="2"/>
  <text x="1240" y="272" class="formula-strong" text-anchor="middle">βₜ = sigmoid(bₜ)</text>

  <!-- a branch -->
  <rect x="770" y="317" width="255" height="62" rx="13" fill="#fff2cc" stroke="#f59e0b" stroke-width="2"/>
  <text x="897" y="343" class="node-title" text-anchor="middle">低秩遗忘特征 aₜˡᵒʷ</text>
  <text x="897" y="366" class="small" text-anchor="middle">先降维，再升到各 head</text>
  <path d="M1025 348 H1080" class="thin-orange"/>
  <rect x="1090" y="317" width="270" height="62" rx="13" fill="#fff2cc" stroke="#f59e0b" stroke-width="2"/>
  <text x="1225" y="343" class="node-title" text-anchor="middle">第二级投影</text>
  <text x="1225" y="367" class="formula" text-anchor="middle">aₜ = Wₐ₂ aₜˡᵒʷ</text>
  <path d="M1360 348 H1415" class="thin-orange"/>
  <rect x="1425" y="307" width="290" height="82" rx="14" fill="#fde7a5" stroke="#d97706" stroke-width="2"/>
  <text x="1570" y="335" class="formula" text-anchor="middle">gₜ=−exp(A_log)·softplus(aₜ+dt_bias)</text>
  <text x="1570" y="370" class="formula-strong" text-anchor="middle">αₜ = exp(gₜ) ∈ (0,1)</text>

  <!-- z branch -->
  <rect x="770" y="399" width="255" height="62" rx="13" fill="#fff2cc" stroke="#f59e0b" stroke-width="2"/>
  <text x="897" y="425" class="node-title" text-anchor="middle">低秩输出特征 zₜˡᵒʷ</text>
  <text x="897" y="449" class="small" text-anchor="middle">不进入记忆状态</text>
  <path d="M1025 430 H1080" class="thin-orange"/>
  <rect x="1090" y="399" width="270" height="62" rx="13" fill="#fff2cc" stroke="#f59e0b" stroke-width="2"/>
  <text x="1225" y="425" class="node-title" text-anchor="middle">第二级投影</text>
  <text x="1225" y="449" class="formula" text-anchor="middle">zₜ = W_z₂ zₜˡᵒʷ</text>
  <!-- Stage 2 -->
  <rect x="40" y="490" width="1720" height="535" rx="22" fill="#ffffff" stroke="#cbd7e6" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="68" y="530" class="section">② q / k / v / α / β 进入 GDN 状态更新；z 只在最后控制输出</text>
  <path d="M1360 430 H1710 Q1725 430 1725 445 V898 Q1725 913 1710 913 H1125 Q1110 913 1110 925" class="bypass-orange"/>
  <text x="1737" y="665" class="small" transform="rotate(90 1737 665)">zₜ 旁路：不参与状态更新</text>

  <!-- input chips -->
  <rect x="75" y="560" width="200" height="70" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="175" y="585" class="node-title" text-anchor="middle">旧记忆状态</text>
  <text x="175" y="615" class="formula" text-anchor="middle">Sₜ₋₁ ∈ ℝᵈᵏ×ᵈᵛ</text>
  <rect x="75" y="682" width="200" height="58" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="175" y="718" class="formula-strong" text-anchor="middle">kₜ ∈ ℝᵈᵏ</text>
  <rect x="75" y="778" width="200" height="58" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="175" y="814" class="formula-strong" text-anchor="middle">vₜ ∈ ℝᵈᵛ</text>
  <rect x="75" y="882" width="200" height="58" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="175" y="918" class="formula-strong" text-anchor="middle">qₜ ∈ ℝᵈᵏ</text>

  <!-- alpha input from above -->
  <path d="M1570 389 V468 Q1570 480 1558 480 H832 Q820 480 820 492 V583 Q820 595 808 595 H790" class="bypass-orange"/>
  <text x="803" y="584" class="formula-strong" fill="#b45309">αₜ</text>

  <!-- decay -->
  <path d="M275 595 H480" class="flow-purple"/>
  <rect x="490" y="550" width="300" height="90" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="515" cy="575" r="16" fill="#7c3aed"/><text x="515" y="576" class="step">3</text>
  <text x="640" y="581" class="node-title" text-anchor="middle">先遗忘旧状态</text>
  <text x="640" y="616" class="formula-strong" text-anchor="middle">Sₜ⁻ = αₜ Sₜ₋₁</text>
  <text x="640" y="637" class="small" text-anchor="middle">GDN：每个 head 用一个标量 αₜ</text>

  <!-- predict -->
  <path d="M790 595 H865" class="flow-purple"/>
  <path d="M275 711 H813 Q825 711 825 699 V690 H865" class="flow-blue"/>
  <rect x="875" y="550" width="310" height="150" rx="16" fill="#e7f8ee" stroke="#22c55e" stroke-width="2"/>
  <circle cx="900" cy="575" r="16" fill="#16a34a"/><text x="900" y="576" class="step">4</text>
  <text x="1030" y="581" class="node-title" text-anchor="middle">用 kₜ 查询旧记忆</text>
  <text x="1030" y="622" class="formula-strong" text-anchor="middle">v̂ₜ = (Sₜ⁻)ᵀ kₜ</text>
  <text x="1030" y="654" class="body" text-anchor="middle">“按这个 key，记忆原本预测什么 value？”</text>
  <text x="1030" y="682" class="small" text-anchor="middle">输出形状：ℝᵈᵛ</text>

  <!-- error -->
  <path d="M1185 625 H1250" class="flow-green"/>
  <path d="M275 807 H303 Q315 807 315 795 V747 Q315 735 327 735 H1198 Q1210 735 1210 723 V685 Q1210 673 1222 673 H1250" class="flow-blue"/>
  <rect x="1260" y="550" width="305" height="150" rx="16" fill="#e7f8ee" stroke="#22c55e" stroke-width="2"/>
  <circle cx="1285" cy="575" r="16" fill="#16a34a"/><text x="1285" y="576" class="step">5</text>
  <text x="1412" y="581" class="node-title" text-anchor="middle">只写“预测误差”</text>
  <text x="1412" y="622" class="formula-strong" text-anchor="middle">eₜ = vₜ − v̂ₜ</text>
  <text x="1412" y="655" class="body" text-anchor="middle">避免把已经记住的 vₜ 重复叠加</text>
  <text x="1412" y="682" class="small" text-anchor="middle">eₜ ∈ ℝᵈᵛ</text>

  <!-- beta comes down -->
  <path d="M1360 265 H1726 Q1738 265 1738 277 V748 Q1738 760 1726 760 H1463" class="bypass-orange"/>
  <rect x="1318" y="735" width="145" height="52" rx="13" fill="#fde7a5" stroke="#d97706" stroke-width="2"/>
  <text x="1390" y="768" class="formula-strong" text-anchor="middle">× βₜ</text>
  <path d="M1412 700 V735" class="flow-green"/>
  <rect x="1260" y="800" width="305" height="88" rx="16" fill="#e7f8ee" stroke="#22c55e" stroke-width="2"/>
  <text x="1412" y="833" class="node-title" text-anchor="middle">写入强度</text>
  <text x="1412" y="866" class="formula-strong" text-anchor="middle">δₜ = βₜ eₜ</text>
  <path d="M1390 787 V800" class="thin-orange"/>

  <!-- rank one update -->
  <path d="M1260 844 H1185" class="flow-green"/>
  <path d="M825 711 V838 Q825 850 837 850 H840" class="flow-blue"/>
  <circle cx="825" cy="711" r="3.2" fill="#2563eb"/>
  <path d="M640 640 V738 Q640 750 652 750 H888 Q900 750 900 762 V775" class="flow-purple"/>
  <rect x="840" y="775" width="345" height="130" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="865" cy="800" r="16" fill="#7c3aed"/><text x="865" y="801" class="step">6</text>
  <text x="1012" y="807" class="node-title" text-anchor="middle">rank-1 Delta Rule 写入</text>
  <text x="1012" y="850" class="formula-strong" text-anchor="middle">Sₜ = Sₜ⁻ + kₜ δₜᵀ</text>
  <text x="1012" y="882" class="body" text-anchor="middle">key 决定写到哪一行；误差决定写入内容</text>

  <!-- read -->
  <path d="M840 820 H732 Q720 820 720 830 H537 Q525 830 525 842 V845" class="flow-purple"/>
  <path d="M275 911 H365" class="flow-blue"/>
  <rect x="375" y="845" width="300" height="125" rx="16" fill="#e7f8ee" stroke="#22c55e" stroke-width="2"/>
  <circle cx="400" cy="870" r="16" fill="#16a34a"/><text x="400" y="871" class="step">7</text>
  <text x="525" y="877" class="node-title" text-anchor="middle">用 qₜ 读取更新后状态</text>
  <text x="525" y="920" class="formula-strong" text-anchor="middle">oₜ = Sₜᵀ qₜ</text>
  <text x="525" y="950" class="small" text-anchor="middle">inclusive causal：当前 token 的写入可被读到</text>

  <!-- output -->
  <path d="M675 907 H708 Q720 907 720 919 V949 Q720 961 732 961 H760" class="flow-green"/>
  <rect x="770" y="925" width="470" height="72" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <circle cx="795" cy="949" r="16" fill="#16a34a"/><text x="795" y="950" class="step">8</text>
  <text x="1005" y="954" class="node-title" text-anchor="middle">输出门控与归一化</text>
  <text x="1005" y="984" class="formula" text-anchor="middle">rₜ = RMSNorm(oₜ) ⊙ sigmoid(zₜ)</text>
  <path d="M1240 961 H1320" class="flow-green"/>
  <rect x="1330" y="925" width="315" height="72" rx="16" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
  <text x="1488" y="954" class="node-title" text-anchor="middle">输出投影</text>
  <text x="1488" y="985" class="formula-strong" text-anchor="middle">yₜ = Wₒ rₜ</text>

  <!-- footer explanation -->
  <rect x="40" y="1048" width="1720" height="90" rx="18" fill="#10233f"/>
  <text x="72" y="1082" font-family="'Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff">一条主线：</text>
  <text x="190" y="1082" font-family="'Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="18" fill="#e7eef8">a 决定旧记忆保留多少，b 决定这次纠错写多强；k 负责寻址和写入，v 提供目标，q 负责读取，z 只控制最终输出。</text>
  <text x="72" y="1115" font-family="'Microsoft YaHei','Noto Sans SC',Arial,sans-serif" font-size="14" fill="#b9c8dc">实现基线：SGLang main @ 78249034。对应 fused projection、short conv、gate activation、recurrent Delta Rule 与 gated RMSNorm 路径。</text>
</svg>
