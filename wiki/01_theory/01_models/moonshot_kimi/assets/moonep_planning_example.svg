<text x="580" y="354" class="t2" text-anchor="start">下一轮改作接收方（发送方也可能接收）</text>
<text x="580" y="388" class="t1" text-anchor="start">u 被置 0 后不再变化 ⇒ 每个 rank 至多被选作</text>
