<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img"><style>text{font-family:Inter,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#162033}.title{font-size:26px;font-weight:750}.head{font-size:17px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#53627a}.num{font-variant-numeric:tabular-nums}.box{fill:#fff;stroke:#b7c4d4;stroke-width:1.5}.blue{fill:#e8f2ff;stroke:#1757a5;stroke-width:1.5}.orange{fill:#fff1db;stroke:#a65e0c;stroke-width:1.5}.ghost{fill:#f6f8fb;stroke:#b7c4d4;stroke-width:1}.arrow{stroke:#1757a5;stroke-width:2;fill:none;marker-end:url(#arrow)}.aux{stroke:#b7c4d4;stroke-width:1.5;fill:none;marker-end:url(#arrowGray)}.dash{stroke-dasharray:5 5}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#1757a5"/></marker><marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#b7c4d4"/></marker></defs><rect width="1200" height="700" fill="#ffffff"/><text class="title" x="40" y="48" text-anchor="start">PCP：局部 Query，临时全量 KV</text><text class="small" x="40" y="77" text-anchor="start">教学例子 · 4 个 prompt 位置 · 2 张卡 · 因果可见集合</text><rect class="box" x="40" y="115" width="535" height="382" rx="9"/><text class="head" x="62" y="145" text-anchor="start">Rank 0 · 本地生成位置 0、1</text><rect class="blue" x="62" y="174" width="190" height="47" rx="9"/><text class="body" x="76" y="203" text-anchor="start">Q0 / K0 / V0</text><path class="aux" d="M256 198 H286"/><rect class="ghost" x="292" y="174" width="260" height="47" rx="9"/><text class="body" x="305" y="203" text-anchor="start">q0 ← K/V 0</text><rect class="blue" x="62" y="241" width="190" height="47" rx="9"/><text class="body" x="76" y="270" text-anchor="start">Q1 / K1 / V1</text><path class="aux" d="M256 265 H286"/><rect class="ghost" x="292" y="241" width="260" height="47" rx="9"/><text class="body" x="305" y="270" text-anchor="start">q1 ← K/V 0、1</text><rect class="orange" x="62" y="328" width="490" height="62" rx="9"/><text class="head" x="77" y="355" text-anchor="start">有效分数项：1 + 2 = 3</text><text class="small" x="77" y="377" text-anchor="start">后段 Query 的历史更长</text><rect class="blue" x="62" y="411" width="490" height="60" rx="9"/><text class="body" x="77" y="438" text-anchor="start">当前层 All-gather K/V：临时可见 0、1、2、3</text><text class="small" x="77" y="458" text-anchor="start">持久 KV 仍可按位置分片</text><rect class="box" x="625" y="115" width="535" height="382" rx="9"/><text class="head" x="647" y="145" text-anchor="start">Rank 1 · 本地生成位置 2、3</text><rect class="blue" x="647" y="174" width="190" height="47" rx="9"/><text class="body" x="661" y="203" text-anchor="start">Q2 / K2 / V2</text><path class="aux" d="M841 198 H871"/><rect class="ghost" x="877" y="174" width="260" height="47" rx="9"/><text class="body" x="890" y="203" text-anchor="start">q2 ← K/V 0、1、2</text><rect class="blue" x="647" y="241" width="190" height="47" rx="9"/><text class="body" x="661" y="270" text-anchor="start">Q3 / K3 / V3</text><path class="aux" d="M841 265 H871"/><rect class="ghost" x="877" y="241" width="260" height="47" rx="9"/><text class="body" x="890" y="270" text-anchor="start">q3 ← K/V 0、1、2、3</text><rect class="orange" x="647" y="328" width="490" height="62" rx="9"/><text class="head" x="662" y="355" text-anchor="start">有效分数项：3 + 4 = 7</text><text class="small" x="662" y="377" text-anchor="start">后段 Query 的历史更长</text><rect class="blue" x="647" y="411" width="490" height="60" rx="9"/><text class="body" x="662" y="438" text-anchor="start">当前层 All-gather K/V：临时可见 0、1、2、3</text><text class="small" x="662" y="458" text-anchor="start">持久 KV 仍可按位置分片</text><path class="arrow" d="M307 503 C307 535 460 542 490 568"/><path class="arrow" d="M893 503 C893 535 740 542 710 568"/><text class="small" x="600" y="546" text-anchor="middle">位置顺序恢复</text><rect class="blue" x="320" y="568" width="560" height="62" rx="9"/><text class="head" x="600" y="596" text-anchor="middle">输出顺序：o0，o1，o2，o3</text><text class="small" x="600" y="617" text-anchor="middle">完成条件：远端 KV 到齐 → 本地 Q 算完 → 顺序恢复</text><text class="small" x="600" y="672" text-anchor="middle">本例连续切分负载 3 : 7；head-tail 可变成 5 : 5，但需重排位置。</text></svg>
