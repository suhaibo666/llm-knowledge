<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 707" role="img"><style>text{font-family:Inter,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#162033}.title{font-size:26px;font-weight:750}.head{font-size:17px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#53627a}.num{font-variant-numeric:tabular-nums}.box{fill:#fff;stroke:#b7c4d4;stroke-width:1.5}.blue{fill:#e8f2ff;stroke:#1757a5;stroke-width:1.5}.orange{fill:#fff1db;stroke:#a65e0c;stroke-width:1.5}.ghost{fill:#f6f8fb;stroke:#b7c4d4;stroke-width:1}.arrow{stroke:#1757a5;stroke-width:2;fill:none;marker-end:url(#arrow)}.aux{stroke:#b7c4d4;stroke-width:1.5;fill:none;marker-end:url(#arrowGray)}.dash{stroke-dasharray:5 5}</style><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#1757a5"/></marker><marker id="arrowGray" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#b7c4d4"/></marker></defs><rect width="1200" height="707" fill="#ffffff"/><text class="title" x="40" y="48" text-anchor="start">DCP：序列分片，按全局分母合并</text><text class="small" x="40" y="78" text-anchor="start">同一个 q3 · 分数 0、ln2、0、0 · value 0、2、4、6</text><rect class="box" x="40" y="112" width="535" height="265" rx="9"/><text class="head" x="62" y="146" text-anchor="start">Rank 0 · KV 位置 0、2</text><rect class="blue" x="62" y="169" width="491" height="40" rx="9"/><text class="body" x="76" y="195" text-anchor="start">k0: s=0, v=0</text><rect class="blue" x="62" y="219" width="491" height="40" rx="9"/><text class="body" x="76" y="245" text-anchor="start">k2: s=0, v=4</text><rect class="orange" x="62" y="285" width="491" height="65" rx="9"/><text class="body" x="76" y="314" text-anchor="start">m=0，ℓ=2，u=4，局部 o=2</text><text class="small" x="76" y="338" text-anchor="start">合并时该卡权重 × 1/2</text><rect class="box" x="625" y="112" width="535" height="265" rx="9"/><text class="head" x="647" y="146" text-anchor="start">Rank 1 · KV 位置 1、3</text><rect class="blue" x="647" y="169" width="491" height="40" rx="9"/><text class="body" x="661" y="195" text-anchor="start">k1: s=ln2, v=2</text><rect class="blue" x="647" y="219" width="491" height="40" rx="9"/><text class="body" x="661" y="245" text-anchor="start">k3: s=0, v=6</text><rect class="orange" x="647" y="285" width="491" height="65" rx="9"/><text class="body" x="661" y="314" text-anchor="start">m=ln2，ℓ=3/2，u=5，局部 o=10/3</text><text class="small" x="661" y="338" text-anchor="start">合并时该卡权重 × 1</text><path class="arrow" d="M307 382 C307 430 475 445 510 464"/><path class="arrow" d="M892 382 C892 430 725 445 690 464"/><rect class="blue" x="330" y="466" width="540" height="100" rx="9"/><text class="head" x="600" y="496" text-anchor="middle">共同最大值 m=ln2</text><text class="body" x="600" y="522" text-anchor="middle">ℓ = 5/2，u = 7，o3 = 2.8 = 14/5</text><text class="small" x="600" y="548" text-anchor="middle">完整四项权重 1、2、1、1，直接计算也得 14/5</text><rect class="ghost" x="278" y="593" width="644" height="53" rx="9"/><text class="body" x="600" y="625" text-anchor="middle">不能简单平均局部输出： (2 + 10/3)/2 = 8/3</text><text class="small" x="600" y="681" text-anchor="middle">当前 token 位置 3 的 KV 存 Rank 1；下一轮须等本轮 KV 写入及跨卡合并完成。</text></svg>
