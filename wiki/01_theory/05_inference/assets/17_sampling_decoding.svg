<?xml version="1.0" encoding="UTF-8"?>
<!-- Generated by 17_sampling_decoding.mjs. Values derive from the logits and teaching beam conditionals. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="790" viewBox="0 0 1280 790" role="img" aria-labelledby="title desc">
  <title id="title">同一组 logits 通往贪心、随机采样与 beam search</title>
  <desc id="desc">五个 token 的 logits 先变成完整概率分布，再分成候选截断、贪心选择、随机抽样和宽度为二的 beam 扩展。图中显示可复算概率、目标函数和计算成本。</desc>
  <style>
    .bg { fill:#f8fafc; } .panel { fill:#ffffff; stroke:#94a3b8; stroke-width:1.5; rx:14; }
    .acc1 { fill:#dbeafe; stroke:#2563eb; stroke-width:2; rx:12; } .acc2 { fill:#ffedd5; stroke:#ea580c; stroke-width:2; rx:12; }
    .ghost { fill:#f1f5f9; stroke:#cbd5e1; stroke-width:1.2; rx:10; } .line { stroke:#64748b; stroke-width:2; fill:none; marker-end:url(#arrow); }
    .main { stroke:#2563eb; stroke-width:3; fill:none; marker-end:url(#arrowBlue); } .aux { stroke:#94a3b8; stroke-width:1.6; fill:none; marker-end:url(#arrow); }
    text { font-family:-apple-system,BlinkMacSystemFont,"Noto Sans CJK SC","Microsoft YaHei",sans-serif; fill:#0f172a; }
    .h { font-size:25px; font-weight:700; } .sh { font-size:18px; font-weight:700; } .b { font-size:15px; } .s { font-size:13px; fill:#334155; } .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:14px; }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker></defs>
  <rect class="bg" x="0" y="0" width="1280" height="790"/>
  <text class="h" x="50" y="48">同一行 logits，三种不同的选择目标</text>
  <text class="s" x="50" y="74">教学输入固定为 A、B、C、D、EOS 的 logits = (2, 1, 0, −1, −2)。筛选只改变候选集；三种解码的目标不同。</text>

  <rect class="panel" x="50" y="108" width="1180" height="132"/>
  <text class="sh" x="78" y="142">每一步先形成分布</text>
  <text class="mono" x="78" y="173">token       A       B       C       D     EOS</text>
  <text class="mono" x="78" y="197">logit          2      1      0     −1     −2</text>
  <text class="mono" x="78" y="221">softmax   0.636  0.234  0.086  0.032  0.012</text>
  <text class="b" x="790" y="170">温度 T=0.5：logits 除以 0.5</text>
  <text class="mono" x="790" y="197">p = 0.865  0.117  0.016  0.002  0.000</text>
  <text class="s" x="790" y="221">T&lt;1 集中概率；T&gt;1 拉平概率。T=0 是 greedy 的分支，不做除法。</text>

  <path class="main" d="M 290 240 L 290 295"/><path class="aux" d="M 640 240 L 640 295"/><path class="aux" d="M 990 240 L 990 295"/>
  <rect class="acc1" x="55" y="300" width="300" height="154"/>
  <text class="sh" x="80" y="333">1. 贪心：单步局部最大</text>
  <text class="b" x="80" y="364">目标：argmax p(v | history)</text>
  <text class="mono" x="80" y="394">max = A, p(A)=0.636</text>
  <text class="b" x="80" y="422">输出 A；不需要随机数。</text>
  <text class="s" x="80" y="443">只保留当前步一条前缀。</text>

  <rect class="acc1" x="410" y="300" width="350" height="154"/>
  <text class="sh" x="435" y="333">2. 随机采样：从本步分布抽取</text>
  <text class="b" x="435" y="364">top-k=3：候选 A、B、C</text>
  <text class="mono" x="435" y="390">p = 0.665  0.245  0.090  0.000  0.000</text>
  <text class="b" x="435" y="418">top-p=0.8：候选 A、B</text>
  <text class="mono" x="435" y="443">p = 0.731  0.269  0.000  0.000  0.000</text>

  <rect class="acc2" x="815" y="300" width="360" height="154"/>
  <text class="sh" x="840" y="333">3. Beam：维护多条完整前缀</text>
  <text class="b" x="840" y="364">目标：累计 log probability</text>
  <text class="mono" x="840" y="391">S(y1:t)=Σ log p(yt)</text>
  <text class="b" x="840" y="420">每轮扩展 B 条，再保留 B 条。</text>
  <text class="s" x="840" y="443">可另以长度惩罚重排完成序列。</text>

  <path class="main" d="M 205 454 L 205 515"/><path class="main" d="M 585 454 L 585 515"/><path class="main" d="M 995 454 L 995 515"/>
  <rect class="ghost" x="55" y="520" width="300" height="180"/>
  <text class="sh" x="80" y="552">结果与成本</text>
  <text class="b" x="80" y="584">候选：A B C D EOS</text>
  <text class="b" x="80" y="610">结果：A</text>
  <text class="s" x="80" y="640">模型前向：1 条前缀／步</text>
  <text class="s" x="80" y="665">风险：局部最优不等于全序列最优</text>

  <rect class="ghost" x="410" y="520" width="350" height="180"/>
  <text class="sh" x="435" y="552">结果与可复现条件</text>
  <text class="b" x="435" y="584">候选：截断后集合；抽到 A、B</text>
  <text class="b" x="435" y="610">同 seed 仍需同分布、同 RNG 消耗顺序</text>
  <text class="s" x="435" y="640">模型前向：1 条前缀／步</text>
  <text class="s" x="435" y="665">额外：过滤、归一化与随机数</text>

  <rect class="ghost" x="815" y="520" width="360" height="180"/>
  <text class="sh" x="840" y="552">宽度 B=2 的一轮扩展</text>
  <text class="mono" x="840" y="582">保留：A −0.452, B −1.452</text>
  <text class="mono" x="840" y="608">扩展：AA −1.368, AB −1.502</text>
  <text class="mono" x="840" y="634">A EOS −1.838：排名第 3，未入完成集</text>
  <text class="s" x="840" y="665">逻辑前缀约 B 倍；可批量计算。</text>
  <text class="s" x="50" y="748">不变量：禁用 token 写为 −∞ 后概率为 0；EOS 仅在选中后触发停止。接受／拒绝与 grammar 不在此图内。</text>
</svg>