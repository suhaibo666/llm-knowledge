<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="500" viewBox="0 0 1188 500" role="img" aria-labelledby="title desc">
<title id="title">PagedAttention 块表、写时复制和引用变化</title>
<desc id="desc">块长四，展示 A 的七个已处理位置被 B 分叉共享，A 写入共享尾块时复制到 P3，A 结束后 P3 无引用但字节仍在池中。</desc>
<style>
  .stage {font: 700 14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
  .sub {font: 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
  .label {font: 600 12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
  .small {font: 11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#0f172a}
  .tiny {font: 9px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#64748b}
  .arrow {stroke:#64748b;stroke-width:1.4;fill:none;marker-end:url(#arrow)}
  .main {stroke:#2563eb;stroke-width:2;fill:none;marker-end:url(#arrowBlue)}
  .cost {stroke:#ea580c;stroke-width:2;fill:none;marker-end:url(#arrowOrange)}
</style>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#64748b"/></marker>
  <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>
  <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#ea580c"/></marker>
</defs>
<rect width="1188" height="500" fill="white"/>
<text x="154" y="28" class="stage" text-anchor="middle">① 建立 7 个已处理位置</text><text x="154" y="47" class="sub" text-anchor="middle">A: T_A = [7, 1]</text><text x="450" y="28" class="stage" text-anchor="middle">② 分叉 B，共享历史</text><text x="450" y="47" class="sub" text-anchor="middle">A, B: T = [7, 1]</text><text x="746" y="28" class="stage" text-anchor="middle">③ A 续写触发 CoW</text><text x="746" y="47" class="sub" text-anchor="middle">A: [7, 3]；B: [7, 1]</text><text x="1042" y="28" class="stage" text-anchor="middle">④ A 结束，B 仍引用</text><text x="1042" y="47" class="sub" text-anchor="middle">B: T_B = [7, 1]</text>
<line x1="296" y1="25" x2="312" y2="25" class="arrow"/><line x1="592" y1="25" x2="608" y2="25" class="arrow"/><line x1="888" y1="25" x2="904" y2="25" class="arrow"/>
<rect x="26" y="76" width="248" height="57" rx="7" fill="#ffffff" stroke="#64748b"/><text x="36" y="96" class="label" text-anchor="start">请求 A</text><text x="36" y="116" class="tiny" text-anchor="start">逻辑块表</text><rect x="90" y="96" width="34" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="107" y="114" class="small" text-anchor="middle">7</text><rect x="128" y="96" width="34" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="145" y="114" class="small" text-anchor="middle">1</text>
<rect x="18" y="151" width="262" height="32" rx="7" fill="#f8fafc" stroke="#64748b"/><text x="34" y="172" class="label" text-anchor="start">物理块池</text><rect x="26" y="182" width="246" height="38" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="36" y="198" class="label" text-anchor="start">P7</text><text x="82" y="198" class="tiny" text-anchor="start">位置 0–3</text><text x="36" y="213" class="tiny" text-anchor="start">完整块</text><text x="255" y="205" class="small" text-anchor="end">ref 1</text><rect x="26" y="229" width="246" height="38" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="36" y="245" class="label" text-anchor="start">P1</text><text x="82" y="245" class="tiny" text-anchor="start">位置 4–6</text><text x="36" y="260" class="tiny" text-anchor="start">尾块：3 / 4</text><text x="255" y="252" class="small" text-anchor="end">ref 1</text>
<rect x="322" y="76" width="248" height="57" rx="7" fill="#ffffff" stroke="#64748b"/><text x="332" y="96" class="label" text-anchor="start">请求 A</text><text x="332" y="116" class="tiny" text-anchor="start">逻辑块表</text><rect x="386" y="96" width="34" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="403" y="114" class="small" text-anchor="middle">7</text><rect x="424" y="96" width="34" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="441" y="114" class="small" text-anchor="middle">1</text><rect x="322" y="140" width="248" height="57" rx="7" fill="#ffffff" stroke="#64748b"/><text x="332" y="160" class="label" text-anchor="start">请求 B</text><text x="332" y="180" class="tiny" text-anchor="start">逻辑块表</text><rect x="386" y="160" width="34" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="403" y="178" class="small" text-anchor="middle">7</text><rect x="424" y="160" width="34" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="441" y="178" class="small" text-anchor="middle">1</text>
<rect x="314" y="215" width="262" height="32" rx="7" fill="#f8fafc" stroke="#64748b"/><text x="330" y="236" class="label" text-anchor="start">物理块池</text><rect x="322" y="246" width="246" height="38" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="332" y="262" class="label" text-anchor="start">P7</text><text x="378" y="262" class="tiny" text-anchor="start">位置 0–3</text><text x="332" y="277" class="tiny" text-anchor="start">两个请求共享</text><text x="551" y="269" class="small" text-anchor="end">ref 2</text><rect x="322" y="293" width="246" height="38" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="332" y="309" class="label" text-anchor="start">P1</text><text x="378" y="309" class="tiny" text-anchor="start">位置 4–6</text><text x="332" y="324" class="tiny" text-anchor="start">两个请求共享尾块</text><text x="551" y="316" class="small" text-anchor="end">ref 2</text>
<rect x="618" y="76" width="248" height="57" rx="7" fill="#ffffff" stroke="#64748b"/><text x="628" y="96" class="label" text-anchor="start">请求 A</text><text x="628" y="116" class="tiny" text-anchor="start">逻辑块表</text><rect x="682" y="96" width="34" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="699" y="114" class="small" text-anchor="middle">7</text><rect x="720" y="96" width="34" height="26" rx="4" fill="#ffedd5" stroke="#ea580c"/><text x="737" y="114" class="small" text-anchor="middle">3</text><rect x="618" y="140" width="248" height="57" rx="7" fill="#ffffff" stroke="#64748b"/><text x="628" y="160" class="label" text-anchor="start">请求 B</text><text x="628" y="180" class="tiny" text-anchor="start">逻辑块表</text><rect x="682" y="160" width="34" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="699" y="178" class="small" text-anchor="middle">7</text><rect x="720" y="160" width="34" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="737" y="178" class="small" text-anchor="middle">1</text>
<rect x="610" y="215" width="262" height="32" rx="7" fill="#f8fafc" stroke="#64748b"/><text x="626" y="236" class="label" text-anchor="start">物理块池</text><rect x="618" y="246" width="246" height="38" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="628" y="262" class="label" text-anchor="start">P7</text><text x="674" y="262" class="tiny" text-anchor="start">位置 0–3</text><text x="628" y="277" class="tiny" text-anchor="start">共享完整块</text><text x="847" y="269" class="small" text-anchor="end">ref 2</text><rect x="618" y="293" width="246" height="38" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="628" y="309" class="label" text-anchor="start">P1</text><text x="674" y="309" class="tiny" text-anchor="start">位置 4–6 + b7</text><text x="628" y="324" class="tiny" text-anchor="start">B 独占写入 offset 3</text><text x="847" y="316" class="small" text-anchor="end">ref 1</text><rect x="618" y="340" width="246" height="38" rx="7" fill="#ffedd5" stroke="#ea580c"/><text x="628" y="356" class="label" text-anchor="start">P3</text><text x="674" y="356" class="tiny" text-anchor="start">位置 4–6 复制 + a7</text><text x="628" y="371" class="tiny" text-anchor="start">A 的私有尾块</text><text x="847" y="363" class="small" text-anchor="end">ref 1</text>
<rect x="914" y="76" width="248" height="57" rx="7" fill="#f8fafc" stroke="#64748b"/><text x="924" y="97" class="label" text-anchor="start">请求 A 已结束</text><text x="924" y="118" class="small" text-anchor="start">无活跃块表；A 的引用已归还</text><rect x="914" y="140" width="248" height="57" rx="7" fill="#ffffff" stroke="#64748b"/><text x="924" y="160" class="label" text-anchor="start">请求 B</text><text x="924" y="180" class="tiny" text-anchor="start">逻辑块表</text><rect x="978" y="160" width="34" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="995" y="178" class="small" text-anchor="middle">7</text><rect x="1016" y="160" width="34" height="26" rx="4" fill="#dbeafe" stroke="#2563eb"/><text x="1033" y="178" class="small" text-anchor="middle">1</text>
<rect x="906" y="215" width="262" height="32" rx="7" fill="#f8fafc" stroke="#64748b"/><text x="922" y="236" class="label" text-anchor="start">物理块池</text><rect x="914" y="246" width="246" height="38" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="924" y="262" class="label" text-anchor="start">P7</text><text x="970" y="262" class="tiny" text-anchor="start">位置 0–3</text><text x="924" y="277" class="tiny" text-anchor="start">B 仍持有</text><text x="1143" y="269" class="small" text-anchor="end">ref 1</text><rect x="914" y="293" width="246" height="38" rx="7" fill="#dbeafe" stroke="#2563eb"/><text x="924" y="309" class="label" text-anchor="start">P1</text><text x="970" y="309" class="tiny" text-anchor="start">位置 4–6 + b7</text><text x="924" y="324" class="tiny" text-anchor="start">B 仍持有</text><text x="1143" y="316" class="small" text-anchor="end">ref 1</text><rect x="914" y="340" width="246" height="38" rx="7" fill="#dcfce7" stroke="#15803d"/><text x="924" y="356" class="label" text-anchor="start">P3</text><text x="970" y="356" class="tiny" text-anchor="start">A 的旧 KV 字节仍在</text><text x="924" y="371" class="tiny" text-anchor="start">无引用，可领取后覆盖</text><text x="1143" y="363" class="small" text-anchor="end">ref 0</text>
<rect x="26" y="390" width="1136" height="21" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="42" y="405" class="tiny" text-anchor="start">蓝色：共享或仍被引用；橙色：A 的 CoW 私有尾块；绿色：旧字节尚在但 ref=0，可领取后覆盖。</text>
<rect x="26" y="420" width="1136" height="57" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
<text x="42" y="443" class="small" text-anchor="start">块长 B = 4；位置 t 的逻辑块 = floor(t / 4)，offset = t mod 4。</text>
<text x="42" y="463" class="small" text-anchor="start">绿色表示“字节尚在池中、但没有请求引用，下一次分配可覆盖”，不表示它仍可由内容匹配自动命中。</text>
</svg>