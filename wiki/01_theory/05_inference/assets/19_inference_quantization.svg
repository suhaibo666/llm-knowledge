<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="860" viewBox="0 0 1600 860"><style>.title{font:700 17px "Noto Sans CJK SC","PingFang SC",Arial,sans-serif}.body{font:14px "Noto Sans CJK SC","PingFang SC",Arial,sans-serif;fill:#172033}.small{font:12px "Noto Sans CJK SC","PingFang SC",Arial,sans-serif;fill:#475569}.route{font:700 19px "Noto Sans CJK SC","PingFang SC",Arial,sans-serif}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1600" height="860" fill="#f8fafc"/><text x="28" y="34" class="route" fill="#0f172a">同一向量 x = (-1.2, -0.4, 0.2, 0.7, 3.8) 的可复算量化路径</text><text x="28" y="60" class="small">共同约定：对称整数码 q ∈ {-7,…,7}，z=0，最近偶数舍入；橙色路径表示末项截断的成本。</text><line x1="28" y1="78" x2="1572" y2="78" stroke="#cbd5e1"/><text x="28" y="135" class="route" fill="#2563eb">全张量：覆盖离群值</text><rect x="28" y="150" width="255" height="162" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="44" y="178" class="title" fill="#2563eb">输入 x</text><text x="44" y="206" class="body">(-1.2, -0.4, 0.2, 0.7, 3.8)</text><text x="44" y="229" class="body">共同输入；末项为离群值</text><text x="44" y="252" class="body">编码：q = clip(roundEven(x / s))</text><rect x="340" y="150" width="258" height="162" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="356" y="178" class="title" fill="#2563eb">选择 scale</text><text x="356" y="206" class="body">s = 3.8 / 7 = 0.542857</text><text x="356" y="229" class="body">粒度：全张量</text><text x="356" y="252" class="body">代码边界：[-7, 7]</text><rect x="655" y="150" width="218" height="162" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="671" y="178" class="title" fill="#2563eb">整数代码 q</text><text x="671" y="206" class="body">(-2, -1, 0, 1, 7)</text><text x="671" y="229" class="body">每项均在代码范围内</text><text x="671" y="252" class="body">每个元素占 4 bit（教学格式）</text><rect x="930" y="150" width="305" height="162" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="946" y="178" class="title" fill="#2563eb">还原 xhat = q × s</text><text x="946" y="206" class="body">(-1.086, -0.543, 0, 0.543, 3.8)</text><text x="946" y="229" class="body">用编码时相同的 scale</text><text x="946" y="252" class="body">范围决定网格间距</text><rect x="1292" y="150" width="280" height="162" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="1308" y="178" class="title" fill="#2563eb">绝对误差</text><text x="1308" y="206" class="body">(0.114, 0.143, 0.2, 0.157, 0)</text><text x="1308" y="229" class="body">MAE = 0.122857</text><text x="1308" y="252" class="body">max = 0.2；scale 数 = 1</text><path d="M 284 231 L 339 231" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M 599 231 L 654 231" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M 874 231 L 929 231" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M 1236 231 L 1291 231" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="28" y="385" class="route" fill="#ea580c">窄范围：末项被 clip</text><rect x="28" y="400" width="255" height="162" rx="12" fill="#eff6ff" stroke="#ea580c" stroke-width="2"/><text x="44" y="428" class="title" fill="#ea580c">输入 x</text><text x="44" y="456" class="body">(-1.2, -0.4, 0.2, 0.7, 3.8)</text><text x="44" y="479" class="body">共同输入；末项为离群值</text><text x="44" y="502" class="body">编码：q = clip(roundEven(x / s))</text><rect x="340" y="400" width="258" height="162" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/><text x="356" y="428" class="title" fill="#ea580c">选择 scale</text><text x="356" y="456" class="body">s = 1.2 / 7 = 0.171429</text><text x="356" y="479" class="body">粒度：全张量</text><text x="356" y="502" class="body">代码边界：[-7, 7]</text><rect x="655" y="400" width="218" height="162" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="671" y="428" class="title" fill="#ea580c">整数代码 q</text><text x="671" y="456" class="body">(-7, -2, 1, 4, 7)</text><text x="671" y="479" class="body">末项：round(3.8 / s) 后 clip 至 7</text><text x="671" y="502" class="body">每个元素占 4 bit（教学格式）</text><rect x="930" y="400" width="305" height="162" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2"/><text x="946" y="428" class="title" fill="#ea580c">还原 xhat = q × s</text><text x="946" y="456" class="body">(-1.2, -0.343, 0.171, 0.686, 1.2)</text><text x="946" y="479" class="body">用编码时相同的 scale</text><text x="946" y="502" class="body">末项只能还原为 1.2</text><rect x="1292" y="400" width="280" height="162" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="1308" y="428" class="title" fill="#ea580c">绝对误差</text><text x="1308" y="456" class="body">(0, 0.057, 0.029, 0.014, 2.6)</text><text x="1308" y="479" class="body">MAE = 0.54</text><text x="1308" y="502" class="body">max = 2.6；scale 数 = 1</text><path d="M 284 481 L 339 481" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M 599 481 L 654 481" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M 874 481 L 929 481" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M 1236 481 L 1291 481" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="28" y="635" class="route" fill="#2563eb">两组：末项单独 scale</text><rect x="28" y="650" width="255" height="162" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="44" y="678" class="title" fill="#2563eb">输入 x</text><text x="44" y="706" class="body">(-1.2, -0.4, 0.2, 0.7, 3.8)</text><text x="44" y="729" class="body">共同输入；末项为离群值</text><text x="44" y="752" class="body">编码：q = clip(roundEven(x / s))</text><rect x="340" y="650" width="258" height="162" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="356" y="678" class="title" fill="#2563eb">选择 scale</text><text x="356" y="706" class="body">s0 = 0.171429（前四项）</text><text x="356" y="729" class="body">s1 = 0.542857（末项）</text><text x="356" y="752" class="body">粒度：前四项 / 末项</text><text x="356" y="775" class="body">代码边界：[-7, 7]</text><rect x="655" y="650" width="218" height="162" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="671" y="678" class="title" fill="#2563eb">整数代码 q</text><text x="671" y="706" class="body">(-7, -2, 1, 4, 7)</text><text x="671" y="729" class="body">每项均在代码范围内</text><text x="671" y="752" class="body">每个元素占 4 bit（教学格式）</text><rect x="930" y="650" width="305" height="162" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2"/><text x="946" y="678" class="title" fill="#2563eb">还原 xhat = q × s</text><text x="946" y="706" class="body">(-1.2, -0.343, 0.171, 0.686, 3.8)</text><text x="946" y="729" class="body">用编码时相同的 scale</text><text x="946" y="752" class="body">范围决定网格间距</text><rect x="1292" y="650" width="280" height="162" rx="12" fill="#f8fafc" stroke="#2563eb" stroke-width="2"/><text x="1308" y="678" class="title" fill="#2563eb">绝对误差</text><text x="1308" y="706" class="body">(0, 0.057, 0.029, 0.014, 0)</text><text x="1308" y="729" class="body">MAE = 0.02</text><text x="1308" y="752" class="body">max = 0.057143；scale 数 = 2</text><path d="M 284 731 L 339 731" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M 599 731 L 654 731" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M 874 731 L 929 731" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><path d="M 1236 731 L 1291 731" stroke="#64748b" stroke-width="2.2" fill="none" marker-end="url(#arrow)"/><text x="28" y="838" class="small">读图：扩大 scale 可避免截断但会增大步长；缩小 scale 会细化常见值却可能截断离群值；分组降低前四项误差，同时多存一个 scale。</text></svg>