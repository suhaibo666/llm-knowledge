<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 705" role="img"><style>text{font-family:Inter,"Noto Sans CJK SC","PingFang SC",sans-serif;fill:#162033}.title{font-size:25px;font-weight:750}.head{font-size:17px;font-weight:700}.body{font-size:14px}.small{font-size:12.5px;fill:#53627a}.comm{font-size:20px;fill:#1757a5;font-weight:700}.panel{fill:#fff;stroke:#b7c4d4;stroke-width:1.4}.blue{fill:#e8f2ff;stroke:#1757a5;stroke-width:1.4}.ghost{fill:#f6f8fb;stroke:#b7c4d4;stroke-width:1.2}.orange{fill:#fff1db;stroke:#a65e0c;stroke-width:1.4}</style><rect width="1200" height="705" fill="#fff"/><text class="title" x="38" y="45" text-anchor="start">同八卡、同 512 MiB 逻辑 KV：并行轴随请求形状变化</text><text class="small" x="38" y="73" text-anchor="start">教学模型 · 16 层 / 1 KV head / d=64 / fp16 K 与 V / 每卡 256 MiB 持久 KV 预算</text><rect class="panel" x="38" y="104" width="1124" height="305" rx="8"/><text class="head" x="62" y="138" text-anchor="start">A · 一个 128K 长请求</text><text class="small" x="62" y="163" text-anchor="start">候选布局：PCP2 × TP4；DCP4 在每行复用 TP ranks</text><text class="head" x="70" y="223" text-anchor="start">PCP 0</text><rect class="blue" x="184" y="184" width="206" height="72" rx="8"/><text class="body" x="287" y="212" text-anchor="middle">TP / DCP rank 0</text><text class="small" x="287" y="237" text-anchor="middle">持久 KV 64 MiB</text><rect class="blue" x="411" y="184" width="206" height="72" rx="8"/><text class="body" x="514" y="212" text-anchor="middle">TP / DCP rank 1</text><text class="small" x="514" y="237" text-anchor="middle">持久 KV 64 MiB</text><rect class="blue" x="638" y="184" width="206" height="72" rx="8"/><text class="body" x="741" y="212" text-anchor="middle">TP / DCP rank 2</text><text class="small" x="741" y="237" text-anchor="middle">持久 KV 64 MiB</text><rect class="blue" x="865" y="184" width="206" height="72" rx="8"/><text class="body" x="968" y="212" text-anchor="middle">TP / DCP rank 3</text><text class="small" x="968" y="237" text-anchor="middle">持久 KV 64 MiB</text><text class="comm" x="401" y="228" text-anchor="middle">↔</text><text class="comm" x="628" y="228" text-anchor="middle">↔</text><text class="comm" x="855" y="228" text-anchor="middle">↔</text><text class="head" x="70" y="310" text-anchor="start">PCP 1</text><rect class="blue" x="184" y="271" width="206" height="72" rx="8"/><text class="body" x="287" y="299" text-anchor="middle">TP / DCP rank 0</text><text class="small" x="287" y="324" text-anchor="middle">持久 KV 64 MiB</text><rect class="blue" x="411" y="271" width="206" height="72" rx="8"/><text class="body" x="514" y="299" text-anchor="middle">TP / DCP rank 1</text><text class="small" x="514" y="324" text-anchor="middle">持久 KV 64 MiB</text><rect class="blue" x="638" y="271" width="206" height="72" rx="8"/><text class="body" x="741" y="299" text-anchor="middle">TP / DCP rank 2</text><text class="small" x="741" y="324" text-anchor="middle">持久 KV 64 MiB</text><rect class="blue" x="865" y="271" width="206" height="72" rx="8"/><text class="body" x="968" y="299" text-anchor="middle">TP / DCP rank 3</text><text class="small" x="968" y="324" text-anchor="middle">持久 KV 64 MiB</text><text class="comm" x="401" y="315" text-anchor="middle">↔</text><text class="comm" x="628" y="315" text-anchor="middle">↔</text><text class="comm" x="855" y="315" text-anchor="middle">↔</text><text class="comm" x="130" y="275" text-anchor="middle">↕</text><text class="small" x="184" y="379" text-anchor="start">同一请求：PCP 跨行分 Q；DCP 在行内分 KV 并合并局部 attention 统计</text><rect class="panel" x="38" y="428" width="1124" height="175" rx="8"/><text class="head" x="62" y="462" text-anchor="start">B · 六十四个 2K 短请求</text><text class="small" x="62" y="487" text-anchor="start">候选布局：DP8；每副本 8 个独立请求</text><rect class="ghost" x="68" y="507" width="124" height="72" rx="8"/><text class="body" x="130" y="535" text-anchor="middle">DP 0</text><text class="small" x="130" y="557" text-anchor="middle">8 请求 · 64 MiB</text><rect class="ghost" x="204" y="507" width="124" height="72" rx="8"/><text class="body" x="266" y="535" text-anchor="middle">DP 1</text><text class="small" x="266" y="557" text-anchor="middle">8 请求 · 64 MiB</text><rect class="ghost" x="340" y="507" width="124" height="72" rx="8"/><text class="body" x="402" y="535" text-anchor="middle">DP 2</text><text class="small" x="402" y="557" text-anchor="middle">8 请求 · 64 MiB</text><rect class="ghost" x="476" y="507" width="124" height="72" rx="8"/><text class="body" x="538" y="535" text-anchor="middle">DP 3</text><text class="small" x="538" y="557" text-anchor="middle">8 请求 · 64 MiB</text><rect class="ghost" x="612" y="507" width="124" height="72" rx="8"/><text class="body" x="674" y="535" text-anchor="middle">DP 4</text><text class="small" x="674" y="557" text-anchor="middle">8 请求 · 64 MiB</text><rect class="ghost" x="748" y="507" width="124" height="72" rx="8"/><text class="body" x="810" y="535" text-anchor="middle">DP 5</text><text class="small" x="810" y="557" text-anchor="middle">8 请求 · 64 MiB</text><rect class="ghost" x="884" y="507" width="124" height="72" rx="8"/><text class="body" x="946" y="535" text-anchor="middle">DP 6</text><text class="small" x="946" y="557" text-anchor="middle">8 请求 · 64 MiB</text><rect class="ghost" x="1020" y="507" width="124" height="72" rx="8"/><text class="body" x="1082" y="535" text-anchor="middle">DP 7</text><text class="small" x="1082" y="557" text-anchor="middle">8 请求 · 64 MiB</text><rect class="orange" x="226" y="623" width="748" height="58" rx="8"/><text class="body" x="600" y="649" text-anchor="middle">每卡持久 KV 均为 64 MiB；A 的同一请求须跨卡通信，B 的请求彼此独立</text><text class="small" x="600" y="670" text-anchor="middle">临时聚合、权重和实际性能仍需另算；网格本身不证明 backend 支持</text></svg>
