# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: LLM Knowledge Wiki
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: false
  locale: zh-CN
  ignorePatterns:
    - .obsidian
  defaultDateType: modified
  theme:
    fontOrigin: local
    cdnCaching: false
    typography:
      header: Segoe UI
      body: Microsoft YaHei
      code: Cascadia Code
    colors:
      lightMode:
        light: "#fbfcfe"
        lightgray: "#e7ebf0"
        gray: "#9aa5b1"
        darkgray: "#3d4a57"
        dark: "#17212b"
        secondary: "#2457a6"
        tertiary: "#2b7a78"
        highlight: "rgba(36, 87, 166, 0.12)"
        textHighlight: "#fff1a8"
      darkMode:
        light: "#14191f"
        lightgray: "#28313a"
        gray: "#77838f"
        darkgray: "#d3dbe3"
        dark: "#f1f5f8"
        secondary: "#8ab4f8"
        tertiary: "#72c7c2"
        highlight: "rgba(138, 180, 248, 0.14)"
        textHighlight: "#665c1e"
plugins:
  - source: github:quartz-community/syntax-highlighting
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: github:quartz-community/obsidian-flavored-markdown
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: false
      enableTweetEmbed: false
      enableVideoEmbed: false
      enableCheckbox: true
      enableObsidianUri: false
    order: 30
  - source: github:quartz-community/github-flavored-markdown
    enabled: true
    order: 40
  - source: github:quartz-community/table-of-contents
    enabled: true
    options:
      maxDepth: 4
      minEntries: 1
      showByDefault: true
      collapseByDefault: false
    order: 50
    layout:
      position: right
      priority: 50
  - source: github:quartz-community/crawl-links
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: github:quartz-community/description
    enabled: true
    order: 70
  - source: github:quartz-community/latex
    enabled: true
    options:
      renderEngine: mathjax
    order: 80
  - source: github:quartz-community/remove-draft
    enabled: true
  - source: github:quartz-community/alias-redirects
    enabled: true
  - source: github:quartz-community/content-index
    enabled: true
    options:
      enableSiteMap: false
      enableRSS: false
  - source: github:quartz-community/favicon
    enabled: true
  - source: github:quartz-community/content-page
    enabled: true
  - source: github:quartz-community/folder-page
    enabled: true
  - source: github:quartz-community/explorer
    enabled: true
    layout:
      position: left
      priority: 50
  - source: github:quartz-community/search
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: github:quartz-community/article-title
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: github:quartz-community/page-title
    enabled: true
    layout:
      position: left
      priority: 10
  - source: github:quartz-community/darkmode
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: github:quartz-community/breadcrumbs
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      positions:
        right: []
