<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0}
  figure{margin:0;padding:18px;background:#fff;display:inline-block}
  text{font-family:'Segoe UI','Microsoft YaHei',system-ui,sans-serif;fill:#212529}
  .node{fill:#f8f9fa;stroke:#adb5bd;stroke-width:1.5}
  .gpu{fill:#fff;stroke:#4dabf7;stroke-width:1.5}
  .exp{fill:#e7f5ff;stroke:#74c0fc;stroke-width:1.2}
  .hit{fill:#fff3bf;stroke:#f59f00;stroke-width:1.6}
  .ib{stroke:#e8590c;stroke-width:3;fill:none}
  .nvl{stroke:#2f9e44;stroke-width:2.5;fill:none}
  .bdy{stroke:#ced4da;stroke-width:1.5;stroke-dasharray:5 4}
  .t-node{font-size:13px;font-weight:700;fill:#495057}
  .t-gpu{font-size:12px;font-weight:700;fill:#1971c2}
  .t-exp{font-size:12px;font-weight:700}
  .t-sub{font-size:10.5px;fill:#868e96}
</style></head><body>
<figure>
<svg width="980" height="520" viewBox="0 0 980 520" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="aIB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0L7,3L0,6Z" fill="#e8590c"/></marker>
    <marker id="aNVL" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0L7,3L0,6Z" fill="#2f9e44"/></marker>
  </defs>

  <text x="40" y="34" font-size="14" font-weight="700">2 node × 2 GPU,EP=4,topk=4　·　token X 驻留 GPU0 → 命中 {E1, E3, E5, E6}</text>

  <!-- boundary -->
  <line class="bdy" x1="490" y1="56" x2="490" y2="232"/>
  <text class="t-sub" x="490" y="50" text-anchor="middle">节点边界(IB)</text>

  <!-- Node A -->
  <rect class="node" x="40" y="58" width="400" height="172" rx="10"/>
  <text class="t-node" x="60" y="80">Node A</text>
  <!-- GPU0 -->
  <rect class="gpu" x="58" y="90" width="172" height="126" rx="8"/>
  <text class="t-gpu" x="144" y="110" text-anchor="middle">GPU0</text>
  <rect class="exp" x="74" y="120" width="64" height="30" rx="5"/><text class="t-exp" x="106" y="140" text-anchor="middle">E0</text>
  <rect class="hit" x="150" y="120" width="64" height="30" rx="5"/><text class="t-exp" x="182" y="140" text-anchor="middle">E1 ✓</text>
  <rect class="hit" x="98" y="166" width="96" height="34" rx="6"/><text class="t-exp" x="146" y="188" text-anchor="middle">token X</text>
  <!-- GPU1 -->
  <rect class="gpu" x="250" y="90" width="172" height="126" rx="8"/>
  <text class="t-gpu" x="336" y="110" text-anchor="middle">GPU1</text>
  <rect class="exp" x="266" y="120" width="64" height="30" rx="5"/><text class="t-exp" x="298" y="140" text-anchor="middle">E2</text>
  <rect class="hit" x="342" y="120" width="64" height="30" rx="5"/><text class="t-exp" x="374" y="140" text-anchor="middle">E3 ✓</text>
  <text class="t-sub" x="336" y="190" text-anchor="middle">节点内 NVLink(源 node)</text>

  <!-- Node B -->
  <rect class="node" x="540" y="58" width="400" height="172" rx="10"/>
  <text class="t-node" x="560" y="80">Node B</text>
  <!-- GPU2 -->
  <rect class="gpu" x="558" y="90" width="172" height="126" rx="8"/>
  <text class="t-gpu" x="644" y="110" text-anchor="middle">GPU2 · 落地卡</text>
  <rect class="exp" x="574" y="120" width="64" height="30" rx="5"/><text class="t-exp" x="606" y="140" text-anchor="middle">E4</text>
  <rect class="hit" x="650" y="120" width="64" height="30" rx="5"/><text class="t-exp" x="682" y="140" text-anchor="middle">E5 ✓</text>
  <!-- GPU3 -->
  <rect class="gpu" x="750" y="90" width="172" height="126" rx="8"/>
  <text class="t-gpu" x="836" y="110" text-anchor="middle">GPU3</text>
  <rect class="hit" x="766" y="120" width="64" height="30" rx="5"/><text class="t-exp" x="798" y="140" text-anchor="middle">E6 ✓</text>
  <rect class="exp" x="842" y="120" width="64" height="30" rx="5"/><text class="t-exp" x="874" y="140" text-anchor="middle">E7</text>

  <!-- DeepEP links -->
  <!-- NVLink GPU0 -> GPU1 (E3) -->
  <path class="nvl" d="M214,182 C 235,182 240,150 262,150" marker-end="url(#aNVL)"/>
  <text x="246" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#2f9e44">NVLink · M</text>
  <!-- IB GPU0 -> Node B landing GPU2 -->
  <path class="ib" d="M196,166 C 360,235 430,235 606,160" marker-end="url(#aIB)"/>
  <text x="400" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#e8590c">IB · M(整 token 只一次)</text>
  <!-- NVLink GPU2 -> GPU3 (E6) -->
  <path class="nvl" d="M714,160 C 742,178 752,150 770,150" marker-end="url(#aNVL)"/>
  <text x="746" y="210" text-anchor="middle" font-size="11" font-weight="700" fill="#2f9e44">NVLink · M</text>

  <!-- ===== comparison table ===== -->
  <g font-size="13">
    <rect x="40" y="290" width="240" height="34" fill="#f1f3f5" stroke="#dee2e6"/>
    <rect x="280" y="290" width="170" height="34" fill="#f1f3f5" stroke="#dee2e6"/>
    <rect x="450" y="290" width="170" height="34" fill="#f1f3f5" stroke="#dee2e6"/>
    <text x="52" y="312" font-weight="700">链路</text>
    <text x="365" y="312" text-anchor="middle" font-weight="700">标准 A2A</text>
    <text x="535" y="312" text-anchor="middle" font-weight="700">DeepEP</text>

    <rect x="40" y="324" width="240" height="34" fill="#fff" stroke="#dee2e6"/>
    <rect x="280" y="324" width="170" height="34" fill="#fff5f5" stroke="#dee2e6"/>
    <rect x="450" y="324" width="170" height="34" fill="#ebfbee" stroke="#dee2e6"/>
    <text x="52" y="346" font-weight="700">跨节点 IB(瓶颈)</text>
    <text x="365" y="346" text-anchor="middle" font-weight="700" fill="#e8590c">2 M</text>
    <text x="535" y="346" text-anchor="middle" font-weight="700" fill="#2f9e44">1 M ✓</text>

    <rect x="40" y="358" width="240" height="34" fill="#fff" stroke="#dee2e6"/>
    <rect x="280" y="358" width="170" height="34" fill="#fff" stroke="#dee2e6"/>
    <rect x="450" y="358" width="170" height="34" fill="#fff" stroke="#dee2e6"/>
    <text x="52" y="380" font-weight="700">节点内 NVLink</text>
    <text x="365" y="380" text-anchor="middle">1 M</text>
    <text x="535" y="380" text-anchor="middle">2 M</text>
  </g>
  <text x="40" y="414" font-size="12" fill="#495057">→ 拿 1 次廉价 NVLink 跳，换掉 1 次昂贵 IB 跳。</text>

  <!-- ===== speedup box ===== -->
  <rect x="650" y="290" width="290" height="124" rx="10" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5"/>
  <text x="795" y="314" text-anchor="middle" font-size="14" font-weight="700">IB 加速比</text>
  <text x="795" y="346" text-anchor="middle" font-size="17" font-weight="700">(k/P) ÷ ( 1 − (1−1/P)ᵏ )</text>
  <text x="795" y="378" text-anchor="middle" font-size="13">P=2, k=4　→　2.13×</text>
  <text x="795" y="400" text-anchor="middle" font-size="13">topk 提到 8　→　≈ 4×</text>

  <!-- ===== caveat ===== -->
  <rect x="40" y="438" width="900" height="58" rx="8" fill="#fff9db" stroke="#f59f00" stroke-width="1.2"/>
  <text x="56" y="461" font-size="12" fill="#495057">注:落地卡 = 与源卡「同号」的 NVL rank(internode.cu:826),未必是目标卡。</text>
  <text x="56" y="481" font-size="12" fill="#495057">故节点内实际 = gₙ − 𝟙[同号落地卡 ∈ 目标];理想公式的「−1」是上界(最好情形)。</text>
</svg>
</figure>
</body></html>
