site_name: LLM Knowledge Wiki
site_url: https://suhaibo666.github.io/llm-knowledge/
docs_dir: .mkdocs-cache/docs
site_dir: site
use_directory_urls: false
theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.prune
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.view
plugins:
  - search:
      lang:
        - zh
        - en
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
      toc_depth: 3
repo_url: https://github.com/suhaibo666/llm-knowledge
edit_uri: blob/main/wiki/
